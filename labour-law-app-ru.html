لغرامة بتعدد العمال الذين وقعـت فـى شـأنهم\nالجريمة  ،وتضاعف الغرامة فى حالة العود .\nكما يعاقب بذات العقوبة المشار إليها فى الفقـرة الأولـى مـن هـذه المـادة ،\nكل من يخالف أحكام المادة )/٢١بند  (۱من هذا القانون .", "text_ru": "Каждый, кто нарушает положения статьи (82, пункты 1 и 2) и статьи (273, часть 2, абзац четвёртый) настоящего Трудового кодекса и изданных для их исполнения министерских решений, наказывается штрафом в размере не менее одной тысячи и не более десяти тысяч фунтов; штраф умножается по числу работников, в отношении которых совершено правонарушение, и удваивается в случае повторности.\n\nТем же наказанием, указанным в первом абзаце настоящей статьи, наказывается каждый, кто нарушает положения статьи (21, пункт 1) настоящего Трудового кодекса.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "283", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب كل من يخالف أحكام المواد ) ۳۷فقرة أولـى /٤٨ ،فقـرة أولـى (١٥٣ ،\nمن هذا القانون والقرارات الوزارية المنفذة لها  ،بغرامة لا تقـل عـن ألفـى جنيـه\nولا تزيد على عشرة آلاف جنيه  ،وتضاعف الغرامة فى حالة العود .\nكما يعاقب بذات العقوبة المشار إليها بالفقرة الأولى من هذه المادة  ،كـل مـن يخـالف\nحكم المادة  ۱۳۷من هذا القانون .", "text_ru": "Каждый, кто нарушает положения статей (37, абзац первый), (48, абзац первый) и (153) настоящего Трудового кодекса и изданных для их исполнения министерских решений, наказывается штрафом в размере не менее двух тысяч и не более десяти тысяч фунтов; штраф удваивается в случае повторности.\n\nТем же наказанием, указанным в первом абзаце настоящей статьи, наказывается каждый, кто нарушает положение статьи (137) настоящего Трудового кодекса.", "book_title_ru": "Трудовая инспекция и меры ответственно 08) настоящего Трудового кодекса, наказывается штрафом в размере не менее двух тысяч и не более двадцати тысяч фунтов; штраф умножается по числу работников, в отношении которых совершено правонарушение, и удваивается в случае повторности.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "288", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب كل من يخالف أحكـام المـواد )، ۱۱۹ ، ۱۱۸ ، ۱۱۷ ، ٦٠ ، ٥۳ ، ۲۷\n/١٣٥ ، ۱۳۲ ، ۱٢٤ ، ۱۲۳فقرة ثانية  /٢٥٤ ،فقـرة أولـى( مـن هـذا القـانون\nوالقرارات الوزارية المنفذة لها  ،بغرامة لا تقل عن خمسمائة جنيـه ولا تزيـد علـى\nخمسة آلاف جنيه  ،وتتعدد الغرامة بتعدد العمال الذين وقعت فى شـأنهم الجريمـة ،\nوتضاعف الغرامة فى حالة العود .\nكما يعاقب بذات العقوبة المـشار إليهـا بـالفقرة الأولـى مـن هـذه المـادة ،\nكل من يخالف أحكام المـواد )، ۸۹ ، ٥۹ ، ٥۸ ، ٥۷ ، ٥٦ ، ٥٥ ، ٥٤ ، ۲۹ ، ۱۲\n، ١١٦ ، ١١٥ ، ١١٤ ، ١١٣ ، ١١٢ ، ۱۱۱ ، ۱۱۰ ، ٩٤ ، ۹۳ ، ۹۲ ، ۹۱ ، ۹۰\n/۱۳۸ ، ۱۳۱ ، ۱۲۹ ، ۱۲۸ ، ۱۲٦ ، ۱۲٥ ، ۱۲۱ ، ۱۲۰فقــرة ثانيــة ، ١٥٦ ،\n(١٧٣ ، ١٦٤ ، ١٦٢ ، ١٥٩من هذا القانون .", "text_ru": "Каждый, кто нарушает положения статей (27), (53), (60), (117), (118), (119), (123, абзац второй), (124), (132), (135, часть первая), (254, абзац первый) настоящего Трудового кодекса и изданных для их исполнения министерских решений, наказывается штрафом в размере не менее пятисот и не более пяти тысяч фунтов; штраф умножается по числу работников, в отношении которых совершено правонарушение, и удваивается в случае повторности.\n\nТем же наказанием, указанным в первом абзаце настоящей статьи, наказывается каждый, кто нарушает положения статей (12), (29), (54), (55), (56), (57), (58), (59), (89), (90), (91), (92), (93), (94), (110), (111), (112), (113), (114), (115), (116), (120, абзац второй), (12 er_title": null, "text": "يعاقب كل من يخالف أحكام المادتين (۳۷) ، ۳۳من هـذا القـانون والقـرارات\nالوزارية المنفذة لها  ،بغرامة لا تقل عن خمسمائة جنيه ولا تزيد على ألـف جنيـه ،\nوتتعدد الغرامة بتعدد العمال الذين وقعت فى شأنهم الجريمـة  ،وتـضاعف الغرامـة\nفى حالة العود .\nكما يعاقب بذات العقوبة المشار إليها بالفقرة الأولى من هذه المادة  ،كـل مـن يخـالف\nأحكام المادتين (٢٠٥) ، ٣٥من هذا القانون .", "text_ru": "Каждый, кто нарушает положения статей (33), (37) настоящего Трудового кодекса и изданных для их исполнения министерских решений, наказывается штрафом в размере не менее пятисот и не более одной тысячи фунтов; штраф умножается по числу работников, в отношении которых совершено правонарушение, и удваивается в случае повторности.\n\nТем же наказанием, указанным в первом абзаце настоящей статьи, наказывается каждый, кто нарушает положения статей (35), (205) настоящего Трудового кодекса.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "291", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب بالحبس وبغرامة لا تقل عن عشرين ألف جنيه ولا تزيد على مائـة ألـف\nجنيه  ،أو بإحدى هاتين العقوبتين  ،كل من ارتكب إحدى الجرائم الآتية :\n-١مزاولة عمليات إلحاق العمالة للعمل داخل البلاد أو خارجها من غير الجهات\nالمحددة فى المادة (٤٠)من هذا القانون دون الحصول على التـرخيص المنـصوص\nعليه فى المادة (٤١)من هذا القـانون  ،أو بتـرخيص صـادر بنـاء علـى بيانـات\nغير صحيحة .\n-۲تقاضى مبالغ دون وجه حق من أجر العامل أو من مـستحقاته عـن عملـه\nفى الداخل  ،أو الخارج .\n\n-٣تقديم بيانات غير صحيحة عن اتفاقيات أو عقود إلحـاق للعمـل بالخـارج ،\nأو أجورهم أو شروط وظروف عملهم  ،أو عقود عمل وهمية بالمخالفة للواقع .\nوفى جميع الأحوال  ،يحكم برد المبالغ التى تم تقاضيها أو الحصول عليهـا دون\nوجه حق  ،وللمحكمة أن تقضى فى حالات الإدانة بإغلاق المنشأة  ،ويكون الإغـلاق\nوجوبيا فى حالة الإدانة بإحدى الجرائم المشار إليها فى البند (١)من هذه المادة .", "text_ru": "Наказывается лишением свободы и штрафом в размере не менее двадцати тысяч и не более ста тысяч фунтов либо одним из этих двух наказаний каждый, кто совершит одно из следующих преступлений:\n1. осуществление деятельности по трудоустройству рабочей силы внутри страны или за рубежом лицом, не относящимся к органам, указанным в статье (40) настоящего Трудового кодекса, без получения разрешения, предусмотренного статьёй (41) настоящего Трудового кодекса, либо на основании разрешения, выданного на основании недостоверных сведений;\n2. взимание без законного основания каких-либо сумм из заработной платы работника или из причитающихся ему за его работу внутри страны или за рубежом сумм;\n3. представление недостоверных сведений о соглашениях или договорах о трудоустройстве за рубежом, о заработной плате работников либо об условиях и обстоятельствах их работы, либо заключение фиктивных трудовых договоров в нарушение действительности.\n\nВ любом случае выносится решение о возврате сумм, которые были взысканы или получены без законного основания; суд вправе в случаях осуждения постановить о закрытии предприятия, при этом закрытие является обязательным в случае осуждения за одно из преступлений, указанных в пункте 1 настоящей статьи.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "292", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب كل من يخالف أحكام المادة (٤٢)من هذا القانون  ،والقرارات الوزاريـة\nالمنفذة لها  ،بغرامة لا تقل عن خمسة آلاف جنيه ولا تزيد على مائـة ألـف جنيـه ،\nوتتعدد الغرامة بتعدد العمال الذين وقعت فى شأنهم الجريمـة  ،وتـضاعف الغرامـة\nفى حالة الع الف أحكام المـواد )، ٢٦١ ، ٢٦٠ ، ٢٥٩ ، ٢٥٥ ، ٢٥٤ ، ٢٤٥\n(۲۷۲ ، ۲۷۱ ، ۲۷۰ ، ٢٦٦ ، ٢٦٢من هذا القانون  ،والقرارات الوزارية المنفـذة لهـا\nبغرامة لا تقل عن خمسة آلاف جنيه ولا تجاوز مائة ألف جنيه  ،وتضاعف الغرامـة فـى\nحالة العود .\nكما يعاقب بذات العقوبة المشار إليها بالفقرة الأولى من هذه المادة كل من يخالف\nأحكام المـواد )، ٢٦٧ ، ٢٥٣ ، ٢٥٢ ، ٢٥١ ، ٢٥٠ ، ٢٤٩ ، ٢٤٨ ، ٢٤٧ ، ٢٤٦\n(٢٦٩ ، ٢٦٨من هذا القانون .", "text_ru": "Каждый, кто нарушает положения статей (245), (254), (255), (259), (260), (261), (262), (266), (270), (271), (272) настоящего Трудового кодекса и изданных для их исполнения министерских решений, наказывается штрафом в размере не менее пяти тысяч и не более ста тысяч фунтов; штраф удваивается в случае повторности.\n\nТем же наказанием, указанным в первом абзаце настоящей статьи, наказывается каждый, кто нарушает положения статей (246), (247), (248), (249), (250), (251), (252), (253), (267), (268), (269) настоящего Трудового кодекса.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "297", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب صاحب العمل أو من يمثله عن المنشأة إذا خالف أحكام المـادتين )، ۲۷۷\n(۲۷۸من هذا القانون  ،بغرامة لا تقل عن خمسة آلاف جنيه ولا تجاوز عشرين ألـف\nجنيه  ،وتضاعف الغرامة فى حالة العود .", "text_ru": "Работодатель или его представитель в предприятии наказывается, если он нарушает положения статей (277), (278) настоящего Трудового кодекса, штрафом в размере не менее пяти тысяч и не более двадцати тысяч фунтов; штраф удваивается в случае повторности.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "298", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب المسئول عن الإدارة الفعلية للشخص الاعتبارى بالعقوبة ذاتهـا المقـررة\nعن الأفعال التى ترتكب بالمخالفة لأحكام هذا القانون إذا ثبت علمه بها وكـان إخلالـه\nبالواجبات التى تفرضـها عليـه تلـك الإدارة قـد أسـهم فـى وقـوع الجريمـة .\nويكون الشخص الاعتبارى مسئولا ً بالتضامن عن الوفاء بما يحكم بـه مـن عقوبـات\nمالية وتعويضات .", "text_ru": "Лицо, ответственное за фактическое управление юридическим лицом, наказывается тем же наказанием, установленным за деяния, совершённые в нарушение положений настоящего Трудового кодекса, если будет установлено, что ему было об этом известно и что его несоблюдение обязанностей, возлагаемых на него этим управлением, способствовало совершению преступления.\n\nЮридическое лицо несёт солидарную ответственность за уплату присуждённых денежных наказаний и компенсаций.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}], "promulgation": {"intro": "قانون رقم  ١٤لسنة ٢٠٢٥\nبإصدار قانون العمل\nباسم الشعب\nرئيس الجمهورية\nقرر مجلس النواب القانون الآتى نصه  ،وقد أصدرناه :", "articles": [{"number": 1, "label": "الأولى", "text": "يعمل بأحكام هذا القانون والقانون المرافق فى شأن العمل.\nكما تسرى أحكامهما فيما لم يرد بشأنه نص خاص فـى عقـود العمـل الفرديـة\nأو اتفاقيات العمل الجماعية على العاملين الأجانب داخل جمهورية مصر العربية .\nوفيما عدا ما ورد بشأنه نص خاص  ،لا تسرى أحكام هـذا القـانون والقـانون\nالمرافق على الفئات الآتية :\n-١العاملين بأجهزة الدولة بما فى ذلك وحدات الإدارة المحلية والهيئات العامة .\n-٢عمال الخدمة المنزلية ومن فى حكمهم .", "text_ru": "Настоящий Закон и прилагаемый к нему Трудовой кодекс о труде вводятся в действие.\n\nИх положения также применяются — поскольку иное не предусмотрено специальной нормой в индивидуальных трудовых договорах или коллективных трудовых договорах — к иностранным работникам на территории Арабской Республики Египет.\n\nЗа исключением случаев, для которых установлена специальная норма, положения настоящего Закона и прилагаемого к нему Трудового кодекса не распространяются на следующие категории:\n1. Работников государственных органов, включая органы местного самоуправления и государственные учреждения.\n2. Домашних работников и приравненных к ним лиц.", "label_ru": "Статья первая"}, {"number": 2, "label": "الثانية", "text": "يستمر صندوق تمويل التدريب والتأهيل المنشأ وفق ًا لأحكام قانون العمل الـصادر\nبالقانون رقم  ۱۲لسنة  ۲۰۰۳محتفظ ًا بالشخصية الاعتبارية العامـة ،ويتبـع الـوزير\nالمعنى بشئون العمل ،ويباشر اختصاصاته على النحو الذى ينظمه القانون المرافق .\nوتنقضى الخصومة فى جميع الدعاوى التى لم يفصل فيها بحكم بـات ،والمقيـدة\nأو المنظورة لدى جميع المحاكم على اختلاف درجاتها قبل العمل بأحكام هذا القـانون،\nبين صندوق تمويل التدريب والتأهيل  ،والمنشآت الخاضعة لأحكام القـانون المرافـق\nوالتى يكون موضوعها تحصيل نسبة (١٪)لصالح الصندوق ،وتمتنع المطالبة بما لـم\nيسدد من هذه النسبة ،وذلك كله ما لم تتمسك المنشأة باستمرار الخصومة فى الـدعوى\nبطلب يقدم إلى المحكمة المنظورة لديها الدعوى خلال ستة أشهر مـن تـاريخ العمـل\nبهذا القانون .\nوفى جميع الأحوال ،لا يترتب على انقضاء الخصومة حق المنشآت التى قامـت\nبأداء هذه النسبة فى استرداد ما سبق سداده .", "text_ru": "Фонд финансирования профессиональной подготовки и переподготовки, созданный в соответствии с положениями Трудового кодекса № 12 от 2003 года, продолжает своё существование, сохраняя статус юридического лица публичного права; он подведомствен министру, в ведении которого находятся вопросы труда, и осуществляет свои полномочия в порядке, устанавливаемом прилагаемым Трудовым кодексом.\n\nПрекращается производство по всем делам, не разрешённым вступившим в законную силу решением, находящимся в производстве или на рассмотрении в судах всех инстанций до вступления в силу настоящего Закона, между Фондом финансирования профессиональной подготовки и переподготовки и предприятиями, на которые распространяются положения прилагаемого Трудового кодекса, если предметом этих дел является взыскание доли в размере 1% в пользу Фонда; при этом не допускается предъявление требований о взыскании неуплаченной части этой доли — если только предприятие не заявит о намерении продолжить производство по делу, подав соответствующее ходатайство в суд, рассматривающий дело, в течение шести месяцев со дня вступления настоящего Закона в силу.\n\nВ любом случае прекращение производства по делу не влечёт возникновения у предприятий, уплативших указанную долю, права на возврат ранее уплаченных сумм.", "label_ru": "Статья вторая"}, {"number": 3, "label": "الثالثة", "text": "يستمر صندوق الخدمات الاجتماعية والصحية والثقافية المنشأ وفق ًا لأحكام قـانون\nالعمل المشار إليه  ،ويتبع الوزير المعنـى بـشئون العمـل ،ويباشـر اختـصاصاته\nعلى النحو الذى ينظمه القانون .\nكما يستمر المجلس القومى للأجور  ،ويجرى تـشكيله ويمـارس اختـصاصاته\nعلى النحو المبين بالقانون المرافق.", "text_ru": "Фонд социального, медицинского и культурного обслуживания, созданный в соответствии с положениями упомянутого Трудового кодекса, продолжает своё существование; он подведомствен министру, в ведении которого находятся вопросы труда, и осуществляет свои полномочия в порядке, устанавливаемом Законом.\n\nНациональный совет по заработной плате также продолжает своё существование, формируется и осуществляет свои полномочия в порядке, установленном прилагаемым Трудовым кодексом.", "label_ru": "Статья третья"}, {"number": 4, "label": "الرابعة", "text": "لا تخل أحكام هذا القانون والقانون والمرافق بحقوق العمال السابق لهم الحـصول\nعليها من أجور  ،ومزايا مستمدة من أحكام القوانين  ،واللوائح  ،والنظم والاتفاقيـات\nوالقرارات الداخلية السابقة على العمل بأحكامه .\nوتظل الأحكام الواردة بالتشريعات الخاصة ببعض فئات العمال سارية  ،إلـى أن\nيتم إبرام ونفاذ الاتفاقيات الجماعية بشأنها  ،وفق ًا لأحكام القانون المرافق .\nوتعتبر المزايا الواردة بتلك التشريعات الحد الأدنى الذى يتم التفاوض على أساسه .", "text_ru": "Положения настоящего Закона и прилагаемого к нему Трудового кодекса не затрагивают ранее приобретённых работниками прав на заработную плату и льготы, вытекающие из положений законов, регламентов, систем, соглашений и внутренних решений, действовавших до вступления его положений в силу.\n\nПоложения специального законодательства, касающегося отдельных категорий работников, сохраняют силу до заключения и вступления в действие соответствующих коллективных трудовых договоров в порядке, установленном прилагаемым Трудовым кодексом.\n\nЛьготы, предусмотренные этим законодательством, считаются минимальным уровнем, служащим основой для дальнейших переговоров.", "label_ru": "Статья четвёртая"}, {"number": 5, "label": "الخامسة", "text": "لا تخل أحكام هذا القانون والقانون المرافق بأحكام قانون تيسير إجـراءات مـنح\nتراخيص المنشآت الصناعية الصادر بالقانون رقم  ١٥لسنة ٢٠١٧", "text_ru": "Положения настоящего Закона и прилагаемого к нему Трудового кодекса не затрагивают положений Закона об упрощении процедур выдачи разрешений промышленным предприятиям № 15 от 2017 года.", "label_ru": "Статья пятая"}, {"number": 6, "label": "السادسة", "text": "يجوز لأصحاب الأعمال تشغيل العمال دون التقيد بشرط الحصول على ترخيص\nمزاولة المهنة أو الحرفة المنصوص عليه فى المادة (٢٧)من القانون المرافق ،على أن\nيقوموا بتوفيق أوضاعهم خلال مدة لا تجاوز ثلاث سنوات من تاريخ صدور القرارات\nالمنظمة لقواعد وإجراءات الحصول على الترخيص المشار إليه .\nواستثناء من ذلك ،يجوز لرئيس مجلس الوزراء بناء على عرض الوزير المعنـى\nبشئون العمل مد مدة توفيق الأوضاع لمدة أو لمـدد أخـرى مماثلـة لا تجـاوز فـى\nمجموعها ثلاث سنوات .\n\nوفى جميع الأحوال  ،يعفى من الحصول على ذلك الترخيص العمال المـشتغلون\nلدى صاحب العمل لمدة تزيد على سنة قبل صدور القانون المرافق .\nكما تلتزم الجهات المخاطبة بأحكام المادتين (٤١) ، ٢٢مـن القـانون المرافـق\nبتوفيق أوضاعها طبق ًا لأحكامه ،وذلك خلال مدة لا تجاوز سنة من تاريخ العمـل بـه،\nولرئيس مجلس الوزراء مد هذه الفترة لمدة أو مدد أخرى لا تجـاوز فـى مجموعهـا\nسنتين بناء على عرض من الوزير المعنى بشئون العمل .", "text_ru": "Работодатели вправе привлекать работников без соблюдения требования о получении разрешения на занятие профессией или ремеслом, предусмотренного статьёй (27) прилагаемого Трудового кодекса, при условии приведения ими своего положения в соответствие в течение срока, не превышающего трёх лет со дня издания решений, устанавливающих правила и порядок получения указанного разрешения.\n\nВ порядке исключения Председатель Совета министров по представлению министра, в ведении которого находятся вопросы труда, вправе продлить срок приведения положения в соответствие на такой же или иной срок, не превышающий в совокупности трёх лет.\n\nВ любом случае от получения указанного разрешения освобождаются работники, работающие у работодателя более одного года до вступления в силу прилагаемого Трудового кодекса.\n\nОрганы, к которым обращены положения статей (41) и (22) прилагаемого Трудового кодекса, обязаны привести своё положение в соответствие с его требованиями в срок, не превышающий одного года со дня вступления его в силу; Председатель Совета министров вправе продлить этот срок на такой же или иной срок, не превышающий в совокупности двух лет, по представлению министра, в ведении которого находятся вопросы труда.", "label_ru": "Статья шестая"}, {"number": 7, "label": "السابعة", "text": "تئول جميع الأموال النقدية والعينية ،والحقوق والالتزامـات والمـوارد الخاصـة\nبحسابات الرعاية الاجتماعية والصحية للعمالة غير المنتظمة المنشأة بـوزارة العمـل\nومديرياتها بالمحافظات ،إلى صـندوق إعانـات الطـوارئ والخـدمات الاجتماعيـة\nوالصحية للعمالة غير المنتظمة المنشأ وفق ًا لأحكام القانون المرافق .", "text_ru": "Все денежные и натуральные средства, права, обязательства и ресурсы, относящиеся к счетам социального и медицинского обеспечения неформально занятых работников, созданным при Министерстве труда и его управлениях в мухафазах, передаются Фонду чрезвычайной помощи и социально-медицинского обслуживания неформально занятых работников, создаваемому в соответствии с положениями прилагаемого Трудового кодекса.", "label_ru": "Статья седьмая"}, {"number": 8, "label": "الثامنة", "text": "تلتزم المنشآت الخاضعة لأحكام هذا القانون والقانون المرافق بـأن ترسـل إلـى\nالوزارة المعنية بشئون العمل خلال ثلاثين يوما من تاريخ العمل به بيان ًا مفصلا ً بعـدد\nـسياتهم ونــوعهم ،\nـات أعمــارهم وجنـ\nـؤهلاتهم ومهــنهم وفئـ\nـال طبق ًــا لمـ\nالعمـ\nوالأجور التى يتقاضونها .", "text_ru": "Предприятия, на которые распространяются положения настоящего Закона и прилагаемого к нему Трудового кодекса, обязаны направить в министерство, в ведении которого находятся вопросы труда, в течение тридцати дней со дня вступления его в силу подробную ведомость о численности работников по их квалификации, профессии, возрастным категориям, гражданству и полу, а также о размере получаемой ими заработной платы.", "label_ru": "Статья восьмая"}, {"number": 9, "label": "التاسعة", "text": "مع مراعاة حكم المادة الثالثة عشرة من هذا القانون ،تحيل المحـاكم مـن تلقـاء\nنفسها  ،ما يوجد لديها من منازعات ودعاوى متداولة أصبحت بمقتضى أحكام القـانون\nالمرافق من اختصاص المحاكم العمالية المتخصصة ،وذلك بالحالة التى تكون عليهـا ،\nدون رسوم  ،وفى حالة غياب أحد الخصوم يلتزم قلم الكتاب بإعلانه بقرار الإحالة مع\nتكليفه بالحضور فى الميعاد أمام المحكمة التى تحال إليها الدعوى .\nولا يسرى حكم الفقرة الأولى من هذه المـادة علـى الـدعاوى المحكـوم فيهـا\nأو المحجوزة للنطق بالحكم فيها قبل العمل بأحكام هـذا القـانون ،وتـستمر المحـاكم\nفى نظرها  ،وتبقى الأحكام الصادرة فيها خاضعة للقواعد المنظمـة لطـرق الطعـن\nالسارية فى تاريخ صدورها .", "text_ru": "С учётом положений статьи тринадцатой настоящего Закона суды по собственной инициативе передают находящиеся в их производстве споры и дела, которые в соответствии с положениями прилагаемого Трудового кодекса отнесены к компетенции специализированных трудовых судов, в том состоянии, в котором они находятся, без взимания пошлин; в случае отсутствия одной из сторон канцелярия суда обязана уведомить её о решении о передаче дела с вызовом явиться в назначенный срок в суд, которому передано дело.\n\nПоложение первого абзаца настоящей статьи не применяется к делам, по которым уже вынесено решение либо которые отложены для оглашения решения до вступления в силу положений настоящего Закона; такие суды продолжают их рассмотрение, а вынесенные по ним решения остаются подчинёнными правилам обжалования, действовавшим на дату их вынесения.", "label_ru": "Статья девятая"}, {"number": 10, "label": "العاشرة", "text": "تستمر محكمة النقض ومحاكم الاستئناف فى نظر الطعون على الأحكام الـصادرة\nفى المنازعات والدعاوى المشار إليها بالمادة التاسعة من هذا القانون ،المرفوعة أمامها\nقبل تاريخ العمل بنظام المحاكم العمالية المتخصـصة طبق ًـا للمـادة الثالثـة عـشرة\nمن هذا القانون .", "text_ru": "Кассационный суд и апелляционные суды продолжают рассматривать жалобы на решения, вынесенные по спорам и делам, указанным в статье девятой настоящего Закона, поданные им до даты введения в действие системы специализированных трудовых судов в соответствии со статьёй тринадцатой настоящего Закона.", "label_ru": "Статья десятая"}, {"number": 11, "label": "الحادية عشرة", "text": "يصدر الوزير المعنى بشئون العمل القرارات المنفذة لأحكام هذا القانون والقـانون\nالمرافق خلال مدة لا تجاوز تسعين يوما من تاريخ العمل به وإلـى أن تـصدر هـذه\nالقرارات يستمر العمل بالقرارات السارية فى هذا الشأن بما لا يتعارض وأحكـام هـذا\nالقانون والقانون المرافق .\nكما يصدر وزير العدل القرارات اللازمة لتنفيذ أحكام القانون المرافق فيما يتعلـق\nبالمحاكم العمالية المتخصصة .", "text_ru": "Министр, в ведении которого находятся вопросы труда, издаёт решения, необходимые для исполнения положений настоящего Закона и прилагаемого к нему Трудового кодекса, в срок, не превышающий девяноста дней со дня его вступления в силу; до издания этих решений продолжают применяться действующие по этим вопросам решения в части, не противоречащей положениям настоящего Закона и прилагаемого к нему Трудового кодекса.\n\nМинистр юстиции также издаёт решения, необходимые для исполнения положений прилагаемого Трудового кодекса в части, касающейся специализированных трудовых судов.", "label_ru": "Статья одиннадцатая"}, {"number": 12, "label": "الثانية عشرة", "text": "يلغى القانون رقم  ١٢لسنة  ٢٠٠٣بإصدار قانون العمل  ،والقـانون رقـم ١٢٥\nلسنة  ٢٠١٠بشأن مرتبة امتياز حقوق العمال  ،كما يلغى كل حكم يخالف أحكام هـذا\nالقانون والقانون المرافق .", "text_ru": "Отменяются Закон № 12 от 2003 года о введении в действие Трудового кодекса и Закон № 125 от 2010 года о привилегированном ранге прав работников; отменяется также любое положение, противоречащее настоящему Закону и прилагаемому к нему Трудовому кодексу.", "label_ru": "Статья двенадцатая"}, {"number": 13, "label": "الثالثة عشرة", "text": "ينشر هذا القانون فى الجريدة الرسمية ،ويعمل به من أول الشهر التالى لانقـضاء\nتسعين يوما من تاريخ نشره  ،ويعمل به فى شأن المحاكم العمالية المتخصصة اعتبارا\nمن أول أكتوبر التالى للعمل بالقانون المرافق .\nيبصم هذا القانون بخاتم الدولة  ،وينفذ كقانون من قوانينها .\n\nصـدر برئاسة الجمهورية فى  ٥ذى القعدة سنة  ١٤٤٦ه\n) الموافق  ٣مايو سنة  ٢٠٢٥م ( .\nعبد الفتاح السيسى", "text_ru": "Настоящий Закон публикуется в Официальной газете и вступает в силу с первого числа месяца, следующего за истечением девяноста дней со дня его опубликования; в части, касающейся специализированных трудовых судов, он вступает в силу начиная с первого октября, следующего за вступлением в силу прилагаемого Трудового кодекса.\n\nНастоящий Закон скрепляется государственной печатью и подлежит исполнению как один из законов государства.\n\nИздано в Резиденции Президента 5 зу-ль-каада 1446 г.х. (соответствует 3 мая 2025 г.).\n\nАбдель Фаттах ас-Сиси", "label_ru": "Статья тринадцатая"}], "intro_ru": "Закон № 14 от 2025 года\nо введении в действие Трудового кодекса\n\nИменем народа\nПрезидент Республики\n\nПалата депутатов приняла нижеследующий текст закона, и мы обнародовали его:"}, "metadata": {"1": {"article": "1", "topics": ["wages", "penalties", "work-injuries", "disputes", "strikes", "unions"], "periods   // ---------------- text normalization for search (per language) ----------------
  function normalizeArabic(s) {
    if (!s) return "";
    return s
      .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "") // diacritics
      .replace(/[إأآا]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .replace(/ؤ/g, "و")
      .replace(/ئ/g, "ي")
      .replace(/ـ/g, "")
      .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
      .toLowerCase();
  }
  function normalizeRu(s) {
    if (!s) return "";
    return s.toLowerCase().replace(/ё/g, "е");

  function normalizeText(s) { return LANG === "ru" ? normalizeRu(s) : normalizeArabic(s); }

  const DOMAIN_STOPWORDS_AR = new Set(["من","الى","إلى","على","فى","في","هل","ما","هي","هى","او","أو","و","التي","الذي","عن","مع","كم","كيف","لماذا","هذا","هذه","ذلك","تم","الذين","عامل","العامل","عاملين","العاملين","صاحب","الصاحب","عمل","العمل","أحكام","قانون","القانون","مادة","المادة","فقرة","الفقرة","شخص","الشخص","منشأة","المنشأة"]);
  const DOMAIN_STOPWORDS_RU = new Set(["и","в","на","с","по","из","за","для","что","как","это","или","к","от","до","не","но","так","же","то","при","об","о","под","над","между","а","ли","бы","какой","какая","какое","какие","работник","работника","работнику","работником","работодатель","работодателя","закон","закона","статья","статьи","настоящего","кодекса","работы","работе","труд","труда"]);

  // Precompute Document Frequency (DF) maps across all articles for TF-IDF ranking
  const DF_MAP_AR = {}, DF_MAP_RU = {};
  ARTICLES.forEach((a) => {
    const wAr = new Set((a._norm_ar || "").match(/[\u0600-\u06FFa-z0-9]+/g) || []);
    wAr.forEach((w) => { DF_MAP_AR[w] = (DF_MAP_AR[w] || 0) + 1; });
    const wRu = new Set((a._norm_ru || "").match(/[a-zа-я0-9]+/g) || []);
    wRu.forEach((w) => { DF_MAP_RU[w] = (DF_MAP_RU[w] || 0) + 1; });
  });

  const INTENT_RULES = [
    [/(?:إخطار|اخطار|إنهاء|انهاء|مهلة الإخطار|уведомлени|расторжени)/i, ["156", "154", "155", "30", "167"]],

  function smartSearch(query) {
    if (!query) return [];
    const hasRuChar = /[а-яё]/i.test(query);
    const hasArChar = /[\u0600-\u06FF]/.test(query);
    const isRu = hasRuChar || (LANG === "ru" && !hasArChar);
    const nq = isRu ? normalizeRu(query) : normalizeArabic(query);
    const sw = isRu ? DOMAIN_STOPWORDS_RU : DOMAIN_STOPWORDS_AR;
    const dfMap = isRu ? DF_MAP_RU : DF_MAP_AR;
    const totalArticles = ARTICLES.length;

    // Direct article number check (e.g. "156", "مادة 156", "статья 156")
    const numMatch = query.match(/\b(\d+)\b/);
    const targetNum = numMatch ? numMatch[1] : null;

    const rawTerms = nq.match(isRu ? /[a-zа-я0-9]+/g : /[\u0600-\u06FFa-z0-9]+/g) || [];
    let terms = rawTerms.filter((tm) => tm.length > 1 && !sw.has(tm));
    if (!terms.length) terms = rawTerms.filter((tm) => tm.length > 1);

    const boostArticles = new Set();
    INTENT_RULES.forEach(([pattern, nums]) => {
      if (pattern.test(nq)) nums.forEach((n) => boostArticles.add(n));
    });

    const scored = [];
    ARTICLES.forEach((a) => {
      const normText = isRu ? (a._norm_ru || "") : (a._norm_ar || "");
      let score = 0;

      if (targetNum && a.number === targetNum) score += 100;
      if (normText.includes(nq)) score += 50;

      for (let i = 0; i < terms.length - 1; i++) {
        const bigram = terms[i] + " " + terms[i + 1];
        if (normText.includes(bigram)) score += 15;
      }

      terms.forEach((tm) => {
        const tf = normText.split(tm).length - 1;
        if (tf > 0) {
          const df = dfMap[tm] || 1;
          const idf = Math.log((totalArticles + 1) / (df + 0.5)) + 1;
          score += Math.sqrt(tf) * idf;
        }
      });

      if (boostArticles.has(a.number)) {
        score = score * 2.5 + 20;
      }

      if (score > 0) {
        scored.push({ a, score, terms, isRu });
      }
    });

    scored.sort((x, y) => y.score - x.score);
    return scored;
  }

  function extractSmartExcerpt(a, terms, isRu) {
    const useRu = isRu !== undefined ? isRu : (LANG === "ru" && !artIsFallback(a));
    const origText = (useRu && a.text_ru) ? a.text_ru : artText(a);
    const normText = (useRu && a._norm_ru) ? a._norm_ru : artNorm(a);
    if (!terms || !terms.length) {
      return origText.slice(0, 260) + (origText.length > 260 ? "…" : "");
    }
    let bestIdx = -1;
    for (const tm of terms) {
      const idx = normText.indexOf(tm);
      if (idx !== -1) {
        bestIdx = idx;
        break;
      }
    }
    if (bestIdx === -1) {
      return origText.slice(0, 260) + (origText.length > 260 ? "…" : "");
    }
    const start = Math.max(0, bestIdx - 50);
    const end = Math.min(origText.length, bestIdx + 220);
    let excerpt = origText.slice(start, end);
    if (start > 0) excerpt = "…" + excerpt;
    if (end < origText.length) excerpt = excerpt + "…";
    return excerpt;
  }

  // ---------------- ASK THE LAW (extractive, no fabrication) ----------------
  function askBoxHtml() {
    return `
    <div class="ask-box">
      <textarea id="ask-input" placeholder="${esc(t("askPlaceholder"))}"></textarea>
      <div style="margin-top:10px;"><button class="btn primary" id="ask-submit">${esc(t("askButton"))}</button></div>
      <div id="ask-result"></div>
    </div>`;
  }

  function wireAskBox(scope) {
    const btn = scope.querySelector("#ask-submit");
    const input = scope.querySelector("#ask-input");
    const result = scope.querySelector("#ask-result");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const q = input.value.trim();
      if (!q) return;
      result.innerHTML = answerQuestion(q);
    });
  }

  // Extractive retrieval: score articles by normalized term overlap with the question.
  // No generative text is produced — only retrieved article numbers/snippets are shown,
  // so the system cannot fabricate a legal rule that isn't in the source text.
  function answerQuestion(q) {
    const results = smartSearch(q);
    if (!results.length) {
      return `<div class="ask-answer"><p>${esc(t("askNoResults"))}</p></div>`;
    }

    const top = results[0].a;
    const excerpt = extractSmartExcerpt(top, results[0].terms, results[0].isRu);

    return `<div class="ask-answer">
      <h4>${esc(t("askAnswerTitle"))}</h4>
      <p style="font-family:var(--serif);font-size:16px;line-height:1.9;">${highlight(excerpt, results[0].terms)}</p>
      ${translationBadge(top)}
      <h4 style="margin-top:16px;">${esc(t("askSources"))}</h4>
      ${results.slice(0, 5).map((s) => `<a class="source-pill" href="#/article/${s.a.number}">${artNumLabel(s.a.number)} ↗</a>`).join("")}
      <p style="color:var(--muted);font-size:12px;margin-top:12px;">
        ${esc(t("askDisclaimer"))}
      </p>
    </div>`;
  }


  // ---------------- BROWSE (3-column) ----------------
  let tocCollapsed = false;
  function renderBrowse(articleNum) {
    const num = articleNum || ARTICLES[0].number;
    const article = ARTICLES_BY_NUM[num];
    if (!article) { renderNotFound(); return; }
    pushRecent(num);

    app.innerHTML = `
    ${topbar("browse")}
    <div class="browse-shell ${tocCollapsed ? "toc-collapsed" : ""}" id="browse-shell">
      <div class="toc-panel"><div class="toc-panel-inner" id="toc-inner"></div></div>
      <div class="article-center" id="article-center"></div>
      <div class="info-panel" id="info-panel"></div>
    </div>
    ${footer()}
    <button class="back-top" id="back-top">↑</button>
    `;
    wireTopbar();
    buildToc(num);
    renderArticleCenter(article);
    renderInfoPanel(article);
    wireBackTop();
  }

  function buildToc(activeNum) {
    const tocInner = document.getElementById("toc-inner");
    const groups = [];
    let lastKey = null, group = null;
    ARTICLES.forEach((a) => {
      const key = (a.book || "") + "||" + (a.part || "");
      if (key !== lastKey) {
        group = { book: artBook(a), part: artPart(a), part_title: artPartTitle(a), items: [] };
        groups.push(group);
        lastKey = key;
      }
      group.items.push(a);
    });
    let html = "";
    groups.forEach((g, gi) => {
      const isOpenGroup = g.items.some((it) => it.number === activeNum);
      html += `<div class="toc-node ${isOpenGroup ? "open" : ""}" data-idx="${gi}">
        <span class="toc-label">${esc(g.book || "")}${g.part ? " › " + esc(g.part_title || g.part) : ""}</span>
        <div class="toc-articles">
          ${g.items.map((it) => `<a class="toc-art-link ${it.number === activeNum ? "active" : ""}" href="#/browse/${it.number}">${artNumLabel(it.number)}</a>`).join("")}
        </div>
      </div>`;
    });
    tocInner.innerHTML = html;
    tocInner.querySelectorAll(".toc-label").forEach((lbl) => {
      lbl.addEventListener("click", () => lbl.parentElement.classList.toggle("open"));
    });

    const activeLink = tocInner.querySelector(".toc-art-link.active");
    if (activeLink) activeLink.scrollIntoView({ block: "center" });
  }

  function renderArticleCenter(article) {
    const center = document.getElementById("article-center");
    const idx = ARTICLES.indexOf(article);
    const prev = ARTICLES[idx - 1];
    const next = ARTICLES[idx + 1];
    const m = META[article.number] || {};
    center.innerHTML = `
      <div class="crumbs">
        <a href="#/">${esc(t("home"))}</a> ›
        <a href="#/browse">${esc(t("law"))}</a> ›
        ${article.book ? `<span>${esc(artBook(article))}</span> › ` : ""}
        ${article.part ? `<span>${esc(artPartTitle(article) || artPart(article))}</span> › ` : ""}
        <span>${artNumLabel(article.number)}</span>
      </div>
      <div class="article-head">
        <p class="num">${artNumLabel(article.number)}</p>
        <p class="path">${esc(artBookTitle(article) || "")}${artPartTitle(article) ? " — " + esc(artPartTitle(article)) : ""}${artChapterTitle(article) ? " — " + esc(artChapterTitle(article)) : ""}</p>
      </div>
      <div class="legal-text-label">${esc(t("legalTextLabel"))}</div>
      ${translationBadge(article)}
      <div class="legal-text">${esc(artText(article))}</div>
      ${LANG === "ru" ? `<p class="translation-disclaimer-note" style="font-size:11.5px;color:var(--muted);margin:14px 0 8px;line-height:1.5;opacity:0.9;">${esc(t("translationWarning"))}</p>` : ""}
      <div class="article-tools">
        <button class="tool-btn" id="copy-text-btn">${esc(t("copyText"))}</button>
      </div>
      <div class="article-nav">
        ${prev ? `<a href="#/browse/${prev.number}"><span class="lbl">${esc(t("prevArticle"))}</span>${artNumLabel(prev.number)}</a>` : `<span></span>`}
        ${next ? `<a href="#/browse/${next.number}" style="text-align:left;"><span class="lbl">${esc(t("nextArticle"))}</span>${artNumLabel(next.number)}</a>` : `<span></span>`}
      </div>
    `;
    const copyBtn = document.getElementById("copy-text-btn");
    if (copyBtn) {
      copyBtn.addEventListener("click", (e) => {
        const articleLabel = artNumLabel(article.number);
        const articleContent = artText(article);
        const textToCopy = articleLabel + "\n\n" + articleContent;
        if (navigator.clipboard) navigator.clipboard.writeText(textToCopy).catch(() => {});
        const original = t("copyText");
        e.target.textContent = t("copied");
        setTimeout(() => (e.target.textContent = original), 1500);
      });
    }
  }

  function aiBlockHtml(article, m) {
    return "";
  }

  function renderInfoPanel(article) {
    const panel = document.getElementById("info-panel");
    const m = META[article.number] || { topics: [], related_articles: [] };
    const topicChips = (m.topics || []).map((slug) => `<a class="info-tag topic" href="#/topics/${slug}">${esc(topicLabel(slug))}</a>`).join("");
    const related = (m.related_articles || []).slice(0, 12);
    panel.innerHTML = `
      <div class="info-block">
        <h5>${esc(t("infoTopics"))}</h5>
        ${topicChips || `<p style="color:var(--muted);font-size:12.5px;">${esc(t("infoNoTopics"))}</p>`}
      </div>
      <div class="info-block">
        <h5>${esc(t("infoExplicitRefs"))}</h5>
        ${related.length ? related.map((r) => `<a class="related-link" href="#/article/${r}">${artNumLabel(r)}<span class="kind">${esc(t("infoExplicitMention"))}</span></a>`).join("")
          : `<p style="color:var(--muted);font-size:12.5px;">${esc(t("infoNoExplicitRefs"))}</p>`}
      </div>
      <div class="info-block">
        <h5>${esc(t("infoRelatedTopic"))}</h5>
        ${relatedByTopic(article, m)}
      </div>
    `;
  }

  function relatedByTopic(article, m) {
    if (!m.topics || !m.topics.length) return `<p style="color:var(--muted);font-size:12.5px;">${esc(t("infoRelatedNone"))}</p>`;
    const sameTopic = new Set();
    m.topics.forEach((slug) => TOPICS[slug].articles.forEach((n) => { if (n !== article.number) sameTopic.add(n); }));
    const list = Array.from(sameTopic).slice(0, 8);
    if (!list.length) return `<p style="color:var(--muted);font-size:12.5px;">${esc(t("infoRelatedNone"))}</p>`;
    return list.map((r) => `<a class="related-link" href="#/article/${r}">${artNumLabel(r)}<span class="kind">${esc(t("infoRelatedKind"))}</span></a>`).join("");
  }

  function wireBackTop() {
    const btn = document.getElementById("back-top");
    window.addEventListener("scroll", () => btn.classList.toggle("show", window.scrollY > 400), { passive: true });
    btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  }

  // ---------------- Single article page (/article/N) ----------------
  function renderArticlePage(num) {
    const article = ARTICLES_BY_NUM[num];
    if (!article) { renderNotFound(); return; }
    renderBrowse(num);
  }

  // ---------------- TOPICS ----------------
  function renderTopicsIndex() {
    app.innerHTML = `
    ${topbar("topics")}
    <div class="page">
      <div class="section-title">${esc(t("topicsTitle"))}<div class="rule"></div></div>
      <div class="topic-grid">
        ${TOPIC_ORDER.map((slug) => `
          <a class="topic-chip" href="#/topics/${slug}">
            <span>${esc(topicLabel(slug))}</span>
            <span class="count">${TOPICS[slug].articles.length}${esc(t("topicCountSuffix"))}</span>
          </a>`).join("")}
      </div>
    </div>
    ${footer()}`;
    wireTopbar();
  }

  function renderTopicDetail(slug) {
    const topic = TOPICS[slug];
    if (!topic) { renderNotFound(); return; }
    const label = topicLabel(slug);
    app.innerHTML = `
    ${topbar("topics")}
    <div class="page">
      <div class="crumbs"><a href="#/">${esc(t("home"))}</a> › <a href="#/topics">${esc(t("topicsTitle"))}</a> › <span>${esc(label)}</span></div>
      <div class="section-title">${esc(label)}<div class="rule"></div></div>
      <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">${topic.articles.length}${esc(t("topicDetailCountSuffix"))}</p>
      ${topic.articles.map((n) => {
        const a = ARTICLES_BY_NUM[n];
        const txt = artText(a);
        return `<div class="result-item"><a href="#/article/${n}"><span class="rnum">${artNumLabel(n)}</span></a>
          ${translationBadge(a)}
          <div class="rexcerpt">${esc(txt.slice(0, 180))}${txt.length > 180 ? "…" : ""}</div>
          <div class="rpath">${esc(artBookTitle(a) || "")}${artPartTitle(a) ? " — " + esc(artPartTitle(a)) : ""}</div>
        </div>`;
      }).join("")}
    </div>
    ${footer()}`;
    wireTopbar();
  }

  // ---------------- NUMBERS PAGE ----------------
  function renderNumbers(filterType) {
    const types = [
      { key: "period", label: t("numbersPeriod") },
      { key: "percentage", label: t("numbersPercentage") },
      { key: "amount", label: t("numbersAmount") },
    ];
    const active = filterType || "all";
    const rows = NUMBERS_INDEX.filter((n) => active === "all" || n.type === active);

    app.innerHTML = `
    ${topbar("numbers")}
    <div class="page">
      <div class="section-title">${esc(t("numbersTitle"))}<div class="rule"></div></div>
      <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">
        ${esc(t("numbersNote"))}
      </p>
      <div class="filter-bar">
        <a class="filter-chip ${active === "all" ? "active" : ""}" href="#/numbers">${esc(t("numbersAll"))} (${NUMBERS_INDEX.length})</a>
        ${types.map((tp) => `<a class="filter-chip ${active === tp.key ? "active" : ""}" href="#/numbers/${tp.key}">${esc(tp.label)} (${NUMBERS_INDEX.filter(n => n.type === tp.key).length})</a>`).join("")}
      </div>
      <div class="numbers-list">
        ${rows.map((n) => {
          const valStr = LANG === "ru" ? (n.display_val_ru || (n.value + " " + n.unit)) : (n.display_val_ar || (n.value + " " + n.unit));
          const summaryStr = LANG === "ru" ? (n.summary_ru || n.context) : (n.summary_ar || n.context);
          return `<div class="number-row">
            <div class="number-val-badge">${esc(valStr)}</div>
            <div class="number-summary">${esc(summaryStr)}</div>
            <a class="number-art-btn" href="#/article/${n.article}">${artNumLabel(n.article)} ↗</a>
          </div>`;
        }).join("")}
      </div>
      ${!rows.length ? `<div class="empty-note">${esc(t("numbersEmpty"))}</div>` : ""}
    </div>
    ${footer()}`;
    wireTopbar();
  }

  // ---------------- SEARCH ----------------
  function renderSearch(query) {
    const q = decodeURIComponent(query || "");
    const results = smartSearch(q);

    app.innerHTML = `
    ${topbar("")}
    <div class="page">
      <div class="section-title">${esc(t("searchResultsFor"))}${esc(q)}${esc(t("searchResultsForEnd"))}<div class="rule"></div></div>
      ${results.length ? results.map(({ a, terms, isRu }) => {
          const excerpt = extractSmartExcerpt(a, terms, isRu);
          return `<div class="result-item">
            <a href="#/article/${a.number}"><span class="rnum">${artNumLabel(a.number)}</span></a>
            ${translationBadge(a)}
            <div class="rexcerpt">${highlight(excerpt, terms)}</div>
            <div class="rpath">${esc(artBookTitle(a) || "")}${artPartTitle(a) ? " — " + esc(artPartTitle(a)) : ""}</div>
          </div>`;
        }).join("") : `<div class="empty-note">${esc(t("searchEmpty1"))}${esc(q)}${esc(t("searchEmpty2"))}<br>${esc(t("searchEmptyHint"))}</div>`}
    </div>
    ${footer()}`;
    wireTopbar();
  }

  // ---------------- 404 ----------------
  function renderNotFound() {
    app.innerHTML = `${topbar("")}<div class="page"><div class="empty-note">${esc(t("notFound"))}<br><a href="#/">${esc(t("backHome"))}</a></div></div>${footer()}`;
    wireTopbar();
  }

  // ---------------- Topbar wiring (search + theme + lang + palette) ----------------
  function wireTopbar() {
    const input = document.getElementById("global-search-input");
    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && input.value.trim()) location.hash = "#/search?q=" + encodeURIComponent(input.value.trim());
      });
    }
    const themeBtn = document.getElementById("theme-toggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const isDark = cur === "dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        setTheme(isDark ? "light" : "dark");
      });
    }
    document.querySelectorAll("[data-lang-select]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const targetLang = e.currentTarget.dataset.langSelect;
        if (targetLang && targetLang !== LANG) setLang(targetLang);
      });
    });
    const langBtn = document.getElementById("lang-toggle");
    if (langBtn) {
      langBtn.addEventListener("click", () => {
        setLang(LANG === "ru" ? "ar" : "ru");
      });
    }

    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const navLinks = document.querySelector(".nav-links");
    if (mobileMenuBtn && navLinks) {
      mobileMenuBtn.onclick = (e) => {
        e.stopPropagation();
        navLinks.classList.toggle("mobile-open");
      };
      document.onclick = (e) => {
        if (!navLinks.contains(e.target) && e.target !== mobileMenuBtn) {
          navLinks.classList.remove("mobile-open");
        }
      };
      navLinks.querySelectorAll("a").forEach(a => {
        a.onclick = () => navLinks.classList.remove("mobile-open");
      });
    }
  }

  // ---------------- Command palette (Ctrl+K) ----------------
  let paletteOpen = false;
  function openPalette() {
    if (paletteOpen) return;
    paletteOpen = true;
    const overlay = document.createElement("div");
    overlay.className = "palette-overlay";
    overlay.innerHTML = `<div class="palette">
      <input placeholder="${esc(t("palettePlaceholder"))}" autofocus />
      <div class="palette-results"></div>
    </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector("input");
    const results = overlay.querySelector(".palette-results");
    function close() { overlay.remove(); paletteOpen = false; }
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    document.addEventListener("keydown", function esc1(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc1); } });

    function update() {
      const q = input.value.trim();
      const nq = normalizeText(q);
      let items = [];
      if (!q) {
        items = TOPIC_ORDER.slice(0, 8).map((slug) => ({ type: "topic", slug, label: topicLabel(slug) }));
      } else {
        const smartRes = smartSearch(q);
        smartRes.slice(0, 8).forEach(({ a, terms, isRu }) => {
          items.push({ type: "article", num: a.number, label: artNumLabel(a.number), excerpt: extractSmartExcerpt(a, terms, isRu).slice(0, 60), fallback: artIsFallback(a) });
        });
        Object.keys(TOPICS).forEach((slug) => {
          if (normalizeText(topicLabel(slug)).includes(nq)) items.push({ type: "topic", slug, label: topicLabel(slug) });
        });
      }
      results.innerHTML = items.slice(0, 10).map((it) => {
        if (it.type === "article") return `<div class="palette-item" data-href="#/article/${it.num}"><span><span class="pnum">${it.label}</span>${it.fallback ? ' <span style="color:var(--brass-deep);font-size:11px;">(' + (LANG === "ru" ? "AR, без перевода" : "بدون ترجمة") + ')</span>' : ""} ${it.excerpt ? "— " + esc(it.excerpt) : ""}</span></div>`;
        return `<div class="palette-item" data-href="#/topics/${it.slug}"><span>🏷 ${esc(it.label)}</span></div>`;
      }).join("") || `<div class="palette-item">${esc(t("paletteNoResults"))}</div>`;
      results.querySelectorAll(".palette-item[data-href]").forEach((el) => {
        el.addEventListener("click", () => { location.hash = el.dataset.href; close(); });
      });
    }
    input.addEventListener("input", update);
    update();
    setTimeout(() => input.focus(), 30);
  }

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openPalette();
    }
  });

  // ---------------- Main render dispatcher ----------------
  function render() {
    const parts = route();
    window.scrollTo(0, 0);
    if (!parts.length) return renderHome();
    if (parts[0] === "browse") return renderBrowse(parts[1]);
    if (parts[0] === "article") return renderArticlePage(parts[1]);
    if (parts[0] === "topics" && parts[1]) return renderTopicDetail(parts[1]);
    if (parts[0] === "topics") return renderTopicsIndex();
    if (parts[0] === "numbers") return renderNumbers(parts[1]);
    if (parts[0] === "ask") return renderAskPage();
    if (parts[0].startsWith("search")) {
      const q = parts[0].split("q=")[1] || location.hash.split("q=")[1];
      return renderSearch(q);
    }
    return renderNotFound();
  }

  function renderAskPage() {
    app.innerHTML = `
    ${topbar("ask")}
    <div class="container-narrow" style="padding-top:36px;">
      <div class="section-title" style="margin-top:0;">${esc(t("askPageTitle"))}<div class="rule"></div></div>
      <p style="color:var(--muted);font-size:13.5px;">
        ${esc(t("askPageDesc"))}
      </p>
      ${askBoxHtml()}
    </div>
    ${footer()}`;
    wireTopbar();
    wireAskBox(app.querySelector(".container-narrow"));
  }
})();
</script>
</body>
</html>
