я за него пошлина — не свыше пятисот фунтов, — и случаи освобождения от неё.\n\nПривлечение работника к труду допускается только при наличии у него такого разрешения.\n\nЛицо, обращающееся за разрешением, обязано приложить к заявлению свидетельство, подтверждающее уровень его квалификации; компетентный министр по согласованию с соответствующей профсоюзной организацией работников и соответствующей организацией работодателей издаёт решение, определяющее все сведения, которые должны быть указаны в этом свидетельстве, правила, касающиеся оценки уровня квалификации, органы, уполномоченные определять этот уровень, порядок его определения, условия допуска к нему, место его проведения для каждого ремесла или профессии, а также степени квалификации, присваиваемые по результатам испытаний, и установленную за это пошлину — не свыше пятисот фунтов, — и случаи освобождения от этой пошлины.\n\nОт получения этого свидетельства освобождаются выпускники средних и высших технических училищ, а также высших институтов и университетов, работающие по своей специальности.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "28", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يشترط فى المتدرج ألا يقل سنه عن أربعة عشر عاما  ،ويصدر الوزير المختص\nقرارا بالقواعد والإجراءات المنظمة للتدرج المهنى لدى صاحب العمل .", "text_ru": "Условием для ученика (стажёра) является достижение им возраста не менее четырнадцати лет; компетентный министр издаёт решение о правилах и порядке, регулирующих ученичество у работодателя.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "29", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يجب أن يكون اتفاق التدرج مكتوبا  ،وتحدد فيه على الأخص مدة تعلـم المهنـة\nأو الصنعة أو الحرفة  ،ومراحلها المتتابعة والمكافأة التـى يحـصل عليهـا المتـدرج\nفى كل مرحلة بصورة تصاعدية  ،على ألا تقل فى المرحلة الأخيرة عن الحد الأدنـى\nللأجر المحدد لفئة العمال فى المهنة  ،أو الصنعة أو الحرفة التى يتدرج فيها .", "text_ru": "Соглашение об ученичестве должно быть заключено в письменной форме; в нём, в частности, определяются срок обучения профессии, специальности или ремеслу, его последовательные этапы, а также вознаграждение, получаемое учеником на каждом этапе, возрастающее по нарастающей, причём на последнем этапе оно не должно быть ниже минимального размера заработной платы, установленного для соответствующей категории работников по данной профессии, специальности или ремеслу, по которым проходит обучение.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "30", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "لصاحب العمل أن ينهى اتفاق التدرج إذا ثبت لديه عـدم صـلاحية المتـدرج ،\nأو عدم استعداده لتعلم المهنة  ،أو الصنعة  ،أو الحرفة  ،بصورة حسنة  ،كمـا يجـوز\nللمتدرج أن ينهى الاتفاق .\nويشترط أن يخطر الطرف الراغب فى إنهاء الاتفاق الطرف الآخر بـذلك قبـل\nالإنهاء بثلاثة أيام على الأقل .", "text_ru": "Работодатель вправе прекратить соглашение об ученичестве, если установит непригодность ученика либо отсутствие у него готовности к добросовестному изучению профессии, специальности или ремесла; ученик также вправе прекратить соглашение.\n\nСторона, желающая прекратить соглашение, обязана уведомить об этом другую сторону не позднее чем за три дня до прекращения.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "31", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "مع عدم الإخلال بأحكام الفصل الرابع من البـاب الثـانى مـن هـذا الكتـاب ،\nتسرى على المتدرجين الأحكام الخاصة بالإجازات  ،وساعات العمل  ،وفترات الراحة\nالمنصوص عليها فى هذا القانون .", "text_ru": "Без ущерба для положений главы четвёртой раздела второго настоящей книги, на учеников распространяются положения об отпусках, рабочем времени и периодах отдыха, предусмотренные настоящим Трудовым кодексом.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "32", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "ينشأ مجلس يسمى \"المجلس الأعلى لتخطيط وتشغيل القوى العاملة فـى الـداخل\nوالخارج\" برئاسة الوزير المختص  ،ويضم ممثلين للوزارات والجهـات المختـصة ،\nوعددا متساويا من ممثلى كل من منظمات أصحاب الأعمال المعنية الأكثـر تمثـيلا ً ،\nترشحهم منظماتهم وممثلى المنظمات النقابية العمالية المعنية  ،على أن يراعى تمثيـل\nجميع مستويات المنظمات النقابية العمالية ما لم يكن ذلك متعذرا .\n\nويتولى المجلس رسم السياسة العامة لتشغيل العمالـة فـى الـداخل والخـارج ،\nووضع النظم والقواعد  ،والإجراءات اللازمة لهذا التشغيل من واقع احتياجات أسـواق\nالعمل فى الداخل والخارج  ،والاستعداد لوظائف المستقبل  ،بما يتفـق مـع الـسياسة\nالعامة للدولة .\nويصدر بتشكيل المجلس  ،واختصاصاته  ،ونظام العمل به قـرار مـن رئـيس\nمجلس الوزراء فى مدة أقصاها ستة أشهر من تاريخ العمل بهذا القانون .", "text_ru": "Учреждается совет под названием «Высший совет по планированию и трудоустройству рабочей силы внутри страны и за рубежом» под председательством компетентного министра; в его состав входят представители соответствующих министерств и органов, а также равное число представителей наиболее представительных заинтересованных организаций работодателей, выдвигаемых их организациями, и представителей соответствующих профсоюзных организаций работников, при этом учитывается представленность всех уровней профсоюзных организаций работников, если это возможно.\n\nСовет разрабатывает общую политику трудоустройства рабочей силы внутри страны и за рубежом, устанавливает системы, правила и процедуры, необходимые для такого трудоустройства, исходя из потребностей внутреннего и внешнего рынков труда, и готовится к профессиям будущего в соответствии с общей государственной политикой.\n\nСостав совета, его полномочия и порядок его работы устанавливаются решением Председателя Совета министров в срок, не превышающий шести месяцев со дня вступления настоящего Трудового кодекса в силу.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "33", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "مع عدم الإخلال بأحكام قانون حقوق الأشخاص ذوى الإعاقة الـصادر بالقـانون\nرقم  ١٠لسنة  ، ۲۰۱٨على كل قادر على العمل  ،وراغب فيه أن يتقدم بطلـب لقيـد\nاسمه بالجهة الإدارية المختصة مع بيان سنه ومهنته ومؤهلاتـه وخبراتـه الـسابقة ،\nوعلى هذه الجهة قيد تلك الطلبات بسجلات ورقية أو إلكترونية وإعطاء الطالب شـهادة\nتفيد القيد دون مقابل  ،وتحدد البيانات التى يجب أن تتضمنها الـشهادة المـشار إليهـا\nبقرار من الوزير المختص .\nولا يجوز تشغيل العامل إلا إذا كان حاصلا ً على الشهادة المشار إليها فى الفقـرة\nالأولى من هذه المادة  ،واستثناء من ذلك لصاحب العمل أن يعين من غير الحاصـلين\nعليها بشرط قيد اسم العامل بالجهة الإدارية المختصة خلال ثلاثين يوما مـن تـاريخ\nتسلمه العمل .\nويجوز لصاحب العمل أن يستوفى احتياجاته الوظيفية والمهنية والحرفية بالنـسبة\nللوظائف والأعمال التى خلت أو أنشئت لديه ممن ترشحهم الجهة الإداريـة المختـصة\nالتى يقع فى دائرتها محل عمله من المسجلين لديها مراعية أسبقية القيد .", "text_ru": "Без ущерба для положений Закона о правах лиц с инвалидностью № 10 от 2018 года, каждое трудоспособное лицо, желающее работать, вправе подать заявление о регистрации своего имени в компетентном административном органе с указанием возраста, профессии, квалификации и предыдущего опыта; этот орган обязан регистрировать такие заявления в бумажных или электронных реестрах и бесплатно выдавать заявителю свидетельство о регистрации; сведения, которые должно содержать указанное свидетельство, определяются решением компетентного министра.\n\nПривлечение работника к труду допускается только при наличии у него свидетельства, указанного в первом абзаце настоящей статьи; в порядке исключения работодатель вправе принять на работу лицо, не имеющее такого свидетельства, при условии регистрации имени работника в компетентном административном органе в течение тридцати дней со дня начала его работы.\n\nРаботодатель вправе удовлетворять свои потребности в должностях, профессиях и ремёслах в отношении вакантных или вновь созданных у него должностей и работ за счёт лиц, направляемых компетентным административным органом, в округе которого расположено место его работы, из числа зарегистрированных у него лиц, с учётом очерёдности регистрации.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "34", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "إذا كان الراغب فى العمل يمارس حرفة أو مهنة من التى يصدر بتحديدها قـرار\nمن الوزير المختص وفق ًا لنص المادة (۲۷)من هذا القانون  ،وجب عليـه أن يرفـق\nبطلب القيد شهادة قياس مستوى مهارته وترخيص مزاولتها .", "text_ru": "Если лицо, желающее работать, занимается ремеслом или профессией из числа тех, перечень которых устанавливается решением компетентного министра в соответствии со статьёй (27) настоящего Трудового кодекса, оно обязано приложить к заявлению о регистрации свидетельство об оценке уровня своей квалификации и разрешение на занятие этим ремеслом.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "35", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "مع عدم الإخلال بأحكام قانون حقوق الأشخاص ذوى الإعاقة المشار إليه تلتـزم\nالمنشآت القائمة وقت تطبيق هذا القانون  ،وتلك التى تنشأ مستقبلا ً أن تعيد إلى الجهـة\nالإدارية المختصة شهادة قيد العامل الصادرة عنها خلال خمسة وأربعـين يومـا مـن\nتاريخ استلام العمل بعد استيفاء البيانات المدونة بها  ،وعليها تدوين رقم شهادة القيـد ،\nوتاريخها أمام اسم العامل فى سجل قيد العمال بالمنشأة .", "text_ru": "Без ущерба для положений упомянутого Закона о правах лиц с инвалидностью, предприятия, существующие на момент применения настоящего Трудового кодекса, и создаваемые в будущем, обязаны возвращать в компетентный административный орган выданное им свидетельство о регистрации работника в течение сорока пяти дней со дня начала его работы после заполнения указанных в нём сведений; они обязаны указать номер свидетельства о регистрации и его дату напротив имени работника в реестре регистрации работников предприятия.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "36", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "تلتزم المنشآت الخاضعة لأحكام هذا القانون بأن ترسـل إلـى الجهـة الإداريـة\nالمختصة خلال ثلاثين يوما من تاريخ بدء العمل بالمنشأة  ،بيان ًا مفصلا ً بعـدد العمـال\nطبق ًا لمؤهلاتهم  ،ومهنهم  ،وفئات أعمـارهم  ،وجنـسياتهم  ،ونـوعهم  ،والأجـور\nالتى يتقاضونها .\nوعلى هذه المنشآت أن ترسل إلى تلك الجهة خلال شهر ينـاير مـن كـل عـام\nالبيانات الآتية :\n-١ما طرأ من تعديلات على البيانات الواردة فى الفقرة الأولى من هذه المادة .\n-٢عدد الوظائف الشاغرة بسبب الإحلال أو التوسـعات الجديـدة  ،والوظـائف\nالتى تم إلغاؤها .\n-٣بيان بتقـدير الاحتياجـات المتوقعـة حـسب الحالـة التعليميـة والمهنيـة\nخلال العام التالي .\nوذلك كله وفق ًا للنماذج التى تعدها الوزارة المختصة .\nوعلى الجهة الإدارية المختصة موافاة الهيئة القومية للتأمين الاجتمـاعى بنـسخة\nمن البيانات المشار إليها بالفقرة الثانية من هذه المادة .", "text_ru": "Предприятия, на которые распространяются положения настоящего Трудового кодекса, обязаны направить в компетентный административный орган в течение тридцати дней со дня начала работы предприятия подробную ведомость о численности работников по их квалификации, профессии, возрастным категориям, гражданству и полу, а также о размере получаемой ими заработной платы.\n\nЭти предприятия обязаны также ежегодно в течение января направлять этому органу следующие сведения:\n1. изменения, внесённые в сведения, указанные в первом абзаце настоящей статьи;\n2. число вакантных должностей в связи с заменой работников или новым расширением, а также число упразднённых должностей;\n3. сведения об оценке ожидаемых потребностей исходя из уровня образования и специальности на следующий год.\n\nВсё это — по формам, разрабатываемым компетентным министерством.\n\nКомпетентный административный орган обязан направлять Национальному управлению социального страхования копию сведений, указанных во втором абзаце настоящей статьи.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "37", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "تلتزم المنشآت المشار إليها فى المادة (٣٥)من هذا القانون بإمساك سجل ورقـى\nأو إلكترونى لقيد أسماء الأشخاص ذوى الإعاقة والأقزام الحاصـلين علـى شـهادات\nالتأهيل أو بطاقة إثبات الإعاقة والخدمات المتكاملة  ،بحسب الأحوال  ،الـذين ألحقـوا\n\nبالعمل لديها  ،يشتمل على البيانات الواردة فى شهادات التأهيل أو بطاقة إثبات الإعاقة\nوالخدمات المتكاملة بحسب الأحوال  ،ويجب تقديم هذا السجل إلـى الجهـة الإداريـة\nالمختصة كلما طلب منها ذلك .\nويجب إخطار تلك الجهة ببيان يتضمن العدد الإجمالى للعاملين  ،وعدد الوظـائف\nالتى يشغلها الأشخاص ذوو الإعاقة والأقزام  ،والأجر الذى يتقاضاه كل منهم  ،وذلـك\nوفق ًا للنموذج والموعد اللذين يصدر بتحديدهما قرار من الوزير المختص .", "text_ru": "Предприятия, указанные в статье (35) настоящего Трудового кодекса, обязаны вести бумажный или электронный реестр для регистрации имён лиц с инвалидностью и лиц с карликовостью, имеющих свидетельства о переподготовке либо удостоверение, подтверждающее инвалидность, и комплексные услуги, в зависимости от обстоятельств, принятых ими на работу; реестр должен содержать сведения, указанные в свидетельствах о переподготовке либо в удостоверении, подтверждающем инвалидность, и комплексных услугах, в зависимости от обстоятельств; этот реестр должен предоставляться компетентному административному органу по каждому его запросу.\n\nЭтот орган должен быть уведомлён сведениями, включающими общую численность работников, число должностей, занимаемых лицами с инвалидностью и лицами с карликовостью, и заработную плату, получаемую каждым из них, — по форме и в сроки, устанавливаемые решением компетентного министра.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "38", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الأول", "chapter_title": "سياسات التشغيل", "text": "تلتزم جميع المنشآت الخاضعة لأحكام هذا القانون بموافـاة الـوزارة المختـصة\nورقيا أو إلكترونيا بالبيانات أو المعلومات اللازمة لإنشاء أو تحـديث قواعـد بيانـات\nالعمالة  ،ونظام معلومات سوق العمل خلال ثلاثين يوما من تاريخ طلبها .\nكما يجب على أصحاب الأعمال أو من يمثلونهم بذل العناية الواجبة للتعاون مع الجهة\nالإدارية المختصة لاستيفاء استمارات جمع البيانات أو المعلومات ورقيا أو إلكترونيا .\nوعلى الوزارة المختصة القيام بجمع البيانات اللازمة عن سوق العمـل وإجـراء\nالدراسات والأبحاث الميدانية منفردة أو بالتنسيق مع الجهات المختـصة  ،وعليهـا أن\nتصدر تقارير دورية قطاعية أو جغرافية عن احتياجات سوق العمل الحالى والمستقبلى\nمن المهن والمهارات  ،ورصد أية تغيرات تطرأ عليه .", "text_ru": "Все предприятия, на которые распространяются положения настоящего Трудового кодекса, обязаны представлять компетентному министерству в бумажной или электронной форме данные или сведения, необходимые для создания или обновления баз данных о рабочей силе и системы информации о рынке труда, в течение тридцати дней со дня получения соответствующего запроса.\n\nРаботодатели или их представители обязаны также проявлять должную осмотрительность и сотрудничать с компетентным административным органом при заполнении форм сбора данных или сведений в бумажной или электронной форме.\n\nКомпетентное министерство обязано осуществлять сбор необходимых данных о рынке труда и проводить исследования и полевые изыскания самостоятельно либо во взаимодействии с компетентными органами; оно обязано публиковать периодические отраслевые или географические отчёты о текущих и будущих потребностях рынка труда в профессиях и навыках и отслеживать любые происходящие в нём изменения.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава первая", "chapter_title_ru": "Политика трудоустройства"}, {"number": "39", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "يستثنى من تطبيق أحكام هذا الفصل ما يأتي :\n-١الأعمال العرضية وما فى حكمها .\n-٢الوظائف الرئيسية التى يعتبر شاغلوها وكلاء مفوضين عن صاحب العمل .\nوللوزير المختص أن يصدر قرارا بسريان أحكام هذا الفصل على كل  ،أو بعض\nالأعمال والوظائف والفئات المشار إليها فى البندين (٢) ، ١من هذه المادة .", "text_ru": "Из применения положений настоящей главы исключаются:\n1. разовые (случайные) работы и приравненные к ним;\n2. основные должности, занимающие которые лица считаются уполномоченными представителями работодателя.\n\nКомпетентный министр вправе издать решение о распространении положений настоящей главы на все или часть работ, должностей и категорий, указанных в пунктах 1 и 2 настоящей статьи.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "40", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "مع عدم الإخلال بالاتفاقيات الدولية المتعلقة بالتشغيل  ،تكون مزاولـة عمليـات إلحـاق\nالمصريين للعمل بالداخل أو الخارج عن طريق الوزارة المختصة  ،أو الجهات الآتية :\n-١الوزارات والهيئات العامة بالنسبة للعاملين لديها .\n-۲شركات القطاع العام وقطاع الأعمال العـام والقطـاع الخـاص المـصرية\nللعاملين لديها فيما تبرمه من تعاقدات مع الجهـات الأجنبيـة فـى حـدود أعمالهـا ،\nوطبيعة نشاطها .\n-٣وكالات التشغيل الخاصة التى تتخذ شكل الشركة المـساهمة  ،أو التوصـية\nبالأسهم  ،أو ذات المسئولية المحدودة أو الـشخص الواحـد المـرخص لهـا بـذلك\nمن الوزارة المختصة .", "text_ru": "Без ущерба для международных соглашений, касающихся трудоустройства, осуществление деятельности по трудоустройству египтян внутри страны или за рубежом производится через компетентное министерство либо через следующие органы:\n1. министерства и государственные учреждения — в отношении своих работников;\n2. египетские компании государственного сектора, государственного делового сектора и частного сектора — в отношении своих работников, в рамках заключаемых ими договоров с иностранными сторонами в пределах их деятельности и характера их работы;\n3. частные агентства занятости, учреждённые в форме акционерного общества, товарищества на паях, общества с ограниченной ответственностью или компании одного лица, получившие на это разрешение от компетентного министерства.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "41", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "مع عدم الإخلال بالشروط التى يوجبها قـانون شـركات المـساهمة وشـركات\nـشخص\nـركات الـ\nـدودة وشـ\nـسئولية المحـ\nـشركات ذات المـ\nـهم والـ\nـية بالأسـ\nالتوصـ\nالواحد الصادر بالقانون رقم  ١٥٩لسنة  ۱۹۸۱يلزم للحصول على الترخيص المـشار\nإليه فى البند (٣)من المادة (٤٠)من هذا القانون  ،توافر الـشروط المقـررة لـذلك ،\nوعلى الأخص :\n-١أن يكون المؤسسون وأعضاء مجلس الإدارة والمديرون المختصون بعمليـات\nالتشغيل لم يسبق الحكم على أى منهم بعقوبة جناية  ،أو بعقوبة مقيدة للحرية فى جنحة\nمخلة بالشرف أو الأمانة أو الآداب العامة  ،ما لم يكن قد رد إليه اعتباره .\n-٢ألا يقل رأسمال الشركة المصدر أو المدفوع  ،بحسب الأحوال  ،عن مـائتين\nوخمسين ألف جنيه وأن يكون مملوك ًا بأكمله للمـصريين إذا كانـت الـشركة تـزاول\nعمليات التشغيل بالداخل  ،وألا يقل عن خمسمائة ألف جنيه إذا كانت تزاول عمليـات\nتشغيل المصريين بالخارج أو بالداخل والخارج معا  ،وأن تكـون الأغلبيـة المطلقـة\nللمؤسسين وأعضاء مجلس الإدارة من المصريين الذين يمتلكون فى مجموعهم (٥١٪)\nعلى الأقل من رأسمالها .\n\n-٣أن تقدم الشركة تأمين ًا لا يقل عن مليون جنيه إما نقدا أو بخطاب ضمان غير\nمشروط وغير قابل للإلغاء صادر من أحد البنوك المسجلة لـدى البنـك المركـزى ،\nلصالح الوزارة المختصة  ،وأن يكون ساريا طوال مـدة سـريان التـرخيص وذلـك\nلضمان التزام المرخص له بالتزاماته  ،ويتعين استكمال قيمة التأمين بمقدار ما لم تقـم\nبأدائه من غرامات أو تعويضات حكم بها عليها  ،أو مبالغ تقاضتها دون وجه حـق ،\nطبق ًا لأحكام هذا القانون  ،وذلك خلال خمسة عشر يوما من تـاريخ إخطـار الـشركة\nالمرخص لها بكتاب موصى عليه بعلم الوصول بوجوب استكمال التأمين .\nويكون الترخيص لمدة سنة قابلة للتجديد وفق ًا للقواعد والإجراءات التى يصدر بها\nقرار من الوزير المختص  ،وذلك مقابل أداء الرسم الذى يحدده الوزير المختص لمـنح\nالترخيص أو تجديده بما لا يجاوز عشرة آلاف جنيـه  ،وللـوزير المخـتص إضـافة\nشروط أخرى للحصول على التـرخيص  ،ولـه وقـف إصـدار تـراخيص جديـدة\nإذا اقتضت المصلحة العامة ذلك فى ضوء متغيرات سوق العمل الفعلية .", "text_ru": "Без ущерба для требований, установленных Законом об акционерных обществах, товариществах на паях, обществах с ограниченной ответственностью и компаниях одного лица № 159 от 1981 года, для получения разрешения, указанного в пункте 3 статьи (40) настоящего Трудового кодекса, необходимо соблюдение установленных для этого условий, в частности:\n1. учредители, члены совета директоров и руководители, отвечающие за деятельность по трудоустройству, не должны иметь судимости за преступление либо за проступок, связанный с лишением свободы, порочащий честь, добросовестность или общественную нравственность, если только их правоспособность не была восстановлена;\n2. выпущенный или оплаченный (в зависимости от обстоятельств) капитал компании должен составлять не менее двухсот пятидесяти тысяч фунтов и полностью принадлежать египтянам, если компания осуществляет трудоустройство внутри страны, и не менее пятисот тысяч фунтов, если она осуществляет трудоустройство египтян за рубежом либо одновременно внутри страны и за рубежом; при этом абсолютное большинство учредителей и членов совета директоров должны быть египтянами, владеющими в совокупности не менее 51% её капитала;\n3. компания должна предоставить обеспечение на сумму не менее одного миллиона фунтов, наличными либо безусловной и безотзывной банковской гарантией, выданной одним из банков, зарегистрированных в Центральном банке, в пользу компетентного министерства; обеспечение должно действовать в течение всего срока действия разрешения для гарантии исполнения получателем разрешения своих обязательств; сумма обеспечения подлежит пополнению на величину неуплаченных штрафов или присуждённых с неё компенсаций либо неправомерно полученных ею сумм в соответствии с положениями настоящего Трудового кодекса в течение пятнадцати дней со дня уведомления получившей разрешение компании заказным письмом с уведомлением о вручении о необходимости пополнения обеспечения.\n\nРазрешение выдаётся сроком на один год с возможностью продления в порядке, устанавливаемом решением компетентного министра, за уплату пошлины, определяемой компетентным министром за выдачу или продление разрешения, не свыше десяти тысяч фунтов; компетентный министр вправе устанавливать дополнительные условия для получения разрешения и вправе приостанавливать выдачу новых разрешений, если этого требуют публичные интересы с учётом фактических изменений на рынке труда.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "42", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "يصدر الوزير المختص قرارا يتضمن التزامات الشركات المرخص لها بالتـشغيل\nوالشروط الواجب توافرها فى مقر الشركة وإدارتها  ،وتنظيم إجراءات العمل فى هـذا\nالنشاط والسجلات اللازمة لمباشرة عملها والتى يتعين إمساكها  ،وقواعد القيد فيهـا ،\nوالرقابة والتفتيش عليها  ،والشروط الواجب توافرهـا فـى الإعلانـات التـى تنـشر\nعن فرص العمل .", "text_ru": "Компетентный министр издаёт решение, определяющее обязанности компаний, получивших разрешение на трудоустройство, требования к местонахождению и управлению компании, порядок организации работы в этой сфере деятельности и необходимые для её осуществления реестры, подлежащие ведению, правила регистрации в них, порядок контроля и инспектирования, а также требования, предъявляемые к объявлениям о вакансиях.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "43", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "يحظر على الجهات المشار إليها فى المادة (٤٠)من هـذا القـانون تقاضـى أى\nمبالغ مالية من العامل بطريقة مباشرة أو غير مباشرة نظير إلحاقه بالعمـل  ،ولهـا أن\nتتقاضى مقابل ذلك من صاحب العمل .\nواستثناء من أحكام الفقرة الأولى من هذه المادة يجوز للـشركات المـشار إليهـا\nفى البند (٣)من المادة (٤٠)من هذا القانون أن تتقاضى مبلغ ًا لا يجـاوز (١٪)مـن\nأجر العامل الذى يتم إلحاقه بالعمل  ،وذلك عن السنة الأولى فقط كمصروفات إدارية ،\nويحظر تقاضى أى مبالغ أخرى من العامل تحت أى مسمى .", "text_ru": "Органам, указанным в статье (40) настоящего Трудового кодекса, запрещается взимать с работника какие-либо денежные суммы прямо или косвенно за его трудоустройство; они вправе взимать плату за это с работодателя.\n\nВ порядке исключения из первого абзаца настоящей статьи компании, указанные в пункте 3 статьи (40) настоящего Трудового кодекса, вправе взимать сумму, не превышающую 1% заработной платы трудоустраиваемого работника, только за первый год в качестве административных расходов; взимание с работника любых иных сумм под каким-либо иным наименованием запрещается.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "44", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "يلغى الترخيص المشار إليه بالبند (٣)من المادة (٤٠)من هـذا القـانون بقـرار\nمن الوزير المختص فى الحالات الآتية :\n-١فقد الشركة شرط ًا من شروط الترخيص .\n-٢حصول الشركة على الترخيص أو تجديده بناء على ما قدمتـه مـن بيانـات\nغير صحيحة .\n-٣ثبوت ممارسة الشركة لنشاطها خـارج المقـر المـرخص لهـا ممارسـة\nالنشاط فيه .\n-٤تشغيل العامل دون تحرير عقد عمل مكتـوب  ،أو مـا يقـوم مقامـه لـدى\nبعض الدول  ،أو عدم اعتماد العقد من الجهة الإدارية المختصة .\n-٥عدم إمساك السجلات الخاصة بتسجيل بيانات العمالة أو تسجيل المبالغ التـى\nيتم تحصيلها منهم  ،والتى يصدر بتحديدها قرار من الوزير المختص .\n-٦قيام الشركة بالإعلان عن وظائف غير حقيقية أو تجاوز الشركة حدود التعاقد\nمع أصحاب الأعمال .\n-٧تقاضى الشركة أى مبالغ مـن العامـل نظيـر تـشغيله بالمخالفـة لأحكـام\nهذا القانون .\nويجوز للوزير المختص إيقاف نشاط الشركة مؤقت ًا فى أى من الحـالات المبينـة\nفى الفقرة الأولى من هذه المادة لحين الفصل فى مدى ثبوت تلك الحـالات  ،أو زوال\nتلك المخالفات .\nولا يخل إلغاء الترخيص فى أى من الحالات المبينة فى هذه المـادة بالمـسئولية\nالجنائية أو المدنية أو التأديبية .", "text_ru": "Разрешение, указанное в пункте 3 статьи (40) настоящего Трудового кодекса, аннулируется решением компетентного министра в следующих случаях:\n1. утрата компанией одного из условий получения разрешения;\n2. получение компанией разрешения либо его продление на основании представленных ею недостоверных сведений;\n3. установление факта осуществления компанией деятельности за пределами места, для которого ей выдано разрешение на осуществление деятельности;\n4. привлечение работника к труду без составления письменного трудового договора либо документа, заменяющего его в некоторых государствах, либо без утверждения договора компетентным административным органом;\n5. неведение реестров регистрации сведений о работниках либо регистрации сумм, взыскиваемых с них, перечень которых устанавливается решением компетентного министра;\n6. размещение компанией объявлений о фиктивных вакансиях либо превышение компанией пределов договорных отношений с работодателями;\n7. взимание компанией с работника каких-либо сумм за его трудоустройство в нарушение положений настоящего Трудового кодекса.\n\nКомпетентный министр вправе временно приостановить деятельность компании в любом из случаев, указанных в первом абзаце настоящей статьи, до решения вопроса о подтверждении этих случаев либо устранения этих нарушений.\n\nАннулирование разрешения в любом из случаев, указанных в настоящей статье, не затрагивает уголовной, гражданской или дисциплинарной ответственности.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "45", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "مع مراعاة حكم المادة (٤٠)من هذا القانون  ،لا يجوز للمنشآت تـشغيل عمـال\nعن طريق متعهد أو مقاول توريد عمال .", "text_ru": "С учётом положений статьи (40) настоящего Трудового кодекса, предприятиям запрещается привлекать работников через подрядчика или посредника по поставке рабочей силы.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "46", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "مع عدم الإخلال بأحكام قانون تنظيم ممارسة العمل الأهلـى الـصادر بالقـانون\nرقم  ١٤٩لسنة  ۲۰۱۹يجوز للوزير المخـتص  ،وفق ًـا لاحتياجـات سـوق العمـل\nالترخيص للجمعيات والمؤسسات الأهلية بإنشاء مكاتب لتشغيل المتعطلين بالداخل .\nوعلى تلك المكاتب مراعاة الأحكام الواردة فى هذا الفصل من القانون والقرارات\nالوزارية الصادرة بشأنه .\nويصدر الوزير المختص قرارا بتنظيم أعمال تلـك المكاتـب  ،وشـروط مـنح\nالترخيص وحالات إلغائه والرسوم المقررة عليه بما لا يجاوز خمسة آلاف جنيه .\nوتعفى تلك المكاتب من الشكل القانونى للشركات  ،كما تعفى من تقـديم التـأمين\nأو خطاب الضمان .", "text_ru": "Без ущерба для положений Закона о регулировании осуществления общественной деятельности № 149 от 2019 года, компетентный министр вправе, исходя из потребностей рынка труда, выдавать разрешения ассоциациям и частным (общественным) учреждениям на создание бюро по трудоустройству безработных внутри страны.\n\nЭти бюро обязаны соблюдать положения настоящей главы Закона и изданные в соответствии с ней министерские решения.\n\nКомпетентный министр издаёт решение, регулирующее деятельность этих бюро, условия выдачи разрешения, случаи его аннулирования и установленную за него пошлину, не свыше пяти тысяч фунтов.\n\nЭти бюро освобождаются от требования об организационно-правовой форме компаний, а также от предоставления обеспечения или банковской гарантии.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "47", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "لصاحب العمل الإعلان عن الوظـائف الـشاغرة بمختلـف وسـائل الإعـلام ،\nأو أن يعهد إلى وكالات التشغيل الخاصة لشغل تلك الوظائف .\nوعلى صاحب العمل أو وكالة التـشغيل إخطـار الجهـة الإداريـة المختـصة\nورقيا أو إلكترونيا بالإعلان  ،وتقديم بيان بالوظائف التى تم شغلها وفق ًا له .", "text_ru": "Работодатель вправе объявлять о вакантных должностях через различные средства массовой информации либо поручить это частным агентствам занятости для замещения этих должностей.\n\nРаботодатель или агентство занятости обязаны уведомить компетентный административный орган в бумажной или электронной форме об этом объявлении и представить сведения о должностях, замещённых в соответствии с ним.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "48", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "تلتزم الجهات المشار إليها فى المادة (٤٠)من هذا القانون عدا البند (۱)منهـا ،\nبأن تقدم إلى الوزارة المختصة خلال خمسة أيام عمل فعلية صورة طبق الأصل مـن\nالطلب الوارد إليها بشأن توفير فرص العمل بالخارج وشروطها  ،موثقة من الـسلطات\nالمختصة  ،كما تقدم نسخة من الاتفاقيات وعقود العمل المبرمة  ،متضمنة تحديد العمل\nوالأجر المحدد له وشروط وظروف أدائه والتزامات العامل .\nويكون للوزارة المختصة خلال خمسة عشر يو ما على الأكثر من تاريخ إخطارها\nبالاتفاقيات والطلبات والعقود المستوفاة الاعتراض عليها فى حالة عدم مناسبة الأجر ،\nأو مخالفتها للنظام العام والآداب العامة .\n\nفإذا انقضت المدة المشار إليها دون اعتراض من الـوزارة اعتبـرت الاتفاقيـات\nوالطلبات والعقود موافق ًا عليها .\nويصدر الوزير المختص قرارا بإجراءات وأسلوب ووسيلة إخطار تلك الجهـات\nبشأن اعتراض الوزارة المختصة .", "text_ru": "Органы, указанные в статье (40) настоящего Трудового кодекса, за исключением указанного в её пункте 1, обязаны представить компетентному министерству в течение пяти фактических рабочих дней точную копию полученного ими запроса о предоставлении возможностей трудоустройства за рубежом и его условий, заверенную компетентными органами, а также копию заключённых соглашений и трудовых договоров с указанием определённой работы, установленной для неё заработной платы, условий и обстоятельств её выполнения и обязанностей работника.\n\nКомпетентное министерство вправе в течение не более пятнадцати дней со дня его уведомления о заполненных соглашениях, запросах и договорах заявить против них возражение в случае несоответствия размера заработной платы либо в случае их противоречия публичному порядку и общественной нравственности.\n\nЕсли указанный срок истёк без возражения со стороны министерства, соглашения, запросы и договоры считаются одобренными.\n\nКомпетентный министр издаёт решение о порядке, способе и средстве уведомления этих органов о возражении компетентного министерства.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "49", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "تتولى الوزارة المختصة بالتعاون مع الوزارات والجهات المعنيـة متابعـة تنفيـذ\nالاتفاقيات الدولية والتعاقدات المتعلقة بالعمالة المصرية فى الخارج  ،وبحـث تـسوية\nالمنازعات الناشئة عن تنفيذ هذه الاتفاقيات والتعاقدات .", "text_ru": "Компетентное министерство во взаимодействии с соответствующими министерствами и органами осуществляет контроль за исполнением международных соглашений и договоров, касающихся египетской рабочей силы за рубежом, и рассматривает урегулирование споров, возникающих в связи с исполнением этих соглашений и договоров.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "50", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "للمنظمات الدولية أن تزاول عمليات إلحاق العمالـة المـصرية ممـن يتمتعـون\nبخبرات وكفاءات خاصة للعمل خارج البلاد  ،إذا كان التعاقد مع جهـات حكوميـة ،\nأو هيئات عامة عربية أو أجنبية بعد أخذ موافقة الجهات المعنية .\nوعليها أن تقدم إلى الوزارة المختصة بيان ًا بفرص العمل التى تم توفيرهـا بهـذه\nالجهات وعقود العمل المبرمة .", "text_ru": "Международные организации вправе осуществлять деятельность по трудоустройству египетской рабочей силы, обладающей особым опытом и квалификацией, для работы за пределами страны, если договор заключается с правительственными органами либо арабскими или иностранными государственными учреждениями, после получения согласия соответствующих органов.\n\nОни обязаны представлять компетентному министерству сведения о предоставленных этими органами возможностях трудоустройства и заключённых трудовых договорах.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "51", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "تلتزم جميع الجهات التى تزاول عمليات التشغيل بالـداخل والخـارج أن تـوافى\nالوزارة المختصة ببيانات ونتائج أعمالها على الأقل كل ستة أشهر  ،ويـصدر بتحديـد\nقواعد وإجراءات ذلك قرار من الوزير المختص .", "text_ru": "Все органы, осуществляющие деятельность по трудоустройству внутри страны и за рубежом, обязаны представлять компетентному министерству сведения и результаты своей деятельности не реже одного раза в шесть месяцев; правила и порядок этого определяются решением компетентного министра.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "52", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثانى", "chapter_title": "التشغيل فى الداخل والخارج", "text": "لا يجوز ممارسة عمليات إلحاق المصريين بالداخل والخارج إلكترونيا من خـلال\nمواقع أو صفحات أو منصات إلكترونية إلا بعـد الحـصول علـى تـرخيص بـذلك\nمن الوزارة المختصة  ،ويستثنى من ذلك وكالات التشغيل المشار إليها فى البنـد (٣)\nمن المادة ). (٤٠\nويصدر الوزير المختص بالتشاور مع الوزير المعنى بشئون الاتـصالات قـرارا\nبقواعد منح هذا الترخيص  ،ومدته بما لا يجاوز سنة  ،والرسوم المقررة عليه بمـا لا\nيقل عن ألف جنيه ولا يزيد على عشرة آلاف جنيه  ،وضـوابط وقواعـد التـشغيل ،\nوالتقارير التى تقدمها عن نتائج أعمالها  ،وآليات التنسيق معها .", "text_ru": "Осуществление деятельности по трудоустройству египтян внутри страны и за рубежом в электронной форме через сайты, страницы или электронные платформы допускается только после получения на это разрешения от компетентного министерства; из этого правила исключаются агентства занятости, указанные в пункте 3 статьи (40).\n\nКомпетентный министр по согласованию с министром, в ведении которого находятся вопросы связи, издаёт решение о правилах выдачи этого разрешения, сроке его действия — не свыше одного года, — установленной за него пошлине — не менее тысячи и не более десяти тысяч фунтов, — правилах и требованиях к осуществлению деятельности, отчётах, представляемых о результатах их деятельности, и механизмах координации с ними.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава вторая", "chapter_title_ru": "Трудоустройство внутри страны и за рубежом"}, {"number": "53", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "مع عدم الإخلال بأحكام المواد التالية  ،تسرى علـى النـساء العـاملات جميـع\nالأحكام المنظمة لتشغيل العمال  ،دون تمييز .\nويستحق جميع العاملين من الذكور والإناث أجرا متساويا عن العمـل ذى القيمـة\nالمتساوية  ،ويشمل ذلك كل صور الأجر وعناصـره مـن مزايـا نقديـة أو عينيـة\nأو علاوات أو حوافز أو بدلات أو غيرها .\nويصدر الوزير المختص  ،بعد أخذ رأى كل من المجلس القومى للمرأة والمجلس\nالقومى للطفولة والأمومة  ،قرارا بتحديد الأحوال أو الأعمال التى لا يجـوز تـشغيل\nالنساء فيها  ،بهدف توفير التدابير اللازمة لحمايـة الأمومـة  ،أو مواجهـة مخـاطر\nالسلامة والصحة المهنية .", "text_ru": "Без ущерба для положений следующих статей, на работающих женщин распространяются все положения, регулирующие занятость работников, без дискриминации.\n\nВсе работники, как мужчины, так и женщины, имеют право на равную оплату за труд равной ценности; это распространяется на все формы заработной платы и её элементы: денежные и натуральные льготы, надбавки, поощрения, компенсации и прочее.\n\nКомпетентный министр, после получения заключения Национального совета по делам женщин и Национального совета по делам детства и материнства, издаёт решение об определении случаев или работ, на которых запрещается использование труда женщин, в целях обеспечения необходимых мер защиты материнства либо предотвращения рисков для безопасности и здоровья на производстве.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "54", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "للعاملة الحق فى إجازة وضع لمدة أربعة أشهر تشمل المدة التى تـسبق الوضـع\nوالتى تليه  ،على ألا تقل مدة هذه الإجازة بعد الوضع عن خمـسة وأربعـين يومـا ،\nبشرط أن تقدم شهادة طبية مبين ًا بها التاريخ الـذى يـرجح حـصول الوضـع فيـه ،\nوتكون هذه الإجازة مدفوعة الأجر  ،وفى جميع الأحـوال لا تـستحق العاملـة هـذه\nالإجازة لأكثر من ثلاث مرات طوال مدة خدمتها .\nويخصم من الأجر الذى يلتزم به صاحب العمل  ،ما يلتزم بأدائه مـن تعـويض\nعن الأجر وفق ًا لحكم المادة (٧٧)من قانون التأمينات الاجتماعية والمعاشات الـصادر\nبالقانون رقم  ١٤٨لسنة ٢٠١٩\nوتخفض ساعات العمل اليومية للمرأة الحامل ساعة على الأقل اعتبارا من الشهر\nالسادس من الحمل  ،ولا يجوز إلزامها بساعات عمل إضافية طوال مدة الحمل وحتـى\nنهاية ستة أشهر من تاريخ الوضع .", "text_ru": "Работница имеет право на отпуск по беременности и родам продолжительностью четыре месяца, включающий период до родов и после них, при этом продолжительность этой части отпуска после родов должна составлять не менее сорока пяти дней, при условии предоставления медицинской справки с указанием предполагаемой даты родов; этот отпуск является оплачиваемым; в любом случае работница не имеет права на этот отпуск более трёх раз за весь период своей работы.\n\nИз заработной платы, которую обязан выплачивать работодатель, вычитается сумма компенсации заработной платы, подлежащая выплате в соответствии со статьёй (77) Закона о социальном страховании и пенсиях № 148 от 2019 года.\n\nПродолжительность ежедневного рабочего времени беременной женщины сокращается не менее чем на один час начиная с шестого месяца беременности; привлечение её к сверхурочной работе в течение всего периода беременности и до истечения шести месяцев со дня родов не допускается.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "55", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "للعاملة بعد انتهاء إجازة الوضع المبينة بالمادة (٥٤)مـن هـذا القـانون الحـق\nفى العودة إلى وظيفتها أو وظيفة مماثلة لها دون الإخلال بأية مزايـا كانـت مقـررة\nلوظيفتها الأصلية .\nويحظر فصل العاملة أو إنهاء خدمتها أثناء إجازة الوضع .\nكما يحظر فصلها أو إنهاء خدمتها عقب عودتها من هذه الإجازة  ،ما لـم يثبـت\nصاحب العمل أن الفصل أو إنهاء الخدمة لسبب مشروع .\nومع ذلك  ،يكون لصاحب العمل حرمان العاملة من التعويض عن أجرهـا عـن\nمدة الإجازة المشار إليها أو استرداد ما تم أداؤه منه إذا ثبت اشتغالها خـلال الإجـازة\nلدى الغير ،وذلك مع عدم الإخلال بالمساءلة التأديبية .", "text_ru": "После окончания отпуска по беременности и родам, указанного в статье (54) настоящего Трудового кодекса, работница имеет право вернуться на свою должность либо на аналогичную должность без ущерба для каких-либо льгот, установленных для её первоначальной должности.\n\nУвольнение работницы или прекращение её службы во время отпуска по беременности и родам запрещается.\n\nЗапрещается также её увольнение или прекращение её службы сразу после возвращения из этого отпуска, если только работодатель не докажет, что увольнение или прекращение службы произведено по законному основанию.\n\nВместе с тем работодатель вправе лишить работницу компенсации заработной платы за период указанного отпуска либо потребовать возврата выплаченной суммы, если будет установлено, что она в течение отпуска работала у другого лица, без ущерба для привлечения её к дисциплинарной ответственности.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "56", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "يكون للعاملة التى ترضع طفلها خـلال الـسنتين التـاليتين لتـاريخ الوضـع ،\nفضلا ً عن فترة الراحة المقررة  ،الحق فى فترتين أخريين للرضاعة لا تقل كل منهمـا\nعن نصف ساعة  ،وللعاملة الحق فى ضم هاتين الفترتين .\nوتحسب هاتان الفترتان الإضافيتان من ساعات العمل ولا يترتب علـى ذلـك أى\nتخفيض فى الأجر .", "text_ru": "Работница, кормящая своего ребёнка грудью в течение двух лет, следующих за датой родов, имеет право, помимо установленного перерыва на отдых, на два дополнительных перерыва для кормления продолжительностью не менее получаса каждый; работница вправе объединить эти два перерыва.\n\nЭти два дополнительных перерыва засчитываются в рабочее время без какого-либо уменьшения заработной платы.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "57", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "مع مراعاة حكم الفقرة الثانية من المادة (٧٢)من قانون الطفل الصادر بالقـانون\nرقم  ١٢لسنة  ، ١٩٩٦يكون للعاملة فى المنشأة التى تستخدم خمـسين عـاملا ً فـأكثر\nالحق فى الحصول على إجازة دون أجر لمدة لا تجاوز سنتين  ،وذلك لرعاية طفلهـا ،\nولا تستحق هذه الإجازة لأكثر من ثلاث مرات طوال مدة خدمتها شريطة أن يكون قـد\nمر على وجودها فى المنشأة سنة على الأقل  ،وعلى ألا تقل المدة بين الإجازة الأولـى\nوالثانية عن سنتين .", "text_ru": "С учётом положений второго абзаца статьи (72) Закона о ребёнке № 12 от 1996 года, работница на предприятии, использующем труд пятидесяти и более работников, имеет право на отпуск без сохранения заработной платы продолжительностью не более двух лет для ухода за своим ребёнком; право на этот отпуск не возникает более трёх раз за весь период её работы, при условии, что со времени её работы на предприятии прошло не менее одного года, а промежуток между первым и вторым таким отпуском составляет не менее двух лет.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "58", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "للعاملة أن تنهى عقد العمل بسبب زواجها  ،أو حملهـا  ،أو إنجابهـا  ،علـى أن\nتخطر صاحب العمل كتابة برغبتها فى ذلك خلال ثلاثة أشهر من تاريخ إبـرام عقـد\nالزواج  ،أو ثبوت الحمل  ،أو من تاريخ الوضع بحـسب الأحـوال  ،مـع مراعـاة\nألا يؤثر ذلك على الحقوق المقررة لها وفق ًا لأحكام هـذا القـانون أو لأحكـام قـانون\nالتأمينات الاجتماعية والمعاشات المشار إليه .", "text_ru": "Работница вправе прекратить трудовой договор по причине своего вступления в брак, беременности или рождения ребёнка, письменно уведомив работодателя о своём намерении в течение трёх месяцев со дня заключения брака, установления факта беременности либо со дня родов, в зависимости от обстоятельств, при этом это не должно влиять на права, установленные для неё в соответствии с положениями настоящего Трудового кодекса либо упомянутого Закона о социальном страховании и пенсиях.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "59", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "يجب على صاحب العمل فى حالة تشغيله عاملة أو أكثر أن يعلـق فـى أمـاكن\nالعمل أو تجمع العمال نسخة من نظام تشغيل النساء .\nويجب أن يتضمن ذلك النظام إجراءات وضوابط وقواعد ومواعيد ساعات العمـل\nالمرن أو العمل عن بعد للمرأة التى ترعى أطفالا ً ذوى إعاقة أو أقزام .", "text_ru": "Работодатель, использующий труд одной или более работниц, обязан вывесить в местах работы или в местах сбора работников копию регламента труда женщин.\n\nЭтот регламент должен содержать порядок, требования, правила и график гибкого рабочего времени либо дистанционной работы для женщины, ухаживающей за детьми с инвалидностью или карликовостью.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "60", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الثالث", "chapter_title": "تشغيل النساء", "text": "مع عدم الإخلال بأحكام قانون الطفل المشار إليه علـى صـاحب العمـل الـذى\nيستخدم مائة عاملة فأكثر فى مكان واحد أن ينشئ دا را للحضانة  ،أو يعهـد إلـى دار\nللحضانة برعاية أطفال العاملات .\nوتلتزم المنشآت التى تقع فى منطقة واحدة وتستخدم كل منها أقل من مائة عاملـة  ،أن\nتشترك فى تنفيذ الالتزام المنصوص عليه فى الفقرة الأولى من هذه المادة .\nواستثناء من ذلك  ،لصاحب العمل أن يتحمل تكاليف رعاية الأطفال بدار الحضانة .\nوذلك كله بالضوابط والأوضاع التى يصدر بها قـرار مـن الـوزير المخـتص\nبعد التنسيق مع الوزير المعنى بـشئون التـضامن الاجتمـاعى والمجلـس القـومى\nللطفولة والأمومة .", "text_ru": "Без ущерба для положений упомянутого Закона о ребёнке, работодатель, использующий труд ста и более работниц в одном месте, обязан создать детские ясли либо поручить уход за детьми работниц одним из существующих детских яслей.\n\nПредприятия, расположенные в одном районе и использующие каждое менее ста работниц, обязаны совместно исполнять обязанность, предусмотренную первым абзацем настоящей статьи.\n\nВ порядке исключения работодатель вправе нести расходы по уходу за детьми в детских яслях.\n\nВсё это — в соответствии с требованиями и порядком, устанавливаемыми решением компетентного министра после согласования с министром, в ведении которого находятся вопросы социальной солидарности, и Национальным советом по делам детства и материнства.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава третья", "chapter_title_ru": "Труд женщин"}, {"number": "61", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "تسرى على هذا الفصل أحكام قانون الطفل المشار إليـه فيمـا لـم يـرد بـشأنه\nنص خاص .\nويعتبر طفلا ً فى تطبيق أحكام هذا القانون  ،كل من لم يبلغ ثمانى عشرة سنة .", "text_ru": "К настоящей главе применяются положения упомянутого Закона о ребёнке в части, не урегулированной специальной нормой.\n\nРебёнком в целях применения положений настоящего Трудового кодекса считается любое лицо, не достигшее восемнадцати лет.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "62", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "يحظر تشغيل الأطفال قبل بلوغهم خمس عشرة سنة  ،ومع ذلك يجـوز تـدريبهم\nمتى بلغت سنهم أربع عشرة سنة بما لا يعوقهم عن مواصلة التعليم .\nويلتزم كل صاحب عمل يدرب طفلا ً دون سن الخامسة عشرة بمنحه بطاقة تثبـت\nأنه يتدرب لديه  ،وتلصق عليها صورة الطفل  ،وت ُعتمد من الجهة الإدارية المختصة ،\nوتختم بخاتمها .", "text_ru": "Привлечение детей к труду до достижения ими пятнадцати лет запрещается; вместе с тем допускается их обучение по достижении ими четырнадцати лет, если это не препятствует продолжению их образования.\n\nКаждый работодатель, обучающий ребёнка младше пятнадцати лет, обязан выдать ему удостоверение, подтверждающее, что он проходит у него обучение, с приклеенной фотографией ребёнка, утверждённое компетентным административным органом и скреплённое его печатью.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "63", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "يكون تشغيل أو تـدريب الأطفـال  ،وتحديـد الظـروف والأحـوال والقواعـد\nوالإجراءات التى يتم فيها ذلك  ،وفق ًا للقرار الصادر من الوزير المختص بالتنسيق مـع\nالمجلس القومى للطفولة والأمومة .", "text_ru": "Привлечение детей к труду или их обучение, а также определение условий, обстоятельств, правил и порядка, в которых это осуществляется, производится в соответствии с решением, издаваемым компетентным министром по согласованию с Национальным советом по делам детства и материнства.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "64", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "يحظر تشغيل أو تدريب الأطفال فى الأعمال  ،والمهن  ،والصناعات التـى مـن\nشأنها أن تعرض صحتهم البدنية أو النفسية أو سلامتهم أو أخلاقهم للخطر  ،أو تعوقهم\nعن مواصلة التعليم كما يحظر تشغيلهم أو تدريبهم فى أى عمل غير مشروع  ،أو أيـة\nأعمال تعتبر من صور أسوأ أشـكال عمـل الأطفـال وفق ًـا للاتفاقيـات والمواثيـق\nوالمعاهدات الدولية التى صدقت عليها جمهورية مصر العربية .\nويصدر الوزير المختص بالتنسيق مع المجلس القومى للطفولة والأمومـة قـرارا\nبتحديد تلك الأعمال والمهن والصناعات طبق ًا لمراحل السن المختلفة .", "text_ru": "Запрещается привлечение детей к труду или их обучение в работах, профессиях и отраслях, которые могут подвергать опасности их физическое или психическое здоровье, их безопасность или нравственность либо препятствовать продолжению их образования; запрещается также их привлечение к труду или обучение в любой незаконной работе либо в любой работе, считающейся одной из наихудших форм детского труда в соответствии с международными конвенциями, хартиями и договорами, ратифицированными Арабской Республикой Египет.\n\nКомпетентный министр по согласованию с Национальным советом по делам детства и материнства издаёт решение, определяющее эти работы, профессии и отрасли в соответствии с различными возрастными группами.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "65", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "يحظر تشغيل الطفل أكثر من ست ساعات يوميا  ،ويجب أن تتخلل ساعات العمل\nفترة أو أكثر لتناول الطعام والراحة لا تقـل فـى مجموعهـا عـن سـاعة واحـدة ،\nوتحدد هذه الفترة أو الفترات بحيث لا يعمل الطفل أكثر من أربع سـاعات متـصلة ،\nويحظر تشغيل الطفل ساعات عمل إضافية أو تشغيله فـى أيـام الراحـة الأسـبوعية\nوالعطلات الرسمية .\nوفى جميع الأحوال  ،يحظر تشغيل الطفل فيمـا بـين الـساعة الـسابعة مـساء\nوالسابعة صباحا .", "text_ru": "Запрещается привлечение ребёнка к труду более шести часов в день; в течение рабочего времени должен предоставляться один или более перерывов для приёма пищи и отдыха общей продолжительностью не менее одного часа; этот перерыв или перерывы устанавливаются таким образом, чтобы ребёнок не работал более четырёх часов подряд; запрещается привлечение ребёнка к сверхурочной работе либо к работе в дни еженедельного отдыха и в официальные праздники.\n\nВ любом случае запрещается привлечение ребёнка к труду в период с семи часов вечера до семи часов утра.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "66", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "على صاحب العمل الذى يقوم بتشغيل طفل أو أكثر مراعاة الآتى :\n- ١تعليق نسخة تحتوى على الأحكام التى يتضمنها هذا الفصل فى مكان ظـاهر\nبمحل العمل .\n-٢تحرير كشف موضح به ساعات العمل وفترات الراحة معتمـد مـن الجهـة\nالإدارية المختصة .\n-٣إبلاغ الجهة الإدارية المختصة بأسماء الأطفال العـاملين لديـه  ،والأعمـال\nالمكلفين بها  ،وأسماء الأشخاص المنوط بهم مراقبة أعمالهم .\n-٤توفير سكن منفصل للأطفال عن غيرهم مـن البـالغين  ،وفق ًـا للـضوابط\nوالأحكام التى يصدر بها قرار من الوزير المختص  ،ويحظر فى جميع الأحوال مبيت\nالطفل في مكان العمل .", "text_ru": "Работодатель, привлекающий к труду одного или более детей, обязан соблюдать следующее:\n1. вывесить на видном месте по месту работы копию положений, содержащихся в настоящей главе;\n2. составить ведомость с указанием рабочего времени и периодов отдыха, утверждённую компетентным административным органом;\n3. уведомить компетентный административный орган об именах работающих у него детей, порученной им работе и именах лиц, ответственных за надзор за их работой;\n4. обеспечить отдельное от взрослых проживание детей в соответствии с требованиями и правилами, устанавливаемыми решением компетентного министра; в любом случае запрещается ночлег ребёнка на месте работы.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "67", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "مع عدم الإخلال بأحكام قانون الطفل المشار إليه  ،تقوم جهات التأهيـل بإخطـار\nالجهة الإدارية المختصة التى يقع فى دائرتها محل إقامة الطفل ذى الإعاقة بمـا يفيـد\nتأهيله  ،وتقيد لديها أسماء الأطفال الذين تـم تـأهيلهم فـى سـجل خـاص ورقـى\nأو إلكتروني  ،وتسلم إلى الطفل ذى الإعاقة أو من ينوب عنه شهادة القيد دون مقابل .\nوتلتزم الجهة الإدارية المختصة بمعاونة الأطفال ذوى الإعاقـة المقيـدين لـديها\nفى الالتحاق بالأعمال التى تناسب أعمارهم وكفايتهم ومحال إقامتهم  ،وعليها إخطـار\nمديرية التضامن الاجتماعى الواقعة فى دائرتها ببيان شهرى عن الأطفال ذوى الإعاقة\nالذين تم تشغيلهم .", "text_ru": "Без ущерба для положений упомянутого Закона о ребёнке, органы переподготовки уведомляют компетентный административный орган, в округе которого расположено место жительства ребёнка с инвалидностью, о факте его переподготовки и регистрируют имена переподготовленных детей в специальном бумажном или электронном реестре; ребёнку с инвалидностью либо лицу, действующему от его имени, бесплатно выдаётся свидетельство о регистрации.\n\nКомпетентный административный орган обязан оказывать содействие зарегистрированным у него детям с инвалидностью в трудоустройстве на работы, соответствующие их возрасту, способностям и месту жительства; он обязан уведомлять управление социальной солидарности, расположенное в его округе, ежемесячной сводкой о трудоустроенных детях с инвалидностью.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "68", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الرابع", "chapter_title": "أحكام تشغيل وتدريب الأطفال", "text": "يحظر على الأبوين أو متولى أمر الطفل  ،بحـسب الأحـوال  ،تـشغيل الطفـل\nبالمخالفة لأحكام هذا القانون  ،والقرارات التنفيذية الصادرة له .", "text_ru": "Родителям или опекуну ребёнка, в зависимости от обстоятельств, запрещается привлекать ребёнка к труду в нарушение положений настоящего Трудового кодекса и изданных во исполнение его решений.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Положения о труде и профессиональной подготовке детей"}, {"number": "69", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "يقصد بالعمل فى تطبيق أحكام هذا الفصل كل عمل تابع أو حر أو لحساب النفس\nأو العمل فى أى مهنة أو صنعة أو حرفة بما فى ذلك العمل فى الخدمة المنزلية .", "text_ru": "Под трудом в целях применения положений настоящей главы понимается любая наёмная или самостоятельная работа, работа за собственный счёт либо работа по какой-либо профессии, специальности или ремеслу, включая работу в качестве домашней прислуги.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "70", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "يخضع عمل الأجانب فى جميع منشآت القطاع الخاص  ،ووحدات القطاع العام ،\nوقطاع الأعمال العام  ،والهيئات العامة والإدارة المحلية  ،والجهـاز الإدارى للدولـة\nللأحكام الواردة فى هذا الفصل  ،وذلك مع مراعاة شرط المعاملة بالمثل .\nويحدد الوزير المختص النسبة القصوى لتشغيل الأجانـب فـى تلـك المنـشآت\nوالجهات  ،وحالات الاستثناء من تلـك النـسبة  ،والمهـن والحـرف التـى يحظـر\nعلى الأجانب الاشتغال بها .\nويجوز للوزير المختص إعفاء الأجانب من شرط المعاملة بالمثل .", "text_ru": "Труд иностранцев на всех предприятиях частного сектора, в подразделениях государственного сектора и государственного делового сектора, в государственных учреждениях, органах местного самоуправления и государственном административном аппарате регулируется положениями настоящей главы, с учётом условия взаимности.\n\nКомпетентный министр определяет максимальную долю иностранных работников на этих предприятиях и в этих органах, случаи исключения из этой доли, а также профессии и ремёсла, которыми иностранцам запрещается заниматься.\n\nКомпетентный министр вправе освобождать иностранцев от условия взаимности.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "71", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "لا يجوز للأجنبى العمل داخل البلاد إلا بعد الحـصول علـى تـرخيص بـذلك\nمن الوزارة المختصة وأن يكون مصرحا له بدخول البلاد والإقامة بها بقصد العمـل ،\nولا يجوز لأصحاب الأعمال تشغيل الأجانب إلا بعد الحصول على هذا الترخيص .\nويصدر الوزير المختص قرارا بشروط الحصول على الترخيص المشار إليـه ،\nوإجراءاته  ،والبيانات التى يتضمنها  ،وإجراءات تجديده  ،والرسم الذى يحصل عنـه\nورسوم الإعفاء من شروط الاستقدام  ،بما لا يقل عن خمسة آلاف جنيـه  ،ولا يزيـد\nعلى مائة وخمسين ألف جنيه  ،ويحدد حالات إلغاء الترخيص قبـل انتهـاء مدتـه ،\nوحالات إعفاء الأجانب من شرط الحصول عليه  ،وحالات الإعفاء من شرط الاستقدام\nوبما يتماشى مع احتياجات سوق العمل .\nويلتزم كل من يستخدم أجنبيا أعفى من شرط الحصول على الترخيص بأن يخطر\nالجهة الإدارية المختصة بذلك خلال سبعة أيام من مزاولة الأجنبـى للعمـل  ،وعنـد\nانتهاء خدمته لديه .", "text_ru": "Иностранец не вправе работать в стране без получения на это разрешения от компетентного министерства и наличия у него разрешения на въезд в страну и проживание в ней с целью работы; работодателям запрещается привлекать иностранцев к труду без получения этого разрешения.\n\nКомпетентный министр издаёт решение об условиях получения указанного разрешения, порядке его получения, содержащихся в нём сведениях, порядке его продления, причитающейся за него пошлине и пошлине за освобождение от требований найма — не менее пяти тысяч и не более ста пятидесяти тысяч фунтов; этим же решением определяются случаи аннулирования разрешения до истечения его срока, случаи освобождения иностранцев от требования о его получении и случаи освобождения от требований найма, с учётом потребностей рынка труда.\n\nКаждый, кто использует труд иностранца, освобождённого от требования о получении разрешения, обязан уведомить об этом компетентный административный орган в течение семи дней со дня начала работы иностранца и по окончании его службы у него.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "72", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "يلتزم صاحب العمل بإبلاغ الجهة الإدارية والسلطات المختصة عن غياب العامل\nالأجنبى عن العمل لمدة خمسة عشر يوما متصلة دون مسوغ قـانونى يجيـز ذلـك ،\nويصدر الوزير المختص قرارا بالضوابط والشروط والإجراءات المنظمة لذلك .", "text_ru": "Работодатель обязан уведомлять компетентный административный орган и компетентные власти об отсутствии иностранного работника на работе в течение пятнадцати дней подряд без законного основания, допускающего это; компетентный министр издаёт решение о требованиях, условиях и порядке, регулирующих это.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "73", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "مع عدم الإخلال بأحكام قانون الاستثمار الصادر بالقانون رقم  ٧٢لسنة ، ٢٠١٧\nيجوز للوزير المختص بالاتفاق مع الوزير المعنى بشئون الاستثمار  ،وضـع القواعـد\nوالضوابط اللازمة للترخيص بالعمل للأجانب المخاطبين بأحكـام قـانون الاسـتثمار\nالمشار إليه .", "text_ru": "Без ущерба для положений Закона об инвестициях № 72 от 2017 года, компетентный министр по согласованию с министром, в ведении которого находятся вопросы инвестиций, вправе устанавливать необходимые правила и требования для выдачи разрешений на работу иностранцам, на которых распространяются положения упомянутого Закона об инвестициях.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "74", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثانى", "part_title": "التشغيل", "chapter": "الفصل الخامس", "chapter_title": "تنظيم عمل الأجانب", "text": "يلتزم صاحب العمل الذى يعمل لديه الأجنبى بإعادته إلى الدولة التى تم اسـتقدامه\nمنها على نفقة صاحب العمل الخاصة حال انتهاء علاقة العمل  ،ما لـم يـنص عقـد\nالعمل على خلاف ذلك .\nويصدر الوزير المختص قرارا بالحالات والمواعيد والإجراءات المنظمة لذلك .", "text_ru": "Работодатель, у которого работает иностранец, обязан вернуть его в страну, из которой он был приглашён, за собственный счёт работодателя по окончании трудового отношения, если трудовой договор не предусматривает иное.\n\nКомпетентный министр издаёт решение о случаях, сроках и порядке, регулирующих это.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел второй", "part_title_ru": "Трудоустройство", "chapter_ru": "Глава пятая", "chapter_title_ru": "Регулирование труда иностранцев"}, {"number": "75", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "تهدف أحكام هذا الباب إلى تنظيم ودعم وتشغيل العمالة غير المنتظمة والعـاملين\nفى القطاع غير الرسمى على المستوى القومى  ،ومساعدتهم فى الحصول على فرص\nالعمل اللائقة لهم  ،وتنمية مهاراتهم بما يتناسب مع احتياجات سوق العمل فى الـداخل\nوالخارج  ،وحمايتهم أثناء العمل  ،وتقديم الدعم اللازم أثناء فترات التعطل .\nوتسرى على العمالة غير المنتظمة والعاملين فى القطاع غير الرسـمى  ،الـذين\nيعملون لدى أصحاب الأعمال  ،جميع الحقوق والواجبات الواردة فى هذا القانون .\nويصدر الوزير المختص قرارا بالقواعد والأحكام المنظمة لشروط وظروف عمل\nتلك الفئات  ،وطرق الحصول على حقوقهم والقيام بواجباتهم  ،بما يتوافق مع طبيعـة\nوفترات عملهم .", "text_ru": "Положения настоящего раздела направлены на регулирование и поддержку занятости неформально занятых работников и работников неформального сектора на общенациональном уровне, содействие им в получении достойных для них возможностей трудоустройства, развитие их навыков в соответствии с потребностями внутреннего и внешнего рынков труда, их защиту во время работы и оказание им необходимой поддержки в периоды безработицы.\n\nНа неформально занятых работников и работников неформального сектора, работающих у работодателей, распространяются все права и обязанности, предусмотренные настоящим Трудовым кодексом.\n\nКомпетентный министр издаёт решение о правилах и положениях, регулирующих условия и обстоятельства труда этих категорий, порядок получения ими своих прав и исполнения обязанностей, в соответствии с характером и периодами их работы.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "76", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "تتولى الوزارة المختصة رسم سياسة ومتابعة تشغيل العمالة غير المنتظمة وعلـى\nالأخص عمال الزراعة الموسميون  ،وعمال المقاولات وعمال البحر  ،وعمال المناجم\nوالمحاجر  ،بما يتفق مع السياسة العامة للدولة .\nوللوزير المختص تحديد فئات العمالة غير المنتظمـة بالتـشاور مـع الـوزراء\nالمعنيين والمنظمات النقابية العمالية المعنية  ،ومنظمات أصحاب الأعمال المعنيين .", "text_ru": "Компетентное министерство разрабатывает политику и осуществляет контроль за занятостью неформально занятых работников, в частности сезонных сельскохозяйственных работников, работников подрядных организаций, работников морского транспорта, работников горнодобывающей промышленности и карьеров, в соответствии с общей государственной политикой.\n\nКомпетентный министр вправе определять категории неформально занятых работников по согласованию с соответствующими министрами, соответствующими профсоюзными организациями работников и соответствующими организациями работодателей.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "77", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapt
