er": null, "chapter_title": null, "text": "تلتزم الجهة الإدارية المختصة بحصر وقيد العمالة غير المنتظمة  ،وفق ًا لتصنيفها\nوفئاتها  ،فى السجلات الورقية أو الإلكترونية المعدة لذلك .\nكما تلتزم بإعداد قواعد بيانات قومية لفئات العمالة غيـر المنتظمـة  ،وربطهـا\nبأجهزة ووزارات الدولة بالتنسيق مع الجهـات المعنيـة  ،وعلـى الأخـص الجهـاز\nالمركزى للتعبئة العامة والإحصاء  ،والهيئة القومية للتأمين الاجتماعي .\nويصدر الوزير المختص قرارا بالقواعد والإجراءات اللازمة لذلك .", "text_ru": "Компетентный административный орган обязан осуществлять учёт и регистрацию неформально занятых работников в соответствии с их классификацией и категориями в предназначенных для этого бумажных или электронных реестрах.\n\nОн также обязан разрабатывать национальные базы данных по категориям неформально занятых работников и обеспечивать их связь с государственными органами и министерствами во взаимодействии с соответствующими органами, в частности с Центральным агентством по всеобщей мобилизации и статистике и Национальным управлением социального страхования.\n\nКомпетентный министр издаёт решение о правилах и порядке, необходимых для этого.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "78", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "ينشأ صندوق لحماية وتشغيل العمالة غير المنتظمة يـسمى \"صـندوق إعانـات\nالطوارئ والخدمات الاجتماعية والصحية للعمالة غير المنتظمة\"  ،تكون له الشخـصية\nالاعتبارية العامة  ،ويتبع الوزير المختص  ،ويكون مقره الرئيسى محافظة القـاهرة ،\nوله أن ينشئ فروعا فى المحافظات .\nويصدر رئيس مجلس الوزراء قرارا بتشكيل مجلس إدارة الـصندوق  ،برئاسـة\nالوزير المختص  ،وعضوية ممثلى المنظمات النقابيـة العماليـة المعنيـة ومنظمـات\nأصحاب الأعمال المعنية بالتساوى فيما بينهما  ،وممثلى الوزارات والجهات المعنيـة ،\nويحدد القرار اختصاصات المجلس  ،والنظام الأساسى للصندوق  ،والمعاملـة الماليـة\nلرئيس وأعضاء مجلس الإدارة  ،على أن تكون من موارده الذاتية  ،والنظام المحاسبى\nالواجب اتباعه .", "text_ru": "Учреждается фонд по защите и трудоустройству неформально занятых работников под названием «Фонд чрезвычайной помощи и социально-медицинского обслуживания неформально занятых работников», имеющий статус юридического лица публичного права; он подведомствен компетентному министру, и его местонахождением является мухафаза Каир; он вправе создавать отделения в мухафазах.\n\nПредседатель Совета министров издаёт решение об образовании совета директоров Фонда под председательством компетентного министра и с участием на паритетных началах представителей соответствующих профсоюзных организаций работников и соответствующих организаций работодателей, а также представителей соответствующих министерств и органов; этим же решением определяются полномочия совета, устав Фонда, порядок финансового вознаграждения председателя и членов совета директоров — за счёт собственных средств Фонда, — и подлежащая применению система бухгалтерского учёта.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "79", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "يختص الصندوق بما يأتي :\n-١صرف إعانات الطوارئ للعمالة غيـر المنتظمـة فـى حـالات الأزمـات\nالاقتصادية العامة أو الكوارث أو الأوبئة أو حالات التوقف المؤقت عن العمل .\n-٢تقديم الخدمات الاجتماعية والصحية لفئات العمالة غير المنتظمة .\n-٣دعم النفقات العلاجية والخدمات الطبية .\n-٤المساهمة فى سداد اشتراكات التأمين الاجتمـاعى للعمالـة غيـر المنتظمـة\nبالاتفاق مع وزير المالية ووزير التـضامن الاجتمـاعى  ،والهيئـة القوميـة للتـأمين\nالاجتماعي  ،وفى حدود موارد الصندوق .\n-٥دعم وتطوير وتعزيز عمليات التشغيل اللازمة للعمالة غير المنتظمة .\n-٦تدريب العمالة غير المنتظمة المخاطبين بأحكام هذا القانون وتنمية مهـاراتهم\nالفنية والمهنية فى مجالات العمل المختلفة بالتنسيق مع الوزارة المختصة .\n-٧المساهمة فى توفير أدوات العمل اللازمة لبعض فئات العمالة غير المنتظمـة\nللقيام بأعمالهم .\n-٨المساهمة فى توفير سبل الانتقال والإعاشة والإقامة بمواقع العمل النائية .\n-٩المشاركة فى دعم الالتزام باشتراطات السلامة والـصحة المهنيـة اللازمـة\nوتأمين بيئة العمل .\n-١٠تقديم البرامج الثقافية والرياضية  ،وإقامة المسابقات اللازمة لتنمية مهارات\nالعمالة غير المنتظمة  ،فنيا وثقافيا  ،ورياضيا  ،وإعداد برامج الـرحلات الترفيهيـة ،\nوالمصايف طبق ًا للموارد المتاحة .\n-١١المساهمة فى تمويل عمليات حصر العمالة غير المنتظمة علـى المـستوى\nالقومى أو إعداد قواعد بياناتها .\n-١٢إطلاق الحملات التوعوية إعلاميا للتعريف بحقوق العمالة غيـر المنتظمـة\nوحقوقهم التأمينية والاجتماعية وغيرها .\n-١٣إنشاء المنصات الإلكترونية اللازمة لتقديم خدمات الصندوق الرقمية .\n\n- ١٤إقامة مشروعات تنموية تستهدف الارتقاء بأوضاع العمالة غير المنتظمة ،\nأو دمج العاملين فى القطاع غير الرسمى بالقطاع الرسمى على المـستوى القـومى ،\nسواء منفردا أو بالتعاون مع الجهات والمنظمات الدولية أو الإقليمية المتخصصة بعـد\nموافقة الجهات الوطنية المعنية .", "text_ru": "К компетенции Фонда относится:\n1. выплата чрезвычайных пособий неформально занятым работникам в случаях общих экономических кризисов, стихийных бедствий, эпидемий или временного прекращения работы;\n2. предоставление социальных и медицинских услуг категориям неформально занятых работников;\n3. поддержка расходов на лечение и медицинское обслуживание;\n4. участие в уплате взносов социального страхования за неформально занятых работников по согласованию с министром финансов, министром социальной солидарности и Национальным управлением социального страхования, в пределах средств Фонда;\n5. поддержка, развитие и укрепление мероприятий по трудоустройству, необходимых для неформально занятых работников;\n6. подготовка неформально занятых работников, на которых распространяются положения настоящего Трудового кодекса, и развитие их технических и профессиональных навыков в различных сферах деятельности во взаимодействии с компетентным министерством;\n7. участие в обеспечении орудиями труда, необходимыми некоторым категориям неформально занятых работников для выполнения их работы;\n8. участие в обеспечении транспорта, питания и проживания на отдалённых рабочих объектах;\n9. участие в поддержке соблюдения необходимых требований охраны труда и профессионального здоровья и обеспечения безопасности условий труда;\n10. организация культурных и спортивных программ, проведение конкурсов, необходимых для развития технических, культурных и спортивных навыков неформально занятых работников, подготовка программ развлекательных поездок и летнего отдыха в пределах имеющихся средств;\n11. участие в финансировании мероприятий по учёту неформально занятых работников на общенациональном уровне либо в создании их баз данных;\n12. проведение информационно-просветительских кампаний для разъяснения прав неформально занятых работников, их страховых, социальных и иных прав;\n13. создание электронных платформ, необходимых для предоставления цифровых услуг Фонда;\n14. реализация проектов развития, направленных на улучшение положения неформально занятых работников либо на интеграцию работников неформального сектора в формальный сектор на общенациональном уровне, самостоятельно либо во взаимодействии со специализированными международными или региональными органами и организациями, после получения согласия соответствующих национальных органов.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "80", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "يصدر الوزير المختص بالتشاور مع الوزراء المعنيين اللوائح الماليـة والإداريـة\nللصندوق  ،ونظام تحصيل موارده  ،ولائحة الخدمات التى يقدمها  ،وقيمـة الإعانـات\nالمالية الطارئة وضوابط استحقاقها  ،ومدتها  ،وحالات وقفها  ،والمـستندات اللازمـة\nلإثباتها  ،وطريقة وآليات صرفها .", "text_ru": "Компетентный министр по согласованию с соответствующими министрами издаёт финансовые и административные регламенты Фонда, порядок сбора его средств, регламент оказываемых им услуг, размер чрезвычайных финансовых пособий, условия и порядок приобретения права на них, их продолжительность, случаи их приостановления, необходимые для их подтверждения документы, а также способ и механизмы их выплаты.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "81", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "يجوز بقرار من رئيس الجمهورية فى حالات الطوارئ العامة صـرف إعانـات\nطوارئ عاجلة لفئات العمالة غير المنتظمة أو بعـضها  ،أو لأسـرهم  ،وذلـك فـى\nالحالات والأحوال التى يحددها القرار .", "text_ru": "Решением Президента Республики в случаях общих чрезвычайных ситуаций допускается выплата срочных чрезвычайных пособий всем или отдельным категориям неформально занятых работников либо их семьям в случаях и на условиях, определяемых этим решением.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "82", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "تتكون موارد الصندوق مما يأتي :\n-١نسبة لا تقل عن (١٪)ولا تزيد على (۳٪)من قيمة الأجور الفعلية للعمالـة\nغير المنتظمة فى قطاع المقاولات والتشييد والبناء  ،فإذا تعذر الوقـوف علـى قيمـة\nالأجور الفعلية تقدر قيمة الأجور حكما بنسبة لا تزيد على (٢٠٪)من قيمة العملية فى\nالمقاولات العامة  ،ولا تزيد على (٤٥٪)فى عمليات الخدمات والمصنعية .\n-۲نسبة لا تقل عن (١٪)ولا تزيد على (۳٪)من قيمة الأجور الفعلية للعمالـة\nغير المنتظمة فى قطاع المناجم والمحاجر وما فى حكمها  ،فإذا تعذر الوقوف على قيمة\nالأجور الفعلية تقدر قيمة الأجور حكما بنسبة لا تزيد على (١٥٪)من قيمة العملية .\n-٣اشتراك قيد لفئات العمالة غير المنتظمة الأخرى  ،لا يقـل عـن  ٢٠جنيهـا\nولا يزيد على  ۲۰۰جنيه شهريا .\n-٤نسبة (٠,٥٪)نصف فى المائة من قيمة مبيعات المنتجـات الزراعيـة التـى\nتشتريها الدولة .\n\n-٥مبلغ  ١٠٠جنيه عن كل طلب توثيق أو طلب صحة توقيـع أو صـحة نفـاذ\nعقود بيع الأراضى الزراعية .\n-٦مبلغ لا يجاوز  ٥٠جنيها عن كل رخصة قيادة مهنيـة تـصدر لأول مـرة\nأو عند تجديدها .\n-٧كافة أموال حسابات العمالة غير المنتظمة بمديريات العمل  ،وعوائد الأصول\nوالودائع الخاصة بها .\n-٨التبرعات والهبات العينية والنقدية التى يوافق عليها مجلس الإدارة  ،وبمـا لا\nيخالف القوانين واللوائح المعمول بها .\n-٩عائد الخدمات التى يقدمها الصندوق بمقابل رمزى ) إن وجدت ( .\n-١٠عائد استثمار أموال الصندوق .\nويصدر بتحديد فئات الرسوم والاشتراكات المـشار إليهـا فـى هـذه المـادة ،\nوبما لا يزيد على الحد الأقصى المقرر  ،ومواعيد الوفاء بها  ،قرار من رئيس مجلـس\nإدارة الصندوق .", "text_ru": "Средства Фонда формируются из:\n1. доли в размере не менее 1% и не более 3% от фактической суммы заработной платы неформально занятых работников в секторе подрядных работ, строительства и застройки; если определить фактическую сумму заработной платы невозможно, сумма заработной платы оценивается в силу закона в размере не свыше 20% от стоимости работ по общим подрядам и не свыше 45% по операциям оказания услуг и переработки;\n2. доли в размере не менее 1% и не более 3% от фактической суммы заработной платы неформально занятых работников в секторе горнодобывающей промышленности, карьеров и приравненных к ним отраслях; если определить фактическую сумму заработной платы невозможно, сумма заработной платы оценивается в силу закона в размере не свыше 15% от стоимости работ;\n3. регистрационного взноса для иных категорий неформально занятых работников в размере не менее 20 и не более 200 фунтов в месяц;\n4. доли в размере 0,5% (половина процента) от стоимости продаж сельскохозяйственной продукции, закупаемой государством;\n5. суммы в размере 100 фунтов за каждое заявление об удостоверении, заявление о подтверждении подлинности подписи либо действительности исполнения договоров купли-продажи сельскохозяйственных земель;\n6. суммы не свыше 50 фунтов за каждое профессиональное водительское удостоверение, выдаваемое впервые либо при его продлении;\n7. всех средств счетов неформально занятых работников в управлениях труда, а также доходов от их активов и вкладов;\n8. пожертвований и даров в натуральной и денежной форме, одобренных советом директоров, не противоречащих действующим законам и регламентам;\n9. дохода от услуг, оказываемых Фондом за символическую плату (при наличии таковых);\n10. дохода от инвестирования средств Фонда.\n\nРешением председателя совета директоров Фонда устанавливаются размеры пошлин и взносов, указанных в настоящей статье, в пределах установленного максимального размера, и сроки их уплаты.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "83", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "يكون للصندوق حساب خاص لدى أحد البنوك التجارية المـسجلة لـدى البنـك\nالمركزى المصرى وموازنة مستقلة  ،تعد علـى نمـط موازنـات الهيئـات العامـة\nالاقتصادية  ،ويعد الصندوق سنويا القوائم الدالة على المركـز المـالى وفق ًـا لنظـام\nالمحاسبة المالية  ،وتبدأ السنة المالية للصندوق مع الـسنة الماليـة للدولـة  ،وتنتهـى\nبانتهائها  ،وتخضع أمواله لرقابة الجهاز المركزى للمحاسبات  ،ويرحل فائض أموالـه\nمن سنة مالية إلى أخرى .", "text_ru": "Фонд имеет специальный счёт в одном из коммерческих банков, зарегистрированных в Центральном банке Египта, и самостоятельный бюджет, составляемый по образцу бюджетов государственных экономических органов; Фонд ежегодно составляет отчётность, отражающую его финансовое положение, в соответствии с системой финансового учёта; финансовый год Фонда начинается и заканчивается вместе с финансовым годом государства; его средства подлежат контролю со стороны Центрального агентства по учёту и контролю, а остаток его средств переносится из одного финансового года в другой.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "84", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "تعد أموال الصندوق أموالا ً عامة  ،وبصفة خاصة فيما يتعلق بتطبيق أحكام قانون\nالعقوبات  .وللصندوق الحق فى اتخاذ إجراءات التنفيذ المباشر والحجز الإدارى وفق ًـا\nلأحكام القانون رقم  ۳۰۸لسنة  ١٩٥٥فى شأن الحجز الإدارى .", "text_ru": "Средства Фонда считаются публичными средствами, в частности применительно к положениям Уголовного кодекса. Фонд вправе применять меры непосредственного исполнения и административного ареста имущества в соответствии с положениями Закона № 308 от 1955 года об административном аресте.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "85", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الثالث", "part_title": "تشغيل العمالة غير المنتظمة", "chapter": null, "chapter_title": null, "text": "يلتزم العاملون بالوزارة المختصة ومـديرياتها كـل فـى حـدود اختـصاصه ،\nبتنفيذ أحكام هذا الباب وما يصدر عن مجلس إدارة الصندوق مـن لـوائح وقـرارات\nبالتنسيق مع إدارة الصندوق  ،ويصدر قرار من الوزير المختص بقواعـد وإجـراءات\nوآليات التنسيق .", "text_ru": "Работники компетентного министерства и его управлений, каждый в пределах своей компетенции, обязаны исполнять положения настоящего раздела и регламенты и решения, издаваемые советом директоров Фонда, во взаимодействии с администрацией Фонда; компетентный министр издаёт решение о правилах, порядке и механизмах координации.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел третий", "part_title_ru": "Занятость неформальных работников", "chapter_ru": null, "chapter_title_ru": null}, {"number": "86", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "تسرى أحكام هذا الفصل على العقد الذى يتعهد بمقتضاه عامل بأن يعمـل لـدى\nصاحب عمل تحت إدارته أو إشرافه لقاء أجر .", "text_ru": "Положения настоящей главы применяются к договору, по которому работник обязуется работать у работодателя под его руководством или контролем за вознаграждение.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "87", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "يبرم عقد العمل الفردى لمدة غير محددة  ،أو لمدة محددة إذا كانت طبيعة العمـل\nتقتضى ذلك كما يجوز باتفاق الطرفين تجديد العقد لمدد أخرى مماثلة .", "text_ru": "Индивидуальный трудовой договор заключается на неопределённый срок либо на определённый срок, если этого требует характер работы; по соглашению сторон договор может быть продлён на такие же новые сроки.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "88", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "يعتبر عقد العمل غير محدد المدة منذ إبرامه فى الحالات الآتية :\n-١إذا كان غير مكتوب .\n-٢إذا لم ينص العقد على مدته .\n-٣إذا كان مبرما لمدة محددة واستمر الطرفان فى تنفيذه بعد انتهاء هـذه المـدة\nدون اتفاق مكتوب بينهما .", "text_ru": "Трудовой договор считается заключённым на неопределённый срок с момента его заключения в следующих случаях:\n1. если он не заключён в письменной форме;\n2. если в договоре не указан его срок;\n3. если он заключён на определённый срок, а стороны продолжили его исполнение после истечения этого срока без письменного соглашения между ними.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "89", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "يلتزم صاحب العمل بتحرير عقد العمل كتابة باللغة العربية مـن أربـع نـسخ ،\nيحتفظ صاحب العمل بنسخة  ،وتسلم نسخة للعامل  ،وتودع الثالثـة بمكتـب التـأمين\nالاجتماعى المختص  ،والنسخة الرابعة بالجهة الإدارية المختصة .\nوإذا كان العامل أجنبيا ولا يجيد اللغة العربيـة يجـوز أن يحـرر عقـد العمـل\nباللغة العربية ولغة العامل  ،وفى حالة الاختلاف فى التفسير يعمل بعقد العمل المحرر\nباللغة العربية .\nويجب أن يتضمن العقد على الأخص البيانات الآتية :\n-١تاريخ بداية العقد .\n-۲اسم صاحب العمل وعنوان محل العمل .\n-٣اسم العامل ومؤهله  ،ومهنته  ،أو حرفته ورقمه التأميني  ،ومحـل إقامتـه ،\nوما يلزم لإثبات شخصيته .\n-٤طبيعة ونوع العمل محل العقد .\n-٥الأجر المتفق عليه  ،وطريقة وموعد أدائه  ،وسائر المزايا النقديـة والعينيـة\nالمتفق عليها .\nوإذا لم يوجد عقد مكتوب فيكون لكل من العامل وصاحب العمل الحق فى إثبـات\nعلاقة العمل  ،ومدته  ،وجميع الحقـوق المترتبـة عليهـا بطـرق الإثبـات كافـة .\nويعطى صاحب العمل للعامل إيصالا ً بما يكون قد أودعه لديه من أوراق وشهادات .", "text_ru": "Работодатель обязан составить трудовой договор в письменной форме на арабском языке в четырёх экземплярах: один экземпляр хранится у работодателя, один экземпляр вручается работнику, третий сдаётся на хранение в компетентное управление социального страхования, а четвёртый — в компетентный административный орган.\n\nЕсли работник является иностранцем и не владеет арабским языком в достаточной мере, трудовой договор может быть составлен на арабском языке и на языке работника; в случае расхождений в толковании применяется текст, составленный на арабском языке.\n\nДоговор должен содержать, в частности, следующие сведения:\n1. дату начала действия договора;\n2. имя работодателя и адрес места работы;\n3. имя работника, его квалификацию, профессию или ремесло, его страховой номер, место жительства и сведения, необходимые для удостоверения его личности;\n4. характер и вид работы, являющейся предметом договора;\n5. согласованную заработную плату, порядок и срок её выплаты, а также все иные согласованные денежные и натуральные льготы.\n\nЕсли письменный договор отсутствует, как работник, так и работодатель вправе доказывать наличие трудового отношения, его срок и все вытекающие из него права всеми способами доказывания. Работодатель обязан выдать работнику расписку в получении сданных ему на хранение документов и свидетельств.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "90", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "تحدد فترة الاختبار فى عقد العمل لمدة لا تزيد على ثلاثة أشهر .\nولا يجوز تعيين العامل تحت الاختبار أكثر مـن مـرة واحـدة لـدى صـاحب\nعمل واحد .", "text_ru": "Испытательный срок устанавливается в трудовом договоре продолжительностью не более трёх месяцев.\n\nНазначение работника на испытательный срок у одного и того же работодателя более одного раза не допускается.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "91", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "لا يجوز لصاحب العمل أن يخرج على الشروط المتفق عليها فـى عقـد العمـل\nالفردى  ،أو اتفاقية العمل الجماعية  ،أو أن يكلف العامل بعمل غيـر المتفـق عليـه ،\nإلا إذا دعت الضرورة إلى ذلك  ،منعا لوقوع حادث  ،أو لإصلاح مـا نـشأ عنـه ،\nأو فى حالة القوة القاهرة  ،على أن يكون ذلك بصفة مؤقتة  ،ولـه أن يكلـف العامـل\nبعمل غير المتفق عليه  ،إذا كان لا يختلف عنه اختلاف ًا جوهريا .\nوفى جميع الأحوال  ،لا يجوز المساس بحقوق العامل .", "text_ru": "Работодатель не вправе отступать от условий, согласованных в индивидуальном трудовом договоре или коллективном трудовом договоре, либо поручать работнику работу, не согласованную сторонами, за исключением случаев, когда это вызвано необходимостью предотвращения несчастного случая, устранения его последствий либо обстоятельствами непреодолимой силы, при условии, что это носит временный характер; работодатель также вправе поручить работнику несогласованную работу, если она существенно не отличается от согласованной.\n\nВ любом случае ущемление прав работника не допускается.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "92", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "على صاحب العمل أن ينشئ ملف ًا ورقيا أو إلكترونيا لكل عامل يتضمن اسـمه ،\nومهنته  ،ودرجة مهارته عند التحاقه بالعمل  ،ومحل إقامته  ،وحالتـه الاجتماعيـة ،\nوتاريخ بداية خدمته  ،وأجره  ،وبيان ما يطرأ عليه من تطـورات والجـزاءات التـى\nوقعت عليه  ،وبيان ما حصل عليه من إجازات  ،وأن يدرج أو يـودع فـى الملـف\nصورة من عقد العمل  ،ومحاضر التحقيق إن وجدت  ،وتقارير رؤسائه عـن عملـه\nوفق ًا لما تقرره لائحة المنشأة  ،وأية أوراق أخرى تتعلق بخدمة العامل وما يفيد التأمين\nعليه لدى الهيئة القومية للتأمين الاجتماعي  ،والكشف الطبى الابتـدائى  ،ولا يجـوز\nالاطلاع على هذه البيانات إلا لمن رخص له قانون ًا بذلك  ،وأن يقدم هذا الملـف إلـى\nالجهة الإدارية المختصة أو المحكمة العمالية المختصة حسب الأحوال عند طلبه .\nوعليه أن يحتفظ بملف العامل ورقيا أو إلكترونيا لمدة خمس سنوات على الأقـل\nتبدأ من تاريخ انتهاء علاقة العمل  ،وفى جميع الأحوال يجب الاحتفاظ بـالملف عنـد\nوجود نزاع قضائى لحين الفصل فى الدعوى بحكم بات .", "text_ru": "Работодатель обязан вести на каждого работника личное дело в бумажной или электронной форме, содержащее его имя, профессию, уровень квалификации при поступлении на работу, место жительства, семейное положение, дату начала службы, его заработную плату, сведения о происходящих с ним изменениях и наложенных на него взысканиях, сведения о полученных им отпусках; в дело должны быть включены либо приобщены копия трудового договора, протоколы расследований (при наличии), отчёты руководителей о его работе в соответствии с внутренним регламентом предприятия, а также любые иные документы, относящиеся к службе работника и подтверждающие его страхование в Национальном управлении социального страхования, и заключение первичного медицинского осмотра; ознакомление с этими сведениями допускается только для лиц, уполномоченных на это законом; это дело должно предоставляться компетентному административному органу либо компетентному трудовому суду, в зависимости от обстоятельств, по их требованию.\n\nРаботодатель обязан хранить личное дело работника в бумажной или электронной форме не менее пяти лет начиная со дня прекращения трудового отношения; в любом случае при наличии судебного спора дело подлежит хранению до разрешения дела вступившим в законную силу решением.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "93", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "يلتزم صاحب العمل  ،بنقل العامل من الجهة التى تم التعاقد معه فيها إلى مكـان\nالعمل  ،كما يلتزم بإعادته إلى تلك الجهة خلال ثلاثة أيام من تاريخ انتهاء عقد العمـل\nلأحد الأسباب المبينة فى هذا القانون  ،ولو كان خلال فترة الاختبـار  ،إلا إذا رفـض\nالعامل كتابة العودة خلال المدة المشار إليها .\n\nفإذا لم يقم صاحب العمل بذلك وجب على الجهة الإدارية المختصة  ،بناء علـى\nطلب العامل  ،إعادته إلى الجهة التى تم التعاقد معه فيها على نفقتها  ،ولهـذه الجهـة\nاسترداد ما أنفقته بطريق الحجز الإدارى .", "text_ru": "Работодатель обязан перевезти работника из места, где с ним был заключён договор, к месту работы, а также обязан вернуть его в это место в течение трёх дней со дня прекращения трудового договора по одному из оснований, предусмотренных настоящим Трудовым кодексом, даже если это произошло в течение испытательного срока, — если только работник письменно не откажется от возвращения в течение указанного срока.\n\nЕсли работодатель не исполнит эту обязанность, компетентный административный орган по заявлению работника обязан вернуть его в место, где с ним был заключён договор, за счёт работодателя; этот орган вправе взыскать понесённые им расходы в порядке административного ареста имущества.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "94", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "إذا عهد صاحب العمل إلى صاحب عمل آخر بتأدية عمل من أعماله  ،أو جـزء\nمنها  ،وذلك فى منطقة عمل واحدة وجب على الأخير أن يسوى بين عماله  ،وعمـال\nصاحب العمل الأصلى فى جميع الحقوق  ،ويكون الأخير متضامن ًا معه فـى الوفـاء\nبجميع الالتزامات التى تفرضها أحكام هذا القانون .\nوفى جميع الأحوال  ،لا يجوز المساس بحقوق العامل .", "text_ru": "Если работодатель поручает другому работодателю выполнение своей работы или её части в пределах одного района работы, последний обязан уравнять своих работников с работниками первоначального работодателя во всех правах и несёт солидарную с ним ответственность за исполнение всех обязательств, установленных положениями настоящего Трудового кодекса.\n\nВ любом случае ущемление прав работника не допускается.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "95", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الأول", "chapter_title": "عقد العمل الفردى", "text": "يلتزم العامل الذى تم تدريبه على نفقة صاحب العمل بأن يقضى لديه المدة المتفق\nعليها  ،وفى حالة تركه العمل قبل انقضاء هذه المدة يلتزم بسداد نفقات التدريب  ،دون\nإخلال بحق صاحب العمل فى التعويض  ،ما لم ينص عقد العمل على خلاف ذلك .", "text_ru": "Работник, прошедший подготовку за счёт работодателя, обязан проработать у него согласованный срок; в случае оставления им работы до истечения этого срока он обязан возместить расходы на подготовку, без ущерба для права работодателя на возмещение убытков, если трудовой договор не предусматривает иное.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Индивидуальный трудовой договор"}, {"number": "96", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثانى", "chapter_title": "أنماط العمل الجديدة", "text": "يعتبر نمط ًا جديدا من أنماط العمل كل عمل يقوم به العامل بطريقة غير تقليديـة ،\nأيا كان شكل أداء العمل  ،أو طريقة تنفيذه  ،ويقدم لصالح صاحب العمل وتحت إدارته\nأو إشرافه  ،مقابل أجر أيا كانت صورته  ،ويعتبر نمط ًا من أنمـاط العمـل الجديـدة\nعلى الأخص ما يأتي :\n-١العمل عن بعد  ،وهو أداء العمل فى مكان يختلف عن المقر التقليدى للمنشأة ،\nويتم تنفيذه من خلال الوسائل التكنولوجية .\n-۲العمل بعض الوقت أو جزء منه  ،وهو العمل الذى يتم خلال ساعات عمـل\nأقل من ساعات العمل الكاملة للعمل المماثل .\n\n-٣العمل المرن  ،وهو أداء العمل بنفس عدد ساعات العمل المطلوبة من العامل ،\nفى أوقات غير متصلة يتم الاتفاق عليها بين طرفى علاقة العمل  ،أو بتغيير فى مواعيد\nساعات العمل أو عددها أو مكان العمل .\n-٤تقاسم العمل  ،وهو العمل الذى يقوم بإنجازه أكثر من شـخص ويتقاسـمون\nفيه الأدوار أو الأوقات  ،كما يتقاسمون الأجر  ،وفق ًا لما يتم الاتفاق عليه .\n-٥أى صور أخرى للعمل يصدر بتحديدها قرار من الوزير المختص .", "text_ru": "Новой формой занятости считается любая работа, выполняемая работником нетрадиционным способом, независимо от формы её выполнения или порядка её осуществления, если она предоставляется в пользу работодателя, под его руководством или контролем, за вознаграждение в любой форме; новыми формами занятости считаются, в частности, следующие:\n1. Дистанционная работа — выполнение работы в месте, отличном от традиционного места нахождения предприятия, посредством технологических средств.\n2. Работа неполное рабочее время или его часть — работа, выполняемая в течение меньшего количества часов, чем полное рабочее время для аналогичной работы.\n3. Гибкая занятость — выполнение работы в том же количестве рабочих часов, что требуется от работника, но в несмежные периоды времени, согласованные между сторонами трудового отношения, либо путём изменения времени, количества рабочих часов или места работы.\n4. Разделение работы — работа, выполняемая более чем одним лицом, которые разделяют между собой роли или время, а также заработную плату, в соответствии с достигнутым соглашением.\n5. Любые иные формы работы, определяемые решением компетентного министра.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Новые формы занятости"}, {"number": "97", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثانى", "chapter_title": "أنماط العمل الجديدة", "text": "تسرى على علاقات العمل فى أنماط العمل الجديدة مـا يـسرى علـى علاقـات\nالعمل التقليدية  ،وذلك مع مراعاة طبيعة كل عمل وطريقة أدائه .\nكما يسرى على العاملين فى تلك الأنماط جميع الحقوق والواجبات التـى تـسرى\nعلى العاملين فى الأنماط التقليدية للعمل  ،وعلى الأخص الحماية الاجتماعية والضمان\nالاجتماعي  ،والحد الأدنى للأجر وطريقة حسابه  ،وضمان الحصول عليه  ،وإتاحـة\nالتدريب المهنى وبرامج تنمية المهارات  ،والحق فى المفاوضة الجماعيـة  ،والحريـة\nالنقابية وفق ًا لأحكام قانون المنظمات النقابية العمالية وحمايـة حـق التنظـيم النقـابى\nالصادر بالقانون رقم  ۲۱۳لسنة ٢٠١٧", "text_ru": "К трудовым отношениям в новых формах занятости применяется то же, что применяется к традиционным трудовым отношениям, с учётом характера каждой работы и порядка её выполнения.\n\nНа работников, занятых в этих формах, распространяются все права и обязанности, применимые к работникам, занятым в традиционных формах труда, в частности социальная защита и социальное страхование, минимальный размер заработной платы и порядок его расчёта, гарантия его получения, доступность профессиональной подготовки и программ развития навыков, право на коллективные переговоры и профсоюзная свобода в соответствии с положениями Закона о профсоюзных организациях работников и защите права на профсоюзную организацию № 213 от 2017 года.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Новые формы занятости"}, {"number": "98", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثانى", "chapter_title": "أنماط العمل الجديدة", "text": "يجوز باتفاق الطرفين فى أنماط العمل الجديدة أن يقوم العامل بالعمل لـدى أكثـر\nمن صاحب عمل مع التزام العامل بعدم إفشاء أسرار العمـل  ،أو أن يعمـل لحـساب\nنفسه إلى جانب عمله لدى الغير .", "text_ru": "По соглашению сторон в новых формах занятости работник вправе работать более чем у одного работодателя при условии соблюдения работником обязанности неразглашения производственной тайны, либо работать на себя наряду со своей работой у другого лица.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Новые формы занятости"}, {"number": "99", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثانى", "chapter_title": "أنماط العمل الجديدة", "text": "يجب أن تكون علاقة العمل فى أنماط العمل الجديدة واضحة ومحددة فـى عقـد\nعمل مكتوب ورقيا أو إلكترونيـا  ،ويجـوز للعامـل إثبـات علاقـة العمـل بكافـة\nطرق الإثبات .", "text_ru": "Трудовое отношение в новых формах занятости должно быть ясно и определённо изложено в письменном трудовом договоре в бумажной или электронной форме; работник вправе доказывать наличие трудового отношения всеми способами доказывания.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Новые формы занятости"}, {"number": "100", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثانى", "chapter_title": "أنماط العمل الجديدة", "text": "يصدر الوزير المختص بالتشاور مع المنظمـات النقابيـة العماليـة ومنظمـات\nأصحاب الأعمال القرارات اللازمة لتنظيم أنماط العمل الجديـدة  ،وتحديـد صـورها\nوالنماذج الاسترشادية لعقود ولوائح العمل  ،وطرق إثبات علاقـة العمـل  ،وآليـات\nحصول الطرفين على حقوقهم  ،وذلك فى موعد لا يتجاوز ستة أشـهر مـن تـاريخ\nإصدار هذا القانون .", "text_ru": "Компетентный министр в консультации с профсоюзными организациями работников и организациями работодателей издаёт решения, необходимые для регулирования новых форм занятости, определения их видов, разработки рекомендательных образцов трудовых договоров и регламентов труда, способов доказывания трудового отношения и механизмов получения сторонами своих прав, — в срок, не превышающий шести месяцев со дня издания настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Новые формы занятости"}, {"number": "101", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يشكل المجلس القومى للأجور برئاسة الوزير المعنى بشئون التخطـيط والتنميـة\nالاقتصادية والتعاون الدولى  ،وعضوية كل من :\nالوزير المختص  ،أو من ينيبه .\nالوزير المعنى بشئون التضامن الاجتماعي  ،أو من ينيبه .\nالوزير المعنى بشئون المالية  ،أو من ينيبه .\nالوزير المعنى بشئون الصناعة  ،أو من ينيبه .\nالوزير المعنى بشئون قطاع الأعمال العام  ،أو من ينيبه .\nالوزير المعنى بشئون التموين والتجارة الداخلية  ،أو من ينيبه .\nرئيس المجلس القومى للمرأة  ،أو من ينيبه .\nرئيس الجهاز المركزى للتعبئة العامة والإحصاء .\nالرئيس التنفيذى للهيئة العامة للاستثمار والمناطق الحرة .\nرئيس مجلس إدارة الهيئة القومية للتأمين الاجتماعي .\nرئيس الجهاز المركزى للتنظيم والإدارة  ،أو من ينيبه .\nرئيس المجلس القومى للأشخاص ذوى الإعاقة  ،أو من ينيبه .\nستة أعضاء يمثلون منظمات أصحاب الأعمال  ،يتم اختيـارهم مـن المنظمـات\nالأكثر تمثيلا ً  ،من حيث العضوية .\n\nستة أعضاء يمثلون المنظمات النقابية العمالية المعنية الأكثـر تمثـيلا ً للعمـال ،\nترشحهم منظماتهم  ،على أن يراعى تمثيل جميع مستويات المنظمات النقابية المعنيـة\nما لم يكن ذلك متعذرا .\nويجوز للمجلس الاستعانة بعدد كاف من الخبـراء والمختـصين أو الشخـصيات\nالعامة  ،وفق ًا للموضوعات المطروحة على جدول الأعمال  ،دون أن يكون لهم صوت\nمعدود فى المداولات .", "text_ru": "Национальный совет по заработной плате образуется под председательством министра, в ведении которого находятся вопросы планирования, экономического развития и международного сотрудничества, в составе:\n— компетентного министра или его представителя;\n— министра, в ведении которого находятся вопросы социальной солидарности, или его представителя;\n— министра, в ведении которого находятся вопросы финансов, или его представителя;\n— министра, в ведении которого находятся вопросы промышленности, или его представителя;\n— министра, в ведении которого находятся вопросы государственного делового сектора, или его представителя;\n— министра, в ведении которого находятся вопросы снабжения и внутренней торговли, или его представителя;\n— председателя Национального совета по делам женщин или его представителя;\n— председателя Центрального агентства по всеобщей мобилизации и статистике;\n— исполнительного директора Главного управления по инвестициям и свободным зонам;\n— председателя совета директоров Национального управления социального страхования;\n— председателя Центрального агентства по организации и управлению или его представителя;\n— председателя Национального совета по делам инвалидов или его представителя;\n— шести членов, представляющих организации работодателей, избираемых из числа наиболее представительных по численности членства организаций;\n— шести членов, представляющих соответствующие профсоюзные организации работников, наиболее представительные для работников, выдвигаемых их организациями, при этом учитывается представленность всех уровней соответствующих профсоюзных организаций, если это возможно.\n\nСовет вправе привлекать достаточное число экспертов, специалистов или общественных деятелей в соответствии с вопросами, вынесенными на повестку дня, без права решающего голоса при обсуждениях.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "102", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يختص المجلس المشار إليه فى المادة (١٠١)مـن هـذا القـانون علـى وجـه\nالخصوص بالآتي :\n-١وضع الحد الأدنى لأجور العاملين فى كل القطاعات على المستوى القومى ،\nبمراعاة احتياجات العمال وعائلاتهم وتكاليف المعيشة وتغيراتها  ،وتحقيق التوازن بين\nطرفى علاقة العمل  ،وضمان زيادة معدلات الإنتاج .\n-۲وضع الحد الأدنى للعلاوة الدورية السنوية  ،بما لا يقل عن النسبة المقـررة\nفى المادة (١٢)من هذا القانون  ،والقواعد المنظمة لصرفها وفق ًا لأحكام هذا القانون .\n-٣النظر فى طلبات أصحاب الأعمال للتخفيض أو الإعفاء من صرف العـلاوة\nالدورية لظروف اقتصادية طارئة .\n-٤وضع المعايير والضوابط التى على أساسها يـتم قبـول أو رفـض طلبـات\nالتخفيض أو الإعفاء من صرف العلاوة الدورية السنوية .\n-٥إخطار الوزارات المعنية بقبول أو رفض الطلبات المقدمة مـن ذوى الـشأن\nبالتخفيض أو الإعفاء من صرف العلاوة الدورية السنوية .\nويصدر رئيس مجلس الوزراء قرارا بتحديد نظام العمل بالمجلس  ،واختصاصاته\nالأخرى  ،فى موعد أقصاه ستة أشهر من تاريخ العمل بهذا القانون .", "text_ru": "К компетенции совета, указанного в статье (101) настоящего Трудового кодекса, в частности, относится:\n1. установление минимального размера заработной платы работников во всех секторах на общенациональном уровне с учётом потребностей работников и их семей, стоимости жизни и её изменений, обеспечения баланса между сторонами трудового отношения и обеспечения роста показателей производства;\n2. установление минимального размера ежегодной периодической надбавки в размере не менее доли, установленной статьёй (12) настоящего Трудового кодекса, и правил, регулирующих её выплату в соответствии с положениями настоящего Трудового кодекса;\n3. рассмотрение заявлений работодателей о снижении размера периодической надбавки или освобождении от её выплаты в связи с чрезвычайными экономическими обстоятельствами;\n4. установление критериев и требований, на основании которых принимаются или отклоняются заявления о снижении размера ежегодной периодической надбавки или освобождении от её выплаты;\n5. уведомление соответствующих министерств об удовлетворении или отклонении заявлений заинтересованных лиц о снижении размера периодической надбавки или освобождении от её выплаты.\n\nПредседатель Совета министров издаёт решение об определении регламента работы совета и иных его полномочий в срок, не превышающий шести месяцев со дня вступления настоящего Трудового кодекса в силу.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "103", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يجتمع المجلس القومى للأجور بدعوة من رئيسه كل ستة أشـهر علـى الأقـل ،\nأو كلما دعت الحاجة إلى ذلك  ،وتكون اجتماعاته صحيحة بحضور أغلبية الأعضاء ،\nوتصدر قراراته بأغلبية أراء الحاضرين من أعضائه  ،وعند التساوى يرجح الجانـب\nالذي منه الرئيس .", "text_ru": "Национальный совет по заработной плате собирается по созыву его председателя не реже одного раза в шесть месяцев либо всякий раз, когда это необходимо; его заседания правомочны при присутствии большинства членов; его решения принимаются большинством голосов присутствующих членов, а при равенстве голосов решающим является голос стороны, к которой присоединился председатель.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "104", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "تلتزم المنشآت الخاضعة لأحكام هذا القانون بتنفيـذ قـرارات المجلـس القـومى\nللأجور  ،كل فيما يخصها .", "text_ru": "Предприятия, на которые распространяются положения настоящего Трудового кодекса, обязаны исполнять решения Национального совета по заработной плате, каждое в части, его касающейся.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "105", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يتعين على أجهزة التفتيش بالوزارة المختصة القيام بإجراء التفتيش الدورى علـى\nالمنشآت الخاضعة لأحكام هذا القانون للتحقق من تنفيـذ قـرارات المجلـس القـومى\nللأجور  ،وعلى أصحاب الأعمـال أو مـن يمثلـونهم  ،إمـساك سـجلات ورقيـة\nأو إلكترونية تتضمن بيانات العاملين والأجر المستحق لكل عامل .", "text_ru": "Органы инспекции компетентного министерства обязаны проводить периодические проверки предприятий, на которые распространяются положения настоящего Трудового кодекса, для установления факта исполнения решений Национального совета по заработной плате; работодатели или их представители обязаны вести бумажные или электронные реестры, содержащие сведения о работниках и причитающейся каждому работнику заработной плате.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "106", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "مع عدم الإخلال بالاختصاص المقرر لمحاكم مجلس الدولة  ،لكـل ذى مـصلحة\nالطعن على القرارات الصادرة عن المجلس القومى للأجـور فـى طلبـات أصـحاب\nالأعمال بالتخفيض أو الإعفاء من صرف العلاوة الدوريـة الـسنوية أمـام المحكمـة\nالعمالية  ،وذلك خلال ثلاثين يوما من التاريخ المقرر لـصرف العـلاوة أو الإخطـار\nبالقرار المطعون فيه  ،بحسب الأحوال .", "text_ru": "Без ущерба для компетенции, установленной для судов Государственного совета, любое заинтересованное лицо вправе обжаловать решения, вынесенные Национальным советом по заработной плате по заявлениям работодателей о снижении размера ежегодной периодической надбавки или освобождении от её выплаты, в трудовой суд в течение тридцати дней со дня, установленного для выплаты надбавки, либо со дня уведомления об обжалуемом решении, в зависимости от обстоятельств.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "107", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يحدد الأجر وفق ًا لعقد العمل الفردى  ،أو اتفاقية العمـل الجماعيـة  ،أو لائحـة\nالمنشأة المعتمدة  ،فإذا لم يحدد بأى من هذه الطـرق اسـتحق العامـل أجـر المثـل\nإن وجد  ،وإلا قدر الأجر طبق ًا لعرف المهنة فى الجهة التى يؤدى فيها العمل  ،فإن لم\nيوجد عرف تولى قاضى الأمور الوقتية بالمحكمة العمالية المختصة تقدير الأجر وفق ًـا\nلمقتضيات العدالة  ،مع مراعاة أحكام هذا القانون .", "text_ru": "Заработная плата определяется в соответствии с индивидуальным трудовым договором, коллективным трудовым договором либо утверждённым внутренним регламентом предприятия; если она не определена ни одним из этих способов, работник имеет право на заработную плату по аналогии, если таковая существует, а иначе заработная плата определяется в соответствии с обычаем данной профессии в месте, где выполняется работа; если такого обычая не существует, определение размера заработной платы производится судьёй по неотложным делам компетентного трудового суда исходя из требований справедливости, с учётом положений настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "108", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "تؤدى الأجور وغيرها من المبالغ المستحقة للعامل فى أحد أيام العمل وفى مكانـه\nبالعملة المتداولة قانون ًا  ،أو فى حساب العامل البنكى  ،مع مراعاة الأحكام التالية :\n-١العمال المعينون بأجر شهرى تؤدى أجورهم مرة على الأقل فى الشهر .\n-٢إذا كان الأجر بالإنتاج أو بالعمولة واستلزم العمل مدة تزيد على أسـبوعين ،\nوجب أن يحصل العامل كل أسبوع على دفعة تحت الحساب تتناسب مـع مـا أتمـه\nمن العمل  ،وأن يؤدى له باقى أجره خلال الأسبوع التالى لتسليم ما كلف به .\n\n-٣فى غير ما ذكر فى البندين (٢) ، ۱من هذه المادة تؤدى للعمـال أجـورهم\nمرة كل أسبوع على الأكثر ما لم يتفق على غير ذلك .\n-٤إذا انتهت علاقة العمل لأى سبب يـؤدى صـاحب العمـل للعامـل أجـره\nوجميع المبالغ المستحقة له فى مدة لا تجاوز سبعة أيام مـن تـاريخ مطالبـة العامـل\nبهذه المستحقات .\nوفى جميع الأحوال  ،يجب ألا يقل ما يحصل عليه العامـل عـن الحـد الأدنـى\nللأجور  ،ويحظر احتجاز أجر العامل أو جزء منه دون سند قانوني .", "text_ru": "Заработная плата и иные причитающиеся работнику суммы выплачиваются в один из рабочих дней и по месту работы в законно обращающейся валюте либо на банковский счёт работника, с соблюдением следующих правил:\n1. работникам, принятым на работу с месячной оплатой, заработная плата выплачивается не реже одного раза в месяц;\n2. если заработная плата определяется по объёму произведённой продукции или в виде комиссионного вознаграждения и выполнение работы требует срока, превышающего две недели, работник должен получать каждую неделю авансовый платёж в счёт причитающейся суммы, соразмерный выполненному им объёму работы, а остаток заработной платы должен быть выплачен ему в течение недели, следующей за сдачей порученной ему работы;\n3. в случаях, не указанных в пунктах 1 и 2 настоящей статьи, заработная плата выплачивается работникам не реже одного раза в неделю, если не согласовано иное;\n4. если трудовое отношение прекращается по какой-либо причине, работодатель обязан выплатить работнику его заработную плату и все причитающиеся ему суммы в срок, не превышающий семи дней со дня предъявления работником требования об этих выплатах.\n\nВ любом случае то, что получает работник, не должно быть меньше минимального размера заработной платы; удержание заработной платы работника или её части без законного основания запрещается.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "109", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يكون حساب متوسط الأجر اليومى لعمال الإنتاج  ،أو العمال الـذين يتقاضـون\nأجورا أساسية مضاف ًا إليها عمولة أو نسبة مئوية على أساس متوسط ما تقاضاه العامل\nعن أيام العمل الفعلية فى السنة الميلادية السابقة  ،أو عن المدة التى اشـتغلها إن قلـت\nعن ذلك مقسوما على عدد أيام العمل الفعلية عن ذات الفترة .", "text_ru": "Расчёт среднего дневного заработка работников сдельного труда либо работников, получающих основную заработную плату с добавлением комиссионного вознаграждения или процента, производится исходя из среднего заработка, полученного работником за фактически отработанные рабочие дни предыдущего календарного года, либо за период, в течение которого он работал, если этот период был меньше, делённого на число фактически отработанных рабочих дней за тот же период.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "110", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "يحظر على صاحب العمل أن ينقل العامل من فئة عمال الأجر الشهرى إلى فئـة\nعمال اليومية  ،أو بالأجر الأسبوعى  ،أو بالساعة  ،أو بالإنتاج  ،إلا بعـد موافقتـه ،\nويكون للعامل فى هذه الحالة جميع الحقوق التى اكتـسبها فـى المـدة التـى قـضاها\nبالأجر الشهري .", "text_ru": "Работодателю запрещается переводить работника из категории работников с месячной оплатой труда в категорию поденных работников, работников с недельной оплатой, почасовой оплатой или сдельной оплатой без его согласия; в этом случае за работником сохраняются все права, приобретённые им за период, в течение которого он получал месячную заработную плату.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "111", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "إذا حضر العامل إلى مقر عمله فى الوقـت المحـدد للعمـل  ،وكـان مـستعدا\nلمباشرة عمله  ،وحالت دون ذلك أسباب ترجع إلى صاحب العمل  ،اعتبر كأنـه أدى\nعمله فعلا ً واستحق أجره كاملا ً  ،أما إذا حضر وحالت بينه وبين مباشرة عمله أسـباب\nقهرية خارجة عن إرادة صاحب العمل استحق نصف أجره .", "text_ru": "Если работник явился на место своей работы в установленное для работы время и был готов приступить к своей работе, но этому воспрепятствовали обстоятельства, относящиеся к работодателю, он считается фактически выполнившим свою работу и имеет право на заработную плату в полном размере; если же он явился, но приступлению к работе воспрепятствовали обстоятельства непреодолимой силы, не зависящие от воли работодателя, он имеет право на половину заработной платы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "112", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "لا يجوز لصاحب العمل إلزام العامـل بـشراء أغذيـة  ،أو سـلع أو خـدمات\nمن محال معينة  ،أو مما ينتجه صاحب العمل من سلع  ،أو ما يقدمه من خدمات .", "text_ru": "Работодателю запрещается обязывать работника покупать продукты питания, товары или услуги в определённых магазинах либо товары, производимые работодателем, или услуги, оказываемые им.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "113", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "لا يجوز لصاحب العمل أن يقتطع من أجر العامل أكثر مـن عـشرة بالمائـة ،\nوفاء لما يكون قد أقرضه من مال أثناء سريان العقد  ،أو أن يتقاضى أية فائدة عن هذه\nالقروض  ،ويسرى هذا الحكم على الأجور المدفوعة مقدما .", "text_ru": "Работодатель не вправе удерживать из заработной платы работника более десяти процентов в счёт погашения денежных средств, предоставленных им в заём в течение действия договора, а также не вправе взимать какие-либо проценты по этим займам; это правило применяется и к заработной плате, выплаченной авансом.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "114", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "مع عدم الإخلال بأحكام قانون تنظيم بعض أوضاع وإجـراءات التقاضـى فـى\nمسائل الأحوال الشخصية الصادر بالقانون رقم  ١لسنة  ، ۲۰۰۰لا يجوز فـى جميـع\nالأحوال الاستقطاع أو الحجز  ،أو النزول عن الأجر المستحق للعامـل لأداء أى ديـن\nإلا فى حدود خمسة وعشرين بالمائة من هذا الأجر  ،ويجوز رفع نسبة الخـصم إلـى\nخمسين بالمائة فى حالة دين النفقة .\nوعند التزاحم يقدم دين النفقة ثم ما يكون مطلوبا لصاحب العمل بسبب مـا أتلفـه\nالعامل من أدوات أو مهمات أو استردادا لما صرف إليه بغير وجه حق أو مـا وقـع\nعلى العامل من جزاءات .\nويشترط لصحة النزول عن الأجر فى حدود النسبة المقررة بهذه المادة أن تصدر\nبه موافقة مكتوبة من العامل .\nوتحسب النسبة المشار إليها فى الفقرة الأولى من هذه المادة بعد استقطاع ضريبة\nالدخل على الأجر  ،وقيمة الاشتراكات والمبالغ المـستحقة وفق ًـا لقـانون التأمينـات\nالاجتماعية والمعاشات المشار إليه  ،وما يكون صاحب العمـل قـد أقرضـه للعامـل\nفى حدود النسبة المنصوص عليها فى المادة (١١٣)من هذا القانون .", "text_ru": "Без ущерба для положений Закона об упорядочении некоторых процедур судопроизводства по делам личного статуса № 1 от 2000 года, во всех случаях не допускается удержание, наложение ареста на причитающуюся работнику заработную плату либо отказ от неё в счёт погашения какого-либо долга иначе как в пределах двадцати пяти процентов этой заработной платы; доля удержания может быть повышена до пятидесяти процентов в случае долга по алиментам.\n\nПри конкуренции требований в первую очередь удовлетворяется долг по алиментам, а затем — суммы, причитающиеся работодателю вследствие порчи работником инструментов или оборудования, возврата неправомерно полученных им сумм либо наложенных на работника взысканий.\n\nУсловием действительности отказа от заработной платы в пределах доли, установленной настоящей статьёй, является наличие письменного согласия работника.\n\nДоля, указанная в первом абзаце настоящей статьи, рассчитывается после удержания подоходного налога с заработной платы, суммы взносов и причитающихся сумм в соответствии с упомянутым Законом о социальном страховании и пенсиях, а также сумм, предоставленных работодателем работнику в заём в пределах доли, предусмотренной статьёй (113) настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "115", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "لا تبرأ ذمة صاحب العمل من الأجر إلا إذا وقع العامل بما يفيد اسـتلام الأجـر\nفى السجل المعد لذلك  ،أو فى كشوف الأجور  ،أو إتمام تحويل أجره ومستحقاته إلـى\nحسابه بأحد البنوك  ،ويلتزم صاحب العمل بإعطاء العامل بيان ًا بمفردات أجره .", "text_ru": "Работодатель не считается освобождённым от обязательства по выплате заработной платы, если только работник не распишется в получении заработной платы в предназначенном для этого реестре либо в ведомостях заработной платы, либо не будет завершён перевод его заработной платы и причитающихся ему сумм на его счёт в одном из банков; работодатель обязан выдать работнику расчётный листок с указанием составных частей его заработной платы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "116", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الثالث", "chapter_title": "الأجور", "text": "مع مراعاة حكم المادة (١١٥)من هذا القانون  ،يسلم صاحب العمل إلـى عمالـه\nمن الأطفال أجورهم أو مكافآتهم أو غير ذلك مما يستحقونه قانون ًا  .ويكون هذا التسليم\nمبرئًا لذميه .", "text_ru": "С учётом положения статьи (115) настоящего Трудового кодекса работодатель выдаёт своим работающим детям их заработную плату, вознаграждения либо иные причитающиеся им по закону суммы; такая выдача считается освобождающей его от обязательства.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Заработная плата"}, {"number": "117", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "مع عدم الإخلال بأحكام القانون رقم  ١٣٣لسنة  ١٩٦١فى شأن تنظـيم تـشغيل\nالعمال فى المنشآت الصناعية  ،لا يجوز تشغيل العامل تشغيلا ً فعليا أكثر مـن ثمـانى\nساعات فى اليوم  ،أو ثمان وأربعين ساعة فى الأسبوع  ،ولا تـدخل فيهـا الفتـرات\nالمخصصة لتناول الطعام والراحة .\nويجوز بقرار من الوزير المختص تخفيض الحد الأقصى لساعات العمل لـبعض\nفئات العمال  ،أو فى بعض الصناعات أو الأعمال التى يحددها .", "text_ru": "Без ущерба для положений Закона № 133 от 1961 года о регулировании занятости работников на промышленных предприятиях, фактическое привлечение работника к труду не должно превышать восьми часов в день или сорока восьми часов в неделю; в это время не включаются периоды, отведённые для приёма пищи и отдыха.\n\nРешением компетентного министра может быть снижен максимальный предел рабочего времени для некоторых категорий работников либо для некоторых определяемых им отраслей или работ.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "118", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "يجب أن تتخلل ساعات العمل فترة أو أكثر لتناول الطعـام والراحـة  ،ولا تقـل\nفى مجموعها عن ساعة ويراعى فى تحديد هذه الفترة ألا يعمل العامل أكثر من خمـس\nساعات متصلة .\nوللوزير المختص أن يحدد بقرار منه الحالات  ،أو الأعمال التى يتحتم لأسـباب\nفنية أو لظروف التشغيل استمرار العمل فيها دون فترة راحة  ،والأعمال المرهقة التى\nيمنح العامل فيها فترات راحة  ،وتحسب من ساعات العمل الفعلية .", "text_ru": "В течение рабочего времени должен предоставляться один или более перерывов для приёма пищи и отдыха общей продолжительностью не менее одного часа; при определении этого перерыва учитывается, чтобы работник не работал более пяти часов подряд.\n\nКомпетентный министр вправе своим решением определить случаи или работы, в которых по техническим причинам или в силу условий производства работа должна продолжаться непрерывно без перерыва на отдых, а также тяжёлые работы, при выполнении которых работнику предоставляются периоды отдыха, засчитываемые в фактическое рабочее время.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "119", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "يجب تنظيم ساعات العمل وفترات الراحة  ،بحيث لا تجاوز الفتـرة بـين بدايـة\nساعات العمل ونهايتها أكثر من عشر ساعات فى اليوم الواحد  ،وتحسب فترة الراحـة\nمن ساعات التواجد  ،إذا كان العامل أثناءها فى مكان العمل .\nويستثنى من هذا الحكم العمال المشتغلون فى أعمال متقطعة بطبيعتها  ،والأعمال\nذات الطبيعة الخاصة  ،والتى يحددها الوزير المختص بقرار منه  ،بحيث لا تزيد مـدة\nتواجدهم فى المنشأة على اثنتى عشرة ساعة فى اليوم الواحد .", "text_ru": "Рабочее время и периоды отдыха должны быть организованы таким образом, чтобы промежуток между началом и окончанием рабочего времени не превышал десяти часов в течение одного дня; период отдыха засчитывается в период нахождения на работе, если работник в это время находится на месте работы.\n\nИз этого правила исключаются работники, занятые на работах, прерывистых по своему характеру, и работах особого характера, которые определяются решением компетентного министра, при условии, что продолжительность их нахождения на предприятии не превышает двенадцати часов в течение одного дня.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "120", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "يجب تنظيم العمل بالمنشأة بحيث يحصل كل عامل على راحة أسـبوعية لا تقـل\nعن أربع وعشرين ساعة كاملة بعد ستة أيام عمل متصلة على الأكثر  ،وفـى جميـع\nالأحوال تكون الراحة الأسبوعية مدفوعة الأجر .\n\nواستثناء من الحكم الوارد فى الفقرة الأولى من هذه المادة  ،يجوز فـى الأمـاكن\nالبعيدة عن العمران  ،وفى الأعمال التى تتطلب طبيعة العمل  ،أو ظـروف التـشغيل\nفيها استمرار العمل تجميع الراحات الأسبوعية المستحقة للعامل عـن مـدة لا تجـاوز\nثمانية أسابيع  ،وتحدد لائحة تنظيم العمل والجزاءات قواعد الحصول علـى الراحـات\nالأسبوعية المجمعة  ،وتضع المنشآت التى يقل عدد عمالها عن عشرة عمـال قواعـد\nتنظيم الراحات الأسبوعية المجمعة بها وفق ًا للقرارات التى تصدرها المنشأة .\nويراعى فى حساب مدة الراحات الأسبوعية المجمعة أن تبدأ من ساعة وصـول\nالعمال إلى أقرب موقع به مواصلات وتنتهى ساعة العودة إليه .", "text_ru": "Работа на предприятии должна быть организована таким образом, чтобы каждый работник получал еженедельный отдых продолжительностью не менее двадцати четырёх полных часов после не более чем шести дней непрерывной работы подряд; в любом случае еженедельный отдых является оплачиваемым.\n\nВ порядке исключения из правила, установленного первым абзацем настоящей статьи, в отдалённых от населённых пунктов местах и на работах, характер которых или условия производства которых требуют непрерывной работы, допускается накопление причитающихся работнику еженедельных дней отдыха за период, не превышающий восьми недель; внутренний регламент организации труда и мер ответственности устанавливает правила получения накопленных еженедельных дней отдыха; предприятия с численностью работников менее десяти человек устанавливают правила организации накопленных у них еженедельных дней отдыха в соответствии с решениями, издаваемыми предприятием.\n\nПри исчислении продолжительности накопленных еженедельных дней отдыха учитывается, что она начинается с часа прибытия работников к ближайшему пункту, где имеется транспортное сообщение, и заканчивается часом возвращения к нему.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "121", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "يجوز لصاحب العمل عدم التقيد بالأحكام الواردة بالمواد )، ۱۱۹ ، ۱۱۸ ، ١١٧\n(۱۲۰من هذا القانون  ،إذا كان التشغيل بقصد مواجهة ضرورات عمل غير عاديـة ،\nأو ظروف استثنائية  ،ويشترط فى هذه الحالات إبلاغ الجهة الإدارية المختـصة فـى\nخلال سبعة أيام من وقوع ظروف العمل غير العادية أو الظروف الاستثنائية بمبررات\nالتشغيل الإضافى والمدة اللازمة لإتمام العمل .\nوفى هذه الحالة يستحق العامل بالإضافة إلى أجره عن ساعات العمل الأصـلية ،\nأجرا عن ساعات التشغيل الإضافية حسبما يتم الاتفاق عليه فى عقـد العمـل الفـردى\nأو الجماعى  ،بحيث لا يقل عن الأجر الذى يستحقه العامل مضاف ًا إليـه (٣٥٪)عـن\nساعة العمل النهارية  ،و (٧٠٪)عن ساعة العمل الليلية تحسب على أساس أجر ساعة\nعمله الأصلية  ،فإذا وقع التشغيل فى يوم الراحة استحق العامل مثل أجـره تعويـضا\nعن هذا اليوم  ،ويمنحه صاحب العمل يوما آخر عوضا عنه خلال الأسبوع التالي .\nوفى جميع الأحوال  ،لا يجوز أن تزيد ساعات وجود العامل بالمنشأة على اثنتـى\nعشرة ساعة .", "text_ru": "Работодатель вправе не соблюдать положения, установленные статьями (117), (118), (119) и (120) настоящего Трудового кодекса, если привлечение к труду вызвано необходимостью удовлетворения неотложных производственных потребностей необычного характера либо исключительными обстоятельствами; в этих случаях необходимо уведомить компетентный административный орган в течение семи дней со дня наступления необычных производственных обстоятельств или исключительных обстоятельств с указанием оснований для дополнительной занятости и срока, необходимого для завершения работы.\n\nВ этом случае работник, помимо заработной платы за часы обычной работы, имеет право на оплату за часы дополнительной занятости в размере, согласованном в индивидуальном или коллективном трудовом договоре, но не менее заработной платы, причитающейся работнику, увеличенной на 35% за дневной час работы и на 70% за ночной час работы, рассчитываемой исходя из размера оплаты часа его обычной работы; если привлечение к труду произошло в день отдыха, работник имеет право на оплату в размере, равном его заработной плате, в качестве компенсации за этот день, и работодатель предоставляет ему другой день взамен него в течение следующей недели.\n\nВ любом случае продолжительность нахождения работника на предприятии не должна превышать двенадцати часов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "122", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "على صاحب العمل أن يضع بالمداخل الرئيسية التى يستعملها العمـال  ،أو فـى مكـان\nظاهر بالمنشأة جدولا ً ببيان يوم الراحة الأسبوعية  ،وساعات العمل  ،وفترات الراحـة\nالمقررة لكل العاملين  ،وما يطرأ على هذا الجدول من تعـديل مـع إخطـار الجهـة\nالإدارية المختصة بصورة من هذا الجدول  ،أو ما يطرأ عليه من تعديل خلال سـبعة\nأيام من تنفيذه على الأكثر .", "text_ru": "Работодатель обязан разместить у главных входов, которыми пользуются работники, либо в ином видном месте на предприятии таблицу с указанием дня еженедельного отдыха, рабочего времени и установленных для всех работников периодов отдыха, а также вносимых в эту таблицу изменений, с уведомлением компетентного административного органа о копии этой таблицы либо вносимых в неё изменениях не позднее чем в течение семи дней с начала их применения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "123", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الرابع", "chapter_title": "ساعات العمل وفترات الراحة", "text": "لا تسرى أحكام المواد ) / ۱۲۰ ، ۱۱۹ ، ۱۱۸ ، ۱۱۷فقرة ثانيـة( مـن هـذا\nالقانون على الفئات الآتية :\n-١الوكلاء المفوضين عن صاحب العمل .\n-٢العمال المشتغلين بالأعمال التجهيزية والتكميلية التى يتعـين إنجازهـا قبـل\nأو بعد انتهاء العمل .\n-٣العمال المخصصين للحراسة والنظافة .\nويحدد الحد الأقصى لساعات العمل الفعلية والإضافية للأعمـال المـشار إليهـا\nفى البندين (٣) ، ٢من الفقرة الأولى من هذه المادة بقرار مـن الـوزير المخـتص ،\nويستحق العمال فى هذه الحالة أجرا إضافيا طبق ًا لنص المادة (١٢١)من هذا القانون .", "text_ru": "Положения статей (117), (118), (119) и (120, второй абзац) настоящего Трудового кодекса не применяются к следующим категориям:\n1. уполномоченным представителям работодателя;\n2. работникам, занятым подготовительными и вспомогательными работами, которые необходимо выполнить до начала или после окончания работы;\n3. работникам, выполняющим функции охраны и уборки.\n\nМаксимальный предел фактического и сверхурочного рабочего времени для работ, указанных в пунктах 2 и 3 первого абзаца настоящей статьи, устанавливается решением компетентного министра; в этом случае работники имеют право на оплату сверхурочной работы в соответствии с положениями статьи (121) настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Рабочее время и время отдыха"}, {"number": "124", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "يستحق العامل إجازة سنوية بأجر  ،لا يدخل فى حسابها أيـام عطـلات الأعيـاد\nوالمناسبات الرسمية والراحة الأسبوعية  ،وذلك على الوجه الآتى :\n-١خمسة عشر يوما فى السنة الأولى .\n-٢واحد وعشرون يوما اعتبارا من السنة الثانية .\n-٣ثلاثون يوما لمن أمضى عشر سنوات كاملة لدى صاحب عمـل أو أكثـر ،\nأو لمن تجاوزت سنه خمسين عاما .\n-٤خمسة وأربعون يوما للأشخاص ذوى الإعاقة والأقزام .\nوإذا قلت مدة خدمة العامل عن سنة تكون إجازته بنـسبة المـدة التـى قـضاها\nفي العمل بشرط أن يكون قد أمضى ستة أشهر على الأقل فى خدمة صاحب العمل .\nوفى جميع الأحوال  ،تزاد مدة الإجازة السنوية بمقدار سبعة أيام للعمـال الـذين\nيعملون فى الأعمال الخطرة  ،أو المضرة بالصحة  ،أو فى المناطق النائيـة  ،والتـى\nيصدر بتحديدها قرار من الوزير المختص بعد أخذ رأى الجهات المعنية .", "text_ru": "Работник имеет право на оплачиваемый ежегодный отпуск, в исчисление которого не включаются праздничные дни, официальные памятные даты и еженедельный отдых, в следующем размере:\n1. пятнадцать дней в первый год;\n2. двадцать один день начиная со второго года;\n3. тридцать дней — для лиц, проработавших десять полных лет у одного или нескольких работодателей, либо для лиц старше пятидесяти лет;\n4. сорок пять дней — для лиц с инвалидностью и лиц с карликовостью.\n\nЕсли срок службы работника составляет менее года, его отпуск исчисляется пропорционально времени, отработанному им, при условии, что он проработал у работодателя не менее шести месяцев.\n\nВ любом случае продолжительность ежегодного отпуска увеличивается на семь дней для работников, занятых на опасных или вредных для здоровья работах либо в отдалённых районах, перечень которых устанавливается решением компетентного министра после получения заключения соответствующих органов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "125", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "يحدد صاحب العمل مواعيد الإجازة السنوية حسب مقتضيات العمل وظروفـه ،\nولا يجوز قطعها إلا لأسباب قوية تقتضيها مصلحة العمل .\nولا يجوز للعامل النزول عن إجازته  ،ويلتزم بالقيام بالإجـازة فـى التـاريخ ،\nوالمدة التى حددها صاحب العمل وتم إخطاره بها  ،وإذا رفض العامـل كتابـة القيـام\nبالإجازة سقط حقه فى اقتضاء مقابلها .\nوفى جميع الأحوال  ،يجب أن يحصل العامل على إجازة سنوية مـدتها خمـسة\nعشر يوما  ،منها ستة أيام متصلة على الأقل  ،ويلتزم صاحب العمل بتـسوية رصـيد\nالإجازات  ،أو الأجر المقابل له كل ثلاث سنوات على الأكثر  ،فـإذا انتهـت علاقـة\nالعمل قبل استنفاد العامل رصيد إجازته السنوية استحق الأجر المقابل لهذا الرصيد .\nولا يجوز تجزئة الإجازة أو ضمها أو تأجيلهـا بالنـسبة للأطفـال والأشـخاص\nذوى الإعاقة والأقزام .", "text_ru": "Работодатель определяет сроки ежегодного отпуска исходя из потребностей и условий производства; прерывание отпуска допускается только по уважительным причинам, продиктованным интересами производства.\n\nРаботник не вправе отказаться от своего отпуска и обязан использовать отпуск в дату и на срок, определённые работодателем и доведённые до его сведения; если работник письменно отказывается использовать отпуск, его право на получение компенсации за него утрачивается.\n\nВ любом случае работник должен получить ежегодный отпуск продолжительностью пятнадцать дней, из которых не менее шести дней подряд; работодатель обязан производить расчёты по остатку отпусков либо соответствующей ему заработной плате не реже одного раза в три года; если трудовое отношение прекращается до того, как работник использовал остаток своего ежегодного отпуска, он имеет право на заработную плату, соответствующую этому остатку.\n\nДробление, объединение или перенос отпуска не допускается в отношении детей, лиц с инвалидностью и лиц с карликовостью.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "126", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للعامل الحق فى تحديد موعد إجازته السنوية إذا كـان متقـدما لأداء الامتحـان\nفى إحدى مراحل التعليم بشرط أن يخطـر صـاحب العمـل قبـل قيامـه بالإجـازة\nبخمسة عشر يوما على الأقل .\nوللعامل الحق فى الحصول على إجازة دراسية بأجر عن أيام الامتحـان الفعليـة\nلا تحتسب من رصيد إجازاته السنوية  ،ويشترط لذلك :\n-١إخطار صاحب العمل قبل القيام بالإجازة بعشرة أيام على الأقل .\n-٢إثبات ما يفيد دخوله الامتحان فعليا .", "text_ru": "Работник имеет право самостоятельно определить срок своего ежегодного отпуска, если он допущен к сдаче экзамена на одном из этапов образования, при условии уведомления работодателя не менее чем за пятнадцать дней до начала отпуска.\n\nРаботник имеет право на оплачиваемый учебный отпуск на дни фактических экзаменов, не засчитываемый в остаток его ежегодных отпусков, при условии:\n1. уведо
