мления работодателя не менее чем за десять дней до начала отпуска;\n2. представления подтверждения фактической сдачи экзамена.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "127", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "لصاحب العمل أن يحرم العامل من أجره عن مدة الإجازة  ،أو يـسترد مـا أداه\nمن أجر عنها  ،إذا ثبت اشتغاله خلالها لدى الغير  ،وذلك دون إخلال بالجزاء التأديبي .", "text_ru": "Работодатель вправе лишить работника заработной платы за период отпуска либо потребовать возврата выплаченной за него заработной платы, если будет установлено, что он в течение отпуска работал у другого лица, без ущерба для применения дисциплинарного взыскания.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "128", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للعامل أن ينقطع عن العمل لسبب عارض لمدة لا تجاوز سبعة أيام خلال السنة ،\nوبحد أقصى يومان فى المرة الواحدة  ،وتحسب الإجازة العارضة من الإجازة السنوية\nالمقررة للعامل .\nوللعامل الذى يولد له مولود الحق فى إجازة طارئة مدفوعة الأجر يـوم الـولادة\nلا تحسب من رصيد إجازاته السنوية  ،بحد أقصى ثلاث مرات طوال مدة الخدمة .", "text_ru": "Работник вправе прерывать работу по случайной причине на срок, не превышающий семи дней в году, и не более двух дней за один раз; такой краткосрочный отпуск засчитывается в счёт установленного для работника ежегодного отпуска.\n\nРаботник, у которого родился ребёнок, имеет право на оплачиваемый краткосрочный отпуск в день рождения ребёнка, не засчитываемый в остаток его ежегодных отпусков, не более трёх раз за весь период службы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "129", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للعامل الحق فى إجازة بأجر فى العطلات والأعياد والمناسـبات التـى يـصدر\nبتحديدها قرار من الوزير المختص  ،وتسرى بالنسبة للأعياد الدينية لغيـر المـسلمين\nأحكام قرار مجلس الوزراء الصادر فى هذا الشأن .\nولصاحب العمل تشغيل العامل فى هذه الأيام  ،إذا اقتضت ظروف العمل ذلـك ،\nويستحق العامل فى هذه الحالة بالإضافة إلى أجره عن هذا اليوم مثلى هذا الأجر أو أن\nيمنح العامل يوما آخر عوضا عنه بناء على طلب كتابى من العامـل يـودع بـالملف\nالخاص به .", "text_ru": "Работник имеет право на оплачиваемый отпуск в дни праздников, торжеств и памятных дат, перечень которых устанавливается решением компетентного министра; в отношении религиозных праздников немусульман применяются положения решения Совета министров, изданного по этому вопросу.\n\nРаботодатель вправе привлекать работника к труду в эти дни, если этого требуют условия производства; в этом случае работник, помимо заработной платы за этот день, имеет право на двойную оплату либо на предоставление ему другого дня взамен него на основании письменного заявления работника, приобщаемого к его личному делу.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "130", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للعامل الذى أمضى فى خدمة صاحب عمل خمس سنوات متصلة  ،الحـق فـى\nإجازة بأجر لمدة شهر لأداء فريضة الحج  ،أو زيارة بيـت المقـدس  ،وتكـون هـذه\nالإجازة مرة واحدة طوال مدة خدمته .", "text_ru": "Работник, проработавший у работодателя пять лет подряд, имеет право на оплачиваемый отпуск продолжительностью один месяц для совершения паломничества (хаджа) либо посещения Иерусалима; этот отпуск предоставляется один раз за весь период его службы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "131", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للعامل الذى يثبت مرضه  ،أو إصابته على نحو يحول بينه وبين أداء عمله الحق\nفى إجازة مرضية تحددها الجهة الطبية المختصة  ،ويستحق العامل خلالهـا تعويـضا\nعن الأجر  ،تحدد نسبته ومدته  ،وفق ًا لأحكام قانون التأمينات الاجتماعية والمعاشـات\nالمشار إليه .\nويكون للعامل الذى يثبت مرضه فى المنشآت الصناعية التى يسرى فـى شـأنها قـانون\nتيسير منح تراخيص المنشآت الصناعية الصادر بالقانون رقم  ١٥لسنة  ، ٢٠١٧الحق\nفى إجازة مرضية كل ثلاث سنوات تقضى فى الخدمة على أساس ثلاثة أشهر بـأجر ،\n\nثم ستة أشهر بأجر يعادل (٨٥٪)من أجره  ،ثم ثلاثة أشهر بأجر يعادل (٧٥٪)من أجره ،\nوذلك إذا قررت الجهة الطبية المختصة احتمال شفائه .\nويخصم من الأجر الذى يلتزم به صاحب العمل  ،ما يلتزم بأدائه نظـام التـأمين\nالاجتماعى من تعويض عن الأجر .\nوللعامل أن يستفيد من متجمد إجازاته السنوية إلى جانب ما يستحقه مـن إجـازة\nمرضية  ،كما له أن يطلب تحويل الإجازة المرضية إلى إجازة سنوية  ،إذا كـان لـه\nرصيد يسمح بذلك .", "text_ru": "Работник, у которого подтверждена болезнь или травма, препятствующая выполнению им своей работы, имеет право на отпуск по болезни, продолжительность которого определяется компетентным медицинским органом; в течение этого отпуска работник имеет право на компенсацию заработной платы, размер и срок которой устанавливаются в соответствии с положениями упомянутого Закона о социальном страховании и пенсиях.\n\nРаботник, у которого подтверждена болезнь, на промышленных предприятиях, на которые распространяется упомянутый Закон об упрощении процедур выдачи разрешений промышленным предприятиям № 15 от 2017 года, имеет право на отпуск по болезни каждые три года, предоставляемый на основе трёх месяцев с полной оплатой, затем шести месяцев с оплатой в размере 85% его заработной платы, затем трёх месяцев с оплатой в размере 75% его заработной платы, если компетентный медицинский орган признает вероятность его выздоровления.\n\nИз заработной платы, которую обязан выплачивать работодатель, вычитается сумма компенсации заработной платы, подлежащая выплате в рамках системы социального страхования.\n\nРаботник вправе использовать накопленный остаток своих ежегодных отпусков наряду с причитающимся ему отпуском по болезни, а также вправе просить о переводе отпуска по болезни в ежегодный отпуск, если у него имеется остаток, позволяющий это сделать.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "132", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "للجهة الطبية المختصة منع العامل المخالط لمريض بمرض معد من أحـد أفـراد\nأسرته من مزاولة عمله المدة المناسبة بما لا يجـاوز ثلاثـة أشـهر  ،وتحـدد هـذه\nالأمراض بقرار من الوزير المعنى بشئون الصحة  ،كما يحدد القرار الجهـة الطبيـة\nالمختصة المشار إليها .", "text_ru": "Компетентный медицинский орган вправе запретить работнику, контактировавшему с больным инфекционным заболеванием из числа членов его семьи, выполнять свою работу в течение соответствующего срока, не превышающего трёх месяцев; эти заболевания определяются решением министра, в ведении которого находятся вопросы здравоохранения, которое также определяет указанный компетентный медицинский орган.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "133", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل الخامس", "chapter_title": "الإجازات", "text": "تثبت عدم اللياقة للخدمة صـحيا وفق ًـا لأحكـام قـانون التأمينـات الاجتماعيـة\nوالمعاشات المشار إليه .", "text_ru": "Непригодность к службе по состоянию здоровья устанавливается в соответствии с положениями упомянутого Закона о социальном страховании и пенсиях.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Отпуска"}, {"number": "134", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يجب على العامل ما يأتي :\n-١أن يؤدى بنفسه الواجبات المنوطة به بدقة وأمانة  ،وذلك وفق ًا لما هو محـدد\nبالقانون ولوائح العمل  ،وعقود العمل الفردية والجماعية  ،وأن ينجزهـا فـى الوقـت\nالمحدد  ،وأن يبذل فيها عناية الشخص المعتاد .\n-٢أن ينفذ أوامر وتعليمات صاحب العمل الخاصة بتنفيذ الواجبات التـى تـدخل\nفى نطاق العمل المنوط به  ،إذا لم يكن فى هذه الأوامر والتعليمات ما يخـالف العقـد\nأو القانون أو اللوائح أو الآداب العامة  ،ولم يكن فى تنفيذها ما يعرض للخطر .\n\n-٣أن يحافظ على مواعيد العمل  ،وأن يتبع الإجراءات المقررة فى حالة التغيب\nعن العمل  ،أو مخالفة مواعيده .\n-٤أن يحافظ على ما يسلمه إليه صاحب العمل من أدوات أو أجهزة أو مستندات\nأو أى أشياء أخرى  ،وأن يقوم بجميع الأعمال اللازمة لسلامتها  ،ويلتزم بـأن يبـذل\nفى ذلك عناية الشخص المعتاد .\n-٥أن يحسن معاملة عملاء صاحب العمل .\n-٦أن يحترم رؤساءه وزملاءه فى العمل  ،وأن يتعاون معهم بما يحقق مـصلحة\nالمنشأة التي يعمل بها .\n-٧أن يحافظ على كرامة العمل  ،وأن يتبع السلوك القويم .\n-٨أن يراعى النظم الموضوعة للمحافظة على سلامة المنشأة وأمنها .\n-٩أن يحافظ على أسرار العمل  ،فلا يفشى المعلومات المتعلقـة بالعمـل متـى\nكانت سرية بطبيعتها  ،أو وفق ًا للتعليمات الكتابية الصادرة عن صاحب العمل .\n-١٠أن يخطر جهة العمل بالبيانات الصحيحة المتعلقة بمحـل إقامتـه وحالتـه\nالاجتماعية وموقفه من أداء الخدمة العسكرية  ،والبيانات الأخرى التى تتطلب القوانين\nأو النظم إدراجها فى السجل الخاص به  ،وبكل تغيير يطرأ على بيـان مـن البيانـات\nالسابقة فى المواعيد المحددة لذلك .\n-١١أن يتبع النظم التى يضعها صاحب العمل لتنمية وتطوير مهاراته وخبراتـه\nمهنيا وثقافيا  ،أو لتأهيله للقيام بعمل يتفق  ،أو يتناسب مع عمله والتطور التقنى داخـل\nالمنشأة  ،وذلك بالاشتراك مع المنظمة النقابية العمالية المعنية .", "text_ru": "Работник обязан:\n1. лично добросовестно и точно исполнять возложенные на него обязанности в соответствии с тем, что определено законом, регламентами труда, индивидуальными и коллективными трудовыми договорами, выполнять их в установленный срок и проявлять при этом заботливость обычного человека;\n2. исполнять приказы и указания работодателя, касающиеся исполнения обязанностей, входящих в круг порученной ему работы, если в этих приказах и указаниях нет ничего, что противоречило бы договору, закону, регламентам или общественной нравственности, и их исполнение не создаёт опасности;\n3. соблюдать рабочее время и следовать установленным процедурам в случае отсутствия на работе или нарушения графика;\n4. беречь переданные ему работодателем инструменты, оборудование, документы или иные предметы, принимать все необходимые меры для их сохранности, проявляя при этом заботливость обычного человека;\n5. надлежащим образом обращаться с клиентами работодателя;\n6. уважать своих руководителей и коллег по работе и сотрудничать с ними в интересах предприятия, на котором он работает;\n7. беречь достоинство труда и придерживаться достойного поведения;\n8. соблюдать правила, установленные для обеспечения безопасности и охраны предприятия;\n9. хранить производственную тайну, не разглашая сведения, относящиеся к работе, если они являются конфиденциальными по своему характеру либо в соответствии с письменными указаниями работодателя;\n10. уведомлять место работы о достоверных сведениях, касающихся места его жительства, семейного положения, его отношения к прохождению военной службы, а также иных сведениях, внесение которых в его личное дело требуется законами или регламентами, а также о любых изменениях в указанных выше сведениях в установленные для этого сроки;\n11. следовать системам, устанавливаемым работодателем для развития и совершенствования его профессиональных и культурных навыков и опыта либо для его подготовки к выполнению работы, соответствующей или согласующейся с его работой и техническим развитием на предприятии, во взаимодействии с соответствующей профсоюзной организацией работников.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "135", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "مع عدم الإخلال بأحكام القانون رقم  ١٣٧لسنة  ١٩٥٨فى شأن الاحتياطات الـصحية\nللوقاية من الأمراض المعدية بالإقليم المصرى  ،ومـع مراعـاة أحكـام المـادتين )۱۳۲\nو (۱۳۸من هذا القانون يلتزم العامل بالخضوع للاختبارات الطبية عن تعاطى المـواد\nالمخدرة أو الأمراض المعدية حينما يطلب منه صاحب العمل ذلك وعلى نفقته  ،ويـتم\nالاختبار الطبى بالهيئة العامة للتأمين الصحى أو المعامل المركزية بوزارة الصحة .\n\nوتتم الاختبارات الطبية عن تعاطى المواد المخدرة والتظلم منهـا وفق ًـا للتنظـيم\nوالإجراءات والضمانات التى يصدر بها قرار من الوزير المختص  ،علـى أن يكـون\nمن بينها إجراء فحص لذات العينة فى ذات يوم سحبها  ،وفى حالة اخـتلاف نتيجتـى\nالفحص يتم إجراء تحليل توكيدى لدى أى من الجهتين المشار إليهما فى الفقرة الأولـى\nمن هذه المادة .\nفإذا تأكدت إيجابية العينـة يـتم إحالـة العامـل للمحكمـة العماليـة المختـصة\nلإعمال شئونها .\nوفى جميع الأحوال  ،يلتزم صاحب العمل باتباع السرية فى إجراء الكشف الطبى\nوعدم الإفصاح عن الوضع الصحى للعامل بناء على هذه الاختبارات .", "text_ru": "Без ущерба для положений Закона № 137 от 1958 года о санитарных мерах предосторожности для профилактики инфекционных заболеваний на территории Египта, и с учётом положений статей (132) и (138) настоящего Трудового кодекса, работник обязан пройти медицинское освидетельствование на предмет употребления наркотических веществ или наличия инфекционных заболеваний, когда этого потребует от него работодатель, за счёт работодателя; медицинское освидетельствование проводится в Главном управлении медицинского страхования или центральных лабораториях Министерства здравоохранения.\n\nМедицинские освидетельствования на предмет употребления наркотических веществ и порядок обжалования их результатов производятся в соответствии с организацией, процедурами и гарантиями, устанавливаемыми решением компетентного министра, при этом среди них должна быть проверка той же пробы в тот же день её взятия; в случае расхождения результатов двух проверок производится подтверждающий анализ в одном из двух органов, указанных в первом абзаце настоящей статьи.\n\nЕсли положительный результат пробы подтверждён, дело работника передаётся в компетентный трудовой суд для рассмотрения соответствующих вопросов.\n\nВ любом случае работодатель обязан соблюдать конфиденциальность при проведении медицинского освидетельствования и не разглашать сведения о состоянии здоровья работника, полученные на основании этих освидетельствований.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "136", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يحظر على العامل أن يقوم بنفسه  ،أو بواسطة غيره بالأعمال الآتية :\n-١الاحتفاظ لنفسه بأى ورقة أو مستند خاص بالعمل أو أى بيانـات إلكترونيـة\nأو أى من وسائل التأمين الإلكترونية الخاصة بالعمل سواء بنفسه  ،أو بتمكـين الغيـر\nمن الحصول على أى منها أو على أية معلومات تخص العمل .\n-٢العمل لدى الغير سواء بأجر  ،أو دون أجر إذا كان فى قيامه بهذا العمل مـا\nيخل بحسن أدائه لعمله أو يمكن الغير  ،أو يساعده على التعرف على أسرار المنشأة ،\nأو منافسة صاحب العمل .\n-٣ممارسة نشاط مماثل للنشاط الذى يمارسه صاحب العمل أثناء قيـام علاقـة\nالعمل أو الاشتراك فى نشاط من هذا القبيل  ،سواء بصفته شريك ًا  ،أو عاملا ً .\n-٤الاقتراض من عملاء صاحب العمل  ،أو ممن يمارسون نشاط ًا مماثلا ً للنشاط\nالذى يمارسه صاحب العمل  ،ولا يسرى هذا الحظر علـى الاقتـراض مـن البنـوك\nأو غيرها من الجهات المرخص لها بذلك .\n-٥طلب أو قبول هدايا  ،أو مكافآت  ،أو عمولات  ،أو مبالغ  ،أو أشياء أخـرى\nبأية صفة كانت بمناسبة قيامه بواجباته بغير موافقة صاحب العمل .\n\n-٦جمع تبرعات نقدية أو عينية  ،أو توزيع منشورات  ،أو جمـع توقيعـات ،\nأو تنظيم اجتماعات داخل مكان العمل دون موافقة صاحب العمل كتابة  ،مع مراعـاة\nما تقضى به أحكام قانون المنظمات النقابية العمالية وحمايـة حـق التنظـيم النقـابى\nالمشار إليه .", "text_ru": "Работнику запрещается лично или через посредство иного лица совершать следующие действия:\n1. оставлять у себя какой-либо документ или бумагу, относящуюся к работе, либо какие-либо электронные данные или средства электронного обеспечения, относящиеся к работе, будь то лично или посредством предоставления другому лицу возможности получить любые из них либо любую информацию, относящуюся к работе;\n2. работать у другого лица, за вознаграждение или без вознаграждения, если выполнение им этой работы нарушает надлежащее исполнение им своей работы либо позволяет другому лицу или помогает ему ознакомиться с производственной тайной предприятия либо конкурировать с работодателем;\n3. заниматься деятельностью, аналогичной деятельности, осуществляемой работодателем, в период действия трудового отношения, либо участвовать в такой деятельности в качестве партнёра или работника;\n4. брать займы у клиентов работодателя либо у лиц, осуществляющих деятельность, аналогичную деятельности работодателя; этот запрет не распространяется на займы, полученные в банках или иных уполномоченных на это органах;\n5. требовать или принимать подарки, вознаграждения, комиссионные, денежные суммы или иные предметы в какой бы то ни было форме в связи с исполнением им своих обязанностей без согласия работодателя;\n6. собирать денежные или натуральные пожертвования, распространять листовки, собирать подписи либо организовывать собрания на месте работы без письменного согласия работодателя, с учётом положений упомянутого Закона о профсоюзных организациях работников и защите права на профсоюзную организацию.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "137", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "على كل صاحب عمل يستخدم عشرة عمال فأكثر أن يعد لائحة بقواعـد تنظـيم\nالعمل وفق ًا لطبيعة النشاط  ،على أن تتضمن على الأخص نظـم الترقـى  ،والنقـل ،\nوالأجور  ،والمخالفات التى تمثل خروجا على مقتضى الواجب الوظيفى  ،والجزاءات\nالتأديبية  ،خلال ستين يوما من بداية عمل المنشأة أو تاريخ تـوافر هـذا النـصاب ،\nأو نفاذ هذا القانون  ،بحسب الأحوال  ،وعليه تسليم الجهة الإدارية المختصة نسخة من\nاللائحة لمراجعتها والتصديق عليها وعلى الجهة الإداريـة المختـصة اسـتطلاع رأى\nالمنظمة النقابية العمالية المختصة والتى يتعين عليها إبداء رأيها إلى الجهـة الإداريـة\nالمختصة فى موعد لا يتجاوز خمسة عشر يوما من تاريخ تسلمها للائحة وإلا اعتبـر\nذلك بمثابة موافقة على اللائحة  ،فإذا لم تقم الجهة الإداريـة المختـصة بالتـصديق ،\nأو الاعتراض على اللائحة خلال ثلاثين يوما من تاريخ استلامها اعتبرت اللائحة نافذة .\nوعلى صاحب العمل أن يعلق هذه اللائحة فى مكان ظـاهر بالمنـشأة وفروعهـا\nومواقع عملها .\nوللوزير المختص أن يصدر قرارا بالقواعد العامة لهذه اللائحة .", "text_ru": "Каждый работодатель, использующий труд десяти и более работников, обязан подготовить регламент правил организации труда в соответствии с характером деятельности, который должен содержать, в частности, системы продвижения по службе, перевода, оплаты труда, нарушения, представляющие собой отступление от требований служебного долга, и дисциплинарные взыскания, — в течение шестидесяти дней с начала работы предприятия либо с даты достижения указанной численности, либо со дня вступления настоящего Трудового кодекса в силу, в зависимости от обстоятельств; он обязан передать компетентному административному органу копию регламента для проверки и утверждения; компетентный административный орган обязан запросить мнение соответствующей профсоюзной организации работников, которая обязана представить своё мнение компетентному административному органу в срок, не превышающий пятнадцати дней со дня получения ею регламента, — в противном случае это считается согласием с регламентом; если компетентный административный орган не утвердит регламент либо не заявит возражений против него в течение тридцати дней со дня его получения, регламент считается вступившим в силу.\n\nРаботодатель обязан вывесить этот регламент на видном месте на предприятии, в его филиалах и на объектах его деятельности.\n\nКомпетентный министр вправе издать решение об общих правилах этого регламента.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "138", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يشترط فى الفعل الذى تجوز مساءلة العامل عنه تأديبيا أن يكون ذا صلة بالعمل ،\nوتحدد لائحة الجزاءات المخالفات والجزاءات المقررة لها  ،وفق ًا لما هـو منـصوص\nعليه فى المادة (١٣٩)من هذا القانون وبما يحقق تناسب الجزاء مع المخالفة .\nولا يجوز توقيع جزاء تأديبى على العامل بعد مضى ثلاثين يوما مـن تـاريخ الانتهـاء\nمن التحقيق فى المخالفة .", "text_ru": "Условием привлечения работника к дисциплинарной ответственности за деяние является наличие связи этого деяния с работой; регламент взысканий определяет нарушения и установленные за них взыскания в соответствии с положениями статьи (139) настоящего Трудового кодекса, обеспечивая соразмерность взыскания нарушению.\n\nНаложение дисциплинарного взыскания на работника по истечении тридцати дней со дня завершения расследования нарушения не допускается.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "139", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "الجزاءات التأديبية التى يجوز توقيعها على العامل وفق ًـا للـوائح تنظـيم العمـل\nوالجزاءات فى المنشأة هي :\n-١الإنذار الكتابي .\n-٢الخصم من الأجر الأساسي .\n-٣تأجيل موعد استحقاق العلاوة السنوية لمدة لا تجاوز ثلاثة أشهر .\n-٤الحرمان من جزء من العلاوة السنوية  ،بما لا يجاوز نصفها .\n-٥تأجيل الترقية عند استحقاقها لمدة لا تزيد على سنة .\n-٦خفض الأجر الأساسى بمقدار علاوة على الأكثر .\n-٧الخفض إلى وظيفة فى الدرجة الأدنى مباشرة  ،دون تخفيض الأجر .\n-٨الفصل من الخدمة وفق ًا لأحكام هذا القانون .", "text_ru": "Дисциплинарными взысканиями, которые могут быть наложены на работника в соответствии с регламентами организации труда и взысканий на предприятии, являются:\n1. письменное предупреждение;\n2. удержание из основной заработной платы;\n3. отсрочка наступления права на ежегодную надбавку на срок, не превышающий трёх месяцев;\n4. лишение части ежегодной надбавки в размере не более её половины;\n5. отсрочка повышения по службе при наступлении права на него на срок, не превышающий одного года;\n6. снижение основной заработной платы на сумму, не превышающую размера одной надбавки;\n7. понижение в должности до непосредственно нижестоящей должности без снижения заработной платы;\n8. увольнение со службы в соответствии с положениями настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "140", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لا يجوز لصاحب العمل توقيع أكثر من جزاء عـن المخالفـة الواحـدة  ،كمـا\nلا يجوز له الجمع بين اقتطاع جزء من أجر العامل تطبيق ًا لحكم المادة (١٣٩)من هذا\nالقانون وبين أى جزاء مالي  ،إذا زاد ما يجب اقتطاعـه علـى أجـر خمـسة أيـام\nفى الشهر الواحد .", "text_ru": "Работодателю не разрешается налагать более одного взыскания за одно нарушение, а также не разрешается совмещать удержание части заработной платы работника в соответствии с положением статьи (139) настоящего Трудового кодекса с каким-либо денежным взысканием, если то, что подлежит удержанию, превышает заработную плату за пять дней в течение одного месяца.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "141", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لا يجوز توقيع جزاء على العامل إلا بعد إبلاغه كتابة بما نسب إليه وسماع أقوالـه ،\nوتحقيق دفاعه وإثبات ذلك فى محضر يودع فى ملفه الخاص  ،على أن يبدأ التحقيـق\nخلال سبعة أيام على الأكثر من تاريخ اكتشاف المخالفـة ولا يتجـاوز ثلاثـة أشـهر\nمن تاريخ بداية التحقيق ويجوز أن تزاد ثلاثة أشهر أخرى إذا تكشف أثنـاء التحقيـق\nوقائع أو مستندات جديدة  ،وللمنظمة النقابية التى يتبعها العامل أن تندب ممـثلا ً عنهـا\nلحضور التحقيق .\nويجوز فى المخالفات التى يعاقب عليها بالإنذار  ،أو الخصم من الأجر الأساسـى\nالذى لا يزيد مقداره على أجر يوم واحد  ،أن يكون التحقيق شفاهة  ،علـى أن يثبـت\nمضمونه في القرار الذى يصدر بتوقيع الجزاء .\nوفى جميع الحالات  ،يشترط أن يكون القرار الصادر بتوقيع الجزاء مسببا .", "text_ru": "Наложение взыскания на работника допускается только после письменного уведомления его о вменяемом ему деянии, заслушивания его объяснений, проверки его возражений и фиксации этого в протоколе, приобщаемом к его личному делу, при этом расследование должно начаться не позднее семи дней со дня обнаружения нарушения и не должно превышать трёх месяцев со дня начала расследования; этот срок может быть продлён ещё на три месяца, если в ходе расследования выявятся новые обстоятельства или документы; профсоюзная организация, к которой относится работник, вправе назначить своего представителя для присутствия при расследовании.\n\nПо нарушениям, за которые предусмотрено взыскание в виде предупреждения либо удержания из основной заработной платы в размере, не превышающем заработную плату за один день, расследование может проводиться устно, при условии фиксации его содержания в решении, издаваемом о наложении взыскания.\n\nВ любом случае решение о наложении взыскания должно быть мотивированным.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "142", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "تختص الشئون القانونية بالمنشأة بالتحقيق مع العامل  ،وفى حالة عـدم وجودهـا\nفلصاحب العمل أن يعهد بالتحقيق فى موضوع المخالفة إلى شخص آخـر مـن ذوى\nالخبرة أو أحد العاملين بالمنشأة  ،بشرط ألا يقل المستوى الوظيفى للمحقق عن مستوى\nالعامل الذى يحقق معه .", "text_ru": "Расследование в отношении работника относится к компетенции юридической службы предприятия; при её отсутствии работодатель вправе поручить расследование по вопросу нарушения другому опытному лицу либо одному из работников предприятия, при условии, что должностной уровень проводящего расследование лица не ниже уровня работника, в отношении которого проводится расследование.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "143", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لا يجوز لصاحب العمل أن يوقع جزاء الخصم على العامل عن المخالفة الواحـدة\nبما يزيد على خمسة أيام من الأجر الأساسي  ،كما لا يجوز أن يقتطع من هذا الأجـر\nوفاء للجزاءات التى يوقعها أكثر من أجر خمسة أيام فى الشهر الواحد .\nوإذا حدد الخصم بنسبة محددة من الأجر  ،اعتبر أن المقصود بذلك هـو الأجـر\nالأساسى اليومى للعامل .", "text_ru": "Работодателю не разрешается налагать на работника взыскание в виде удержания за одно нарушение в размере, превышающем заработную плату за пять дней из основной заработной платы, а также не разрешается удерживать из этой заработной платы в счёт взысканий, налагаемых им, более заработной платы за пять дней в течение одного месяца.\n\nЕсли размер удержания определён в виде определённой доли заработной платы, под этим понимается дневная основная заработная плата работника.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "144", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يجوز تشديد الجزاء إذا عاد العامل إلى ارتكاب مخالفة جديدة من نـوع المخالفـة\nالتى سبق مجازاته عليها  ،متى وقعت هذه المخالفة خلال سنة من تاريخ إبلاغ العامـل\nبتوقيع الجزاء السابق .", "text_ru": "Взыскание может быть ужесточено, если работник вновь совершит новое нарушение того же вида, за которое он ранее был подвергнут взысканию, при условии, что это нарушение совершено в течение года со дня уведомления работника о наложении предыдущего взыскания.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "145", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لصاحب العمل أن يوقف العامل عن عمله مؤقت ًا بموجب قـرار مكتـوب لمـدة\nلا تزيد على ستين يوما مع صرف أجره كاملا ً  ،وذلك فى الحالات الآتية :\n-١إذا أحيل العامل للتحقيق بسبب مخالفة ارتكبها داخل مقر العمل  ،واقتـضت\nمصلحة التحقيق ذلك .\n-٢إذا أت ُهم العامل بارتكاب جناية أو جنحة مخلة بالشرف أو الأمانـة أو الآداب\nالعامة  ،أو أى جنحة أخرى داخل محل العمل .\n-٣إذا طلب صاحب العمل من المحكمـة العماليـة المختـصة فـصل العامـل\nمن الخدمة .", "text_ru": "Работодатель вправе временно отстранить работника от работы на основании письменного решения на срок, не превышающий шестидесяти дней, с выплатой ему заработной платы в полном размере, в следующих случаях:\n1. если работник привлечён к расследованию по причине нарушения, совершённого им на территории места работы, и этого требуют интересы расследования;\n2. если работник обвиняется в совершении преступления или проступка, порочащего честь, добросовестность или общественную нравственность, либо любого иного проступка на территории места работы;\n3. если работодатель обратился в компетентный трудовой суд с требованием об увольнении работника со службы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "146", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "للعامل التظلم من قرار وقفه عن العمل الصادر وفق ًا للبندين (٢) ، ١من المـادة (١٤٥)\nمن هذا القانون بموجب عريضة تقدم لقاضى الأمور الوقتية بالمحكمة العمالية المختـصة ،\nـرار\nـصدور القـ\nـه بـ\nـاره  ،أو علمـ\nـاريخ إخطـ\nـن تـ\nـام مـ\nـة أيـ\nـلال ثلاثـ\nـك خـ\nوذلـ\nالمتظلم منه .\nوعلى القاضى الفصل فى هذا التظلم فى اليوم التالى لتقديمه على الأكثر  ،فـإذا قـضى\nبعدم صحة القرار الصادر بالوقف  ،قضى بعودته للعمل مرة أخرى .", "text_ru": "Работник вправе обжаловать решение о его отстранении от работы, вынесенное в соответствии с пунктами 1 и 2 статьи (145) настоящего Трудового кодекса, посредством заявления, подаваемого судье по неотложным делам компетентного трудового суда, в течение трёх дней со дня уведомления его об этом решении либо со дня, когда ему стало известно об обжалуемом решении.\n\nСудья обязан разрешить эту жалобу не позднее следующего дня после её подачи; если будет установлено, что решение об отстранении является неправомерным, выносится решение о возвращении работника к работе.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "147", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لصاحب العمل أن يطلب من قاضى الأمور الوقتية بالمحكمة العماليـة المختـصة\nمد فترة الإيقاف عن العمل لمدة أو لمدد أخرى مع صرف نصف أجر العامـل وذلـك\nقبل انتهاء مدة الإيقاف بعشرة أيام .\nوعلى قاضى الأمور الوقتية البت فى هذا الطلب قبل انتهاء فترة الإيقاف  ،فإذا لم\nيصدر قراره خلال هذه المدة ولم يعد العامل إلى عمله  ،يستمر إيقـاف العامـل مـع\nصرف الأجر كاملا ً لحين البت فى الطلب فإذا قضى برفض الطلب يعاد لعملـه فـور\nانتهاء مدة إيقافه الأخيرة .\nفإذا كان الوقف لأحد الأسباب الواردة بالبند (٢)مـن المـادة (١٤٥)مـن هـذا\nالقانون  ،ورأت السلطة المختصة بالاتهام حفظ التحقيق  ،أو إصدار أمر بأن لا وجـه\nلإقامة الدعوى الجنائية  ،أو قدم العامل للمحاكمة الجنائية وقـضى ببراءتـه  ،وجبـت\nإعادته إلى عمله مع صرف ما لم يصرف له من مستحقات عن فتـرة الإيقـاف  ،وإلا\nاعتبر عدم إعادته للعمل فصلا ً تعسفيا .", "text_ru": "Работодатель вправе обратиться к судье по неотложным делам компетентного трудового суда с требованием о продлении срока отстранения от работы на такой же или иной срок с выплатой работнику половины заработной платы, — не позднее чем за десять дней до истечения срока отстранения.\n\nСудья по неотложным делам обязан разрешить это заявление до истечения срока отстранения; если его решение не будет вынесено в течение этого срока, а работник не возвращён к работе, отстранение работника продолжается с выплатой ему заработной платы в полном размере до разрешения заявления; если в удовлетворении заявления отказано, работник возвращается к своей работе сразу по истечении последнего срока его отстранения.\n\nЕсли отстранение было произведено по одному из оснований, указанных в пункте 2 статьи (145) настоящего Трудового кодекса, и компетентный по предъявлению обвинения орган принял решение о прекращении расследования либо вынес постановление об отсутствии оснований для возбуждения уголовного дела, либо работник был предан уголовному суду и оправдан, работодатель обязан вернуть его к работе с выплатой ему невыплаченных причитающихся сумм за период отстранения; в противном случае невозвращение его к работе считается незаконным увольнением.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "148", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يكون الاختصاص بتوقيع جزاء الفصل من العمل للمحكمة العماليـة المختـصة ،\nويكون توقيع باقى الجزاءات التأديبية لـصاحب العمـل  ،أو مـن يفوضـه لـذلك ،\nويكون لمدير المنشأة توقيع جزائى الإنذار الكتابى  ،والخصم من الأجر لمدة لا تجاوز\nثلاثة أيام .\n\nوفى جميع الأحوال  ،لا يجوز فصل العامـل إلا إذا ارتكـب خطـأ جـسيما ،\nويعتبر من قبيل الخطأ الجسيم الحالات الآتية :\n-١إذا ثبت انتحال العامل شخصية غير صحيحة أو قدم مستندات مزورة .\n-٢إذا ثبت ارتكاب العامل لخطأ نشأت عنه أضرار جسيمة لـصاحب العمـل ،\nبشرط أن يبلغ صاحب العمل الجهات المختصة بالواقعة  ،أو الحـادث خـلال أربـع\nوعشرين ساعة من وقت علمه بوقوعه .\n-٣إذا ثبت تكرار عدم مراعاة العامل التعليمات اللازم اتباعها لسلامة العمـال ،\nأو المنشأة  ،بشرط أن تكون هذه التعليمات مكتوبة  ،ومعلنـة فـى مكـان ظـاهر ،\nرغم التنبيه عليه كتابة بمراعاة ذلك .\n-٤إذا ثبت أن العامل أفشى أسرار المنشأة التى يعمل بهـا  ،وأدى ذلـك إلـى\nإحداث أضرار جسيمة بالمنشأة .\n-٥إذا ثبت قيام العامل بمنافسة صاحب العمل فى ذات نشاطه .\n-٦إذا ثبت وجود العامل فى حالة سكر بين أو متأثرا بما تعاطاه من مادة مخدرة\nأثناء ساعات العمل .\n-٧إذا ثبت اعتداء العامل على صاحب العمل  ،أو المدير العام  ،وكذلك إذا وقع\nمنه اعتداء جسيم على أحد رؤسائه أثناء العمل  ،أو بسببه .\nوفى جميع الأحوال  ،لا يجوز الفصل من الخدمة إلا وفق ًا لأحكام هذا القانون .", "text_ru": "Компетенция по наложению взыскания в виде увольнения со службы принадлежит компетентному трудовому суду, а наложение остальных дисциплинарных взысканий относится к компетенции работодателя либо уполномоченного им лица; директор предприятия вправе налагать взыскания в виде письменного предупреждения и удержания из заработной платы на срок, не превышающий трёх дней.\n\nВ любом случае увольнение работника допускается только в случае совершения им грубого проступка; к грубым проступкам, в частности, относятся следующие случаи:\n1. установлен факт присвоения работником чужой личности либо представления им подложных документов;\n2. установлен факт совершения работником ошибки, повлёкшей причинение работодателю серьёзного ущерба, при условии, что работодатель уведомил компетентные органы о происшествии или случае в течение двадцати четырёх часов с момента, когда ему стало об этом известно;\n3. установлен факт неоднократного несоблюдения работником указаний, необходимых для соблюдения требований безопасности работников или предприятия, при условии, что эти указания были составлены в письменной форме, обнародованы в видном месте, и, несмотря на письменное предупреждение о необходимости их соблюдения, работник продолжал их нарушать;\n4. установлен факт разглашения работником производственной тайны предприятия, на котором он работает, повлёкшего причинение предприятию серьёзного ущерба;\n5. установлен факт осуществления работником деятельности, конкурирующей с деятельностью работодателя в той же сфере;\n6. установлен факт нахождения работника в состоянии явного алкогольного опьянения либо под воздействием употреблённого им наркотического вещества в течение рабочего времени;\n7. установлен факт нападения работника на работодателя или генерального директора, а равно совершения им серьёзного нападения на одного из своих руководителей во время работы или в связи с ней.\n\nВ любом случае увольнение со службы допускается только в соответствии с положениями настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "149", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "مع عدم الإخلال بحق التقاضي  ،إذا نشأ نزاع فردى بين صاحب العمل والعامـل\nبشأن تطبيق أحكام هذا القانون  ،أو أى من القوانين ذات الصلة كان لأى منهما خـلال\nعشرة أيام من تاريخ نشوء النزاع أن يطلب تسويته وديا بمعرفة لجنـة تـشكل علـى\nالنحو الآتي :\n-۱مدير مديرية العمل  ،أو من ينيبه )رئيسا( .\n-٢العامل  ،أو من يمثله )عضوا( .\n-٣صاحب العمل  ،أو من يمثله )عضوا( .\nولرئيس اللجنة أن يستعين بذوى الخبرة حسب الموضوع المعروض .\n\nويجب أن تنتهى اللجنة من أعمالها خلال واحد وعشرين يوما من تـاريخ تقـديم\nالطلب  ،فإذا تمت التسوية الودية  ،يثبت رئيس اللجنة ذلك فى محضر يوقعـه طرفـا\nالنزاع  ،ويلحق بمحضر الجلسة التى تم فيها  ،ويحال إلى قاضـى الأمـور الوقتيـة\nبالمحكمة العمالية المختصة  ،ويكون قابلا ً للتنفيذ بالأمر الذى يصدره وينتهى به النزاع\nفى حدود ما تمت التسوية الودية فيه .\nويصدر الوزير المختص قرارا بنظام عمل اللجنة والنمـاذج والـسجلات التـى\nتستعين بها .", "text_ru": "Без ущерба для права на судебную защиту, если между работодателем и работником возникает индивидуальный спор относительно применения положений настоящего Трудового кодекса либо любого из связанных с ним законов, каждый из них вправе в течение десяти дней со дня возникновения спора потребовать его мирного урегулирования комиссией, образуемой в следующем составе:\n1. директор управления труда либо его представитель (председатель);\n2. работник либо его представитель (член);\n3. работодатель либо его представитель (член).\n\nПредседатель комиссии вправе привлекать экспертов в соответствии с рассматриваемым вопросом.\n\nКомиссия обязана завершить свою работу в течение двадцати одного дня со дня подачи заявления; если достигнуто мирное урегулирование, председатель комиссии удостоверяет это в протоколе, подписываемом обеими сторонами спора, который приобщается к протоколу заседания, на котором оно было достигнуто, и передаётся судье по неотложным делам компетентного трудового суда; оно подлежит исполнению на основании выносимого им постановления, которым спор разрешается в пределах достигнутого мирового соглашения.\n\nКомпетентный министр издаёт решение о регламенте работы комиссии и формах и реестрах, которыми она пользуется.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "150", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "إذا لم تتم تسوية النزاع وديا يحرر رئيس اللجنة محضرا بما تم  ،ويوقع منه ومن\nطرفى النزاع  ،ويثبت ما تم من أعمال وما تلقته اللجنة مـن مـستندات ورأيهـا فـى\nموضوع النزاع  ،ويحال إلى المحكمة العمالية المختصة بناء على طلب أى من طرفيه ،\nويحدد قلم كتاب المحكمة جلسة لنظر النزاع فى مدة لا تجاوز عشرين يوما من تـاريخ\nورود الطلب  ،وعليه إعلان طرفى النزاع بها .\nفإذا كان موضوع النزاع يتعلق بفصل العامل  ،وجب على المحكمـة أن تفـصل\nفى هذا الطلب بصفة مستعجلة خلال ثلاثة أشهر من تـاريخ أول جلـسة  ،فـإذا رأت\nمن ظاهر الأوراق صحة طلب العامل  ،ألزمت صاحب العمل أن يؤدى إلـى العامـل\nما يعادل أجره من تاريخ الفصل  ،وبحد أقصى ستة أشهر  ،ويكون قرارها نهائيا .\nوتخصم المبالغ التى استوفاها العامل نفاذ ًا لقرار المحكمة مـن مبلـغ التعـويض\nالذى يحكم به أو أى مبالغ أخرى مستحقة له قبل صاحب العمل  ،مع مراعـاة نـص\nالمادة (١٤٣)من هذا القانون .\nفإذا كان فصل العامل بسبب النشاط النقابي  ،قضت المحكمة بإعادته إلـى عملـه\nإذا طلب ذلك .", "text_ru": "Если спор не урегулирован мирным путём, председатель комиссии составляет протокол о проделанной работе, подписываемый им и обеими сторонами спора, в котором фиксируются произведённые действия, полученные комиссией документы и её мнение по предмету спора; дело передаётся в компетентный трудовой суд по заявлению любой из сторон; канцелярия суда назначает заседание для рассмотрения спора в срок, не превышающий двадцати дней со дня поступления заявления, и обязана уведомить об этом обе стороны спора.\n\nЕсли предмет спора связан с увольнением работника, суд обязан разрешить это заявление в срочном порядке в течение трёх месяцев со дня первого заседания; если из представленных материалов дела суду очевидна обоснованность требования работника, он обязывает работодателя выплатить работнику сумму, эквивалентную его заработной плате со дня увольнения, но не более чем за шесть месяцев, и его решение является окончательным.\n\nСуммы, полученные работником во исполнение решения суда, засчитываются в счёт суммы компенсации, присуждённой судом, либо любых иных сумм, причитающихся ему от работодателя, с учётом положения статьи (143) настоящего Трудового кодекса.\n\nЕсли увольнение работника произведено по причине профсоюзной деятельности, суд выносит решение о его возвращении на работу, если он об этом просит.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "151", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "إذا تسبب العامل بخطئه  ،أو بمناسبة عمله فى فقد  ،أو إتلاف مهمات  ،أو آلات\nأو خامات  ،أو منتجات أو غيرها  ،يملكها صاحب العمل  ،أو كانت فى عهدته التـزم\nبأداء قيمة ما فقد  ،أو أتلف .\n\nولصاحب العمل بعد إجراء التحقيق وإخطار العامـل أن يبـدأ باقتطـاع المبلـغ\nالمشار إليه من أجره  ،على ألا يزيد ما يقتطع لهذا الغرض على أجـر خمـسة أيـام\nفى الشهر الواحد .\nويجوز للعامل أن يتظلم أمام المحكمة العمالية المختصة من تقدير صاحب العمـل\nوفق ًا للمدد والإجراءات المحددة فى هذا القانون .\nفإذا لم يقض لصاحب العمل بالمبلغ الذى قدره ،للإتلاف أو قضى له بأقل منـه ،\nوجب عليه رد ما اقتطع دون وجه حق خلال سبعة أيام من تاريخ صدور الحكم .\nولا يجوز لصاحب العمل أن يستوفى مستحقاته بطريق الاقتطاع وفق ًا لحكم هـذه\nالمادة  ،فيما زاد على أجر شهرين .", "text_ru": "Если работник по своей вине либо в связи со своей работой становится причиной утраты или порчи оборудования, механизмов, сырья, продукции или иного имущества, принадлежащего работодателю либо находящегося в его ведении, он обязан возместить стоимость утраченного или испорченного имущества.\n\nРаботодатель вправе после проведения расследования и уведомления работника приступить к удержанию указанной суммы из его заработной платы, при условии, что удерживаемая для этой цели сумма не превышает заработную плату за пять дней в течение одного месяца.\n\nРаботник вправе обжаловать оценку работодателя в компетентном трудовом суде в сроки и в порядке, установленные настоящим Трудовым кодексом.\n\nЕсли сумма, определённая работодателем в связи с порчей имущества, не будет присуждена ему судом либо будет присуждена в меньшем размере, он обязан вернуть неправомерно удержанное в течение семи дней со дня вынесения решения.\n\nРаботодателю не разрешается получать причитающиеся ему суммы путём удержания в соответствии с положением настоящей статьи в части, превышающей заработную плату за два месяца.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "152", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "لا تخل الأحكام الواردة بهذا الفصل بالضمانات المقررة بقانون المنظمات النقابيـة\nالعمالية وحماية حـق التنظـيم النقـابى المـشار إليـه  ،لأعـضاء مجـالس إدارات\nالمنظمات النقابية .", "text_ru": "Положения настоящей главы не затрагивают гарантий, установленных упомянутым Законом о профсоюзных организациях работников и защите права на профсоюзную организацию, для членов советов директоров профсоюзных организаций.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "153", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السادس", "chapter_title": "واجبات العمال ومساءلتهم", "text": "يجب على صاحب العمل أن يمسك سجلا ً ورقيا أو إلكترونيـا لقيـد الجـزاءات\nالمالية الموقعة على العمال  ،مع بيان سبب توقيعها واسـم العامـل ومقـدار أجـره ،\nوأن يفرد لحصيلتها حسابا خاصا للـصرف علـى عمـال المنـشأة فـى الأغـراض\nالاجتماعية والثقافية والرياضية  ،ولا يجوز صرف هذه المبـالغ للوفـاء بالالتزامـات\nالمنصوص عليها فى المادة (٢٧٢)من هذا القانون وتوزع حصيلة تلك الأموال عنـد\nتصفية المنشأة بالتساوى على العمال الموجودين بها وقت التصفية .", "text_ru": "Работодатель обязан вести бумажный или электронный реестр для регистрации денежных взысканий, налагаемых на работников, с указанием основания их наложения, имени работника и размера его заработной платы; он обязан выделить для сумм этих взысканий специальный счёт для расходования в пользу работников предприятия на социальные, культурные и спортивные цели; расходование этих сумм в счёт исполнения обязательств, предусмотренных статьёй (272) настоящего Трудового кодекса, не допускается; при ликвидации предприятия остаток этих средств распределяется поровну между работниками, состоящими на нём на момент ликвидации.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава шестая", "chapter_title_ru": "Обязанности работников и их ответственность"}, {"number": "154", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "مع عدم الإخلال بما نصت عليه المواد (٩٥) ، ۸۸ ، ۸۷مـن هـذا القـانون ،\nينتهى عقد العمل محدد المدة بانقضاء مدته .\n\nفإذا أبرم العقد أو جدد لمدة تزيد على خمس سنوات  ،جاز للعامـل إنهـاؤه دون\nتعويض عند انقضاء خمس سنوات  ،وذلك بعد إخطار صاحب العمـل قبـل الإنهـاء\nبثلاثة أشهر .\nوتسرى أحكام الفقرة الثانية من هذه المادة على حالات إنهاء العامل للعقـد بعـد\nانقضاء المدة المذكورة .\nفإذا كان الإنهاء من جانب صاحب العمل استحق العامل مكافأة تعادل أجر شـهر\nعن كل سنة من سنوات الخدمة .", "text_ru": "Без ущерба для положений статей (87), (88) и (95) настоящего Трудового кодекса, срочный трудовой договор прекращается по истечении его срока.\n\nЕсли договор заключён или продлён на срок, превышающий пять лет, работник вправе прекратить его без выплаты компенсации по истечении пяти лет, уведомив об этом работодателя за три месяца до прекращения.\n\nПоложения второго абзаца настоящей статьи применяются к случаям прекращения договора работником по истечении указанного срока.\n\nЕсли прекращение производится работодателем, работник имеет право на вознаграждение в размере месячной заработной платы за каждый год службы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "155", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "إذا أبرم عقد العمل لإنجاز عمل معين  ،انتهى العقد بإنجاز هذا العمل  ،ويجـوز\nتجديده باتفاق صريح بين طرفيه  ،وذلك لعمل أو أعمال أخرى مماثلة .\nفإذا انتهى العقد المبرم لإنجاز عمل معين واستمر طرفاه فى تنفيذه  ،اعتبر ذلـك\nتجديدا منهما لهذا العقد  ،أو أعمال أخرى مماثلة .\nفإذا استغرق إنجاز العمل الأصلي  ،أو الأعمال التى جدد لها لأكثر مـن خمـس\nسنوات  ،لا يجوز للعامل إنهاء العقد قبل تمام إنجاز هذه الأعمال .", "text_ru": "Если трудовой договор заключён для выполнения определённой работы, договор прекращается с выполнением этой работы; он может быть продлён по прямому соглашению сторон для выполнения той же или иной аналогичной работы.\n\nЕсли срок договора, заключённого для выполнения определённой работы, истёк, а стороны продолжили его исполнение, это считается продлением ими этого договора либо иной аналогичной работы.\n\nЕсли выполнение первоначальной работы либо работ, для которых договор был продлён, занимает более пяти лет, работник не вправе прекратить договор до полного завершения этих работ.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "156", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "مع عدم الإخلال بأحكام المادة (١٦٥)من هذا القانون إذا كان عقد العمـل غيـر\nمحدد المدة  ،جاز لأى من طرفيه إنهاؤه بشرط أن يخطر الطرف الآخر كتابـة قبـل\nالإنهاء بثلاثة أشهر .", "text_ru": "Без ущерба для положений статьи (165) настоящего Трудового кодекса, если трудовой договор заключён на неопределённый срок, любая из сторон вправе прекратить его при условии письменного уведомления другой стороны за три месяца до прекращения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "157", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "مع عدم الإخلال بحكم المادة (٢٣٥)من هذا القانون  ،ومع مراعاة أحكام المـواد\nمن ) ١٥٨إلى  (١٧٥من هذا القانون  ،لا يجوز لأصحاب الأعمال والعمال إنهاء عقد\nالعمل غير محدد المدة  ،إلا بمبرر مشروع وكاف .\nويراعى فى جميع الأحوال  ،أن يتم الإنهاء فى وقت مناسب لظروف العمل .", "text_ru": "Без ущерба для положения статьи (235) настоящего Трудового кодекса и с учётом положений статей (158)–(175) настоящего Трудового кодекса, работодателям и работникам не разрешается прекращать трудовой договор, заключённый на неопределённый срок, иначе как при наличии законного и достаточного основания.\n\nВ любом случае учитывается, чтобы прекращение производилось в момент, подходящий для условий производства.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "158", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لا يجوز تعليق الإخطار بالإنهاء على شرط واقف  ،أو فاسخ .\nويبدأ سريان مهلة الإخطار من تاريخ تسلمه .", "text_ru": "Уведомление о прекращении не может быть поставлено в зависимость от отлагательного или отменительного условия. Течение срока уведомления начинается со дня его получения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "159", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لا يجوز توجيه الإخطار للعامل خلال إجازاته  ،ولا تحتـسب مهلـة الإخطـار\nإلا من اليوم التالى لانتهاء الإجازة  ،وإذا حصل العامل على إجـازة مرضـية خـلال\nمهلة الإخطار يوقف سريان هذه المهلة ولا يبدأ سريانها من جديد إلا من اليوم التـالى\nلانتهاء تلك الإجازة .", "text_ru": "Направление уведомления работнику во время его отпусков не допускается; срок уведомления исчисляется только со дня, следующего за окончанием отпуска; если работник получает отпуск по болезни в течение срока уведомления, течение этого срока приостанавливается и возобновляется только со дня, следующего за окончанием этого отпуска.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "160", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "يظل عقد العمل قائما طوال مهلة الإخطار  ،ويلتزم طرفاه بتنفيذ جميع الالتزامات\nالناشئة عنه وينتهى العقد بانقضاء هذه المهلة .", "text_ru": "Трудовой договор остаётся действующим в течение всего срока уведомления; обе его стороны обязаны исполнять все вытекающие из него обязательства; договор прекращается по истечении этого срока.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "161", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لا يجوز الاتفاق على الإعفاء من شرط الإخطار أو تخفـيض مدتـه  ،ويجـوز\nالاتفاق على زيادة هذه المدة .\nويجوز لصاحب العمل إعفاء العامل من مراعاة مهلة الإخطار كلها  ،أو بعـضها\nفى حالة إنهاء العقد من جانب العامل .", "text_ru": "Соглашение об освобождении от условия уведомления или сокращении его срока не допускается; допускается соглашение об увеличении этого срока.\n\nРаботодатель вправе освободить работника от соблюдения срока уведомления полностью или частично в случае прекращения договора со стороны работника.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "162", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "إذا كان الإخطار بالإنهاء من جانب صاحب العمل  ،يحق للعامل أن يتغيب يومـا\nكاملا ً فى الأسبوع أو ثمانى ساعات أثناء الأسبوع  ،وذلك للبحث عن عمل آخـر مـع\nاستحقاقه لأجره عن يوم أو ساعات الغياب .\nويكون للعامل تحديد يوم الغياب  ،أو ساعاته  ،بشرط أن يخطر صاحب العمـل\nبذلك فى اليوم السابق للغياب على الأقل .", "text_ru": "Если уведомление о прекращении сделано работодателем, работник имеет право отсутствовать один полный день в неделю либо восемь часов в течение недели для поиска другой работы, с сохранением за ним права на заработную плату за этот день или часы отсутствия.\n\nРаботник вправе самостоятельно определить день своего отсутствия либо его часы при условии уведомления работодателя об этом не позднее чем накануне дня отсутствия.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "163", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لصاحب العمل أن يعفى العامل من العمل أثناء مهلة الإخطار  ،مع احتساب مـدة\nخدمة العامل مستمرة إلى حين انتهاء تلك المهلة  ،مع ما يترتب على ذلك من آثـار ،\nوبخاصة استحقاق العامل أجره عن هذه المهلة .", "text_ru": "Работодатель вправе освободить работника от работы в течение срока уведомления, при этом стаж службы работника считается непрерывным вплоть до истечения этого срока со всеми вытекающими из этого последствиями, в частности с сохранением права работника на заработную плату за этот срок.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "164", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "إذا أنهى صاحب العمل عقد العمل غير محدد المدة دون إخطار أو قبل انقـضاء\nمهلة الإخطار  ،يلتزم بأن يؤدى للعامل مبلغ ًا يعادل أجره عن مدة المهلة  ،أو الجـزء\nالباقى منها .\nوفى هـذه الحالـة تحـسب مـدة المهلـة  ،أو الجـزء البـاقى منهـا ضـمن\nمدة خدمة العامل  ،ويستمر صاحب العمل فى تحمل الأعباء  ،والالتزامـات المترتبـة\nعلى ذلك  ،أما إذا كان الإنهاء صادرا من جانب العامل فإن العقد ينتهـى مـن وقـت\nتركه العمل .", "text_ru": "Если работодатель прекращает трудовой договор, заключённый на неопределённый срок, без уведомления либо до истечения срока уведомления, он обязан выплатить работнику сумму, эквивалентную его заработной плате за срок уведомления либо оставшуюся его часть.\n\nВ этом случае срок уведомления либо оставшаяся его часть засчитывается в стаж службы работника, а работодатель продолжает нести связанные с этим обязанности и обязательства; если же прекращение произведено работником, договор прекращается с момента оставления им работы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "165", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "إذا أنهى صاحب العمل العقد غير محدد المدة لسبب غير مشروع  ،كان للعامـل\nالحق فى تعويض عما أصابه من ضرر بسبب هذا الإنهاء بما لا يقل عن أجر شهرين\nعن كل سنة من سنوات الخدمة  ،ولا يخل ذلك بحق العامل فى المطالبة بباقى حقوقـه\nالمقررة قانون ًا .\nويعتبر من الأسباب غير المشروعة ما يأتي :\n-١انتساب العامل إلى منظمة نقابية  ،أو مشاركته فى نشاط نقـابى فـى نطـاق\nهذا القانون .\n-٢ممارسة صـفة المفـوض العمـالي  ،أو سـبق ممارسـة هـذه الـصفة ،\nأو السعى إلى ذلك .\n-٣تقديم شكوى  ،أو إقامة دعوى ضد صاحب العمل  ،أو المشاركة فى ذلـك ،\nتظلما من إخلاله بالقوانين  ،أو اللوائح  ،أو عقود العمل .\n-٤توقيع الحجز على مستحقات العامل تحت يد صاحب العمل .\n-٥استخدام العامل لحقه فى الإجازات الممنوحة له طبق ًا لأحكام هذا القانون .\n-٦اللون  ،أو الجـنس  ،أو الحالـة الاجتماعيـة  ،أو المـسئوليات العائليـة ،\nأو الحمل أو الدين أو الرأى السياسي .", "text_ru": "Если работодатель прекращает договор, заключённый на неопределённый срок, по незаконному основанию, работник имеет право на компенсацию причинённого ему этим прекращением ущерба в размере не менее двухмесячной заработной платы за каждый год службы; это не затрагивает права работника требовать иные причитающиеся ему по закону права.\n\nНезаконными основаниями, в частности, считаются:\n1. членство работника в профсоюзной организации либо его участие в профсоюзной деятельности в рамках настоящего Трудового кодекса;\n2. исполнение функций уполномоченного представителя работников, предыдущее исполнение таких функций либо стремление к этому;\n3. подача жалобы или предъявление иска к работодателю либо участие в этом в порядке обжалования его нарушений законов, регламентов или трудовых договоров;\n4. наложение ареста на причитающиеся работнику суммы, находящиеся у работодателя;\n5. использование работником своего права на отпуска, предоставляемые ему в соответствии с положениями настоящего Трудового кодекса;\n6. цвет кожи, пол, семейное положение, семейные обязанности, беременность, религия или политические убеждения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "166", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "يعتبر العامل مستقيلا ً من العمل إذا تغيب بدون مبرر مشروع أكثر من عـشرين\nيوما متقطعة خلال السنة الواحدة  ،أو أكثر من عشرة أيام متتالية  ،على أن يسبق ذلك\nإنذار بخطاب موصى عليه بعلم الوصول من صاحب العمل  ،أو من يمثلـه  ،للعامـل\nبعد غيابه عشرة أيام فى الحالة الأولى  ،وخمسة أيام فى الحالة الثانية .", "text_ru": "Работник считается уволившимся по собственному желанию, если он отсутствует без уважительной причины более двадцати дней с перерывами в течение одного года либо более десяти дней подряд, при условии, что этому предшествовало предупреждение, направленное работнику заказным письмом с уведомлением о вручении работодателем или его представителем, после десяти дней отсутствия в первом случае и пяти дней — во втором.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "167", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "للعامل أن يقدم استقالته كتابة لصاحب العمل بشرط أن تكون موقعة مـن العامـل\nأو من وكيله الخاص  ،ومعتمدة من الجهة الإدارية المختصة .\nولا تنتهى خدمة العامل إلا بالقرار الصادر بقبول الاستقالة  ،وعلـى العامـل أن\nيستمر فى العمل إلى أن تبت جهة عمله فى الاستقالة خلال عشرة أيـام مـن تـاريخ\nتقديمها  ،وإلا اعتبرت مقبولة بفوات هذه المدة  ،وللعامل المستقيل أو وكيلـه الخـاص\nالعدول عن الاستقالة خلال عشرة أيام من تـاريخ إخطـاره بقبـول صـاحب العمـل\nالاستقالة على أن يكون هذا العدول مكتوبا ومعتمدا من الجهـة الإداريـة المختـصة ،\nوفى هذه الحالة تعتبر الاستقالة كأن لم تكن .", "text_ru": "Работник вправе подать работодателю письменное заявление об увольнении по собственному желанию при условии, что оно подписано работником или его специальным представителем и заверено компетентным административным органом.\n\nСлужба работника не прекращается иначе как решением о принятии заявления об увольнении; работник обязан продолжать работу до тех пор, пока его место работы не примет решение по заявлению об увольнении в течение десяти дней со дня его подачи, — в противном случае заявление считается принятым по истечении этого срока; работник, подавший заявление об увольнении, или его специальный представитель вправе отказаться от заявления об увольнении в течение десяти дней со дня уведомления его о принятии работодателем заявления об увольнении, при условии, что такой отказ совершён в письменной форме и заверен компетентным административным органом; в этом случае заявление об увольнении считается несостоявшимся.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "168", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "للعامل إنهاء العقد إذا أخل صاحب العمل بالتزام من التزاماته الجوهرية الناشـئة\nعن هذا القانون  ،أو عقد العمل الفردى أو الجمـاعى  ،أو لائحـة النظـام الأساسـى\nللمنشأة  ،أو إذا وقع على العامل  ،أو أحـد ذويـه اعتـداء مـن صـاحب العمـل ،\nأو ممن يمثله .\nويعتبر الإنهاء فى هذه الحالات بمثابة إنهاء للعقد من جانب صاحب العمل بغيـر\nمبرر مشروع .", "text_ru": "Работник вправе прекратить договор, если работодатель нарушил одно из своих существенных обязательств, вытекающих из настоящего Трудового кодекса, индивидуального или коллективного трудового договора либо регламента основных положений предприятия, либо если в отношении работника или одного из членов его семьи было совершено нападение со стороны работодателя или его представителя.\n\nПрекращение в этих случаях считается прекращением договора со стороны работодателя без законного основания.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "169", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "ينتهى عقد العمل بوفاة العامل حقيقة  ،أو حكما  ،طبق ًا للقواعد القانونية المقررة ،\nولا ينتهى عقد العمل بوفاة صاحب العمل  ،إلا إذا كان قد أبـرم لاعتبـارات تتعلـق\nبشخص صاحب العمل  ،أو بنشاطه الذى ينقطع بوفاته .\n\nفإذا توفى العامل وهو فى الخدمة  ،يصرف صاحب العمل لأسرته ما يعادل أجر\nشهرين طبق ًا لآخر أجر تقاضاه لمواجهة نفقات الجنازة  ،تصرف للأرمل  ،فـإذا لـم\nيوجد صرفت لأرشد الأولاد  ،أو إلى أى شخص يثبت قيامه بتحمل نفقات الجنـازة ،\nوذلك بحد أدنى ألف جنيه .\nكما تصرف منحة تعادل أجر العامل عن الشهر الذى توفى فيه والشهرين التاليين\nله  ،وذلك بالإضافة إلى الأجر المستحق عن أيام العمل خلال شهر الوفـاة  ،تـصرف\nطبق ًا لأحكام قانون التأمينات الاجتماعية والمعاشات المشار إليه .\nويلتزم صاحب العمل بنفقات تجهيز ونقل الجثمان إلى الجهة التى استقدم العامـل\nمنها  ،أو الجهة التى تطلب أسرته نقله إليها .", "text_ru": "Трудовой договор прекращается смертью работника, фактической или объявленной в судебном порядке, в соответствии с установленными правовыми нормами; трудовой договор не прекращается смертью работодателя, если только он не был заключён исходя из соображений, связанных с личностью работодателя или с его деятельностью, которая прекращается его смертью.\n\nЕсли работник умирает во время нахождения на службе, работодатель выплачивает его семье сумму, эквивалентную двухмесячной заработной плате исходя из последней полученной им заработной платы, на покрытие расходов на похороны; эта сумма выплачивается вдове (вдовцу), а при её (его) отсутствии — старшему из детей либо любому лицу, доказавшему, что оно понесло расходы на похороны, при этом минимальный размер составляет одну тысячу фунтов.\n\nТакже выплачивается пособие, эквивалентное заработной плате работника за месяц, в котором он умер, и два последующих месяца, помимо заработной платы, причитающейся за отработанные дни в месяц смерти; оно выплачивается в соответствии с положениями упомянутого Закона о социальном страховании и пенсиях.\n\nРаботодатель обязан нести расходы по подготовке и перевозке тела в место, откуда работник был приглашён, либо в место, куда его семья попросит его перевезти.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "170", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "مع عدم الإخلال بأحكام قانون التأمينات الاجتماعية والمعاشـات المـشار إليـه ،\nينتهى عقد العمل بعجز العامل عن تأدية عمله عجزا كليا  ،أيا كان سبب هذا العجز .\nفإذا كان عجز العامل عجزا جزئيا  ،فلا تنتهى علاقة العمل بهذا العجـز  ،إلا إذا\nثبت عدم وجود عمل آخر  ،لدى صاحب العمل  ،يستطيع العامل أن يقـوم بـه علـى\nوجه مرض .\nوإذا ثبت وجود هذا العمل الآخر  ،كان على صاحب العمل بنـاء علـى طلـب\nالعامل كتابة  ،أن ينقله إلى ذلك العمل .", "text_ru": "Без ущерба для положений упомянутого Закона о социальном страховании и пенсиях, трудовой договор прекращается в связи с полной утратой работником трудоспособности для выполнения своей работы, независимо от причины этой утраты трудоспособности.\n\nЕсли утрата трудоспособности работника является частичной, трудовое отношение не прекращается в связи с этой утратой трудоспособности, если только не будет установлено отсутствие у работодателя другой работы, которую работник в состоянии выполнять удовлетворительным образом.\n\nЕсли будет установлено наличие такой другой работы, работодатель обязан на основании письменного заявления работника перевести его на эту работу.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "171", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لا يجوز تحديد سن للتقاعد تقل عن ستين سنة .\nويجوز لصاحب العمل إنهاء العقد إذا بلغ العامل سن الستين  ،ما لم يكـن العقـد\nمحدد المدة  ،وكانت مدته تمتد إلى ما بعد بلوغه هذه السن  ،وفى هذه الحالة لا ينتهـى\nالعقد إلا بانقضاء مدته .\nوتطبق أحكام قانون التأمينات الاجتماعية والمعاشات المشار إليـه فيمـا يتعلـق\nبسن استحقاق المعاش .", "text_ru": "Установление пенсионного возраста менее шестидесяти лет не допускается.\n\nРаботодатель вправе прекратить договор, если работник достиг шестидесятилетнего возраста, если только договор не заключён на определённый срок, продолжающийся после достижения им этого возраста, — в этом случае договор прекращается только по истечении его срока.\n\nПоложения упомянутого Закона о социальном страховании и пенсиях применяются в отношении возраста наступления права на пенсию.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "172", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "يستحق العامل عن مدة عمله بعد سن الستين  ،مكافأة بواقع أجر نصف شهر عن\nكل سنة من السنوات الخمس الأولى من الخدمة  ،وأجر شهر عـن كـل سـنة مـن\nالسنوات التالية لها  ،وذلك إذا لم تكن له حقوق عن هذه المدة  ،وفق ًـا لأحكـام تـأمين\nالشيخوخة  ،والعجز  ،والوفاة المنصوص عليها فـى قـانون التأمينـات الاجتماعيـة\nوالمعاشات المشار إليه .\nوتستحق هذه المكافأة عن سنوات الخدمة السابقة علـى سـن الثامنـة عـشرة ،\nوذلك للمتدرج والعامل عند بلوغ هذه السن .\nوتحسب المكافأة على أساس آخر أجر كان يتقاضاه العامل  ،أو المتدرج حسب الأحوال .\nوتصرف المكافأة فى حالة استحقاقها للوفـاة وفق ًـا لأحكـام قـانون التأمينـات\nالاجتماعية والمعاشات المشار إليه .", "text_ru": "Работник имеет право за период своей работы после достижения шестидесятилетнего возраста на вознаграждение в размере половины месячной заработной платы за каждый год из первых пяти лет службы и месячной заработной платы за каждый последующий год, — если у него отсутствуют права за этот период в соответствии с положениями о страховании по старости, инвалидности и на случай смерти, предусмотренными упомянутым Законом о социальном страховании и пенсиях.\n\nЭто вознаграждение причитается также за годы службы, предшествующие достижению восемнадцатилетнего возраста, — для ученика и работника по достижении ими этого возраста.\n\nВознаграждение исчисляется исходя из последней заработной платы, получаемой работником или учеником, в зависимости от обстоятельств.\n\nВ случае возникновения права на это вознаграждение в связи со смертью оно выплачивается в соответствии с положениями упомянутого Закона о социальном страховании и пенсиях.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "173", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "يحظر على صاحب العمل إنهاء عقد العامـل لمـرض العامـل  ،إلا إذا اسـتنفد\nإجازاته المرضية  ،وما تبقى من متجمد إجازاته السنوية المستحقة له  ،وذلك مع عـدم\nالإخلال بأحكام قانون التأمينات الاجتماعية والمعاشات المشار إليه .\nوعلى صاحب العمل أن يخطر العامل برغبته فى إنهاء العقد قبل مضى خمـسة\nعشر يوما من تاريخ استنفاد العامل لإجازاته .\nفإذا شفى العامل قبل تمام الإخطار  ،امتنع على صـاحب العمـل إنهـاء العقـد\nلمرض العامل .", "text_ru": "Работодателю запрещается прекращать договор работника по причине его болезни, если только он не исчерпал свои отпуска по болезни и остаток накопленных причитающихся ему ежегодных отпусков, без ущерба для положений упомянутого Закона о социальном страховании и пенсиях.\n\nРаботодатель обязан уведомить работника о своём намерении прекратить договор не позднее пятнадцати дней со дня исчерпания работником своих отпусков.\n\nЕсли работник выздоровеет до завершения срока уведомления, работодателю запрещается прекращать договор по причине болезни работника.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "174", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "لصاحب العمل أن ينهى عقد العمل ولو كان محدد المدة  ،أو مبرما لإنجاز عمـل\nمعين إذا حكم نهائيا على العامل بعقوبة جناية أو بعقوبة مقيدة للحرية فى جريمة ماسة\nبالشرف أو الأمانة  ،وذلك ما لم تأمر المحكمة بوقف تنفيذ العقوبة .", "text_ru": "Работодатель вправе прекратить трудовой договор, даже если он заключён на определённый срок либо для выполнения определённой работы, если работник окончательно осуждён к наказанию за преступление либо к наказанию, связанному с лишением свободы, за деяние, порочащее честь или добросовестность, — если только суд не постановит об отсрочке исполнения наказания.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глав
