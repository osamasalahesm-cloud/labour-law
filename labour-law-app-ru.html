لضرورات اقتصادية  ،الإغلاق الكلى أو الجزئى للمنـشأة ،\nأو تقليص حجمها أو نشاطها  ،بما قد يمس حجم العمالة بها على نحو مؤقت أو دائم ،\nوذلك فى الأوضاع  ،وبالشروط والإجراءات المنصوص عليها فى هذا القانون .", "text_ru": "Работодатель вправе по экономическим причинам произвести полное или частичное закрытие предприятия либо сократить его размер или деятельность, что может затронуть численность занятых на нём работников временно или постоянно, в порядке, на условиях и в соответствии с процедурами, предусмотренными настоящим Трудовым кодексом.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "237", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "فى تطبيق أحكام المادة (٢٣٦)من هذا القانون  ،يجب على صـاحب العمـل أن\nيتقدم بطلب إغلاق المنشأة  ،أو تقليص حجمها  ،أو نشاطها إلى لجنـة تـشكل لهـذا\nالغرض  ،ويجب أن يتضمن الطلب الأسباب  ،والأوضاع  ،والشروط والإجـراءات ،\nالتى يستند إليها فى ذلك  ،وأعداد  ،وفئات العمال الذين سيتم الاستغناء عنهم .\n\nوعلى اللجنة أن تصدر قرارها مسببا خلال خمسة وأربعين يومـا علـى الأكثـر\nمن تاريخ تقديم الطلب إليها  ،فإذا كان القرار صادرا بقبول الطلـب وجـب أن يحـدد\nموعد تنفيذه .\nفإذا لم تصدر اللجنة قرارها خلال المدة المشار إليها  ،اعتبر ذلك موافقة ضـمنية\nعلى الإغلاق بالأوضاع والشروط والإجراءات التى تقدم بها صاحب العمل .\nولصاحب الشأن أن يتظلم من قرار اللجنة أمام لجنة أخرى تشكل لهذا الغـرض ،\nويترتب على قبول التظلم وقف تنفيذ قرار اللجنة .\nويصدر رئيس مجلس الوزراء قرارا بتشكيل كل من اللجنتـين المـشار إليهمـا\nفى هذه المادة  ،وتحديد اختصاصاتهما  ،والجهات التى تمثل فيهما  ،والإجراءات التى\nتتبع أمامهما  ،ومواعيد  ،وإجراءات الـتظلم  ،علـى أن يتـضمن تـشكيلهما ممـثلا ً\nعن المنظمة النقابية العمالية المعنية  ،وممثلا ً عن منظمة أصـحاب الأعمـال المعنيـة\nترشحه كل منهما .", "text_ru": "При применении положений статьи (236) настоящего Трудового кодекса работодатель обязан подать заявление о закрытии предприятия либо сокращении его размера или деятельности в комиссию, образуемую для этой цели; заявление должно содержать причины, обстоятельства, условия и процедуры, на которые он ссылается, а также число и категории работников, которые будут уволены.\n\nКомиссия обязана вынести мотивированное решение не позднее чем в течение сорока пяти дней со дня подачи ей заявления; если решение принято об удовлетворении заявления, в нём должен быть определён срок его исполнения.\n\nЕсли комиссия не вынесет своё решение в указанный срок, это считается молчаливым согласием на закрытие на условиях и в порядке, предложенных работодателем.\n\nЗаинтересованное лицо вправе обжаловать решение комиссии в другую комиссию, образуемую для этой цели; принятие жалобы к рассмотрению влечёт приостановление исполнения решения комиссии.\n\nПредседатель Совета министров издаёт решение об образовании обеих комиссий, указанных в настоящей статье, определении их компетенции, представленных в них органов, процедур, которым они следуют, а также сроков и порядка обжалования; в их состав должны входить представитель соответствующей профсоюзной организации работников и представитель соответствующей организации работодателей, выдвигаемые каждой из них.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "238", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يخطر صاحب العمل العمال  ،والمنظمة النقابية العمالية المعنية بالطلـب المقـدم\nمنه  ،وبالقرار الصادر بالإغلاق الكلى  ،أو الجزئى للمنشأة  ،أو بتقلـيص حجمهـا ،\nأو نشاطها  .ويكون تنفيذ ذلك القرار اعتبارا من التاريخ الـذى تحـدده اللجنـة التـى\nنظرت الطلب  ،أو التظلم على حسب الأحوال .", "text_ru": "Работодатель уведомляет работников и соответствующую профсоюзную организацию работников о поданном им заявлении и о решении о полном или частичном закрытии предприятия либо сокращении его размера или деятельности; исполнение этого решения производится начиная с даты, определённой комиссией, рассмотревшей заявление либо жалобу, в зависимости от обстоятельств.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "239", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "فى حالة الإغلاق الجزئى أو تقليص حجم المنشأة أو نـشاطها  ،إذا لـم تتـضمن\nالاتفاقية الجماعية السارية فى المنشأة المعايير الموضوعية لاختيار من سيتم الاسـتغناء\nعنهم من العمال  ،يتعين على صاحب العمل أن يتشاور فى هذا الشأن مـع المنظمـة\nالنقابية العمالية المعنية  ،وذلك بعد صدور القرار وقبل التنفيذ .\nوتعتبر الأقدمية  ،والأعباء العائلية  ،والسن  ،والقدرات والمهارات المهنية للعمال\nمن المعايير التى يمكن الاسترشاد بها فى هذا الشأن .\nويصدر الوزير المختص قرارا بالمعايير الموضوعية لاختيار من سيتم الاستغناء\nعنهم من العمال  ،وذلك بالتشاور مع منظمات العمال وأصحاب الأعمال .", "text_ru": "В случае частичного закрытия либо сокращения размера или деятельности предприятия, если действующий на предприятии коллективный трудовой договор не содержит объективных критериев отбора работников, подлежащих увольнению, работодатель обязан провести консультации по этому вопросу с соответствующей профсоюзной организацией работников после вынесения решения и до его исполнения.\n\nСтаж работы, семейное положение, возраст, способности и профессиональные навыки работников считаются критериями, которыми можно руководствоваться в этом вопросе.\n\nКомпетентный министр издаёт решение об объективных критериях отбора работников, подлежащих увольнению, в консультации с организациями работников и работодателей.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "240", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يحظر على صاحب العمل التقدم بطلب الإغلاق الكلـى أو الجزئـى للمنـشأة ،\nأو تقليص حجمها أو نشاطها أثناء مراحل تسوية منازعات العمـل الجماعيـة  ،كمـا\nيحظر عليه أن يتقدم بهذا الطلب بسبب أو أثناء إضراب العمال عن العمل .", "text_ru": "Работодателю запрещается подавать заявление о полном или частичном закрытии предприятия либо сокращении его размера или деятельности в ходе этапов урегулирования коллективных трудовых споров, а также запрещается подавать такое заявление по причине забастовки работников либо во время неё.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "241", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "مع عدم الإخلال بحكم المادة (٢٣٨)من هذا القانون  ،فى الحالات التـى يحـق\nفيها لصاحب العمل إنهاء عقد العمل لأسباب اقتصادية يجوز له بدلا ً من استخدام هـذا\nالحق أن يعدل من شروط العقد بصفة مؤقتة  ،وله على الأخص أن يكلف العامل بعمل\nغير متفق عليه  ،ولو كان يختلف عن عمله الأصلى كما له أن يخفض أجر العامل بما\nلا يقل عن الحد الأدنى للأجور .\nفإذا قام صاحب العمل بتعديل شروط العقد وفق ًا للفقرة الأولى من هذه المادة جـاز\nللعامل أن ينهى عقد العمل دون أن يلتزم بالإخطار  ،ويعتبر الإنهاء فى هـذه الحالـة\nإنهاء مبررا من جانب صاحب العمل والعامل .\nوفى جميع الأحوال  ،يستحق العامل مكافأة تعادل أجر شـهر عـن كـل سـنة\nمن السنوات الخمس الأولى من سنوات الخدمة وشهر ونصف الشهر عن كـل سـنة\nتجاوز ذلك .", "text_ru": "Без ущерба для положения статьи (238) настоящего Трудового кодекса, в случаях, когда работодатель имеет право прекратить трудовой договор по экономическим причинам, он вправе вместо использования этого права временно изменить условия договора; в частности, он вправе поручить работнику работу, не согласованную сторонами, даже если она отличается от его первоначальной работы, а также вправе снизить заработную плату работника, но не менее минимального размера заработной платы.\n\nЕсли работодатель изменяет условия договора в соответствии с первым абзацем настоящей статьи, работник вправе прекратить трудовой договор без обязанности уведомления; прекращение в этом случае считается обоснованным как со стороны работодателя, так и со стороны работника.\n\nВ любом случае работник имеет право на вознаграждение в размере месячной заработной платы за каждый год из первых пяти лет службы и полутора месячных заработных плат за каждый последующий год.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "242", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": null, "part_title": null, "chapter": null, "chapter_title": null, "text": "ينظم هذا الكتاب أحكام وضوابط الوقاية من الحوادث والأضرار الصحية الناتجـة\nعن العمل أو المتصلة به  ،أو التى تقع أثناءه  ،أو بسببه  ،وذلك للحد مـن المخـاطر\nوأسبابها التى تنطوى عليها بيئة العمل .", "text_ru": "Настоящая книга регулирует положения и требования профилактики несчастных случаев и вреда здоровью, возникающих из работы или связанных с ней, либо происходящих во время неё или по её причине, в целях снижения рисков и их источников, присущих условиям труда.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": null, "part_title_ru": null, "chapter_ru": null, "chapter_title_ru": null}, {"number": "243", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": null, "part_title": null, "chapter": null, "chapter_title": null, "text": "يقصد فى تطبيق أحكام هذا الكتاب بالمنشأة كل مشروع أو مرفق يملكه أو يـديره\nشخص من أشخاص القانون العام أو الخاص .", "text_ru": "При применении положений настоящей книги под предприятием понимается любой проект или объект, принадлежащий лицу публичного или частного права либо управляемый им.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": null, "part_title_ru": null, "chapter_ru": null, "chapter_title_ru": null}, {"number": "244", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": null, "part_title": null, "chapter": null, "chapter_title": null, "text": "تسرى أحكام هذا الكتاب على جميع مواقع العمل  ،والمنشآت وفروعها أيا كـان\nنوعها  ،أو تبعيتها  ،سواء كانت برية أو بحرية أو جوية .\nكما تسرى أيضا على المسطحات المائية بجميع أنواعها ووسائل النقل المختلفة .", "text_ru": "Положения настоящей книги применяются ко всем местам работы, предприятиям и их филиалам, независимо от их вида или подчинённости, будь то сухопутные, морские или воздушные.\n\nОни также применяются к водным акваториям всех видов и различным транспортным средствам.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": null, "part_title_ru": null, "chapter_ru": null, "chapter_title_ru": null}, {"number": "245", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": null, "part_title": null, "chapter": null, "chapter_title": null, "text": "مع عدم الإخلال بأحكام التفتيش والضبطية القضائية فى هـذا القـانون  ،يجـوز\nللوزير المختص بقرار منه الترخيص بإنشاء مكاتب امتثال تهدف إلـى التحقـق مـن\nاستيفاء اشتراطات السلامة والصحة المهنية وتأمين بيئة العمل فى المنشآت المخاطبـة\nبأحكام هذا الكتاب  ،وتقديم الدعم الفنى والمشورة اللازمة .\nويحدد القرار الشكل القانونى لمكاتب الامتثال وشروط وضوابط مزاولة نشاطها ،\nومؤهلات العاملين بها  ،وشروط وقواعد الترخيص  ،ومدتـه  ،والرسـوم المقـررة عليـه ،\nبما لا يجاوز مائة ألف جنيه .", "text_ru": "Без ущерба для положений об инспекции и полномочиях судебной полиции в настоящем Трудовом кодексе, компетентный министр вправе своим решением разрешить создание бюро по соответствию, имеющих целью проверку соблюдения требований охраны труда, профессионального здоровья и безопасности условий труда на предприятиях, на которые распространяются положения настоящей книги, и оказание необходимой технической поддержки и консультирования.\n\nРешением определяются организационно-правовая форма бюро по соответствию, условия и требования осуществления их деятельности, квалификация их работников, условия и правила выдачи разрешения, срок его действия и установленная за него пошлина — не свыше ста тысяч фунтов.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": null, "part_title_ru": null, "chapter_ru": null, "chapter_title_ru": null}, {"number": "246", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها  ،بتوفير وسائل السلامة والصحة المهنية  ،وتأمين بيئـة\nالعمل فى أماكن العمل  ،وفق ًا لمعايير التعرض والحدود العتبية  ،وبما يكفـل الوقايـة\nمن المخاطر الفيزيائية الناجمة عما يلى :\n-١الوطأة الحرارية والبرودة .\n-٢الضوضاء والاهتزازات .\n-٣شدة الاستضاءة .\n-٤الإشعاعات الضارة والخطرة ) مؤينة  -غير مؤينة( .\n-٥تغيرات الضغط الجوى .\n-٦مخاطر الانفجار .", "text_ru": "Предприятие и его филиалы обязаны обеспечивать средства охраны труда и профессионального здоровья, безопасность условий труда на рабочих местах в соответствии со стандартами воздействия и пороговыми значениями, обеспечивая профилактику физических рисков, возникающих в связи со следующим:\n1. тепловое и холодовое воздействие;\n2. шум и вибрация;\n3. интенсивность освещения;\n4. вредные и опасные излучения (ионизирующие и неионизирующие);\n5. изменения атмосферного давления;\n6. риски взрыва.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "247", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها باتخاذ الاحتياطات والتدابير اللازمـة لتـوفير وسـائل\nالسلامة والصحة المهنية وتأمين بيئة العمل  ،بما يكفل الوقاية من المخـاطر الهندسـية\n)ميكانيكية  -كهربائية  -تشييد وبناء  -المواءمة(  ،وعلى الأخص ما يأتي :\n-١كل خطر ينشأ عن معدات وأدوات رفع وجر  ،ووسائل الانتقال  ،والتداول ،\nونقل الحركة .\n-٢كل خطر ينشأ عن أعمال التشييد والبناء  ،والحفر  ،ومخاطر الانهيار  ،والسقوط .\n-٣كل خطر ينشأ عن الكهرباء )الديناميكية والاستاتيكية( .\n-٤كل خطر ينشأ عن عدم مراعاة التناسب بين البنية الجسدية للعامل والمعـدات\nوالآلات  ،وبين مكان العمل .", "text_ru": "Предприятие и его филиалы обязаны принимать необходимые меры предосторожности и меры для обеспечения средств охраны труда и профессионального здоровья, безопасности условий труда, обеспечивая профилактику технических рисков (механических, электрических, строительно-монтажных, связанных с эргономическим соответствием), в частности следующих:\n1. любой риск, возникающий от подъёмно-транспортного оборудования и инструментов, средств перемещения, обращения и передачи движения;\n2. любой риск, возникающий от строительно-монтажных работ, земляных работ, рисков обрушения и падения;\n3. любой риск, возникающий от электричества (динамического и статического);\n4. любой риск, возникающий от несоблюдения соответствия между физическим строением работника и оборудованием, машинами и местом работы.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "248", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة وفروعها باتخاذ وسائل وطرق وقاية العمال مـن خطـر الإصـابة\nبالبكتيريا والفيروسات والفطريات  ،والطفيليات  ،وسائر المخـاطر البيولوجيـة متـى\nكانت طبيعة العمل ت ُعرض العمال لظروف الإصابة بها  ،وعلى الأخص ما يأتي :\n-۱مخالطة الآدميين المرضى  ،والقيام بخدماتهم من رعاية وتحاليل  ،وفحـوص\nطبية ومعملية  ،وعمليات جراحية .\n-٢التعامل مع الحيوانات  ،ومنتجاتها  ،ومخلفاتها .\n-٣وحدات تداول  ،ونقل وتخزين  ،ومعالجة المخلفات الطبية  ،والبيطرية الخطرة .\n-٤وحدات استقبال  ،وتخزين  ،ومعالجة التصريفات بأنواعها المختلفة .", "text_ru": "Предприятие и его филиалы обязаны принимать средства и способы защиты работников от риска заражения бактериями, вирусами, грибками, паразитами и от иных биологических рисков, если характер работы подвергает работников условиям заражения ими, в частности от следующего:\n1. контакт с больными людьми, оказание им услуг по уходу, проведение анализов, медицинских и лабораторных обследований, хирургических операций;\n2. работа с животными, их продукцией и отходами;\n3. подразделения по обращению, перевозке, хранению и обработке опасных медицинских и ветеринарных отходов;\n4. подразделения по приёму, хранению и обработке сбросов различных видов.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "249", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها بتوفير وسائل السلامة والصحة المهنيـة وتـأمين بيئـة\nالعمل فى أماكن العمل بما يكفل الوقاية من المخاطر الكيميائية الناتجة عن التعامل مـع\nالمواد الكيميائية الصلبة والسائلة والغازية  ،مع مراعاة ما يأتي :\n-١عدم تجاوز أقصى تركيز مسموح به للتعامل فى المواد الكيميائية  ،والمـواد\nالمسببة للسرطان التى يتعرض لها العمال .\n-٢عدم تجاوز مخزون المواد الكيميائية الخطرة كميات العتبة لكل منها .\n-٣توفير الاحتياطات اللازمة لوقاية المنـشأة  ،والعمـال عنـد تـداول ونقـل\nوتخزين  ،واستخدام المواد الكيميائية الخطرة  ،والتخلص من مخلفاتها .\n\n-٤الاحتفاظ بسجل ورقى أو إلكترونى لحصر المواد الكيميائية الخطرة المتداولة\nمتضمن ًا جميع البيانات الخاصة بكل مادة  ،ويسجل لرصد ملوثات بيئـة العمـل التـى\nيتعرض لها العمال  ،ويسجل المواد والمخلفات الخطـرة وفق ًـا لقـانون تنظـيم إدارة\nالمخلفات الصادر بالقانون رقم  ۲۰۲لسنة ٢٠٢٠\n-٥وضع بطاقات تعريف جميع المواد الكيميائية المتداولة فى العمل موضحا بها\nالاسم العلمى والتجارى  ،وتركيبها الكيميائي  ،ودرجة خطورتها واحتياطات الـسلامة\nوإجراءات الطوارئ المتعلقة بها  ،وعلى المنشأة أن تحصل على البيانـات المـذكورة\nفى هذه المواد من مصنعها  ،أو موردها عند التوريد .\n-٦تدريب العمال على طرق التعامل مع المواد الكيميائيـة الخطـرة  ،والمـواد\nالمسببة للسرطان وتعريفهم بمخاطرها  ،وبطرق الأمان  ،والوقاية من هذه المخاطر .\n-٧معايير التعرض والحدود العتبية .", "text_ru": "Предприятие и его филиалы обязаны обеспечивать средства охраны труда и профессионального здоровья, безопасность условий труда на рабочих местах, обеспечивая профилактику химических рисков, возникающих при обращении с твёрдыми, жидкими и газообразными химическими веществами, соблюдая следующее:\n1. непревышение максимально допустимой концентрации при обращении с химическими веществами и канцерогенными веществами, которым подвергаются работники;\n2. непревышение пороговых количеств запасов опасных химических веществ для каждого из них;\n3. обеспечение необходимых мер предосторожности для защиты предприятия и работников при обращении, перевозке, хранении и использовании опасных химических веществ и утилизации их отходов;\n4. ведение бумажного или электронного реестра для учёта обращающихся опасных химических веществ, содержащего все сведения по каждому веществу, а также регистрацию для отслеживания загрязнителей условий труда, которым подвергаются работники, и регистрацию опасных веществ и отходов в соответствии с Законом о регулировании управления отходами № 202 от 2020 года;\n5. размещение идентификационных карточек на все химические вещества, обращающиеся в процессе работы, с указанием научного и торгового наименования, химического состава, степени опасности, мер предосторожности и порядка действий в чрезвычайных ситуациях, связанных с ними; предприятие обязано получать указанные сведения об этих веществах от их производителя или поставщика при поставке;\n6. обучение работников способам обращения с опасными химическими веществами и канцерогенными веществами, ознакомление их с рисками, способами обеспечения безопасности и защиты от этих рисков;\n7. стандарты воздействия и пороговые значения.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "250", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها بتوفير وسائل السلامة والصحة المهنيـة وتـأمين بيئـة\nالعمل فى أماكن العمل بما يكفل وسائل الوقاية من المخاطر غيـر المباشـرة  ،والتـى\nتنشأ  ،أو يتفاقم الضرر أو الخطر من عدم توافرها  ،كوسـائل الإنقـاذ والإسـعاف ،\nوالنظافة والترتيب  ،والتنظيم بأماكن العمل  ،والتأكد من حـصول العـاملين بأمـاكن\nالطهى وتداول وتناول الأطعمة والمشروبات على الشهادات الصحية الدالة على خلوهم\nمن الأمراض الوبائية والمعدية .", "text_ru": "Предприятие и его филиалы обязаны обеспечивать средства охраны труда и профессионального здоровья, безопасность условий труда на рабочих местах, обеспечивая средства защиты от косвенных рисков, которые возникают либо усугубление вреда или опасности от которых происходит из-за их отсутствия, — таких как средства спасения и первой помощи, чистота, порядок и организация рабочих мест, а также обеспечение получения работниками, занятыми в местах приготовления, обращения и потребления пищевых продуктов и напитков, медицинских справок, подтверждающих отсутствие у них эпидемических и инфекционных заболеваний.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "251", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها باتخاذ الاحتياطـات والاشـتراطات اللازمـة للوقايـة\nمن مخاطر الحريق  ،طبق ًا لما تحدده الجهة المختصة بوزارة الداخلية .", "text_ru": "Предприятие и его филиалы обязаны принимать необходимые меры предосторожности и требования для защиты от рисков пожара в соответствии с тем, что определяет компетентный орган Министерства внутренних дел.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "252", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة  ،وفروعها بتوفير وسائل السلامة والصحة المهنيـة وتـأمين بيئـة\nالعمل بما يكفل الوقاية من كل خطر ينشأ عن العمل داخل الأماكن الضيقة والمغلقة .", "text_ru": "Предприятие и его филиалы обязаны обеспечивать средства охраны труда и профессионального здоровья, безопасность условий труда, обеспечивая профилактику любого риска, возникающего от работы в тесных и замкнутых пространствах.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "253", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة وفروعها بإجراء تقييم وتحليل للمخـاطر  ،والكـوارث الـصناعية\nوالطبيعية المتوقعة والكوارث الناتجة عن التشغيل وإعـداد خطـط طـوارئ لحمايـة\nالمنشأة والعمال والمترددين عليها عند وقوع الحوادث والكوارث  ،على أن يتم اختبـار\nفاعلية هذه الخطط  ،وإجراء تجارب عملية عليها للتأكد من كفاءتها  ،وتدريب العمـال\nلمواجهة متطلباتها  ،وتصحيحها إذا لزم الأمر .\nويجوز للمنشأة الاسترشاد برأى خبير استشارى  ،أو مراكز استشارية فى مجال\nالسلامة والصحة المهنية وتأمين بيئة العمل عند إعداد خطط الطوارئ .\nكما تلتزم المنـشأة بـإبلاغ الجهـة الإداريـة المختـصة بخطـط الطـوارئ ،\nوبأى تعديلات تطرأ عليها  ،وكذلك فى حالة تخزين مواد خطرة أو استخدامها .\nوفى حالة التنبؤ بوقوع حادث أو خطر فى مكان العمل قد يؤدى إلى تهديد وشيك\nوخطير على صحة العمال أو حياتهم  ،يجوز للعامل مغادرة مكان العمل إلـى مكـان\nآمن داخل المنشأة أو موقع العمل أو خارجه إذا لزم الأمر  ،دون إذن  ،وعليهم إخطار\nالمشرف المباشر بأية أخطار يتعرضون لهـا  ،ولا يترتـب علـى هـذا الانـسحاب\nأى عواقب أو مساءلة تأديبية .\nوتلتزم المنشأة بضمان عدم عودة العمال إلى بيئة العمل غير الآمنة إلـى أن يـتم\nإزالة الخطر .\nوفى حالة امتناع المنشأة عن تنفيذ ما توجبه أحكام هذه المادة  ،والقرارات المنفذة\nلها فى المواعيد التى تحددها الجهة الإدارية المختصة  ،وترتب على ذلك وجود خطـر\nداهم على صحة العاملين أو المترددين أو سلامتهم  ،على الجهة الإدارية المختصة أن\nتأمر بإغلاق المنشأة كليا أو جزئيا  ،أو إيقاف معدة أو آلة أو أكثر حتى زوال أسـباب\nالخطر  ،وينفذ القرار الصادر بالإغلاق أو الإيقاف بالطرق الإدارية مع عدم الإخـلال\nبحق العاملين فى تقاضى أجورهم خلال فترة الإغلاق أو الإيقاف الجزئى أو الكلى .\nوللجهة الإدارية المختصة أن تقوم بإزالة أسباب الخطر بطريق التنفيـذ المباشـر\nعلى نفقة المنشأة بالتنسيق مع الجهات المعنية .", "text_ru": "Предприятие и его филиалы обязаны проводить оценку и анализ рисков, ожидаемых промышленных и природных катастроф и катастроф, возникающих в результате эксплуатации, и разрабатывать планы действий в чрезвычайных ситуациях для защиты предприятия, работников и посетителей при наступлении происшествий и катастроф, при этом эффективность этих планов должна проверяться, по ним должны проводиться практические испытания для подтверждения их действенности, работники должны обучаться выполнению их требований, а планы при необходимости должны корректироваться.\n\nПредприятие вправе руководствоваться мнением консультанта-эксперта либо консультационных центров в области охраны труда, профессионального здоровья и безопасности условий труда при разработке планов действий в чрезвычайных ситуациях.\n\nПредприятие также обязано уведомлять компетентный административный орган о планах действий в чрезвычайных ситуациях и о любых вносимых в них изменениях, а также в случае хранения или использования опасных веществ.\n\nВ случае прогнозирования происшествия или опасности на месте работы, которые могут привести к неминуемой и серьёзной угрозе здоровью или жизни работников, работник вправе покинуть место работы и перейти в безопасное место внутри предприятия или места работы либо за его пределами, если это необходимо, без разрешения, при этом он обязан уведомить непосредственного руководителя о любых опасностях, которым он подвергается; такой уход не влечёт каких-либо последствий или дисциплинарной ответственности.\n\nПредприятие обязано гарантировать невозвращение работников в небезопасные условия труда до устранения опасности.\n\nВ случае отказа предприятия исполнить требования настоящей статьи и изданных для её исполнения решений в сроки, установленные компетентным административным органом, если это повлекло возникновение неминуемой опасности для здоровья или безопасности работников либо посетителей, компетентный административный орган обязан распорядиться о полном или частичном закрытии предприятия либо об остановке одного или нескольких устройств или машин до устранения причин опасности; решение о закрытии или остановке исполняется в административном порядке без ущерба для права работников на получение заработной платы за период полного или частичного закрытия либо остановки.\n\nКомпетентный административный орган вправе устранить причины опасности путём непосредственного исполнения за счёт предприятия во взаимодействии с заинтересованными органами.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "254", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "تلتزم المنشآت وفروعها بتوفير بيئة عمل آمنة  ،وغيـر عـدائيــة  ،خاليــة\nمـن التحرش والتنمر والعنف  ،وتوفير الوسائل الكفيلة بالوقاية منهم .\nويصدر الوزير المختص قرارا بتحديـد نمـاذج لمدونـة الـسلوك الـوظيفي ،\nوالقواعد والإجراءات اللازمة لتقديم الشكاوى وسـبل تـسويتها واتخـاذ الإجـراءات\nاللازمة فى شأنها .", "text_ru": "Предприятия и их филиалы обязаны обеспечивать безопасные, неагрессивные условия труда, свободные от домогательств, травли и насилия, и обеспечивать средства защиты от них.\n\nКомпетентный министр издаёт решение об определении образцов кодекса служебного поведения, правил и процедур, необходимых для подачи жалоб, способов их урегулирования и принятия необходимых по ним мер.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "255", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الأول", "part_title": "تأمين بيئة العمل", "chapter": null, "chapter_title": null, "text": "يصدر الوزير المختص قرارا بقواعد ومعايير وبيان حدود الأمـان فـى أمـاكن\nالعمل  ،والاشتراطات  ،والاحتياطات اللازمة لدرء المخاطر المبينـة بهـذا البـاب ،\nوذلك بالتنسيق مع الجهات المختصة .\nوالصحة المهنية وتأمين بيئة العمل", "text_ru": "Компетентный министр издаёт решение о правилах, стандартах и определении пределов безопасности на рабочих местах, требованиях и мерах предосторожности, необходимых для предотвращения рисков, указанных в настоящем разделе, по согласованию с компетентными органами.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел первый", "part_title_ru": "Обеспечение безопасности условий труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "256", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثاني", "part_title": "التفتيش فى مجال السلامة", "chapter": null, "chapter_title": null, "text": "مع مراعاة الأحكام الواردة فى الكتاب الخامس من هذا القـانون  ،تلتـزم الجهـة\nالإدارية المختصة بما يأتي :\n-١تشكيل جهاز متخصص يسمى )جهاز تفتيش السلامة والصحة المهنية وتأمين\nبيئة العمل(  ،من أعضاء تتوافر فيهم المؤهلات العلمية والعملية فى مجـالات الطـب\nالبشرى  ،والبيطرى  ،والصيدلة  ،والهندسة والعلوم  ،والبيئة وإدارة المخلفات للتفتيش\nعلى المنشآت ومراقبة تنفيذ أحكام السلامة والصحة المهنية وتأمين بيئة العمل على أن\nيكون التفتيش على فترات دورية مناسبة .\n-٢تنظيم برامج تدريبيـة متخصـصة ونوعيـة لرفـع كفـاءة ومـستوى أداء\nأعضاء جهاز التفتيش المشار إليه فى البند (١)من هذه المادة  ،وتزويدهم بـالخبرات\nالفنية والتطورات الحديثة بما يضمن أفضل مـستويات الـسلامة والـصحة المهنيـة\nوتأمين بيئة العمل .\n\n-٣تزويد جهاز التفتيش المشار إليه بأجهزة ومعدات القياس  ،وجميع الإمكانيات\nاللازمة لأداء مهمته .\nويكون التفتيش على المنشآت المتعلق عملها بالأمن القومى  ،والتى تحدد بقـرار\nمن رئيس مجلس الوزراء  ،بمعرفة الجهة التى يحددها هذا القرار .", "text_ru": "С учётом положений, содержащихся в Книге пятой настоящего Трудового кодекса, компетентный административный орган обязан:\n1. образовать специализированный орган под названием «Инспекция охраны труда, профессионального здоровья и безопасности условий труда» из членов, обладающих научной и практической квалификацией в области медицины человека, ветеринарии, фармации, инженерии и естественных наук, охраны окружающей среды и управления отходами, для инспектирования предприятий и контроля за исполнением положений об охране труда, профессиональном здоровье и безопасности условий труда, при этом инспекция должна проводиться с соответствующей периодичностью;\n2. организовывать специализированные и профильные учебные программы для повышения квалификации и уровня работы членов указанного в пункте 1 настоящей статьи инспекционного органа, обеспечивать их техническим опытом и современными разработками для гарантии наилучшего уровня охраны труда, профессионального здоровья и безопасности условий труда;\n3. обеспечивать указанный инспекционный орган измерительными приборами и оборудованием и всеми возможностями, необходимыми для выполнения его задачи.\n\nИнспектирование предприятий, деятельность которых связана с национальной безопасностью и которые определяются решением Председателя Совета министров, производится органом, определяемым этим решением.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел второй", "part_title_ru": "Инспекция в области охраны труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "257", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثاني", "part_title": "التفتيش فى مجال السلامة", "chapter": null, "chapter_title": null, "text": "على أعضاء جهاز تفتيش السلامة والصحة المهنية وتأمين بيئة العمل فى سـبيل\nأداء عملهم :\n-١إجراء الفحوص الطبية والمعملية اللازمة علـى العمـال بالمنـشآت للتأكـد\nمن ملاءمة ظروف العمل .\n-۲أخذ عينات من المواد المستعملة أو المتداولـة فـى العمليـات الـصناعية ،\nوأنشطة العمل المختلفة والتى قد يكون لها تأثير ضار على سـلامة وصـحة العمـال\nأو بيئة العمل  ،بغرض تحليلها والتعرف على الآثار الناتجة عن استخدامها وتـداولها ،\nوإخطار المنشأة بذلك لاتخاذ ما يلزم فى هذا الشأن .\n-٣استخدام المعدات والأجهزة وآلات التصوير وغيرها أثناء التفتـيش لتحليـل\nأسباب الحوادث .\n-٤الاطلاع على خطط الطوارئ  ،وتحليل المخاطر الخاصة بالمنشأة .\n-٥الاطلاع على نتائج التقارير الفنية والإدارية التى ترد للمنـشأة عـن أنـواع\nالحوادث الجسيمة وأسبابها .\n-٦الاطلاع على كميات المخزون من المواد الخطرة التى قد تهدد المنشأة .\nوعلى الجهة الإدارية المختصة بناء على تقرير جهاز تفتيش الـسلامة والـصحة\nالمهنية وتأمين بيئة العمل الأمر بإغلاق المنشأة كليا أو جزئيا  ،أو إيقاف آلة  ،أو أكثر ،\nوذلك فى حالة وجود خطر داهم يهدد سلامة المنشأة  ،أو صحة العمال والمتـرددين ،\nأو سلامة بيئة العمل حتى زوال أسباب الخطر  ،مع عدم الإخلال بحق العـاملين فـى\nتقاضي أجورهم .\n\nوللجهة الإدارية المختصة بناء على قرار الإغلاق أن تقوم بإزالة أسباب الخطـر\nبطريق التنفيذ المباشر على نفقة المنشأة .\nوينفذ القرار الصادر بالإغلاق أو الإيقاف بالطرق الإدارية .\nوتصدر الجهة الإدارية المختصة الأمر بإلغاء الإغلاق  ،أو الإيقـاف فـور زوال\nأسباب الخطر .", "text_ru": "Члены инспекционного органа по охране труда, профессиональному здоровью и безопасности условий труда для выполнения своей работы обязаны:\n1. проводить необходимые медицинские и лабораторные обследования работников предприятий для удостоверения соответствия условий труда;\n2. брать пробы материалов, используемых или обращающихся в производственных процессах и различных видах трудовой деятельности, которые могут оказывать вредное воздействие на безопасность и здоровье работников либо условия труда, с целью их анализа и определения последствий, возникающих от их использования и обращения, и уведомлять предприятие об этом для принятия необходимых мер;\n3. использовать оборудование, приборы, фотоаппаратуру и прочее во время инспектирования для анализа причин происшествий;\n4. знакомиться с планами действий в чрезвычайных ситуациях и анализом рисков предприятия;\n5. знакомиться с результатами технических и административных отчётов, поступающих на предприятие, о видах серьёзных происшествий и их причинах;\n6. знакомиться с количеством запасов опасных веществ, которые могут угрожать предприятию.\n\nКомпетентный административный орган на основании доклада инспекционного органа по охране труда, профессиональному здоровью и безопасности условий труда обязан распорядиться о полном или частичном закрытии предприятия либо об остановке одной или нескольких машин в случае наличия неминуемой опасности, угрожающей безопасности предприятия, здоровью работников и посетителей либо безопасности условий труда, до устранения причин опасности, без ущерба для права работников на получение заработной платы.\n\nКомпетентный административный орган вправе на основании решения о закрытии устранить причины опасности путём непосредственного исполнения за счёт предприятия.\n\nРешение о закрытии или остановке исполняется в административном порядке.\n\nКомпетентный административный орган издаёт распоряжение об отмене закрытия или остановки незамедлительно по устранении причин опасности.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел второй", "part_title_ru": "Инспекция в области охраны труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "258", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثاني", "part_title": "التفتيش فى مجال السلامة", "chapter": null, "chapter_title": null, "text": "مع مراعاة حكم المادة (٢٤٢)من هذا القانون  ،يكون لمفتشى السلامة والـصحة\nالمهنية وتأمين بيئة العمل حق التفتيش على المنشآت للتحقق مـن تـوافر اشـتراطات\nالسلامة والصحة المهنية وتأمين بيئة العمل تطبيق ًا لأحكام هذا القـانون  ،والقـرارات\nالمنفذة له .\nوتأمين بيئة العمل بالمنشآت والتدريب", "text_ru": "С учётом положения статьи (242) настоящего Трудового кодекса, инспекторы охраны труда, профессионального здоровья и безопасности условий труда обладают правом инспектирования предприятий для удостоверения соблюдения требований охраны труда, профессионального здоровья и безопасности условий труда во исполнение положений настоящего Трудового кодекса и изданных для его исполнения решений.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел второй", "part_title_ru": "Инспекция в области охраны труда", "chapter_ru": null, "chapter_title_ru": null}, {"number": "259", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثالث", "part_title": "تنظيم أجهزة السلامة والصحة المهنية", "chapter": null, "chapter_title": null, "text": "يصدر الوزير المختص القـرارات اللازمـة بتحديـد المنـشآت  ،وفروعهـا ،\nالتى تلتزم بإنشاء أجهزة وظيفية للسلامة والـصحة المهنيـة وتـأمين بيئـة العمـل ،\nواللجان المختصة بذلك .\nوتختص اللجان المشار إليها بالفقرة الأولى من هذه المادة ببحث ظـروف العمـل\nوأسباب حوادث وإصابات العمل وغيرها  ،ووضع القواعـد  ،والاحتياطـات الكفيلـة\nبمنعها  ،وتكون قرارات هذه اللجان ملزمة للمنشأة وفروعها .\nويجب أن يشمل التدريب العاملين بالجهاز الوظيفى للـسلامة والـصحة المهنيـة\nوتأمين بيئة العمل وأعضاء اللجان المختصة بذلك  ،والمسئولين عن الإدارة  ،والإنتاج\nبمستوياتهم كافة بما يتفق ومسئوليتهم  ،وطبيعة عملهم .", "text_ru": "Компетентный министр издаёт решения, необходимые для определения предприятий и их филиалов, обязанных создать функциональные подразделения по охране труда и профессиональному здоровью и безопасности условий труда, и комитеты, компетентные в этом отношении.\n\nК компетенции комитетов, указанных в первом абзаце настоящей статьи, относится изучение условий труда, причин несчастных случаев и производственных травм и прочего, разработка правил и мер предосторожности, обеспечивающих их предотвращение; решения этих комитетов являются обязательными для предприятия и его филиалов.\n\nОбучение должно охватывать работников функционального подразделения по охране труда, профессиональному здоровью и безопасности условий труда, членов компетентных в этом отношении комитетов, лиц, ответственных за управление и производство на всех уровнях, в соответствии с их ответственностью и характером их работы.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел третий", "part_title_ru": "Организация органов охраны труда и здоровья", "chapter_ru": null, "chapter_title_ru": null}, {"number": "260", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثالث", "part_title": "تنظيم أجهزة السلامة والصحة المهنية", "chapter": null, "chapter_title": null, "text": "تلتزم كل منشأة يعمل بها ثلاثـون عـاملا ً فـأكثر  ،بموافـاة الجهـة الإداريـة\nالمختصة بإحصائية نصف سنوية ببيانات حقيقية عن الأمراض العادية  ،والمزمنـة ،\nوالحوادث الجسيمة  ،والإصابات  ،وذلك خلال النصف الأول مـن شـهرى يوليـو ،\nويناير على الأكثر .\nكما تلتزم المنشآت الخاضعة لأحكام هذا الكتـاب  ،بإخطـار الجهـة الإداريـة\nالمختصة بكل حادث جسيم يقع بالمنشأة  ،أو عند ظهور أعـراض مـرض مهنـي ،\nوذلك خلال أربع وعشرين ساعة من وقوعه  ،ويـصدر الـوزير المخـتص قـرارا\nبالنماذج التى تستخدم لهذا الغرض .\nوتلتزم جميع المنشآت الخاضعة لأحكام هذا الكتاب بموافـاة الـوزارة المختـصة\nإلكترونيا على المنصة الإلكترونية المعدة لذلك بكافة البيانات والتقارير والإحـصائيات\nاللازمة والتى يصدر بتحديدها قرار من الوزير المختص  ،ويحـدد القـرار البيانـات\nالأساسية المطلوبة لذلك .", "text_ru": "Каждое предприятие, на котором занято тридцать и более работников, обязано представлять компетентному административному органу полугодовую статистическую отчётность с достоверными данными об обычных и хронических заболеваниях, серьёзных происшествиях и травмах в течение первой половины месяцев июля и января, не позднее указанных сроков.\n\nПредприятия, на которые распространяются положения настоящей книги, обязаны также уведомлять компетентный административный орган о каждом серьёзном происшествии, произошедшем на предприятии, либо при появлении признаков профессионального заболевания, в течение двадцати четырёх часов с момента его наступления; компетентный министр издаёт решение о формах, используемых для этой цели.\n\nВсе предприятия, на которые распространяются положения настоящей книги, обязаны представлять компетентному министерству в электронной форме через предназначенную для этого электронную платформу все данные, отчёты и статистические сведения, необходимые и определяемые решением компетентного министра; решение определяет основные требуемые для этого данные.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел третий", "part_title_ru": "Организация органов охраны труда и здоровья", "chapter_ru": null, "chapter_title_ru": null}, {"number": "261", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثالث", "part_title": "تنظيم أجهزة السلامة والصحة المهنية", "chapter": null, "chapter_title": null, "text": "تتولى الوزارة المختصة  ،والمركز القومى لدراسات السلامة والـصحة المهنيـة\nوتأمين بيئة العمل المشار إليه فى المادة (٢٦٣)من هذا القـانون  ،والجهـات التـى\nيرخص لها  ،التدريب الأساسى  ،والمتقدم  ،والنوعى  ،والتخصـصى للأخـصائيين\nوالفنيين  ،وأعضاء اللجان فى مجال السلامة والصحة المهنية .\nويصدر الوزير المختص قرارا بقواعد منح التراخيص  ،ونظم التـدريب فـى الحـالات\nالسابقة فى مجال التدريب الأساسى  ،وتدريب السلامة والـصحة المهنيـة والتـدريب\nالنوعي  ،والتخصـصى  ،للكليـات والمعاهـد  ،والجمعيـات الأهليـة والـشركات\nوالمؤسسات المتخصصة  ،على أن يتضمن شروط منح الترخيص وإجراءاته  ،ومدته ،\nوالرسم المقرر عنه  ،بما لا يزيد على خمسين ألف جنيه  ،وحالات الإعفاء منه .", "text_ru": "Компетентное министерство и Национальный центр исследований охраны труда, профессионального здоровья и безопасности условий труда, указанный в статье (263) настоящего Трудового кодекса, а также органы, получившие соответствующее разрешение, осуществляют базовую, продвинутую, профильную и специализированную подготовку специалистов, технических работников и членов комитетов в области охраны труда и профессионального здоровья.\n\nКомпетентный министр издаёт решение о правилах выдачи разрешений и системах подготовки в указанных выше случаях в области базовой подготовки, подготовки по охране труда и профессиональному здоровью, профильной и специализированной подготовки, для колледжей и институтов, общественных объединений, специализированных компаний и учреждений, при этом решение должно содержать условия и порядок выдачи разрешения, срок его действия, установленную за него пошлину — не свыше пятидесяти тысяч фунтов, — и случаи освобождения от неё.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел третий", "part_title_ru": "Организация органов охраны труда и здоровья", "chapter_ru": null, "chapter_title_ru": null}, {"number": "262", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الثالث", "part_title": "تنظيم أجهزة السلامة والصحة المهنية", "chapter": null, "chapter_title": null, "text": "يشترط لمزاولة أعمال الخبرة والاستشارات فى مجال السلامة والصحة المهنيـة\nوتأمين بيئة العمل الحصول على الترخيص اللازم من الوزارة المختصة .\n\nويصدر الوزير المختص قرارا بتحديـد شـروط وقواعـد  ،وإجـراءات مـنح\nالترخيص  ،ومدته  ،وقيده فى السجل الورقى أو الإلكترونى المعـد لهـذا الغـرض ،\nوالرسوم المقررة عنه بما لا يزيد على خمسين ألف جنيه  ،وحالات الإعفاء منه .\nوالمجلس الأعلى للسلامة والصحة المهنية وتأمين بيئة العمل", "text_ru": "Условием осуществления деятельности по экспертизе и консультированию в области охраны труда, профессионального здоровья и безопасности условий труда является получение необходимого разрешения от компетентного министерства.\n\nКомпетентный министр издаёт решение об определении условий, правил и порядка выдачи разрешения, срока его действия, его регистрации в бумажном или электронном реестре, предназначенном для этой цели, установленной за него пошлины — не свыше пятидесяти тысяч фунтов, — и случаев освобождения от неё.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел третий", "part_title_ru": "Организация органов охраны труда и здоровья", "chapter_ru": null, "chapter_title_ru": null}, {"number": "263", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الرابع", "part_title": "أجهزة البحوث والدراسات", "chapter": null, "chapter_title": null, "text": "يختص المركز القومى لدراسات السلامة والصحة المهنية وتـأمين بيئـة العمـل\nالمعاد تنظيمه بقرار رئيس الجمهورية رقم  ۳۳۳لسنة  ۲۰۰۳بالاشتراك مع الـوزارة\nالمختصة  ،بإعداد الخطط المركزية للبحوث والدراسات فى مجالات السلامة والصحة\nالمهنية وتأمين بيئة العمل طبق ًا لنتائج التحليل الإحصائى لإصابات العمل بالمنـشآت ،\nويتابع تنفيذها بالتنسيق مع الأجهزة المعنية فى الوزارة المختصة  ،وذلك وفق ًا للقواعـد\nوالإجراءات التى يصدر بها قرار من الوزير المختص .", "text_ru": "К компетенции Национального центра исследований охраны труда, профессионального здоровья и безопасности условий труда, реорганизованного решением Президента Республики № 333 от 2003 года, во взаимодействии с компетентным министерством относится разработка централизованных планов исследований и изысканий в области охраны труда, профессионального здоровья и безопасности условий труда в соответствии с результатами статистического анализа производственных травм на предприятиях; центр осуществляет контроль за их исполнением во взаимодействии с соответствующими органами компетентного министерства в соответствии с правилами и процедурами, устанавливаемыми решением компетентного министра.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел четвёртый", "part_title_ru": "Органы исследований и изысканий", "chapter_ru": null, "chapter_title_ru": null}, {"number": "264", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الرابع", "part_title": "أجهزة البحوث والدراسات", "chapter": null, "chapter_title": null, "text": "ينشأ مجلس يسمى \"المجلس الأعلى للسلامة والصحة المهنية وتأمين بيئة العمل\" ،\nبرئاسة الوزير المختص  ،وعضوية ممثلين عن الوزارات والجهات المختصة  ،وعدد\nمتساو من ممثلى كل من منظمات أصحاب الأعمال المعنية الأكثـر تمثـيلا ً ترشـحهم\nمنظماتهم  ،وممثلى المنظمات النقابية العمالية المعنية الأكثر تمثيلا ً ترشحهم منظماتهم ،\nعلى أن يراعى عند الترشيح تمثيل كافة مستويات المنظمات النقابية المعنيـة مـا لـم\nيتعذر ذلك  ،وعدد من ذوى الخبرة .\nويتولى المجلس رسم السياسة العامة فى هذه المجالات واقتراح ما يلزم فى شـأن\nتنفيذها بما يتفق مع السياسة العامة للدولة .\nويصدر بتشكيل المجلس  ،واختصاصاته  ،ونظام العمل به قـرار مـن رئـيس\nمجلس الوزراء .", "text_ru": "Учреждается совет под названием «Высший совет по охране труда, профессиональному здоровью и безопасности условий труда» под председательством компетентного министра, в состав которого входят представители соответствующих министерств и органов и равное число представителей наиболее представительных заинтересованных организаций работодателей, выдвигаемых их организациями, и представителей соответствующих профсоюзных организаций работников, наиболее представительных, выдвигаемых их организациями, при этом при выдвижении учитывается представленность всех уровней соответствующих профсоюзных организаций, если это возможно, а также ряда лиц, обладающих опытом.\n\nСовет осуществляет разработку общей политики в этих областях и вносит предложения, необходимые для её реализации в соответствии с общей государственной политикой.\n\nСостав совета, его компетенция и регламент его работы устанавливаются решением Председателя Совета министров.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел четвёртый", "part_title_ru": "Органы исследований и изысканий", "chapter_ru": null, "chapter_title_ru": null}, {"number": "265", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الرابع", "part_title": "أجهزة البحوث والدراسات", "chapter": null, "chapter_title": null, "text": "يشكل فى نطاق كل محافظة لجنة فرعية للمجلـس الأعلـى للـسلامة والـصحة\nالمهنية وتأمين بيئة العمل  ،برئاسة المحافظ المختص  ،وتضم فى عـضويتها ممثلـين\nعن الوزارات والجهات المختصة  ،وممثلى المنظمات النقابية العمالية المعنية ترشحهم\nمنظماتهم ما لم يتعذر ذلك  ،ومنظمات أصحاب الأعمال بالتساوى فيما بينهما  ،وعـدد\nمن ذوى الخبرة .\nويصدر بتشكيلها  ،وتحديد اختصاصاتها  ،ونظام العمل بها قرار من الوزير المختص .", "text_ru": "В пределах каждой мухафазы образуется подкомиссия Высшего совета по охране труда, профессиональному здоровью и безопасности условий труда под председательством компетентного губернатора, в состав которой входят представители соответствующих министерств и органов, представители соответствующих профсоюзных организаций работников, выдвигаемые их организациями, если это возможно, и организации работодателей на паритетных началах между собой, а также ряд лиц, обладающих опытом.\n\nЕё состав, определение её компетенции и регламент её работы устанавливаются решением компетентного министра.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел четвёртый", "part_title_ru": "Органы исследований и изысканий", "chapter_ru": null, "chapter_title_ru": null}, {"number": "266", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "مع عدم الإخلال بأحكام قانون التأمينات الاجتماعية والمعاشـات المـشار إليـه ،\nتلتزم المنشأة وفروعها بإجراء ما يأتي :\n-١الكشف الطبى الابتدائى على العامل قبل التحاقه بالعمل للتأكد من سـلامته ،\nولياقته الصحية طبق ًا لنوع واحتياجات العمل الذى يسند إليه .\n-٢كشف القدرات للتأكد من لياقة العامل من ناحية قدراته الجـسمانية والعقليـة\nوالنفسية بما يناسب احتياجات العمل .\nوتجرى هذه الفحوص طبق ًا للأحكام المنظمة للتأمين الصحى  ،ويـصدر الـوزير\nالمختص بالاتفاق مع الوزير المعنى بشئون الصحة قرارا بتحديـد مـستويات اللياقـة\nوالسلامة الصحية والقدرات العقلية والنفسية التى تتم على أساسها هذه الفحوص .", "text_ru": "Без ущерба для положений упомянутого Закона о социальном страховании и пенсиях, предприятие и его филиалы обязаны выполнять следующее:\n1. первичный медицинский осмотр работника до поступления на работу для удостоверения его здоровья и пригодности по состоянию здоровья в соответствии с видом и потребностями работы, которая ему поручается;\n2. осмотр способностей для удостоверения пригодности работника с точки зрения его физических, умственных и психических способностей в соответствии с потребностями работы.\n\nЭти обследования проводятся в соответствии с положениями, регулирующими медицинское страхование; компетентный министр по согласованию с министром, в ведении которого находятся вопросы здравоохранения, издаёт решение об определении уровней пригодности, здоровья, умственных и психических способностей, на основании которых проводятся эти обследования.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "267", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة وفروعها بما يأتي :\n-١تدريب العامل على الأسس السليمة لأداء مهنته .\n-۲إحاطة العامل قبل مزاولة العمل بمخاطر مهنته  ،وإلزامه باسـتخدام وسـائل\nالوقاية المقررة لها مع توفير أدوات الوقاية الشخصية المناسبة وتدريبه على استخدامها .\nولا يجوز للمنشأة أن تحمل العامل أية نفقات أو تقتطع من أجره أى مبـالغ لقـاء\nتوفير وسائل الحماية اللازمة له .", "text_ru": "Предприятие и его филиалы обязаны:\n1. обучать работника надлежащим основам выполнения его профессии;\n2. информировать работника до начала выполнения работы о рисках его профессии и обязывать его использовать установленные для неё средства защиты, обеспечивая при этом надлежащие средства индивидуальной защиты и обучая его пользоваться ими.\n\nПредприятию запрещается возлагать на работника какие-либо расходы или удерживать из его заработной платы какие-либо суммы в счёт обеспечения его необходимыми средствами защиты.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "268", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "يلتزم العامل بأن يستعمل وسائل الوقاية  ،ويتعهد بالعناية بما فى حوزتـه منهـا ،\nوبتنفيذ التعليمات الصادرة للمحافظة على صحته ووقايته من حوادث العمـل  ،وعليـه\nألا يرتكب أى فعل يقصد به منع تنفيذ التعليمات أو إساءة استعمال الوسائل الموضوعة\nلحمايته وسلامة العمال المشتغلين معه أو تغييرها أو إلحاق ضرر أو تلف بها  ،وذلـك\nدون الإخلال بما يفرضه أى قانون آخر فى هذا الشأن .", "text_ru": "Работник обязан использовать средства защиты, обязуется заботиться о находящихся в его распоряжении средствах защиты и исполнять выданные ему указания по сохранению своего здоровья и защите от несчастных случаев на производстве; ему запрещается совершать какое-либо действие, направленное на воспрепятствование исполнению указаний, злоупотребление средствами, предназначенными для его защиты и безопасности работающих вместе с ним работников, их изменение либо причинение им вреда или порчи, без ущерба для требований, устанавливаемых каким-либо иным законом по этому вопросу.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "269", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة وفروعها بإجراء ما يأتي :\n-١التفتيش الدورى اليومى فى كل وردية عمل على أمـاكن العمـل وخاصـة\nالخطرة منها لاكتشاف المخاطر المهنية  ،والعمل على الوقاية منها  ،وإعـداد سـجل\nورقى أو إلكترونى لهذا الغرض .\n-۲فحص شكوى العامل المرضية  ،ومعرفة علاقتها بنوع العمل بمعرفة طبيـب\nالمنشأة  ،إن وجد .\n-٣التنسيق مع الهيئة العامة للتأمين الصحى لإجراء الفحـص الطبـى الـدورى\nلجميع عمـال المنـشأة للمحافظـة علـى ليـاقتهم الـصحية والنفـسية والعقليـة ،\nوسلامتهم بصفة مستمرة واكتشاف ما يظهر من أمراض مهنية فى مراحلهـا الأولـى\nولإجراء الفحص عند انتهاء الخدمة  ،وذلك كله طبق ًا لأنظمة التأمين الصحى المقـررة\nفى هذا الشأن .", "text_ru": "Предприятие и его филиалы обязаны выполнять следующее:\n1. ежедневную периодическую инспекцию в каждую рабочую смену мест работы, в особенности опасных, для выявления профессиональных рисков и принятия мер по их профилактике, с ведением бумажного или электронного реестра для этой цели;\n2. рассмотрение жалобы работника на состояние здоровья и определение её связи с видом работы врачом предприятия, если таковой имеется;\n3. координацию с Главным управлением медицинского страхования для проведения периодического медицинского обследования всех работников предприятия в целях сохранения их физического, психического и умственного здоровья, их безопасности на постоянной основе и выявления профессиональных заболеваний на ранних стадиях их проявления, а также для проведения обследования по окончании службы, — всё это в соответствии с установленными в этой связи системами медицинского страхования.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "270", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة بأن توفر لعمالها وسائل الإسعاف الأولية .\nوإذا زاد عدد عمال المنشأة فى مكان واحد أو بلد واحد أو فـى دائـرة نـصف\nقطرها خمسة عشر كيلو مترا على خمسين عاملا ً  ،تلتزم المنشأة بأن تستخدم ممرضا\nمؤهلا ً أو أكثر الأعمال التمريض أو الإسعاف بكل وردية عمل بها  ،وأن تعهـد إلـى\nطبيب لعيادتهم فى المكان الذى تعده لهذا الغرض  ،وأن تقدم لهـم الأدويـة اللازمـة\nللعلاج  ،وذلك كله بالمجان .\n\nوإذا عولج العامل فى الحالتين المنصوص عليهما فى الفقرتين الأولـى والثانيـة\nمن هذه المادة بمستشفى حكومى أو خيرى  ،وجب على المنشأة أن تـؤدى إلـى إدارة\nالمستشفى نفقات العلاج  ،والأدوية  ،والإقامة .\nويتبع فى تحديد نفقـات العـلاج  ،والأدويـة  ،والإقامـة المنـصوص عليهـا\nفى الفقرات السابقة الطرق والأوضاع التى يصدر بها قرار مـن الـوزير المخـتص\nبالاتفاق مع الوزير المعنى بشئون الصحة .", "text_ru": "Предприятие обязано обеспечивать своих работников средствами первой помощи.\n\nЕсли численность работников предприятия в одном месте, одном населённом пункте либо в пределах круга радиусом пятнадцать километров превышает пятьдесят работников, предприятие обязано использовать одну или более квалифицированных медицинских сестёр по уходу или оказанию первой помощи в каждую рабочую смену, поручить врачу приём этих работников в предназначенном для этого месте и предоставлять им необходимые для лечения медикаменты — всё это безвозмездно.\n\nЕсли работник в случаях, предусмотренных первым и вторым абзацами настоящей статьи, лечится в государственной или благотворительной больнице, предприятие обязано возместить администрации больницы расходы на лечение, медикаменты и проживание.\n\nПри определении расходов на лечение, медикаменты и проживание, предусмотренных предыдущими абзацами, применяются способы и порядок, устанавливаемые решением компетентного министра по согласованию с министром, в ведении которого находятся вопросы здравоохранения.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "271", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "يلتزم من يستخدم عمالا ً فى أماكن لا تصل إليها وسـائل المواصـلات العاديـة\nأن يوفر لهم وسائل الانتقال المناسبة على نفقته الخاصة .\nوعلى من يستخدم عمالا ً فى المنـاطق البعيـدة عـن العمـران أن يـوفر لهـم\nالتغذية المناسبة  ،والمساكن الملائمة مع مراعاة تخصيص بعضها للعمال المتـزوجين\nعلى نفقته الخاصة .\nويصدر الوزير المختص بالاتفاق مع الوزراء المعنيين  ،ومع منظمات أصـحاب\nالأعمال والعمال القرارات اللازمة لتحديد المناطق البعيدة عن العمران  ،واشـتراطات\nومواصفات المساكن  ،وتعيين أصناف الطعام والكميات التى تقدم منها لكـل عامـل ،\nوما يؤديه صاحب العمل مقابلا ً لها .\nويجوز بالنسبة لنظام الوجبات الغذائية الواردة فى الفقرة الثالثة من هـذه المـادة\nالأخذ بنظام توافق عليه إدارة المنشأة والمنظمة النقابية العمالية أو المفـوض العمـالى\nفى حالة عدم وجودها  ،بشرط أن يعتمد من الجهـة الإداريـة المختـصة  ،ويحظـر\nالاستعاضة عن تقديم تلك الوجبات كلها أو بعضها بمقابل نقدى .", "text_ru": "Лицо, использующее труд работников в местах, куда не доходят обычные средства сообщения, обязано обеспечивать им надлежащие средства передвижения за свой счёт.\n\nЛицо, использующее труд работников в районах, удалённых от населённых пунктов, обязано обеспечивать им надлежащее питание и подходящее жильё, с учётом выделения части его для женатых работников, за свой счёт.\n\nКомпетентный министр по согласованию с заинтересованными министрами и с организациями работодателей и работников издаёт решения, необходимые для определения районов, удалённых от населённых пунктов, требований и характеристик жилья, определения видов пищи и количеств, предоставляемых каждому работнику, и того, что уплачивает работодатель взамен этого.\n\nВ отношении системы питания, предусмотренной третьим абзацем настоящей статьи, допускается принятие системы, согласованной администрацией предприятия и профсоюзной организацией работников либо уполномоченным представителем работников при её отсутствии, при условии её утверждения компетентным административным органом; замена предоставления этого питания полностью или частично денежной компенсацией запрещается.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "272", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "تلتزم المنشأة التى يبلغ عدد عمالها خمـسين عـاملا ً فـأكثر بتقـديم الخـدمات\nالاجتماعية والثقافية اللازمة لعمالها  ،وذلك بالاشتراك مع المنظمة النقابيـة العماليـة ،\nدون تحميل العامل أى التزامات  ،ويصدر الوزير المختص بالتـشاور مـع منظمـات\nأصحاب الأعمال والعمال القرارات المشار إليها بتحديد الحد الأدنى لهذه الخدمات .", "text_ru": "Предприятие, численность работников которого достигает пятидесяти и более, обязано предоставлять социальные и культурные услуги, необходимые его работникам, во взаимодействии с профсоюзной организацией работников, не возлагая на работника каких-либо обязательств; компетентный министр в консультации с организациями работодателей и работников издаёт указанные решения об определении минимального размера этих услуг.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "273", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "يتمتع صندوق الخدمات الاجتماعية والصحية والثقافية بالشخـصية الاعتباريـة ،\nويهدف إلى تقديم الخدمات اللازمة للنهوض بالمستوى الاجتماعى والصحى والثقـافى\nللعاملين بمنشآت القطاع العام  ،وقطاع الأعمال العام  ،والقطاع الخاص .\nويصدر رئيس مجلس الوزراء قرارا بتشكيل مجلـس إدارة الـصندوق برئاسـة\nالوزير المختص  ،وعضوية ممثلى المنظمات النقابيـة العماليـة المعنيـة ومنظمـات\nأصحاب الأعمال بالتساوى فيما بينهما  ،ترشـحهم منظمـاتهم  ،وممثلـى الـوزارات\nوالجهات المعنية ويحدد القرار اختصاصات المجلس والنظـام الأساسـى للـصندوق\nوالمعاملة المالية لرئيس وأعضاء مجلس الإدارة  ،على أن تكون من موارده الذاتيـة ،\nوالنظام المحاسبى الواجب إتباعه .\nويكون للصندوق حساب خاص لدى أحد البنوك التجارية المـسجلة لـدى البنـك\nالمركزى المصرى  ،وموازنة مستقلة  ،ويعد الصندوق سـنويا القـوائم الدالـة علـى\nالمركز المالى وفق ًا لنظام المحاسبة المالية  ،وتبدأ السنة المالية للـصندوق مـع الـسنة\nالمالية للدولة  ،وتنتهى بانتهائها وتخضع أمواله لرقابة الجهاز المركزى للمحاسـبات ،\nويرحل فائض أمواله من سنة إلى أخرى .\nوتلتزم المنشآت المشار إليها بالفقرة الأولى من هذه المادة والتى يبلغ عدد عمالهـا\nعشرون عاملا ً فأكثر بسداد اشتراك سنوى لا يقل عن ثمانية جنيهات ولا يجاوز سـتة\nعشر جنيها عن كل عامل سنويا لتمويل هذا الصندوق  ،ويصدر بتحديد قيمة الاشتراك\nالسنوى قرار من الوزير المختص  ،بعد العرض على مجلس إدارة الصندوق  ،ويحق\nللمنشأة حال تقديمها للخدمات الواردة بالمادة  ٢٧٤من هذا القانون  ،أو تقديمها لميـزة\nأفضل للعاملين لديها خصم قيمة تلك الخدمات أو الميزة أو خصم (۷۰٪)مـن المبلـغ\nالمستحق عليها للصندوق سنويا  ،أيهما أقل .", "text_ru": "Фонд социального, медицинского и культурного обслуживания обладает правосубъектностью и имеет целью предоставление услуг, необходимых для повышения социального, медицинского и культурного уровня работников предприятий государственного сектора, государственного делового сектора и частного сектора.\n\nПредседатель Совета министров издаёт решение об образовании совета директоров Фонда под председательством компетентного министра, с участием на паритетных началах представителей соответствующих профсоюзных организаций работников и организаций работодателей, выдвигаемых их организациями, и представителей соответствующих министерств и органов; решением определяются полномочия совета, устав Фонда и порядок финансового вознаграждения председателя и членов совета директоров — за счёт собственных средств Фонда — и подлежащая применению система бухгалтерского учёта.\n\nФонд имеет специальный счёт в одном из коммерческих банков, зарегистрированных в Центральном банке Египта, и самостоятельный бюджет; Фонд ежегодно составляет отчётность, отражающую его финансовое положение, в соответствии с системой финансового учёта; финансовый год Фонда начинается вместе с финансовым годом государства и заканчивается вместе с ним; его средства подлежат контролю со стороны Центрального агентства по учёту и контролю, а остаток его средств переносится из одного года в другой.\n\nПредприятия, указанные в первом абзаце настоящей статьи, численность работников которых составляет двадцать и более, обязаны уплачивать ежегодный взнос в размере не менее восьми и не более шестнадцати фунтов на каждого работника в год для финансирования этого Фонда; размер ежегодного взноса устанавливается решением компетентного министра после представления его совету директоров Фонда; предприятие вправе при предоставлении им услуг, указанных в статье (274) настоящего Трудового кодекса, либо предоставлении своим работникам более значительной льготы, вычесть стоимость этих услуг или льготы либо вычесть 70% суммы, причитающейся с него Фонду ежегодно, в зависимости от того, что меньше.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "274", "book": "الكتاب الرابع", "book_title": "السلامة والصحة المهنية وتأمين بيئة العمل", "part": "الباب الخامس", "part_title": "الخدمات الاجتماعية والصحية", "chapter": null, "chapter_title": null, "text": "يلتزم الصندوق المشار إليه فى المادة (٢٧٣)مـن هـذا القانون بتقديم الخدمات الآتية :\n-١دعم النفقات العلاجية طبق ًا لما تحدده اللائحة الماليـة والإداريـة للـصندوق\nوالتى تحدد أنواع الخدمات الطبية والمنتفعين بها واللجان المختـصة بتقريـر العـلاج\nوالجهات التى تتولى تنفيذ الخدمات الصحية .\n\n-۲تدعيم مكتبات المنشآت بالكتب .\n-٣عقد الندوات الثقافية أو تمويلها .\n-٤دعم تكاليف تنظيم انتخابات المنظمات النقابية العمالية .\n-٥إعداد برامج محو الأمية بالتعاون مع الجهات المختصة .\n-٦تدعيم الأنشطة الرياضية بالمنشأة .\n-٧إقامة المسابقات اللازمة لتنمية مهارات العاملين فنيا وثقافيا ورياضيا .\n-٨إعداد برامج الرحلات الترفيهية  ،والمصايف طبق ًا لإمكانيات العمال .\n-٩دعم الأنشطة النقابية العمالية .\n-١٠مشاركة العمال وأصحاب العمل فى توفير بيئة عمل آمنة خالية من العنـف\nوالتحرش والتنمر من خلال إقامة الندوات التوعوية وتمويـل المـشروعات التنمويـة\nالتى تستهدف ذلك متى توافرت الموارد .\nوللوزير المختص بالاتفاق مع مجلس إدارة الصندوق إضـافة خـدمات أخـرى\nعلى أن تكون فى ذات مجال عمل الصندوق .\nويصدر رئيس مجلس الوزراء قرارا باللائحـة الماليـة والإداريـة للـصندوق ،\nوصلاحيات وضوابط الصرف والرقابة عليها .", "text_ru": "Фонд, указанный в статье (273) настоящего Трудового кодекса, обязан предоставлять следующие услуги:\n1. поддержку расходов на лечение в соответствии с тем, что определяет финансовый и административный регламент Фонда, который определяет виды медицинских услуг и пользующихся ими лиц, комитеты, компетентные принимать решение о лечении, и органы, осуществляющие оказание медицинских услуг;\n2. пополнение библиотек предприятий книгами;\n3. проведение или финансирование культурных семинаров;\n4. поддержку расходов на организацию выборов профсоюзных организаций работников;\n5. разработку программ по ликвидации неграмотности во взаимодействии с компетентными органами;\n6. поддержку спортивной деятельности на предприятии;\n7. проведение конкурсов, необходимых для развития технических, культурных и спортивных навыков работников;\n8. разработку программ развлекательных поездок и летнего отдыха в соответствии с возможностями работников;\n9. поддержку профсоюзной деятельности работников;\n10. участие работников и работодателей в обеспечении безопасных условий труда, свободных от насилия, домогательств и травли, посредством проведения разъяснительных семинаров и финансирования направленных на это проектов развития при наличии средств.\n\nКомпетентный министр по согласованию с советом директоров Фонда вправе добавлять иные услуги при условии, что они относятся к той же сфере деятельности Фонда.\n\nПредседатель Совета министров издаёт решение о финансовом и административном регламенте Фонда, полномочиях и правилах расходования и контроля за ним.", "book_title_ru": "Охрана труда, профессиональное здоровье и безопасность условий труда", "book_ru": "Книга четвёртая", "part_ru": "Раздел пятый", "part_title_ru": "Социальные и медицинские услуги", "chapter_ru": null, "chapter_title_ru": null}, {"number": "275", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الأول", "part_title": "تفتيش العمل والضبطية القضائية", "chapter": null, "chapter_title": null, "text": "يكون للعاملين القائمين على تنفيذ أحكام هـذا القـانون  ،والقـرارات الـصادرة\nتنفيذ ًا له  ،الذين يصدر بتحديدهم قرار من وزير العدل بالاتفاق مع الوزير المخـتص ،\nصفة مأمورى الضبط القضائى بالنسبة للجرائم التى تقع فـى دوائـر اختـصاصهم ،\nوتكون متعلقة بأعمال وظائفهم .\n\nويؤدى كل منهم أمام الوزير المختص قبل مباشرة عمله القسم الآتى \" :أقسم بـاالله\nالعظيم أن أؤدى مهمتى بالذمة والأمانة والصدق وألا أفشى سرا من أسرار العمل التى\nأطلع عليها بحكم وظيفتى\" .", "text_ru": "Работники, осуществляющие исполнение положений настоящего Трудового кодекса, и изданных во исполнение его решений, круг которых определяется решением министра юстиции по согласованию с компетентным министром, обладают статусом должностных лиц судебной полиции в отношении преступлений, совершаемых в пределах их компетенции и относящихся к их должностным функциям.\n\nКаждый из них приносит перед компетентным министром до вступления в должность следующую присягу: «Клянусь Всемогущим Богом исполнять свои обязанности добросовестно, честно и правдиво и не разглашать никакую производственную тайну, ставшую мне известной в силу исполнения моих обязанностей».", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел первый", "part_title_ru": "Трудовая инспекция и полномочия судебной полиции", "chapter_ru": null, "chapter_title_ru": null}, {"number": "276", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الأول", "part_title": "تفتيش العمل والضبطية القضائية", "chapter": null, "chapter_title": null, "text": "يحمل كل من له صفة الضبطية القضائية  ،بطاقة تثبت هذه الصفة  ،ولـه حـق\nدخول جميع أماكن العمل وتفتيشها للتحقق من تطبيق أحكام هذا القانون  ،والقـرارات\nالمنفذة له  ،وفحص الدفاتر والأوراق المتعلقة بذلك  ،وطلـب المـستندات والبيانـات\nاللازمة من أصحاب الأعمال أو من ينوب عنهم .\nويحدد الوزير المختص بقرار منه قواعد وإجراءات التكليف بتفتيش أماكن العمـل\nليلا ً وفى غير أوقات العمل الرسمية للقائمين به والمكافآت التى تستحق لهم .", "text_ru": "Каждое лицо, обладающее статусом должностного лица судебной полиции, имеет удостоверение, подтверждающее этот статус, и вправе входить во все места работы и инспектировать их для удостоверения применения положений настоящего Трудового кодекса и изданных для его исполнения решений, проверять относящиеся к этому книги и документы, требовать необходимые документы и сведения у работодателей или их представителей.\n\nКомпетентный министр своим решением определяет правила и порядок поручения инспектирования мест работы в ночное время и вне официальных часов работы лицам, осуществляющим его, и причитающееся им за это вознаграждение.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел первый", "part_title_ru": "Трудовая инспекция и полномочия судебной полиции", "chapter_ru": null, "chapter_title_ru": null}, {"number": "277", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الأول", "part_title": "تفتيش العمل والضبطية القضائية", "chapter": null, "chapter_title": null, "text": "على أصحاب الأعمال أو من ينوب عنهم أن يسهلوا مهمة المكلفين بمراقبة تنفيـذ\nأحكام هذا القانون  ،والقرارات المنفذة له  ،وأن يقـدموا لهـم المـستندات والبيانـات\nاللازمة لأداء مهمتهم .", "text_ru": "Работодатели или их представители обязаны содействовать выполнению задачи лиц, которым поручен контроль за исполнением положений настоящего Трудового кодекса и изданных для его исполнения решений, и представлять им документы и сведения, необходимые для выполнения их задачи.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел первый", "part_title_ru": "Трудовая инспекция и полномочия судебной полиции", "chapter_ru": null, "chapter_title_ru": null}, {"number": "278", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الأول", "part_title": "تفتيش العمل والضبطية القضائية", "chapter": null, "chapter_title": null, "text": "على أصحاب الأعمال أو من ينوب عنهم الاستجابة لطلبات الحضور التى توجـه\nإليهم من العاملين المشار إليهم فى المادة (٢٧٥)من هذا القانون  ،وذلك فى المواعيـد\nالتي يحددونها .", "text_ru": "Работодатели или их представители обязаны откликаться на требования явки, направляемые им работниками, указанными в статье (275) настоящего Трудового кодекса, в установленные ими сроки.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел первый", "part_title_ru": "Трудовая инспекция и полномочия судебной полиции", "chapter_ru": null, "chapter_title_ru": null}, {"number": "279", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الأول", "part_title": "تفتيش العمل والضبطية القضائية", "chapter": null, "chapter_title": null, "text": "على السلطات والوزارات والجهات والهيئات المعنية مساعدة العـاملين المكلفـين\nبمراقبة تنفيذ أحكام هذا القانون والقرارات المنفذة له عند قيامهم بوظائفهم متـى طلـب\nذلك منها .", "text_ru": "Власти, министерства, органы и учреждения обязаны оказывать содействие работникам, которым поручен контроль за исполнением положений настоящего Трудового кодекса и изданных для его исполнения решений, при выполнении ими своих функций, когда это от них потребуется.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел первый", "part_title_ru": "Трудовая инспекция и полномочия судебной полиции", "chapter_ru": null, "chapter_title_ru": null}, {"number": "280", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "مع عدم الإخلال بأية عقوبة أشد ينص عليها قانون العقوبات أو أى قانون آخـر ،\nيعاقب بالعقوبات المنصوص عليها فى المواد التالية عن الجرائم المشار إليها فيها .", "text_ru": "Без ущерба для любого более строгого наказания, предусмотренного Уголовным кодексом или каким-либо иным законом, за преступления, указанные в нижеследующих статьях, назначаются наказания, предусмотренные этими статьями.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "281", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب كل من يخالف أحكام المادتين (٥) ، ٤من هذا القـانون بغرامـة لا تقـل\nعن خمسة آلاف جنيه ولا تزيد على خمسين ألف جنيـه  ،وتتعـدد الغرامـة بتعـدد\nالعمال الذين وقعت فى شأنهم الجريمة  ،وتضاعف الغرامة فى حالة العود .", "text_ru": "Каждый, кто нарушает положения статей (4) и (5) настоящего Трудового кодекса, наказывается штрафом в размере не менее пяти тысяч и не более пятидесяти тысяч фунтов; штраф умножается по числу работников, в отношении которых совершено правонарушение, и удваивается в случае повторности.", "book_title_ru": "Трудовая инспекция и меры ответственности", "book_ru": "Книга пятая", "part_ru": "Раздел второй", "part_title_ru": "Меры ответственности", "chapter_ru": null, "chapter_title_ru": null}, {"number": "282", "book": "الكتاب الخامس", "book_title": "تفتيش العمل والعقوبات", "part": "الباب الثانى", "part_title": "العقوبات", "chapter": null, "chapter_title": null, "text": "يعاقب كل من يخالف أحكام المادتين )/۸۲البندين ) ۱و/۲۷۳) ، (۲فقرة رابعـة(\nمن هذا القانون  ،والقرارات الوزارية المنفذة لها  ،بغرامة لا تقل عن ألـف جنيـه ولا\nتزيد على عشرة آلاف جنيه  ،وتتعدد ا
