а седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "175", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الأول", "part_title": "علاقات العمل الفردية", "chapter": "الفصل السابع", "chapter_title": "انتهاء علاقة العمل الفردية", "text": "يلتزم صاحب العمل بأن يمكن العامل مـن الاطـلاع علـى تدرجـه الـوظيفى\nوعناصر أجره  ،وأن يعطى العامل بناء على طلبه ودون مقابل شهادة تحـدد خبرتـه\nوكفاءته المهنية  ،وذلك أثناء سريان العقد  ،أو عند انتهائه .\n\nويلتزم صاحب العمل بمنح العامل عند انتهاء علاقة العمل شهادة يبين فيها تاريخ\nالتحاقه بالعمل  ،وتاريخ انتهائه  ،ونوع العمل الذى كان يؤديه  ،والمزايا التـى كـان\nيحصل عليها  ،ويجوز بناء على طلب العامل  ،أن تتضمن تلك الشهادة مقدار الأجـر\nالذى كان يتقاضاه  ،وسبب انتهاء علاقة العمل  ،وذلك خـلال خمـسة عـشر يومـا\nمن تاريخ طلبها .\nكما يلتزم بأن يرد للعامل عند انتهاء علاقة العمل ما يكـون قـد أودعـه لديـه\nمن أوراق  ،أو شهادات  ،أو أدوات  ،وما يفيد إخلاء طرفه  ،فور طلبهم .", "text_ru": "Работодатель обязан обеспечить работнику возможность ознакомиться со своим карьерным продвижением и составными частями своей заработной платы, а также обязан по требованию работника безвозмездно выдать ему свидетельство, подтверждающее его опыт и профессиональную квалификацию, — как в период действия договора, так и по его прекращении.\n\nРаботодатель обязан при прекращении трудового отношения выдать работнику свидетельство с указанием даты поступления на работу, даты её прекращения, вида выполнявшейся им работы и льгот, которые он получал; по требованию работника это свидетельство может также содержать размер получаемой им заработной платы и причину прекращения трудового отношения, — в течение пятнадцати дней со дня обращения с таким требованием.\n\nОн также обязан вернуть работнику при прекращении трудового отношения документы, свидетельства или инструменты, сданные им на хранение, а также документ, подтверждающий полный расчёт с ним, незамедлительно по их требованию.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел первый", "part_title_ru": "Индивидуальные трудовые отношения", "chapter_ru": "Глава седьмая", "chapter_title_ru": "Прекращение индивидуального трудового отношения"}, {"number": "176", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تنشأ بدائرة اختصاص كل محكمة ابتدائية محكمة تسمى \"المحكمة العمالية\"  ،كمـا\nتنشأ بدائرة كل محكمة من محاكم الاستئناف دوائـر اسـتئنافية متخصـصة  ،لنظـر\nالطعون التى ترفع إليها فى الأحكام الصادرة عن المحكمة العمالية .\nويكون تعيين مقار المحاكم العمالية بقرار يصدر من وزير العـدل  ،ولـه عنـد\nالضرورة ولاعتبارات يراها كظروف المكان أو الكثافة العمالية  ،وبناء على طلب من\nرئيس المحكمة الابتدائية المختصة  ،تعيين مقار أخرى لنظر الدعاوى العمالية داخـل\nاختصاص المحاكم الجزئية التابعة للمحكمة الابتدائية .\nويكون قضاتها من قضاة المحاكم الابتدائيـة  ،ومحـاكم الاسـتئناف  ،ويـصدر\nباختيارهم قرار من مجلس القضاء الأعلى .", "text_ru": "В юрисдикции каждого суда первой инстанции учреждается суд под названием «трудовой суд»; в юрисдикции каждого апелляционного суда учреждаются специализированные апелляционные коллегии для рассмотрения поступающих в них жалоб на решения, вынесенные трудовым судом.\n\nМестонахождение трудовых судов определяется решением министра юстиции; при необходимости, исходя из таких соображений, как местные условия или плотность занятости, и по заявлению председателя компетентного суда первой инстанции он вправе определить иные места для рассмотрения трудовых дел в пределах юрисдикции участковых судов, относящихся к суду первой инстанции.\n\nСудьями этих судов являются судьи судов первой инстанции и апелляционных судов; их избрание производится решением Высшего судебного совета.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "177", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تختص المحكمة العمالية المشار إليها فـى المـادة (١٧٦)مـن هـذا القـانون ،\nدون غيرها  ،بنظر النزاعات الناشئة عن تطبيق أحكام القـوانين واللـوائح المنظمـة\nلعلاقات العمل كافة  ،وكذلك الدعاوى المتعلقة بحقوق العمال التأمينية والمنتفعين عنهم ،\nوالمنظمات النقابية العمالية وتشكيلاتها  ،وذلك دون الإخـلال باختـصاصات محـاكم\nمجلس الدولة .", "text_ru": "Трудовой суд, указанный в статье (176) настоящего Трудового кодекса, обладает исключительной компетенцией по рассмотрению споров, возникающих в связи с применением положений всех законов и регламентов, регулирующих трудовые отношения, а также дел, связанных со страховыми правами работников и лиц, пользующихся ими, профсоюзными организациями работников и их структурными подразделениями, без ущерба для компетенции судов Государственного совета.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "178", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تشكل كل دائرة من دوائر المحكمة العمالية من ثلاثـة مـن القـضاة بالمحـاكم\nالابتدائية  ،يكون أحدهم على الأقل بدرجة رئيس من الفئة )أ( .\nوتشكل كل دائرة من الدوائر الاستئنافية المتخصـصة مـن ثلاثـة مـن قـضاة\nالاستئناف يكون أحدهم على الأقل بدرجة رئيس بمحكمة الاستئناف .", "text_ru": "Каждая коллегия трудового суда образуется из трёх судей судов первой инстанции, из которых не менее одного в ранге председателя категории «А».\n\nКаждая специализированная апелляционная коллегия образуется из трёх апелляционных судей, из которых не менее одного в ранге председателя апелляционного суда.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "179", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تعين الجمعية العمومية للمحكمة الابتدائية فى بداية كل عام قضائى قاضيا بدرجـة\nرئيس محكمة من الفئة )أ( ليحكم بصفة مؤقتة مع عدم المـساس بأصـل الحـق فـى\nالمسائل المستعجلة التى يخشى عليها من فوات الوقـت  ،وإصـدار الأوامـر علـى\nعرائض  ،والأوامر الوقتية  ،وأوامر الأداء فى تلك المسائل أيا كانت قيمة الحق محـل\nالطلب الذى تختص به المحاكم العمالية .", "text_ru": "Общее собрание суда первой инстанции в начале каждого судебного года назначает судью в ранге председателя суда категории «А» для временного разрешения, без ущерба для существа права, неотложных вопросов, промедление в которых может причинить непоправимый вред, вынесения приказов по заявлениям, временных постановлений и приказов об исполнении по этим вопросам, независимо от цены иска, относящегося к компетенции трудовых судов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "180", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "يكون الطعن فى الأحكام  ،والتظلم من الأوامر الصادرة عـن قاضـى الأمـور\nالمستعجلة أمام المحاكم العمالية المتخصصة دون غيرها .", "text_ru": "Обжалование решений и оспаривание приказов, вынесенных судьёй по неотложным делам, производится исключительно перед специализированными трудовыми судами.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "181", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تختص دوائر المحاكم العمالية بنظر الجرائم الناشئة عن تطبيق أحكـام القـوانين\nواللوائح المنظمة لعلاقات العمل  ،وحقـوق العمـال التأمينيـة والمنتفعـين عـنهم ،\nوالمنظمــات النقابيــة العماليــة وتــشكيلاتها ويكــون اســتئنافها أمــام الــدوائر\nالاستئنافية المتخصصة .", "text_ru": "Коллегии трудовых судов обладают компетенцией по рассмотрению преступлений, возникающих в связи с применением положений законов и регламентов, регулирующих трудовые отношения, страховые права работников и лиц, пользующихся ими, профсоюзные организации работников и их структурные подразделения; обжалование по ним производится перед специализированными апелляционными коллегиями.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "182", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "لا يجوز الطعن بالنقض فى الأحكام الصادرة عن الدوائر الاستئنافية المتخصـصة\nفى الجرائم الناشئة عن تطبيق أحكام القوانين واللـوائح المنظمـة لعلاقـات العمـل ،\nوحقوق العمال التأمينية والمنتفعين عنهم  ،والمنظمات النقابية العماليـة وتـشكيلاتها ،\nفى غير الأحوال الصادر فيها أحكام بعقوبة مقيدة للحرية .", "text_ru": "Кассационное обжалование решений, вынесенных специализированными апелляционными коллегиями по преступлениям, возникающим в связи с применением положений законов и регламентов, регулирующих трудовые отношения, страховые права работников и лиц, пользующихся ими, профсоюзные организации работников и их структурные подразделения, не допускается, кроме случаев, когда вынесены решения о наказании, связанном с лишением свободы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "183", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تختص المحكمة العمالية بالفصل فى منازعـات التنفيـذ الوقتيـة والموضـوعية\nفى الأحكام والأوامر الصادرة عنها  ،أو تلك التى تصدر وفق ًا للمادة (١٧٩)من هـذا\nالقانون  ،ويطعن فى الأحكام الصادرة عنها أمام الدوائر الاستئنافية المتخصصة .\nويختص رؤساء الـدوائر بالمحكمـة العماليـة بإصـدار القـرارات والأوامـر\nالمتعلقة بالتنفيذ .\nويكون الاختصاص بالفصل فى التظلمات من هـذه القـرارات والأوامـر أمـام\nالمحكمة ذاتها  ،على ألا يكون من بين أعـضائها مـن أصـدر القـرار  ،أو الأمـر\nالمتظلم منه .", "text_ru": "Трудовой суд обладает компетенцией по разрешению временных и относящихся к существу споров об исполнении решений и приказов, вынесенных им, а также тех, которые выносятся в соответствии со статьёй (179) настоящего Трудового кодекса; решения, вынесенные по ним, обжалуются перед специализированными апелляционными коллегиями.\n\nПредседатели коллегий трудового суда обладают компетенцией по вынесению решений и приказов, касающихся исполнения.\n\nРазрешение жалоб на эти решения и приказы относится к компетенции того же суда, при условии, что в его состав не входит лицо, вынесшее обжалуемое решение или приказ.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "184", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "ينشأ فى دائرة اختصاص المحكمة العمالية قلم كتاب خاص بالمحكمـة  ،وإدارة خاصـة\nلتنفيذ الأحكام  ،والقرارات الصادرة عنها  ،أو عن دوائرها الاستئنافية .\nويصدر رئيس المحكمة الابتدائية المختصة قرارا بتنظيم العمل بها .", "text_ru": "В юрисдикции трудового суда учреждается специальная канцелярия суда и специальное управление по исполнению вынесенных им либо его апелляционными коллегиями решений и постановлений. Председатель компетентного суда первой инстанции издаёт решение об организации работы в них.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "185", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "ينشأ فى مقر كل محكمة ابتدائية  ،وكذا بكل مقر آخر تنعقد فيه المحكمـة العماليـة ،\nمكتب للمساعدة القانونية العمالية يناط به كل ما من شأنه معاونة المتقاضين فى إقامـة\nدعواهم العمالية على الوجه القانونى الصحيح  ،وتكون سائر خـدمات هـذا المكتـب\nللمتقاضين اختيارية  ،ودون مقابل .\nويصدر وزير العدل قرارا بتشكيل هذه المكاتب  ،وتحديد مقراتها  ،ومـا يلـزم\nلحسن سير العمل فيها .", "text_ru": "В месте нахождения каждого суда первой инстанции, а также в любом ином месте, где заседает трудовой суд, учреждается бюро трудовой правовой помощи, на которое возлагается всё, что связано с оказанием тяжущимся содействия в надлежащем юридическом оформлении их трудовых исков; все услуги этого бюро предоставляются тяжущимся на добровольной основе и безвозмездно.\n\nМинистр юстиции издаёт решение об образовании этих бюро, определении их местонахождения и всего необходимого для надлежащей организации их работы.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "186", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تشكل بمحكمة النقض دائرة أو أكثر تختص دون غيرها  ،بالفصل فـى الطعـون\nبالنقض فى الأحكام الصادرة عن المحاكم العمالية .\nكما تنشأ بمحكمة النقض دائرة أو أكثر لفحص تلك الطعون  ،فإذا رأت أن الطعن\nغير جائز أو غير مقبول للأسباب الواردة فى المادة (٢٦٣)مـن قـانون المرافعـات\nالمدنية والتجارية الصادر بالقانون رقم  ١٣لسنة  ، ١٩٦٨أمرت بعـدم قبولـه بقـرار\nمسبب وإذا رأت أن الطعن جدير بالنظر  ،أحالته إلى الدائرة المختصة .\n\nوتشكل الدوائر الواردة فى الفقرة الثانية من هذه المادة مـن ثلاثـة مـن قـضاة\nالمحكمة بدرجة نائب رئيس على الأقل  ،ويعرض الطعن على تلك الدوائر فور إيـداع\nنيابة النقض مذكرة برأيها .\nوفى جميع الأحوال  ،لا يجوز الطعن فى القرار الـصادر عـن دائـرة فحـص\nالطعون بأى طريق .\nواستثناء من أحكام الفقرة الثانية من المادة (٢٦٩)من قانون المرافعـات المدنيـة\nوالتجارية المشار إليه  ،وإذا قضت محكمة النقض بنقض الحكم المطعون فيه حكمـت\nفى موضوع الدعوى ولو كان الطعن لأول مرة .", "text_ru": "В Кассационном суде образуется одна или более коллегий, обладающих исключительной компетенцией по разрешению кассационных жалоб на решения, вынесенные трудовыми судами.\n\nВ Кассационном суде также учреждается одна или более коллегий для проверки этих жалоб; если она сочтёт, что жалоба является недопустимой или неприемлемой по основаниям, указанным в статье (263) Закона о гражданском и торговом судопроизводстве № 13 от 1968 года, она мотивированным постановлением отказывает в её принятии; если она сочтёт, что жалоба заслуживает рассмотрения, она передаёт её в компетентную коллегию.\n\nКоллегии, указанные во втором абзаце настоящей статьи, образуются из трёх судей суда в ранге не ниже заместителя председателя; жалоба передаётся на рассмотрение этих коллегий сразу после подачи прокуратурой при Кассационном суде своего заключения.\n\nВ любом случае обжалование постановления, вынесенного коллегией по проверке жалоб, каким-либо способом не допускается.\n\nВ порядке исключения из положений второго абзаца статьи (269) упомянутого Закона о гражданском и торговом судопроизводстве, если Кассационный суд отменяет обжалуемое решение, он выносит решение по существу дела, даже если жалоба рассматривается впервые.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "187", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثاني", "part_title": "المحاكم العمالية المتخصصة", "chapter": null, "chapter_title": null, "text": "تتبع فى الطعن على أحكام المحاكم العمالية الأحكام الواردة فى قـوانين الإجـراءات\nالجنائية  ،وحالات وإجراءات الطعن أمام محكمة النقض  ،والمرافعات المدنية والتجاريـة ،\nوالإثبات فى المواد المدنية والتجارية  ،بحسب الأحوال  ،وذلك فيما لم يرد بـشأنه نـص\nخاص فى هذا القانون .", "text_ru": "При обжаловании решений трудовых судов применяются положения, содержащиеся в законах об уголовном судопроизводстве, случаях и порядке обжалования перед Кассационным судом, о гражданском и торговом судопроизводстве и о доказывании по гражданским и торговым делам, в зависимости от обстоятельств, в части, не урегулированной специальной нормой настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел второй", "part_title_ru": "Специализированные трудовые суды", "chapter_ru": null, "chapter_title_ru": null}, {"number": "188", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "ينشأ بالوزارة المختصة مجلس يسمى \"المجلس الأعلى للتـشاور الاجتمـاعي\" ،\nوتكون له الشخصية الاعتبارية العامة  ،يهدف إلى تعزيز التعاون والتشاور والحـوار\nبين أطراف العمل الثلاثة فى جميع قضايا العمل  ،بما يحقق التوازن والاستقرار فـى\nعلاقات العمل الفردية والجماعية .", "text_ru": "При компетентном министерстве учреждается совет под названием «Высший совет по социальному диалогу», обладающий статусом юридического лица публичного права; его цель — укрепление сотрудничества, консультаций и диалога между тремя сторонами труда по всем трудовым вопросам в целях обеспечения баланса и стабильности в индивидуальных и коллективных трудовых отношениях.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "189", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "يختص المجلس الأعلى للتشاور الاجتماعى بما يأتي :\n-١رسم السياسات القومية للتشاور الثلاثى والحوار الاجتمـاعى  ،وخلـق بيئـة\nعمل محفزة على التشاور والتعاون وتبادل المعلومات بين أطراف العمل الثلاثة  ،بمـا\nيتفق مع السياسة العامة للدولة .\n\n-٢إبداء الرأى فى مشروعات القوانين المتعلقة بالعمل  ،والحماية الاجتماعيـة ،\nوالمنظمات النقابية العمالية  ،والعلاقات الصناعية والقوانين ذات الصلة .\n-٣إبداء الرأى فى اتفاقيات العمل الدولية والعربية قبل التصديق عليها  ،وإعـداد\nدراسات تحليل الفجوة التشريعية والتنفيذية اللازمة لها .\n-٤اقتراح الحلول المناسبة لتفادى منازعات العمل الجماعيـة علـى المـستوى\nالقومى  ،وعلى الأخص فى الأزمات الاقتصادية التـى تـؤدى إلـى توقـف بعـض\nالمشروعات عن العمل كليا أو جزئيا .\n-٥اتخاذ الوسائل المناسبة لتعزيز الثقة والتفاهم بين طرفى علاقة العمـل علـى\nجميع المستويات .\n-٦اقتراح الوسائل والإجراءات اللازمة لدعم المشروعات القومية والاقتـصادية\nالتى تهدف إلى خلق فرص العمل .\n-٧إعداد الدراسات والأبحاث اللازمة فى اقتصاديات العمل  ،ومنهـا العلاقـات\nالصناعية والمهنية والتدريب المهنى  ،ودعم تنافسية الاقتصاد الوطني .\n-٨النظر فى المقترحات أو الموضوعات التى تناقش فى مؤتمر العمل الـدولى ،\nأو مجلس إدارة منظمة العمل الدولية  ،أو الهيئات الإشرافية للمنظمة  ،والموضـوعات\nالتى تتضمنها التقارير المقدمة إلى مكتب العمل الدولى  ،أو المـسائل التـى تتناولهـا\nالمؤتمرات الثلاثية الأخرى الإقليمية والدولية .\n-٩التشاور حول مسودة تقارير الحكومة الدورية المتعلقة باتفاقيات العمل الدولية .\n-١٠إبداء الرأى فى الموضوعات التى تعرض عليه من الوزارة المختصة .", "text_ru": "К компетенции Высшего совета по социальному диалогу относится следующее:\n1. разработка национальной политики трёхстороннего консультирования и социального диалога, создание производственной среды, стимулирующей консультации, сотрудничество и обмен информацией между тремя сторонами труда, в соответствии с общей государственной политикой;\n2. представление заключений по проектам законов, касающихся труда, социальной защиты, профсоюзных организаций работников, производственных отношений и связанных с ними законов;\n3. представление заключений по международным и арабским трудовым конвенциям до их ратификации и подготовка исследований по анализу необходимых для них законодательных и правоприменительных пробелов;\n4. предложение надлежащих решений для предотвращения коллективных трудовых споров на общенациональном уровне, в частности в условиях экономических кризисов, ведущих к полной или частичной остановке работы некоторых предприятий;\n5. принятие надлежащих мер для укрепления доверия и взаимопонимания между сторонами трудового отношения на всех уровнях;\n6. предложение необходимых средств и мер для поддержки национальных и экономических проектов, направленных на создание рабочих мест;\n7. подготовка необходимых исследований и изысканий по экономике труда, в том числе по производственным и профессиональным отношениям, профессиональной подготовке, а также поддержке конкурентоспособности национальной экономики;\n8. рассмотрение предложений или вопросов, обсуждаемых на Международной конференции труда, в Административном совете Международной организации труда либо в надзорных органах этой организации, а также вопросов, содержащихся в докладах, представляемых Международному бюро труда, либо вопросов, рассматриваемых на иных региональных и международных трёхсторонних конференциях;\n9. консультирование по проектам периодических докладов правительства, касающихся международных трудовых конвенций;\n10. представление заключений по вопросам, вынесенным на его рассмотрение компетентным министерством.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "190", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "يشكل المجلس بقرار من رئيس مجلس الوزراء برئاسة الوزير المختص  ،ويضم\nفى عضويته ممثلين عن الوزارات والجهات المعنية  ،وممثلـى منظمـات أصـحاب\nالأعمال المعنية والمنظمات النقابية العمالية المعنية  ،ترشحهم منظماتهم بالتساوى فيمـا\nبينهما  ،على أن يراعى عند الترشيح تمثيل جميع مستويات المنظمات النقابية المعنيـة\nوتمثيل المرأة بما لا يقل عن الثلث لكل من الأطراف الثلاث  ،ما لم يتعذر ذلك .\n\nويحضر اجتماعات المجلس ممثلون عن المجلس القومى للمرأة والمجلس القـومى\nللأشخاص ذوى الإعاقة  ،والمجلس القومى للأمومة والطفولة والمجلس القومى لحقوق\nالإنسان  ،وذلك دون أن يكون لهم صوت معدود فى المداولات .\nوللمجلس دعوة من يراه من ذوى الخبرة والمتخصصين لحضور جلساته  ،وفق ًـا\nللموضوعات المطروحة دون أن يكون لهم صوت معدود فى المداولات .\nويحدد القرار نظام العمل به  ،واختصاصاته الأخرى .", "text_ru": "Совет образуется решением Председателя Совета министров под председательством компетентного министра; в его состав входят представители соответствующих министерств и органов, представители соответствующих организаций работодателей и соответствующих профсоюзных организаций работников, выдвигаемые их организациями поровну между собой, при этом при выдвижении учитывается представленность всех уровней соответствующих профсоюзных организаций и представленность женщин в размере не менее трети от каждой из трёх сторон, если это не окажется невозможным.\n\nНа заседаниях совета присутствуют представители Национального совета по делам женщин, Национального совета по делам инвалидов, Национального совета по делам материнства и детства и Национального совета по правам человека, без права решающего голоса при обсуждениях.\n\nСовет вправе приглашать для участия в своих заседаниях экспертов и специалистов по своему усмотрению в соответствии с вынесенными на рассмотрение вопросами, без права решающего голоса при обсуждениях.\n\nРешение определяет регламент его работы и иные его полномочия.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "191", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "دورة انعقاد المجلس أربع سنوات  ،تبدأ من اليوم التالى لـصدور قـرار رئـيس\nمجلس الوزراء الصادر بالتشكيل  ،ويعاد تشكيله خلال الستين يوما الأخيرة على الأقل\nقبل انتهاء دورته .\nوإذا خلا محل أحد الأعضاء خلال مدة الدورة لأى سبب من الأسـباب  ،تلتـزم\nالجهة التى خلا محل ممثلها بترشيح ممثل آخر لها لاستكمال مدته .", "text_ru": "Срок полномочий совета составляет четыре года начиная со дня, следующего за изданием решения Председателя Совета министров об его образовании; совет переформировывается не позднее чем за последние шестьдесят дней до истечения срока его полномочий.\n\nЕсли место одного из членов освобождается в течение срока полномочий по какой-либо причине, орган, представитель которого выбыл, обязан выдвинуть другого своего представителя для завершения срока полномочий.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "192", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "للمجلس أن ينشئ فروعا له فى المحافظات للقيام بمهامه على مستوى المحافظـة\nبرئاسة مدير مديرية العمل  ،وعضوية ممثلى المنظمـات النقابيـة العماليـة المعنيـة\nومنظمات أصحاب الأعمال المعنية بالتساوى فيما بينهم  ،كما له أن يشكل لجان ًا نوعية\nمن بين أعضائه أو من غيرهم للقيام بالمهام التى يوكلها إليهم  ،على أن يراعـى فـى\nذلك التمثيل الثلاثى للمجلس .\nكما له أن ينشئ وحدات متخصصة للقيام بالأبحاث والدراسات اللازمة لأعمالـه\nمنفردا أو بالتعاون مع المراكز البحثية المعتمدة ومراكز الأبحاث بالجامعات .\nويصدر المجلس اللوائح المالية والإدارية اللازمة لتنظيم عمل فروعـه  ،ولجانـه\nالنوعية  ،ووحداته البحثية المتخصصة .", "text_ru": "Совет вправе создавать свои отделения в мухафазах для выполнения своих функций на уровне мухафазы под председательством директора управления труда, с участием представителей соответствующих профсоюзных организаций работников и соответствующих организаций работодателей на паритетных началах между ними; он также вправе образовывать специализированные комитеты из числа своих членов или иных лиц для выполнения возлагаемых на них задач, при условии соблюдения трёхстороннего представительства совета.\n\nОн также вправе создавать специализированные подразделения для проведения исследований и изысканий, необходимых для его работы, самостоятельно либо во взаимодействии с аккредитованными исследовательскими центрами и исследовательскими центрами при университетах.\n\nСовет издаёт финансовые и административные регламенты, необходимые для организации работы его отделений, специализированных комитетов и специализированных исследовательских подразделений.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "193", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الأول", "chapter_title": "الحوار الاجتماعى", "text": "يجوز للمجلس قبول الهبات والمنح والتبرعات بعد العرض على مجلـس إدارتـه\nوموافقة ثلثى أعضائه على الأقل  ،ووفق ًا للقواعد والإجراءات المقررة قانون ًا .\n\nويكون للمجلس حساب خاص ضمن حساب الخزانة الموحد لدى البنك المركزى ،\nوله أن يفتح حسابا لدى أحد البنوك المسجلة لدى البنك المركزى بعـد موافقـة وزيـر\nالمالية  ،ويرحل فائض أمواله من سنة مالية إلى أخـرى  ،ولـه أن يـستثمر أموالـه\nاستثمارا أمن ًا  ،ويخضع حسابه لرقابة الجهاز المركزى للمحاسبات .", "text_ru": "Совет вправе принимать дары, гранты и пожертвования после их рассмотрения советом директоров и одобрения не менее чем двумя третями его членов, в соответствии с установленными законом правилами и процедурами.\n\nСовет имеет специальный счёт в составе единого казначейского счёта в Центральном банке; он вправе открыть счёт в одном из банков, зарегистрированных в Центральном банке, после согласования с министром финансов; остаток его средств переносится из одного финансового года в другой; он вправе безопасно инвестировать свои средства; его счета подлежат контролю со стороны Центрального агентства по учёту и контролю.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава первая", "chapter_title_ru": "Социальный диалог"}, {"number": "194", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثانى", "chapter_title": "المفاوضة الجماعية", "text": "تجرى المفاوضة الجماعية بحرية وطواعية فى إطار من التوازن بـين مـصالح\nطرفيها من أجل :\n-١تحسين شروط وظروف العمل  ،وأحكام التشغيل .\n-٢التعاون بين طرفى علاقة العمل لتحقيق التنمية الاجتماعية لعمال المنشأة .\n-٣تسوية المنازعات الجماعية بين العمال وأصحاب الأعمال .", "text_ru": "Коллективные переговоры проводятся свободно и добровольно в рамках баланса интересов их сторон в целях:\n1. улучшения условий и обстоятельств труда, положений о трудоустройстве;\n2. сотрудничества между сторонами трудового отношения для достижения социального развития работников предприятия;\n3. урегулирования коллективных споров между работниками и работодателями.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Коллективные переговоры"}, {"number": "195", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثانى", "chapter_title": "المفاوضة الجماعية", "text": "تكون المفاوضة الجماعية علـى مـستوى المنـشأة أو فروعهـا  ،أو المهنـة ،\nأو الصناعة  ،أو على المستوى الإقليمى  ،أو على المستوى القومى .", "text_ru": "Коллективные переговоры проводятся на уровне предприятия или его филиалов, профессии, отрасли, на региональном уровне либо на общенациональном уровне.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Коллективные переговоры"}, {"number": "196", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثانى", "chapter_title": "المفاوضة الجماعية", "text": "إذا أثير نزاع عمل جماعى وجب على طرفيه الدخول فـى مفاوضـة جماعيـة\nلتسويته وديا .\nويلتزم طرفا المفاوضة الجماعية بتقديم ما يطلب منهما من بيانـات ومعلومـات\nومستندات تتعلق بموضوع النزاع  ،والسير فى إجراءات المفاوضة .\nفإذا رفض أحد الطرفين البدء فى إجراءات المفاوضة الجماعيـة جـاز للطـرف\nالآخر أن يطلب من الجهة الإدارية المختصة تحريـك إجـراءات التفـاوض بـدعوة\nمنظمة أصحاب الأعمال أو المنظمة النقابية العمالية المعنيـة أو المفـوض العمـالي ،\nبحسب الأحوال  ،للتدخل وإقناع الطرف الرافض بالعدول عن موقفه .", "text_ru": "Если возникает коллективный трудовой спор, обе его стороны обязаны вступить в коллективные переговоры для его мирного урегулирования.\n\nОбе стороны коллективных переговоров обязаны предоставлять запрашиваемые у них сведения, информацию и документы, относящиеся к предмету спора, и продолжать переговорный процесс.\n\nЕсли одна из сторон отказывается приступить к процедуре коллективных переговоров, другая сторона вправе обратиться в компетентный административный орган с требованием инициировать переговорный процесс путём приглашения соответствующей организации работодателей, соответствующей профсоюзной организации работников либо уполномоченного представителя работников, в зависимости от обстоятельств, для вмешательства и убеждения отказывающейся стороны отказаться от своей позиции.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Коллективные переговоры"}, {"number": "197", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثانى", "chapter_title": "المفاوضة الجماعية", "text": "إذا أسفرت المفاوضة الجماعية عن اتفاق الطرفين يدون اتفاقهما فى اتفاقية عمـل\nجماعية طبق ًا للشروط والقواعد المحددة فى هذا القانون .", "text_ru": "Если коллективные переговоры завершаются достижением сторонами соглашения, их соглашение оформляется в виде коллективного трудового договора в соответствии с условиями и правилами, установленными настоящим Трудовым кодексом.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Коллективные переговоры"}, {"number": "198", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثانى", "chapter_title": "المفاوضة الجماعية", "text": "يحظر على طرفى علاقة العمل أثناء المفاوضة اتخـاذ إجـراءات  ،أو إصـدار\nقرارات تتعلق بالموضوعات محل التفاوض  ،إلا فى حالـة الـضرورة والاسـتعجال\nويشترط أن يكون الإجراء أو القرار فى هذه الحالة مؤقت ًا .", "text_ru": "Сторонам трудового отношения запрещается в ходе переговоров предпринимать действия или выносить решения, касающиеся вопросов, являющихся предметом переговоров, кроме случаев необходимости и неотложности, при условии, что такое действие или решение в этом случае носит временный характер.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава вторая", "chapter_title_ru": "Коллективные переговоры"}, {"number": "199", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "مع عدم الإخلال بأحكام قانون المنظمات النقابية العمالية وحمايـة حـق التنظـيم\nالنقابى المشار إليه  ،يكون إبرام الاتفاقية الجماعية لمدة لا تزيد على ثلاث سـنوات ،\nأو للمدة اللازمة لتنفيذ مشروع معين  ،فإذا زادت المدة فى الحالة الأخيرة على ثـلاث\nسنوات تعين على طرفى الاتفاقية التفاوض لتجديدها أو لتعديل شروطها فـى ضـوء\nما يستجد من ظروف اقتصادية  ،أو اجتماعية  ،وتتبـع فـى شـأن التجديـد أحكـام\nالمادة (٢٠٢)من هذا القانون .", "text_ru": "Без ущерба для положений упомянутого Закона о профсоюзных организациях работников и защите права на профсоюзную организацию, коллективный трудовой договор заключается на срок, не превышающий трёх лет, либо на срок, необходимый для реализации определённого проекта; если в последнем случае этот срок превышает три года, стороны договора обязаны провести переговоры о его продлении либо об изменении его условий с учётом новых экономических или социальных обстоятельств; в отношении продления применяются положения статьи (202) настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "200", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يقع باطلا ً كل نص يرد فى اتفاقية العمل الجماعية ويكون مخالف ًـا لأحكـام هـذا\nالقانون  ،أو القوانين ذات الصلة .\nوفى حالة تعارض نص فى عقد العمل الفردى مع نص فـى الاتفاقيـة  ،يـسرى\nالحكم الذى يحقق فائدة كبرى للعامل .", "text_ru": "Любое положение коллективного трудового договора, противоречащее положениям настоящего Трудового кодекса либо связанных с ним законов, является недействительным.\n\nВ случае противоречия между положением индивидуального трудового договора и положением коллективного договора применяется положение, обеспечивающее наибольшую выгоду для работника.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "201", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يجب أن تكون اتفاقية العمل الجماعية مكتوبة باللغة العربية  ،ويجوز كتابة نسخة\nمنها بلغة أجنبية  ،وفى حالة التعارض أو الخلاف يعتد بالنص المكتوب باللغة العربية .", "text_ru": "Коллективный трудовой договор должен быть составлен в письменной форме на арабском языке; допускается составление его копии на иностранном языке; в случае противоречия или расхождения применяется текст, составленный на арабском языке.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "202", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يتعين على طرفى اتفاقية العمل الجماعية سـلوك طريـق المفاوضـة الجماعيـة\nلتجديدها قبل انتهاء مدتها بثلاثة أشهر  ،فإذا انقضت المدة الأخيرة دون الاتفاق علـى\nالتجديد امتد العمل بالاتفاقية مدة ثلاثة أشهر ويستمر التفاوض لتجديدها  ،فإذا انقـضى\nشهران دون التوصل إلى اتفاق كان لأى من طرفى الاتفاقية عرض الأمر على الجهـة\nالإدارية المختصة لاتخاذ ما يلزم نحو اتباع إجراءات الوساطة وفق ًا لأحكام هذا القانون .", "text_ru": "Стороны коллективного трудового договора обязаны провести коллективные переговоры о его продлении за три месяца до истечения его срока; если этот последний срок истёк без достижения соглашения о продлении, действие договора продлевается на три месяца, и переговоры о его продлении продолжаются; если по истечении двух месяцев соглашение не достигнуто, любая из сторон договора вправе передать вопрос на рассмотрение компетентного административного органа для принятия необходимых мер по применению процедур посредничества в соответствии с положениями настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "203", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "تكون اتفاقية العمل الجماعية نافذة وملزمة لطرفيها بعد التوقيع عليهـا  ،ويتعـين\nإيداعها لدى الجهة الإدارية المختصة لقيدها خلال ثلاثين يوما من تاريخ التوقيع عليهـا\nفى سجل ورقى أو إلكترونى يعد لهذا الغرض  ،ويجوز للجهـة الإداريـة المختـصة\nالاعتراض عليها إذا توافرت حالة من الحالات المنصوص عليها فـى المـادة (٢٠٠)\nمن هذا القانون  ،وإخطار طرفى الاتفاقية بالاعتراض وأسبابه  ،وذلك بكتاب موصـى\nعليه ومصحوبا بعلم الوصول .\nفإذا انقضت المدة المذكورة  ،ولم تقم الجهة الإداريـة المختـصة بـالاعتراض ،\nوجب عليها إجراء القيد وفق ًا للأحكام السابقة .", "text_ru": "Коллективный трудовой договор вступает в силу и становится обязательным для его сторон после его подписания; он подлежит сдаче на хранение в компетентный административный орган для регистрации в течение тридцати дней со дня его подписания в бумажном или электронном реестре, ведущемся для этой цели; компетентный административный орган вправе заявить возражение против него при наличии одного из случаев, предусмотренных статьёй (200) настоящего Трудового кодекса, и уведомить обе стороны договора о возражении и его основаниях заказным письмом с уведомлением о вручении.\n\nЕсли указанный срок истёк, а компетентный административный орган не заявил возражения, он обязан произвести регистрацию в соответствии с приведёнными выше положениями.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "204", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "إذا رفضت الجهة الإدارية المختصة قيد الاتفاقية وفق أحكام المادة (٢٠٣)من هذا\nالقانون  ،جاز لأى من طرفى الاتفاقية اللجوء إلى قاضى الأمور المستعجلة بالمحكمـة\nالعمالية المختصة التى يقع بدائرتها محل العمل  ،وفق ًا للإجراءات المعتادة لرفع الدعوى\n،وذلك خلال ثلاثين يوما من تاريخ الإخطار بالاعتراض  ،فإذا قضت بقيـد الاتفاقيـة\nوجب على الجهة الإدارية المختصة إجراء القيد فى السجل الخاص بذلك .", "text_ru": "Если компетентный административный орган отказывает в регистрации договора в соответствии с положениями статьи (203) настоящего Трудового кодекса, любая из сторон договора вправе обратиться к судье по неотложным делам компетентного трудового суда, в юрисдикции которого находится место работы, в соответствии с обычным порядком предъявления иска, в течение тридцати дней со дня уведомления о возражении; если он выносит решение о регистрации договора, компетентный административный орган обязан произвести регистрацию в специальном для этого реестре.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "205", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يلتزم صاحب العمل بأن يضع اتفاقيـة العمـل الجماعيـة فـى مكـان ظـاهر\nبمحل العمل  ،متضمنة نصوصها والموقعين عليهـا وتـاريخ إيـداعها لـدى الجهـة\nالإدارية المختصة .", "text_ru": "Работодатель обязан разместить коллективный трудовой договор на видном месте по месту работы с указанием его положений, подписавших его лиц и даты его сдачи на хранение в компетентный административный орган.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "206", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يكون الانضمام إلى الاتفاقية بعد قيدها لدى الجهة الإداريـة المختـصة للعمـال\nومنظماتهم النقابية  ،وأصحاب الأعمال ومنظماتهم من غير طرفى الاتفاقية الجماعية ،\nبناء على اتفاق بين الطرفين الراغبين فى الانضمام ودون حاجة إلى موافقـة طرفـى\nالاتفاقية الأصليين  ،بطلب موقع من الطرفين يقدم إلى الجهة الإدارية المختصة .", "text_ru": "Присоединение к договору после его регистрации в компетентном административном органе работников и их профсоюзных организаций, работодателей и их организаций, не являющихся сторонами коллективного договора, производится на основании соглашения между желающими присоединиться сторонами без необходимости согласия первоначальных сторон договора, по заявлению, подписанному обеими сторонами и подаваемому в компетентный административный орган.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "207", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "تلتزم الجهة الإدارية المختصة بالتأشير على هامش السجل المشار إليـه فـى المـادة (٢٠٣)\nمن هذا القانون بما يطرأ على اتفاقيـة العمـل الجماعيـة مـن تجديـد  ،أو انـضمام ،\nأو تعديل خلال خمسة عشر يوما من تاريخ حصوله .", "text_ru": "Компетентный административный орган обязан делать отметку на полях реестра, указанного в статье (203) настоящего Трудового кодекса, о вносимых в коллективный трудовой договор изменениях в связи с продлением, присоединением или изменением, в течение пятнадцати дней со дня получения соответствующих сведений.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "208", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "يلتزم طرفا اتفاقية العمل الجماعية بتنفيذها بطريقة تتفق مع ما يقتـضيه حـسن النيـة ،\nوأن يمتنعا عن القيام بأى عمل  ،أو إجراء  ،من شأنه أن يعطل تنفيذ أحكامها .", "text_ru": "Стороны коллективного трудового договора обязаны исполнять его добросовестным образом и воздерживаться от совершения каких-либо действий или мер, которые могли бы воспрепятствовать исполнению его положений.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "209", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "إذا طرأت ظروف استثنائية غير متوقعة وترتب علـى حـدوثها أن تنفيـذ أحـد\nالطرفين للاتفاقية  ،أو لحكم من أحكامها أصبح مرهق ًا  ،وجب على الطـرفين سـلوك\nطريق المفاوضة الجماعية لمناقشة هذه الظروف  ،والوصول إلى اتفاق يحقق التـوازن\nبين مصلحتيهما .\nفإذا لم يصل الطرفان إلى اتفاق وجب عليهما عرض الأمر على الجهة الإداريـة\nالمختصة لاتخاذ ما يلزم نحو اتباع إجراءات التوفيق  ،أو الوسـاطة والتحكـيم وفق ًـا\nلأحكام هذا القانون .", "text_ru": "Если возникают непредвиденные исключительные обстоятельства, вследствие которых исполнение одной из сторон договора или одного из его положений становится чрезмерно обременительным, стороны обязаны прибегнуть к коллективным переговорам для обсуждения этих обстоятельств и достижения соглашения, обеспечивающего баланс их интересов.\n\nЕсли стороны не достигают соглашения, они обязаны передать вопрос на рассмотрение компетентного административного органа для принятия необходимых мер по применению процедур примирения, посредничества либо арбитража в соответствии с положениями настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "210", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "لكل من طرفى اتفاقية العمل الجماعية  ،وكذلك لكل ذى مصلحة مـن العمـال ،\nأو أصحاب الأعمال  ،أن يطلب الحكم بتنفيذ أى من أحكامها  ،أو بالتعويض عن عـدم\nتنفيذها أو مخالفتها .\n\nولا يحكم بالتعويض على المنظمة النقابية العمالية المعنية  ،أو منظمـة أصـحاب\nالأعمال  ،إلا إذا كان التصرف الذى ترتب عليه الضرر الموجب للتعويض قد صـدر\nعن مجلس إدارة المنظمة  ،أو الممثل القانونى لها .", "text_ru": "Каждая из сторон коллективного трудового договора, а также любое заинтересованное лицо из числа работников или работодателей, вправе требовать вынесения решения об исполнении любого из его положений либо о возмещении убытков за его неисполнение или нарушение.\n\nРешение о возмещении убытков в отношении соответствующей профсоюзной организации работников или организации работодателей выносится только в том случае, если действие, повлёкшее причинение ущерба, послужившего основанием для возмещения, было совершено советом директоров организации либо её законным представителем.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "211", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "للمنظمة النقابية العمالية  ،ولمنظمـة أصـحاب الأعمـال التـى تكـون طرف ًـا\nفى الاتفاقية الجماعية أن ترفع لمصلحة أى عضو من أعضائها جميع الدعاوى الناشئة\nعن الإخلال بأحكام الاتفاقية .\nوللعضو الذى رفعت الدعوى من المنظمة لمصلحته أن يتدخل فيها  ،كما يجـوز\nله رفع هذه الدعوى ابتداء مستقلا ً عنها .", "text_ru": "Профсоюзная организация работников и организация работодателей, являющиеся стороной коллективного договора, вправе предъявлять в интересах любого из своих членов любые иски, возникающие в связи с нарушением положений договора.\n\nЧлен, в интересах которого организацией предъявлен иск, вправе вступить в него; он также вправе предъявить этот иск самостоятельно, независимо от неё.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "212", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الثالث", "chapter_title": "اتفاقيات العمل الجماعية", "text": "مع عدم الإخلال بحق التقاضي  ،تخـضع المنازعـات الناشـئة عـن الاتفاقيـة\nالجماعية للإجراءات التى يتفق عليها الطرفان  ،مع مراعاة الأحكام الواردة فى البـاب\nالثالث من هذا الكتاب .\nالفرع الأول\nأحكام عامة", "text_ru": "Без ущерба для права на судебную защиту, споры, возникающие в связи с коллективным договором, подчиняются процедурам, согласованным сторонами, с учётом положений, содержащихся в разделе третьем настоящей книги.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава третья", "chapter_title_ru": "Коллективные трудовые договоры"}, {"number": "213", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "مع عدم الإخلال بحق التقاضي  ،تسرى أحكام هذا الفصل على كل نزاع يتعلـق\nبشروط العمل أو ظروفه أو أحكام التشغيل ينشأ بـين صـاحب عمـل أو مجموعـة\nمن أصحاب الأعمال  ،أو منظماتهم  ،وجميع العمال أو فريق منهم أو منظماتهم .", "text_ru": "Без ущерба для права на судебную защиту, положения настоящей главы применяются к любому спору, касающемуся условий труда, его обстоятельств или условий трудоустройства, возникающему между работодателем или группой работодателей либо их организациями, с одной стороны, и всеми работниками либо их частью или их организациями, с другой стороны.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "214", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "إذا انقضى شهر من تاريخ بدء المفاوضة دون الوصول إلى اتفاق جاز للطـرفين\nأو لأحدهما اللجوء للجهة الإدارية المختصة لبدء إجراءات التوفيق .\n\nالفرع الثانى\nالتوفيق", "text_ru": "Если после начала переговоров прошёл месяц без достижения соглашения, обе стороны либо одна из них вправе обратиться в компетентный административный орган для начала процедуры примирения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "215", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "تحدد الجهة الإدارية المختصة جلسة للتوفيق فى النزاع فـى موعـد لا يتجـاوز\nخمسة أيام من تاريخ تقديم الطلب إليها  ،ويخطر به طرفا النزاع قبل الموعد المحـدد\nبثلاثة أيام على الأقل .\nويصدر الوزير المختص قرارا بإجراءات وقواعد التوفيق .", "text_ru": "Компетентный административный орган назначает заседание по примирению в споре в срок, не превышающий пяти дней со дня подачи ему заявления, и уведомляет об этом обе стороны спора не позднее чем за три дня до назначенного срока. Компетентный министр издаёт решение о процедурах и правилах примирения.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "216", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "إذا اتفق طرفا النزاع على تسويته وديا وفق ًا لأحكام هذا الفرع  ،يحـرر الاتفـاق\nويوقع عليه منهما فى اتفاقية عمل جماعية  ،وتتخذ بشأنه الإجراءات الواردة فى هـذا\nالقانون  ،وتكون ملزمة لهما .", "text_ru": "Если обе стороны спора договариваются о его мирном урегулировании в соответствии с положениями настоящего раздела, соглашение оформляется и подписывается ими в виде коллективного трудового договора; в отношении него принимаются меры, предусмотренные настоящим Трудовым кодексом, и оно является обязательным для них.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "217", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "مع مراعاة أحكام قانون التحكيم فى المواد المدنية والتجاريـة الـصادر بالقـانون\nرقم  ۲۷لسنة  ، ١٩٩٤إذا لم تتم تسوية النزاع خلال واحد وعشرين يوما من تاريخ بدء\nالتوفيق  ،جاز للطرفين اللجوء إلى الجهة الإدارية المختصة لاتخاذ إجـراءات إحالـة\nالنزاع إلى مركز الوساطة والتحكيم المنصوص عليه فى المادة (٢١٨)من هذا القانون .\nالفرع الثالث\nمركز الوساطة والتحكيم", "text_ru": "С учётом положений Закона об арбитраже по гражданским и торговым делам № 27 от 1994 года, если спор не урегулирован в течение двадцати одного дня со дня начала примирения, обе стороны вправе обратиться в компетентный административный орган для принятия мер по передаче спора в центр посредничества и арбитража, предусмотренный статьёй (218) настоящего Трудового кодекса.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "218", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "ينشأ بالوزارة المختصة مركز يسمى \"مركز الوسـاطة والتحكـيم\"  ،تكـون لـه\nالشخصية الاعتبارية  ،ويتبع الوزير المختص  ،ويتكون من قسمين قـسم الوسـاطة ،\nوقسم التحكيم .\nويكون له رئيس تنفيذى يصدر بتعيينه وتحديد معاملته المالية قرار مـن رئـيس\nمجلس الوزراء بناء على ترشيح من الوزير المختص  ،وذلك لمـدة ثـلاث سـنوات\nقابلة للتجديد .\n\nويصدر رئـيس مجلـس الـوزراء قـرارا بتحديـد الهيكـل الإدارى والمـالى\nلمركز الوساطة والتحكيم ونظام العمل به والرسوم المقررة على خدماته بما لا يجـاوز\nخمسين ألف جنيه  ،وحالات الإعفاء منها .\nويلتزم مركز الوساطة والتحكيم بنصوص هذا القانون وجميع القرارات واللـوائح\nالصادرة تنفيذ ًا له والضمانات والمبادئ الأساسية للتقاضى فى قانون المرافعات المدنية\nوالتجارية  ،وتسرى فى ما لم يرد فى شأنه نص خاص فى هذا القانون ولوائح مركـز\nالوساطة والتحكيم أحكام قانون التحكيم فى المواد المدنية والتجارية المشار إليه .", "text_ru": "При компетентном министерстве учреждается центр под названием «Центр посредничества и арбитража», обладающий правосубъектностью, подведомственный компетентному министру, состоящий из двух отделов: отдела посредничества и отдела арбитража.\n\nЦентр имеет исполнительного директора, назначение которого и определение условий его материального вознаграждения производится решением Председателя Совета министров по представлению компетентного министра сроком на три года с возможностью продления.\n\nПредседатель Совета министров издаёт решение об определении административной и финансовой структуры центра посредничества и арбитража, регламента его работы, установленных пошлин за его услуги — не свыше пятидесяти тысяч фунтов, — и случаев освобождения от них.\n\nЦентр посредничества и арбитража обязан соблюдать положения настоящего Трудового кодекса и все изданные во исполнение его решения и регламенты, а также гарантии и основные принципы судопроизводства, установленные Законом о гражданском и торговом судопроизводстве; в части, не урегулированной специальной нормой настоящего Трудового кодекса и регламентов центра посредничества и арбитража, применяются положения упомянутого Закона об арбитраже по гражданским и торговым делам.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "219", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "يعد مركز الوساطة والتحكيم قائمة من الوسطاء وقائمة من المحكمين الذين تنطبق\nعليهم الشروط الواردة فى هذا القانون  ،ويؤدى كل منهم أمام رئيس المركـز القـسم\nالآتى \" :أقسم باالله العظيم أن أؤدى مهمتى بالذمة والأمانة والصدق وألا أفـشى سـرا\nمن أسرار العمل التى أطلع عليها بحكم مهمتى\" .", "text_ru": "Центр посредничества и арбитража ведёт список посредников и список арбитров, отвечающих требованиям, установленным настоящим Трудовым кодексом; каждый из них приносит перед председателем центра следующую присягу: «Клянусь Всемогущим Богом исполнять свои обязанности добросовестно, честно и правдиво и не разглашать никакую производственную тайну, ставшую мне известной в силу исполнения моих обязанностей».", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "220", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "استثناء من أحكام المادتين (٢٢٦) ، ٢٢١من هذا القانون  ،يجوز لمركـز الوسـاطة\nوالتحكيم الاستعانة بأعضاء من الجهات والهيئات القضائية بعد موافقة مجالسهم الخاصة .", "text_ru": "В порядке исключения из положений статей (221) и (226) настоящего Трудового кодекса центр посредничества и арбитража вправе привлекать членов судебных органов и учреждений после согласия их соответствующих советов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "221", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "يشترط فيمن يقيد بقائمة الوسطاء الشروط الآتية :\n-١أن يكون حاصلا ً على مؤهل عالٍ .\n-٢أن يكون محمود السيرة  ،وحسن السمعة .\n-٣ألا يكون قد سبق إدانته فى جناية أو جنحـة مخلـة بالـشرف أو الأمانـة ،\nما لم يكن قد رد إليه اعتباره .\n-٤ألا يكون من العاملين بالجهاز الإدارى للدولة .\n-٥ألا يكون قد سبق فصله بالطريق التأديبي .\n-٦قضاء مدة التدريب الأولى على أعمال الوساطة ومجالاتها بالمركز .\n- ٧اجتياز الاختبار الذى يعقده مركز الوساطة والتحكـيم بدرجـة لا تقـل عـن\nسبعين بالمائة .", "text_ru": "Лицо, вносимое в список посредников, должно отвечать следующим требованиям:\n1. иметь высшее образование;\n2. обладать безупречной репутацией и добрым именем;\n3. не иметь судимости за преступление или проступок, порочащий честь или добросовестность, если только его правоспособность не была восстановлена;\n4. не являться работником государственного административного аппарата;\n5. не подвергаться ранее увольнению в дисциплинарном порядке;\n6. пройти первоначальную стажировку по вопросам посреднической деятельности и её направлениям в центре;\n7. успешно сдать экзамен, проводимый центром посредничества и арбитража, с результатом не менее семидесяти процентов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "222", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "لطرفى النزاع اختيار أحد الوسطاء المقيدين بالقائمة فى موعد غايته سـبعة أيـام\nمن تاريخ تقديم طلب الوساطة .\nفإذا انقضت المدة المشار إليها  ،ولم يتفق الطرفـان علـى اختيـار الوسـيط ،\nتولى المركز اختيار الوسيط خلال ثلاثة أيام من تاريخ انتهاء تلك المدة .", "text_ru": "Обе стороны спора вправе выбрать одного из посредников, внесённых в список, в срок не позднее семи дней со дня подачи заявления о посредничестве. Если указанный срок истёк, а стороны не договорились о выборе посредника, центр самостоятельно назначает посредника в течение трёх дней со дня истечения этого срока.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "223", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "تبدأ مهمة الوسيط من تاريخ إحالة النزاع إليه  ،وعليه إنجاز مهمته خلال شهر .\nوللوسيط جميع الصلاحيات فى نظر النزاع  ،والإلمام بعناصره  ،وله على وجـه\nالخصوص سماع طرفى النزاع والاطلاع على ما يلزم من مستندات  ،وطلب البيانات\nوالمعلومات التى تعينه على أداء مهمته .", "text_ru": "Обязанности посредника начинаются со дня передачи ему спора; он обязан выполнить свою задачу в течение месяца. Посредник обладает всеми полномочиями по рассмотрению спора и ознакомлению с его обстоятельствами; в частности, он вправе заслушивать обе стороны спора, знакомиться с необходимыми документами и запрашивать сведения и информацию, помогающие ему в выполнении его задачи.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "224", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "مع عدم الإخلال بحكم المادة (٢٢٣)من هذا القـانون  ،يحـق لطرفـى النـزاع\nأو أحدهما خلال خمسة عشر يوما أن يطلب من مركز الوسـاطة والتحكـيم اسـتبدال\nوسيط النزاع لمرة واحدة  ،فإذا رفض الطرف الآخر اسـتبداله تعـين علـى مركـز\nالوساطة والتحكيم الفصل فى هذا الطلب فى موعد لا يجاوز يومين  ،فإذا تـم اختيـار\nوسيط جديد تحسب مدة أعماله من تاريخ تسلمه للمهمة .", "text_ru": "Без ущерба для положения статьи (223) настоящего Трудового кодекса, обе стороны спора либо одна из них вправе в течение пятнадцати дней потребовать от центра посредничества и арбитража заменить посредника по спору один раз; если другая сторона возражает против его замены, центр посредничества и арбитража обязан разрешить это требование в срок, не превышающий двух дней; если избирается новый посредник, срок его работы исчисляется со дня принятия им дела.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "225", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "على الوسيط أن يبذل مساعيه للتقريب بـين وجهـات نظـر طرفـى النـزاع ،\nفإذا لم يتمكن من تحقيق ذلك كان عليه أن يقدم للطرفين كتابة ما يقترحه من توصـيات\nلحل النزاع .\nفإذا قبل الطرفان التوصيات التى قدمها الوسيط يتم إثبات ذلك فى اتفـاق يوقعـه\nالطرفان والوسيط ويصبح هذا الاتفاق ملزما للطرفين فى حدود ما تم الاتفـاق عليـه ،\nويثبت ذلك بالسجل الورقى أو الإلكترونى المعد لهذا الشأن .\nوإذا لم يقبل الطرفان هذه التوصيات أو بعضها يعرض الوسيط عليهمـا اللجـوء\nإلى التحكيم  ،فإذا وافقا أحيل النزاع إلى قسم التحكيم بالمركز .\n\nوفى جميع الأحوال  ،على وسيط النزاع أن يقدم خلال خمسة أيام من تـاريخ انتهـاء\nمهمته تقريرا لقسم الوساطة  ،يتضمن ملخصا للنـزاع والأوراق  ،والمـستندات المقدمـة\nمن طرفيه  ،والتوصيات  ،وما تم قبوله من الطرفين  ،وما تم رفضه وأسباب الرفض .", "text_ru": "Посредник обязан прилагать усилия для сближения точек зрения обеих сторон спора; если ему не удаётся этого достичь, он обязан представить сторонам в письменной форме предлагаемые им рекомендации по разрешению спора.\n\nЕсли обе стороны принимают рекомендации, представленные посредником, это фиксируется в соглашении, подписываемом обеими сторонами и посредником, которое становится обязательным для сторон в пределах достигнутого соглашения и удостоверяется в бумажном или электронном реестре, ведущемся для этой цели.\n\nЕсли стороны не принимают эти рекомендации полностью или частично, посредник предлагает им обратиться к арбитражу; если они соглашаются, спор передаётся в отдел арбитража центра.\n\nВ любом случае посредник по спору обязан в течение пяти дней со дня завершения своей задачи представить отделу посредничества доклад, содержащий краткое изложение спора, документов и материалов, представленных обеими сторонами, рекомендаций, того, что было принято сторонами, и того, что было отклонено, с указанием оснований отказа.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "226", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "يشترط فيمن يقيد بقائمة المحكمين  ،الشروط الآتية :\n-١أن يكون حاصلا ً على إجازة الحقوق مـن إحـدى الجامعـات المـصرية ،\nأو ما يعادلها .\n-٢أن يكون محمود السيرة  ،وحسن السمعة .\n-٣ألا يكون قد سبق إدانته فى جناية  ،أو جنحة مخلـة بالـشرف أو الأمانـة ،\nما لم يكن قد رد إليه اعتباره .\n-٤ألا يكون من العاملين بالجهاز الإدارى للدولة .\n-٥ألا يكون قد سبق فصله بالطريق التأديبي .\n-٦قضاء مدة التـدريب الأولـى لمركـز الوسـاطة والتحكـيم علـى أعمـال\nالتحكيم  ،ومجالاته .\n-٧اجتياز الاختبار الذى يعقد من مركز الوسـاطة والتحكـيم بدرجـة لا تقـل\nعن خمسة وسبعين بالمائة .", "text_ru": "Лицо, вносимое в список арбитров, должно отвечать следующим требованиям:\n1. иметь диплом о высшем юридическом образовании одного из египетских университетов либо эквивалентный ему документ;\n2. обладать безупречной репутацией и добрым именем;\n3. не иметь судимости за преступление или проступок, порочащий честь или добросовестность, если только его правоспособность не была восстановлена;\n4. не являться работником государственного административного аппарата;\n5. не подвергаться ранее увольнению в дисциплинарном порядке;\n6. пройти первоначальную стажировку центра посредничества и арбитража по вопросам арбитражной деятельности и её направлениям;\n7. успешно сдать экзамен, проводимый центром посредничества и арбитража, с результатом не менее семидесяти пяти процентов.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "227", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "تشكل هيئة التحكيم باتفاق الطرفين من محكم واحد أو أكثر  ،بـشرط أن يكـون\nالعدد فرديا  ،لنظر النزاع القائم  ،وذلك فى موعد غايته خمسة عشر يوما من تـاريخ\nإحالة النزاع لقسم التحكيم .\nوإذا لم يتفق طرفا التحكيم على اختيار المحكمين خـلال المـدة المـشار إليهـا\nفى الفقرة الأولى من هذه المادة يتولى المركز اختيار المحكمين وفق ًا للـوائح المنظمـة\nلعمل المركز .", "text_ru": "Арбитражная коллегия образуется по соглашению сторон из одного или более арбитров, при условии, что их число нечётное, для рассмотрения существующего спора, в срок не позднее пятнадцати дней со дня передачи спора в отдел арбитража. Если стороны арбитража не договорились о выборе арбитров в течение срока, указанного в первом абзаце настоящей статьи, центр самостоятельно избирает арбитров в соответствии с регламентами, регулирующими работу центра.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "228", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "يوقع طرفا النزاع مشارطة التحكيم التى تحوى موضـوع النـزاع  ،والـشروط\nوالإجراءات التى يجرى عليها التحكيم  ،وتتبع فيما لـم تتـضمنه مـشارطة التحكـيم\nالأحكام المقررة فى قانون التحكيم فى المواد المدنية والتجارية المشار إليه .", "text_ru": "Обе стороны спора подписывают арбитражное соглашение, содержащее предмет спора, условия и процедуры, по которым проводится арбитраж; в части, не предусмотренной арбитражным соглашением, применяются положения упомянутого Закона об арбитраже по гражданским и торговым делам.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "229", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "يتعين على المحكم أو المحكمين عند الفصل فـى النـزاع المعـروض مراعـاة\nالتشريعات المعمول بها داخـل الدولـة  ،والاتفاقيـات الدوليـة المـصدق عليهـا ،\nومبادئ القانون الطبيعى  ،والعرف والعدالة الاجتماعيـة  ،وفق ًـا للحالـة الاقتـصادية\nوالاجتماعية السائدة فى منطقة المنشأة  ،ويصدر الحكـم بأغلبيـة الآراء فـى حالـة\nتعدد المحكمين .\nويتعين على المحكم  ،أو المحكمين الفصل فى النزاع المعروض خـلال ثلاثـين\nيوما من تاريخ إحالة النزاع .\nويعتبر حكم التحكيم نهائيا  ،ويكون قابلا ً للتنفيذ بعد وضع الصيغة التنفيذية عليـه\nمن المحكمة العمالية المختصة .", "text_ru": "Арбитр или арбитры при разрешении переданного им спора обязаны учитывать действующее в государстве законодательство, ратифицированные международные конвенции, принципы естественного права, обычай и социальную справедливость в соответствии с преобладающими экономическими и социальными условиями в районе расположения предприятия; решение выносится большинством голосов в случае множественности арбитров.\n\nАрбитр или арбитры обязаны разрешить переданный им спор в течение тридцати дней со дня передачи спора.\n\nАрбитражное решение считается окончательным и подлежит исполнению после проставления на нём исполнительной формулы компетентным трудовым судом.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "230", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الرابع", "chapter_title": "منازعات العمل الجماعية", "text": "تشكل بقسم التحكيم دائرة عليا أو أكثر  ،لإعادة النظـر  ،مكونـة مـن خمـسة\nمحكمين من المقيدين بقائمتها للطعن فى الأحكام المـشار إليهـا فـى المـادة (٢٢٩)\nمن هذا القانون .\nوإذا تضمن شرط أو مشارطة التحكيم أن يكون على درجتين  ،يحال النزاع إلـى\nتلك الدائرة خلال خمسة عشر يوما من تاريخ صدور حكم أول درجة  ،ويتعين عليهـا\nالفصل فى النزاع خلال خمسة وأربعين يوما من تاريخ الإحالة إليها .", "text_ru": "В отделе арбитража образуется одна или более коллегий высшей инстанции для пересмотра дел, состоящих из пяти арбитров, внесённых в её список, для рассмотрения жалоб на решения, указанные в статье (229) настоящего Трудового кодекса.\n\nЕсли арбитражная оговорка или арбитражное соглашение предусматривают две инстанции, спор передаётся в эту коллегию в течение пятнадцати дней со дня вынесения решения первой инстанции; она обязана разрешить спор в течение сорока пяти дней со дня передачи ей спора.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава четвёртая", "chapter_title_ru": "Коллективные трудовые споры"}, {"number": "231", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "للعمال حق الإضراب عن العمل للمطالبة بما يرونه محقق ًـا لمـصالحهم المهنيـة\nوالاقتصادية والاجتماعية  ،وذلك بعد اسـتنفاد طـرق التـسوية الوديـة للمنازعـات\nالمنصوص عليها فى هذا القانون  ،ويكون إعلانه  ،وتنظيمـه مـن خـلال المنظمـة\nالنقابية العمالية المعنية  ،أو المفوض العمالى فى حدود الضوابط والإجراءات المقـررة\nفى هذا القانون .", "text_ru": "Работники имеют право на забастовку в целях достижения того, что они считают отвечающим их профессиональным, экономическим и социальным интересам, после исчерпания способов мирного урегулирования споров, предусмотренных настоящим Трудовым кодексом; её объявление и организация производятся соответствующей профсоюзной организацией работников либо уполномоченным представителем работников в пределах требований и процедур, установленных настоящим Трудовым кодексом.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "232", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يجب أن يتضمن الإعلان عن الإضراب  ،إخطار كل من صاحب العمل والجهـة\nالإدارية المختصة قبل التاريخ المحدد للإضراب بعشرة أيام على الأقل  ،وذلك بكتـاب\nمسجل وموصى عليه بعلم الوصول  ،على أن يتـضمن الإخطـار الأسـباب الدافعـة\nللإضراب ومواعيده .", "text_ru": "Объявление о забастовке должно включать уведомление работодателя и компетентного административного органа не менее чем за десять дней до установленной даты забастовки заказным письмом с уведомлением о вручении; уведомление должно содержать причины, побудившие к забастовке, и её сроки.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "233", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يحظر على العمال الدعوة إلى الإضراب  ،أو إعلانه بقصد تعديل اتفاقيـة عمـل\nجماعية أثناء مدة سريانها .", "text_ru": "Работникам запрещается призывать к забастовке либо объявлять её с целью изменения коллективного трудового договора в течение срока его действия.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "234", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يحظر الإضراب أو الدعوة إليه أو إعلانه بالمنشآت الحيوية التى تقـدم خـدمات\nأساسية للمواطنين والتى يترتب على توقف العمل فيها الإخلال بالأمن القومى .\nويحظر الدعوة للإضراب أو إعلانه فى الظروف الاستثنائية .\nويصدر رئيس مجلس الوزراء قرارا بتحديد المنشآت الحيوية والخدمات الأساسية\nالتى تقدمها .", "text_ru": "Забастовка, призыв к ней или её объявление запрещаются на жизненно важных предприятиях, оказывающих основные услуги гражданам, остановка работы на которых повлечёт нарушение национальной безопасности.\n\nПризыв к забастовке или её объявление в исключительных обстоятельствах запрещаются.\n\nПредседатель Совета министров издаёт решение об определении жизненно важных предприятий и основных услуг, оказываемых ими.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "235", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يترتب على الإضراب عن العمل وقف الالتزامات الناشئة عن عقد العمل خـلال\nمدة الإضراب .", "text_ru": "Забастовка влечёт приостановление обязательств, вытекающих из трудового договора, на срок забастовки.", "book_title_ru": "Трудовые отношения", "book_ru": "Книга третья", "part_ru": "Раздел третий", "part_title_ru": "Коллективные трудовые отношения", "chapter_ru": "Глава пятая", "chapter_title_ru": "Забастовка и локаут"}, {"number": "236", "book": "الكتاب الثالث", "book_title": "علاقات العمل", "part": "الباب الثالث", "part_title": "علاقات العمل الجماعية", "chapter": "الفصل الخامس", "chapter_title": "الإضراب والإغلاق", "text": "يحق لصاحب العمل
