<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قانون العمل المصري — نظام مرجعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   قانون العمل المصري — Portal Design System
   Egyptian Labour Law — Professional Legal CSS Architecture
   ========================================================= */

:root {
  --color-primary: #172331;
  --color-primary-light: #243447;
  --color-gold: #b89455;
  --color-gold-light: #d4b77a;
  --color-background: #f5f3ee;
  --color-surface: #ffffff;
  --color-surface-soft: #faf9f6;
  --color-text: #202832;
  --color-text-muted: #6b7280;
  --color-border: #e4e0d7;
  --color-border-dark: #d4cfc3;
  --color-success: #356859;
  --color-danger: #9b4545;
  --shadow-sm: 0 2px 8px rgba(23, 35, 49, 0.05);
  --shadow-md: 0 10px 30px rgba(23, 35, 49, 0.08);
  --shadow-lg: 0 20px 50px rgba(23, 35, 49, 0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --transition: 180ms ease;

  --ink: var(--color-text);
  --paper: var(--color-background);
  --paper-raised: var(--color-surface);
  --brass: var(--color-gold);
  --brass-deep: #8b6b35;
  --navy: var(--color-primary);
  --navy-deep: #0f1823;
  --line: var(--color-border);
  --muted: var(--color-text-muted);
  --danger: var(--color-danger);
  --good: var(--color-success);
  --radius: var(--radius-sm);

  --sans: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
  --serif: 'Amiri', 'Noto Naskh Arabic', serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

:root[data-lang="ru"] {
  --sans: 'Inter', 'Roboto', 'Segoe UI', sans-serif;
  --serif: 'Noto Serif', 'Georgia', serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary: #e9e4d6;
    --color-background: #12181b;
    --color-surface: #182226;
    --color-surface-soft: #1d2a30;
    --color-text: #e9e4d6;
    --color-text-muted: #9aa39a;
    --color-border: #2c393e;
    --ink: #e9e4d6;
    --paper: #12181b;
    --paper-raised: #182226;
    --brass: #c9a55c;
    --brass-deep: #e0bc7c;
    --navy: #dfe8ea;
    --navy-deep: #0a1114;
    --line: #2c393e;
    --muted: #9aa39a;
  }
}

:root[data-theme="dark"] {
  --color-primary: #e9e4d6;
  --color-background: #12181b;
  --color-surface: #182226;
  --color-surface-soft: #1d2a30;
  --color-text: #e9e4d6;
  --color-text-muted: #9aa39a;
  --color-border: #2c393e;
  --ink: #e9e4d6;
  --paper: #12181b;
  --paper-raised: #182226;
  --brass: #c9a55c;
  --brass-deep: #e0bc7c;
  --navy: #dfe8ea;
  --navy-deep: #0a1114;
  --line: #2c393e;
  --muted: #9aa39a;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.65;
  transition: background 200ms ease, color 200ms ease;
}
html[lang="ar"] body { line-height: 1.9; }
html[lang="ru"] body { line-height: 1.65; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
::selection { background: var(--brass); color: #fff; }

/* =========================================================
   HEADER & STICKY TOPBAR
   ========================================================= */
.topbar {
  position: sticky; top: 0; z-index: 1000;
  background: rgba(23, 35, 49, 0.96);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto;
  min-height: 72px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 10px 24px;
}
.brand {
  display: flex; align-items: center; gap: 12px;
  color: #ffffff; font-weight: 700; font-size: 17px;
  white-space: nowrap; text-decoration: none;
}
.brand-logo-svg {
  width: 36px; height: 36px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(212, 183, 122, 0.4);
}
.brand span.full {
  letter-spacing: -0.01em;
  font-family: var(--sans);
}
.topbar-search {
  flex: 1; max-width: 480px;
  display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  padding-block: 7px;
  padding-inline-start: 14px; padding-inline-end: 14px;
  color: #cfd8d4;
  transition: border-color var(--transition), background var(--transition);
}
.topbar-search:focus-within {
  border-color: var(--color-gold);
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 3px rgba(184, 148, 85, 0.2);
}
.topbar-search .search-icon { font-size: 15px; opacity: 0.85; flex-shrink: 0; }
.topbar-search input {
  background: none; border: none; outline: none; color: #fff;
  font-family: var(--sans); font-size: 14px; flex: 1; min-width: 0;
  padding: 2px 0;
}
.topbar-search input::placeholder { color: #9ca8b4; }

.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-links a {
  color: #d8dee5; font-size: 14px; font-weight: 500;
  padding: 8px 14px; border-radius: var(--radius-sm);
  white-space: nowrap; transition: color var(--transition), background var(--transition);
}
.nav-links a:hover { color: #ffffff; background: rgba(255, 255, 255, 0.06); }
.nav-links a.active { color: var(--color-gold-light); font-weight: 600; }

.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  background: none; border: 1px solid rgba(255, 255, 255, 0.16); color: #e7e1cc;
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: border-color var(--transition), color var(--transition), background var(--transition);
}
.icon-btn:hover { border-color: var(--color-gold); color: var(--color-gold-light); background: rgba(255, 255, 255, 0.06); }

/* Language Switcher Segmented Control */
.lang-switcher {
  display: inline-flex; align-items: center;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px; padding: 3px; gap: 3px;
}
.lang-btn {
  background: transparent; border: none; outline: none;
  color: #aeb7c1; font-family: var(--sans); font-size: 12.5px; font-weight: 500;
  padding: 5px 12px; border-radius: 5px; cursor: pointer;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
}
.lang-btn:hover { color: #ffffff; }
.lang-btn.active {
  background: var(--color-gold); color: #172331; font-weight: 700;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

@media (max-width: 960px) {
  .nav-links { display: none; }
  .brand span.full { display: none; }
}

   LAYOUT CONTAINERS & HERO
   ========================================================= */

}
.hero::before {
  content: ""; position: absolute; width: 500px; height: 500px;
  inset-inline-end: -200px; top: -250px;
  border: 1px solid rgba(184, 148, 85, 0.15); border-radius: 50%;
  pointer-events: none;
}
.hero::after {
  content: ""; position: absolute; width: 350px; height: 350px;
  inset-inline-start: -150px; bottom: -200px;
  border: 1px solid rgba(184, 148, 85, 0.10); border-radius: 50%;
  pointer-events: none;
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(32px, 5vw, 54px);
  margin: 0 0 14px; color: #ffffff;
  letter-spacing: -0.02em; line-height: 1.25;
}
.hero p.sub {
  color: #c4ccd5; max-width: 680px; margin: 0 auto 32px;
  font-size: clamp(15px, 2vw, 18px); line-height: 1.7;
}
.search-hero { max-width: 680px; margin: 0 auto; position: relative; z-index: 2; }
.search-hero input {
  width: 100%; padding-block: 16px;
  padding-inline-start: 52px; padding-inline-end: 20px;
  font-size: 16px; border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px; background: rgba(255, 255, 255, 0.08);
  color: #ffffff; font-family: var(--sans); outline: none;
  backdrop-filter: blur(8px);
  transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
}
.search-hero input:focus {
  border-color: var(--color-gold);
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 4px rgba(184, 148, 85, 0.25);
}
.search-hero input::placeholder { color: #9ca8b4; }
.search-hero .go {
  position: absolute; inset-inline-start: 16px; top: 50%;
  transform: translateY(-50%); background: none; border: none;
  color: #d4b77a; font-size: 22px; pointer-events: none;
  display: flex; align-items: center; justify-content: center; z-index: 2;
}
.hero-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
.btn {
  padding: 11px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  border: 1px solid var(--color-border); background: var(--paper-raised); color: var(--ink);
  transition: border-color var(--transition), background var(--transition), color var(--transition);
}
.btn.primary { background: var(--color-gold); color: #172331; border-color: var(--color-gold); font-weight: 700; }
.btn.primary:hover { background: var(--color-gold-light); border-color: var(--color-gold-light); }
.btn:hover { border-color: var(--color-gold); }

/* =========================================================
   DASHBOARD GRID & SECTIONS
   ========================================================= */
.dash-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 40px;
}
@media (max-width: 900px) { .dash-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .dash-grid { grid-template-columns: 1fr; } }
.dash-card {
  border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 22px;
  background: var(--paper-raised); box-shadow: var(--shadow-sm);
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
}
.dash-card:hover {
  border-color: var(--color-gold); transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.dash-card h3 { margin: 0 0 8px; font-size: 14.5px; display: flex; align-items: center; gap: 8px; color: var(--color-primary); }
.dash-card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.dash-card .n { font-family: var(--serif); font-size: 32px; font-weight: 700; color: var(--brass-deep); display: block; margin-bottom: 2px; }

.section-title {
  font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 50px 0 20px; color: var(--ink);
  display: flex; align-items: center; gap: 14px;
}
.section-title .rule { flex: 1; height: 1px; background: var(--color-border); }

.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.topic-chip {
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 14px 16px;
  background: var(--paper-raised); font-size: 14px; display: flex; justify-content: space-between; align-items: center;
  box-shadow: var(--shadow-sm); transition: border-color var(--transition), box-shadow var(--transition);
}
.topic-chip:hover { border-color: var(--color-gold); box-shadow: var(--shadow-md); }
.topic-chip .count { color: var(--muted); font-size: 12.5px; font-weight: 600; }

.ask-box {
  border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 26px;
  background: var(--paper-raised); box-shadow: var(--shadow-sm);
}
.ask-box textarea {
  width: 100%; min-height: 90px; padding: 14px; border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); background: var(--color-surface-soft); color: var(--ink);
  font-family: var(--sans); font-size: 15px; resize: vertical; outline: none;
  transition: border-color var(--transition);
}
.ask-box textarea:focus { border-color: var(--color-gold); box-shadow: 0 0 0 3px rgba(184, 148, 85, 0.15); }
.ask-answer { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--color-border); }
.ask-answer h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.source-pill {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--color-gold);
  color: var(--brass-deep); background: rgba(184, 148, 85, 0.08);
  border-radius: 20px; padding: 4px 13px; font-size: 13px; font-weight: 600; margin: 3px 6px 3px 0;
  transition: background var(--transition);
}
.source-pill:hover { background: rgba(184, 148, 85, 0.18); }

/* =========================================================
   BROWSE 3-COLUMN LAYOUT & TOC
   ========================================================= */
.browse-shell {
  display: grid; grid-template-columns: 270px 1fr 270px; gap: 0;
  min-height: calc(100vh - 72px);
  border-top: 1px solid var(--color-border);
}
.browse-shell.toc-collapsed { grid-template-columns: 0px 1fr 270px; }
@media (max-width: 1100px) {
  .browse-shell { grid-template-columns: 260px 1fr; }
  .browse-shell.toc-collapsed { grid-template-columns: 0px 1fr; }
  .info-panel { display: none; }
}
.toc-panel {
  border-inline-end: 1px solid var(--color-border);
  overflow-y: auto; max-height: calc(100vh - 72px); position: sticky; top: 72px;
  background: var(--color-surface);
}
.browse-shell.toc-collapsed .toc-panel { display: none; }
.toc-panel-inner { padding: 18px 14px; }
.toc-node { margin-bottom: 4px; }
.toc-label {
  font-size: 13px; padding: 8px 10px; border-radius: var(--radius-sm); display: block; color: var(--muted);
  font-weight: 600; cursor: pointer; transition: color var(--transition), background var(--transition);
}
.toc-label:hover { color: var(--ink); background: var(--color-background); }
.toc-articles { padding-inline-start: 16px; display: none; }
.toc-node.open > .toc-articles { display: block; }
.toc-art-link {

/* Article view center */

.tool-btn {

  transition: border-color var(--transition), background var(--transition);
}

.info-panel {
  border-inline-start: 1px solid var(--color-border); background: var(--color-surface);
  padding: 24px 20px; overflow-y: auto; max-height: calc(100vh - 72px); position: sticky; top: 72px;
}
.info-block { margin-bottom: 24px; }
.info-block h5 { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.info-tag { display: inline-block; font-size: 12px; border: 1px solid var(--color-border); border-radius: 20px; padding: 4px 12px; margin: 0 4px 5px 0; background: var(--color-surface-soft); }
.info-tag.topic { border-color: var(--color-gold); color: var(--brass-deep); background: rgba(184, 148, 85, 0.08); font-weight: 600; }
.related-link { display: block; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--color-border); }
.related-link:last-child { border: none; }
.related-link .kind { font-size: 11px; color: var(--muted); display: block; }

/* =========================================================

.result-item {

.result-item .rnum { font-family: var(--serif); color: var(--brass-deep); font-size: 17px; font-weight: 700; }
.result-item .rexcerpt { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.8; }
.result-item mark { background: rgba(184, 148, 85, 0.35); color: inherit; border-radius: 3px; padding: 1px 4px; }

.numbers-list { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.number-row {

}
.number-row:hover { border-color: var(--color-gold); box-shadow: var(--shadow-md); }
.number-val-badge {

}

.number-art-btn {

  color: var(--color-primary); background: var(--color-background); border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); white-space: nowrap; flex-shrink: 0; transition: all var(--transition);
}
.number-art-btn:hover { background: var(--color-primary); color: #ffffff; border-color: var(--color-primary); }

@media (max-width: 640px) {
  .number-row { flex-direction: column; align-items: flex-start; gap: 10px; }
  .number-art-btn { align-self: flex-end; }
}

/* =========================================================
   COMMAND PALETTE & FOOTER
   ========================================================= */
.palette-overlay {
  position: fixed; inset: 0; background: rgba(15, 24, 35, 0.65); backdrop-filter: blur(4px); z-index: 2000;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh;
}
.palette {
  width: min(620px, 92vw); background: var(--paper-raised); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.palette input {
  width: 100%; padding: 18px 22px; border: none; border-bottom: 1px solid var(--color-border); outline: none;
  font-size: 16px; background: none; color: var(--ink); font-family: var(--sans);
}
.palette-results { max-height: 55vh; overflow-y: auto; }
.palette-item { padding: 13px 22px; font-size: 14px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; }
.palette-item:last-child { border: none; }
.palette-item:hover, .palette-item.sel { background: var(--color-background); }
.palette-item .pnum { color: var(--brass-deep); font-family: var(--serif); font-weight: 700; }

.empty-note { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; }
.back-top {
  position: fixed; bottom: 28px; left: 28px; width: 44px; height: 44px; border-radius: 50%;
  background: var(--color-primary); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); display: none; align-items: center; justify-content: center;
  font-size: 18px; z-index: 100; box-shadow: var(--shadow-md); transition: background var(--transition);
}
.back-top:hover { background: var(--color-gold); color: #172331; }
.back-top.show { display: flex; }

.footer-note {
  background: var(--color-primary); border-top: 1px solid rgba(255,255,255,0.1);
  padding: 30px 24px; text-align: center; color: #aeb7c1; font-size: 13px; line-height: 1.8;
}

.translation-note {
  background: rgba(184, 148, 85, 0.12); border: 1px solid var(--color-gold); border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 13px; color: var(--brass-deep); margin: 12px 0;
}

.hero-visual-card {
  max-width: 640px; margin: 26px auto 0;
  border-radius: 12px; overflow: hidden;
  border: 1px solid rgba(212, 183, 122, 0.4);
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
  position: relative; z-index: 2;
}
.hero-visual-card img {
  width: 100%; height: 210px;
  object-fit: cover; object-position: center 35%;
  display: block; filter: brightness(0.95) contrast(1.05);
  transition: transform 0.4s ease;
}
.hero-visual-card:hover img {
  transform: scale(1.04);
}
.hero-visual-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(15, 24, 35, 0.75) 0%, transparent 65%);
  pointer-events: none;
}


/* Dashboard Card Custom Icons & Angle */
.dash-card h3 {
  margin: 0 0 10px;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--color-primary);
}
.dash-card-icon {
  width: 32px;
  height: 32px;
  object-fit: contain;
  display: inline-block;
  vertical-align: middle;
  filter: drop-shadow(0 3px 6px rgba(23, 35, 49, 0.15));
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dash-card-icon.helmet {
  transform: rotate(-10deg) scale(1.12);
  margin-inline-end: 2px;
}
.dash-card:hover .dash-card-icon.helmet {
  transform: rotate(-3deg) scale(1.22);
}
.dash-card-icon.tag-icon {
  transform: rotate(6deg) scale(1.05);
}
.dash-card:hover .dash-card-icon.tag-icon {
  transform: rotate(12deg) scale(1.15);
}
.dash-card-icon.clock-icon {
  transform: rotate(-6deg) scale(1.05);
}
.dash-card:hover .dash-card-icon.clock-icon {
  transform: rotate(0deg) scale(1.15);
}
.dash-card-icon.recent-icon {
  transform: rotate(4deg) scale(1.05);
}
.dash-card:hover .dash-card-icon.recent-icon {
  transform: rotate(-8deg) scale(1.15);
}

لحوار الذى يجرى بين صاحب عمـل أو منظمـة\nأصحاب أعمال أو أكثر من جهة ،وبين منظمة نقابية عمالية ،أو أكثر من جهة أخـرى\nبغرض التوافق لتحقيق مصالح الطرفين .\n-٢٠المنازعة الجماعية  :كل نزاع ينشأ بـين صـاحب عمـل أو مجموعـة\nأصحاب أعمال أو منظماتهم  ،وبين جميع عمال المنشأة أو فريق مـنهم أو منظمـاتهم\nالنقابية المعنية بشأن شروط العمل أو ظروفه أو التشغيل .\n-٢١الشركاء الاجتماعيون  :أطراف العملية الإنتاجية )الحكومـة ،ومنظمـات\nأصحاب الأعمال ،والمنظمات النقابية العمالية(.\n-٢٢المفوض العمالى  :أحد العاملين بالمنشأة يتفق العاملون بها على تفويـضه\nبموجب سند رسمى لتمثيلهم أمام صاحب العمل فى حالة عدم وجـود منظمـة نقابيـة\nعمالية بها .\n-٢٣اتفاقية العمل الجماعيـة  :اتفاق مكتوب ينظم شـروط وظـروف العمـل\nوأحكام التشغيل ،ويبرم بين منظمة أو أكثر من المنظمات النقابية العمالية وبين صاحب\nعمل أو مجموعة من أصحاب الأعمال أو منظمة أو أكثر من منظماتهم .\n-٢٤التوفيق  :وسيلة يلجأ إليها أحد طرفى منازعة العمل الجماعية طالبا تـدخل\nالجهة الإدارية المختصة بعد تعثر المفاوضة الجماعية بينهما .\n-٢٥الوساطة  :وسيلة ودية لفض منازعات العمل الجماعيـة ،يتفـق بموجبهـا\nطرفا النزاع على إسناد مهمة اقتراح التسوية إلـى شـخص ثالـث حيـادى يـدعى\n)وسيط النزاع(  ،يشتركان فى اختياره من القائمة المعدة لذلك .\n-٢٦التحكيم  :وسيلة اتفاقية لإنهاء النزاع الجماعى القائم بعـد فـشل وسـائل\nالتسوية الودية ويتولى القيام به محكم أو أكثر يتم اختيارهم من القائمة المعدة لذلك .\n-٢٧شرط التحكيم  :اتفاق مكتوب بين طرفى علاقة العمل على تسوية مـا قـد\nينشأ بينهما من نزاع بشأن هذه العلاقة بواسطة التحكيم .\n\n-۲۸مشارطة التحكيم  :اتفاق مكتوب بين طرفى علاقة العمل بعد نشوء النزاع .\n-۲۹الإضراب عن العمل  :اتفاق جميع العمال أو فريق منهم على التوقف عـن\nأداء أعمالهم بمقر العمل للمطالبة بما يرونه محقق ًا لمـصالحهم المهنيـة والاقتـصادية\nوالاجتماعية ،بعد تعـذر التـسوية الوديـة  ،فـى حـدود الـضوابط والإجـراءات\nالمقررة قانون ًا.\n-٣٠إصابة العمل والأمراض المزمنة  :التعريفات الـواردة لهـا فـى قـانون\nالتأمينات الاجتماعية والمعاشات الصادر بالقانون رقم  ١٤٨لسنة ٢٠١٩\n-٣١التحرش  :كل فعل أو سلوك فى مكان العمل أو بمناسبته يـشكل تعرضـا\nللغير بإتيان أمور أو إيحاءات أو تلميحات جنسية أو إباحية سواء بالإشارة أو بـالقول\nأو بالفعل بأية وسيلة بمـا فـى ذلـك وسـائل الاتـصالات الـسلكية أو اللاسـلكية\nأو الإلكترونية ،أو أية وسيلة تقنية أخرى .\n-٣٢التنمر  :كل فعل أو سلوك فى مكان العمـل أو بمناسـبته سـواء بـالقول\nأو باستعراض القوة أو السيطرة على الغير أو استغلال ضعفه أو لحالة يعتقد مرتكـب\nذلك الفعل أو السلوك أنها تسيء للغير كالجنس أو العرق أو الدين أو الأوصاف البدنية\nأو الحالة الصحية أو العقلية أو المستوى الاجتماعى بقصد تخويفه أو وضعه موضـع\nالسخرية أو الحط من شأنه أو إقصائه من محيطه الاجتماعى  .بأية وسيلة بما فى ذلك\nوسائل الاتصالات السلكية واللاسلكية أو الإلكترونية ،أو أية وسيلة تقنية أخرى .\n-٣٣المنـشأة  :كل مشروع أو مرفق يملكه أو يديره شـخص مـن أشـخاص\nالقانون الخاص أيا كان نوعها أو تبعيتها ،وذلك مع مراعاة ما نصت عليـه المـادة (٢٤٣)\nمن هذا القانون .\n-٣٤موقع العمل  :هو المكان الذى يمارس فيه العامل العمـل المكلـف بـه ،\nأو يحتمل تواجده فيه بسببه .\n\n-٣٥المهنة أو الحرفة  :كل عمل يتطلب أداؤه مهارة خاصة أو خبرة محـددة،\nولا ينظم مزاولته قانون خاص .\n-٣٦الوزير المختص  :الوزير المعنى بشئون العمل.\n-۳۷الوزارة المختصة  :الوزارة المعنية بشئون العمل.\n-۳۸الجهة الإدارية المختصة  :الوزارة المعنيـة بـشئون العمـل ومـديرياتها\nوإداراتها التابعة لها على مستوى الجمهورية .", "text_ru": "При применении положений настоящего Трудового кодекса нижеследующим словам и терминам придаются указанные рядом с каждым из них значения:\n\n1. Работник — любое физическое лицо, работающее за вознаграждение у работодателя под его руководством или контролем.\n\n2. Ученик (стажёр) — любое лицо, поступившее к работодателю с целью обучения профессии, специальности или ремеслу за вознаграждение.\n\n3. Работодатель — любое физическое или юридическое лицо, использующее труд одного или нескольких работников за вознаграждение.\n\n4. Заработная плата — всё, что получает работник за свой труд, деньгами или в натуральной форме, включая:\n\nОсновная заработная плата: заработная плата, установленная в трудовом договоре, и любые надбавки к ней.\n\nПеременная заработная плата: остальные элементы заработной платы, получаемые работником, в частности:\n\n(а) Комиссионное вознаграждение или процент — денежная сумма, выплачиваемая работнику за произведённую им продукцию, её продажу или взыскание платежей в течение выполнения работы, за которую установлен этот процент.\n\n(б) Надбавки — денежная сумма или процент от основной заработной платы, предоставляемые работнику в связи с экономическими, социальными или техническими обстоятельствами, если они не включены в основную заработную плату.\n\n(в) Дотации — то, что предоставляется работнику сверх его заработной платы, если это предусмотрено индивидуальными или коллективными трудовыми договорами, основными положениями труда либо является установившимся обычаем предоставлять это.\n\n(г) Вознаграждение (премия) — всё, что выплачивается работнику деньгами или в натуральной форме за мастерство, отличие или квалификацию при выполнении порученной ему работы.\n\n(д) Компенсационные выплаты за особые условия — то, что предоставляется работнику за определённые условия или риски, которым он подвергается при выполнении своей работы.\n\n(е) Доля работника в прибыли — то, что выплачивается работнику из чистой прибыли, полученной в соответствии с регулирующими её законами.\n\n(ж) Вознаграждение от третьих лиц (чаевые) — вознаграждение, получаемое работником не от работодателя, если это стало обычаем и существуют правила, позволяющие его определить согласно внутреннему регламенту предприятия или сложившемуся обычаю.\n\n(з) Плата за обслуживание — денежное вознаграждение, которое могут уплачивать клиенты в туристических, гостиничных и иных предприятиях; порядок его распределения между работниками устанавливается решением компетентного министра по согласованию с заинтересованными министрами, соответствующей профсоюзной организацией и организациями работодателей.\n\n(и) Натуральные льготы — неденежные льготы, предоставляемые работодателем работнику, если они не обусловлены требованиями самой работы.\n\n5. Страховой заработок — заработок, учитываемый при уплате страховых взносов согласно Закону о социальном страховании и пенсиях № 148 от 2019 года.\n\n6. Временная работа — работа, которая по своему характеру входит в деятельность, осуществляемую работодателем, но выполнение которой по своей природе требует определённого срока, либо относится к конкретной работе и заканчивается с её завершением.\n\n7. Разовая (случайная) работа — работа, которая по своему характеру не входит в деятельность, осуществляемую работодателем, и выполнение которой не превышает шести месяцев.\n\n8. Сезонная работа — работа, выполняемая в общепризнанные периодичные сезоны.\n\n9. Неформально занятый работник — любое лицо, выполняющее работу, не являющуюся постоянной по своему характеру, за вознаграждение в любой форме, либо работающее по профессии или ремеслу, не регулируемым отдельным законом, например уличные торговцы, распространители газет и подобные им лица.\n\n10. Работник неформального сектора — любое лицо, выполняющее работу внутри или вне предприятия неофициальным или скрытым образом.\n\n11. Принудительный труд — любая работа или услуга, навязанная какому-либо лицу под угрозой применения наказания или причинения вреда, если это лицо не предложило свои услуги добровольно, по собственному выбору.\n\n12. Ночное время — период между заходом и восходом солнца.\n\n13. Профессиональная ориентация — содействие лицу в выборе профессии или профессионального пути, наиболее соответствующего его способностям, готовности и склонностям, с учётом постоянного изучения рынка труда, востребованных профессий и их составляющих.\n\n14. Профессиональная подготовка (обучение) — процесс, позволяющий лицу приобретать и развивать знания, технические навыки и профессиональное поведение, необходимые для подготовки к соответствующей работе.\n\n15. Производственное ученичество — форма обучения или развития навыков на рабочем месте или вне его, позволяющая лицу приобрести навыки, знания и компетенции, необходимые для работы по профессии, специальности или ремеслу, посредством организованной подготовки за вознаграждение.\n\n16. Отраслевые советы по квалификациям — отраслевые структуры, укрепляющие сотрудничество между государством и частным сектором, создаваемые для обеспечения соответствия системы технического и профессионально-технического образования и подготовки потребностям экономического сектора в квалифицированной технической рабочей силе.\n\n17. Частные агентства занятости — специализированные компании по подбору работников или их трудоустройству у третьих лиц на условиях, установленных настоящим Трудовым кодексом.\n\n18. Уполномоченные представители — любое лицо, которому работодатель поручил или делегировал управление предприятием, либо лица, занимающие высшие руководящие должности на предприятии и осуществляющие часть или все полномочия работодателя.\n\n19. Коллективные переговоры — диалог, проводимый между работодателем или одной либо несколькими организациями работодателей, с одной стороны, и профсоюзной организацией или несколькими организациями, с другой стороны, с целью достижения согласия для реализации интересов обеих сторон.\n\n20. Коллективный трудовой спор — любой спор, возникающий между работодателем или группой работодателей либо их организациями, с одной стороны, и всеми работниками предприятия, их частью или их профсоюзными организациями, с другой стороны, относительно условий труда, его обстоятельств или занятости.\n\n21. Социальные партнёры — стороны производственного процесса (государство, организации работодателей, профсоюзные организации работников).\n\n22. Уполномоченный представитель работников — один из работников предприятия, которого работники по договорённости уполномочивают на основании официального документа представлять их перед работодателем в случае отсутствия на предприятии профсоюзной организации.\n\n23. Коллективный трудовой договор — письменное соглашение, регулирующее условия и обстоятельства труда и правила найма, заключаемое между одной или несколькими профсоюзными организациями работников и работодателем, группой работодателей либо одной или несколькими их организациями.\n\n24. Примирение — средство, к которому прибегает одна из сторон коллективного трудового спора, обращаясь за вмешательством компетентного административного органа после того, как коллективные переговоры между сторонами зашли в тупик.\n\n25. Посредничество — мирное средство урегулирования коллективных трудовых споров, при котором обе стороны спора договариваются поручить выработку предложения по урегулированию нейтральному третьему лицу (посреднику по спору), избираемому ими совместно из соответствующего списка.\n\n26. Арбитраж — договорное средство прекращения существующего коллективного спора после того, как средства мирного урегулирования не увенчались успехом; осуществляется одним или несколькими арбитрами, избираемыми из соответствующего списка.\n\n27. Арбитражная оговорка — письменное соглашение между сторонами трудового отношения об урегулировании посредством арбитража любого спора, который может возникнуть между ними в связи с этим отношением.\n\n28. Арбитражное соглашение — письменное соглашение между сторонами трудового отношения, заключаемое после возникновения спора.\n\n29. Забастовка — согласованное прекращение всеми работниками или их частью выполнения своей работы по месту работы с целью добиться того, что они считают отвечающим их профессиональным, экономическим и социальным интересам, после того как не удалось достичь мирного урегулирования, в пределах установленных законом правил и процедур.\n\n30. Производственная травма и хронические заболевания — понятия, определённые в Законе о социальном страховании и пенсиях № 148 от 2019 года.\n\n31. Домогательство — любое действие или поведение на рабочем месте или в связи с ним, представляющее собой обращение к другому лицу с действиями, намёками или высказываниями сексуального либо непристойного характера — будь то жестом, словом или действием, любым способом, включая средства проводной, беспроводной или электронной связи либо любые иные технические средства.\n\n32. Травля (буллинг) — любое действие или поведение на рабочем месте или в связи с ним, будь то на словах, посредством демонстрации силы или господства над другим лицом, использования его слабости или обстоятельств, которые, по мнению совершающего такое действие или поведение, оскорбительны для другого лица — например, в связи с полом, расой, религией, физическими особенностями, состоянием здоровья, психическим состоянием или социальным положением, — с целью запугать это лицо, выставить его на посмешище, унизить его достоинство или исключить его из его социального окружения, любым способом, включая средства проводной, беспроводной или электронной связи либо любые иные технические средства.\n\n33. Предприятие — любой проект или объект, принадлежащий лицу частного права или управляемый им, независимо от его вида или подчинённости, с учётом положений статьи (243) настоящего Трудового кодекса.\n\n34. Место работы — место, в котором работник выполняет порученную ему работу, либо в котором предполагается его нахождение в связи с этой работой.\n\n35. Профессия или ремесло — любая работа, выполнение которой требует особого навыка или определённого опыта и осуществление которой не регулируется отдельным законом.\n\n36. Компетентный министр — министр, в ведении которого находятся вопросы труда.\n\n37. Компетентное министерство — министерство, в ведении которого находятся вопросы труда.\n\n38. Компетентный административный орган — министерство, в ведении которого находятся вопросы труда, и подчинённые ему управления и подразделения на всей территории Республики.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел первый", "part_title_ru": "Определения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "2", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الأول", "part_title": "التعاريف", "chapter": null, "chapter_title": null, "text": "فى تطبيق أحكام هذا القانون تعتبر السنة (٣٦٥)يوما  ،والشهر ثلاثون يومـا مـا لـم يـتم\nالاتفاق على خلاف ذلك .", "text_ru": "При применении положений настоящего Трудового кодекса год считается равным 365 дням, а месяц — тридцати дням, если не согласовано иное.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел первый", "part_title_ru": "Определения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "3", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يعتبر هذا القانون هو القانون العام الذى يحكم علاقات العمل.", "text_ru": "Настоящий Закон является общим законом, регулирующим трудовые отношения.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "4", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يحظر تشغيل العامل سخرة أو جبرا  ،كما يحظر التحرش أو التنمر أو ممارسـة\nأى عنف لفظى أو جسدى أو نفسى على العامل ،وتحدد لائحة تنظيم العمل والجزاءات\nبالمنشأة الجزاءات التأديبية المقررة لها .", "text_ru": "Запрещается привлечение работника к принудительному или подневольному труду, равно как запрещаются домогательства, травля или совершение любого словесного, физического или психологического насилия в отношении работника; внутренний регламент предприятия по организации труда и мерам ответственности определяет применимые к этому дисциплинарные взыскания.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "5", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يحظر كل عمل أو سلوك أو إجراء يكون من شأنه إحداث تمييز أو تفرقـة بـين\nالأشخاص فى التدريب ،أو الإعلان عن الوظائف أو شغلها  ،أو شـروط أو ظـروف\nالعمل أو الحقوق والواجبات الناشئة عن عقد العمل  ،بسبب الدين أو العقيدة أو الجـنس\nأو الأصل أو العرق أو اللون أو اللغة أو الإعاقة أو المستوى الاجتمـاعى أو الانتمـاء\nالسياسى أو النقابى أو الجغرافى أو أى سبب آخر يترتب عليه الإخلال بمبدأ المـساواة\nوتكافؤ الفرص .\n\nولا يعتبر تمييزا محظورا كل ميزة أو أفضلية أو منفعة أو حماية تقرر بموجـب\nأحكام هذا القانون والقرارات واللوائح المنفذة له للمرأة أو للطفـل أو للأشـخاص ذوى\nالإعاقة والأقزام  ،كلما كانت مقررة بالقدر اللازم لتحقيق الهدف الذى تقـررت مـن أجلـه ،\nوتعمل الوزارة المختصة على وضع السياسات والخطط اللازمة لـدمجهم فـى سـوق\nالعمل وتوفير الحماية اللازمة لهم فى بيئة العمل وذلك بالتنسيق مع الوزارة المختـصة\nبالتضامن الاجتماعى والمجالس القومية المتخصصة المعنية .", "text_ru": "Запрещается любое действие, поведение или мера, которые могут повлечь дискриминацию или различие между лицами в сфере профессиональной подготовки, объявления о вакансиях или их замещения, условий или обстоятельств труда либо прав и обязанностей, вытекающих из трудового договора, по причине религии, вероисповедания, пола, происхождения, расы, цвета кожи, языка, инвалидности, социального положения, политической, профсоюзной или территориальной принадлежности либо по любой иной причине, влекущей нарушение принципа равенства и равных возможностей.\n\nНе считается запрещённой дискриминацией любое преимущество, льгота, выгода или защита, устанавливаемые в соответствии с положениями настоящего Трудового кодекса и принятыми во исполнение его решениями и регламентами в пользу женщины, ребёнка, лиц с инвалидностью и лиц с карликовостью, если они установлены в мере, необходимой для достижения цели, ради которой предусмотрены; компетентное министерство разрабатывает необходимые политики и планы для их интеграции на рынке труда и обеспечения им необходимой защиты в условиях труда во взаимодействии с министерством, в ведении которого находятся вопросы социальной солидарности, и соответствующими профильными национальными советами.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "6", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يقع باطلا ً كل شرط أو اتفاق يخالف أحكام هذا القانون ،ولو كان سابق ًا على العمل\nبه ،إذا تضمن انتقاصا من حقوق العامل المقررة فيه ،أو إبراء مـن حقـوق العامـل\nالناشئة عن عقد العمل خلال مدة سريانه ،أو خلال ثلاثة أشهر من تاريخ انتهائه.\nويستمر العمل بأية مزايا أو شروط أفضل تكون مقـررة ،أو تقـرر فـى عقـود\nالعمل الفردية  ،أو الجماعية أو الأنظمة الأساسية ،أو غيرها مـن لـوائح المنـشأة ،\nأو بمقتضى العرف .\nكما يسرى ذلك فى حالة تغيير الكيان القانونى للمنشأة  ،أو انتقال ملكيتها .", "text_ru": "Признаётся недействительным любое условие или соглашение, противоречащее положениям настоящего Трудового кодекса, даже если оно предшествовало вступлению его в силу, если оно предусматривает умаление прав работника, установленных настоящим Трудовым кодексом, либо освобождение от прав работника, возникающих из трудового договора, в течение срока его действия или в течение трёх месяцев со дня его прекращения.\n\nСохраняют силу любые более благоприятные льготы или условия, установленные либо устанавливаемые в индивидуальных или коллективных трудовых договорах, основных положениях труда либо иных внутренних регламентах предприятия, а также в силу обычая.\n\nЭто правило применяется также в случае изменения организационно-правовой формы предприятия или перехода права собственности на него.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "7", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "تعفى من الرسوم والمصاريف القضائية فى جميع مراحـل التقاضـى الـدعاوى\nالناشئة عن المنازعات المتعلقة بأحكام هذا القانون  ،التى يرفعهـا العـاملون والمتـدرجون ،\nوعمال التلمذة الصناعية  ،أو المستحقون عن هؤلاء  ،وللمحكمة فى جميع الأحوال أن\nتشمل حكمها بالنفاذ المعجل وبلا كفالة  ،ولها فى حالة رفض الدعوى أن تحكم علـى\nرافعها بالمصروفات كلها أو بعضها .\nوتعفى الفئات المشار إليها فى الفقرة الأولى من هذه المادة من ضـريبة الدمغـة\nعلى كل الشهادات والصور التى تعطى لهم ،والشكاوى ،والطلبات التى تقـدم مـنهم ،\nتطبيق ًا لأحكام هذا القانون .\n\nومع مراعاة حكم المادة (١٨٥)من هذا القانون لا يشترط بالنسبة لتلـك الفئـات\nتوقيع محام على صحيفة افتتاح الدعوى ،أو صحيفة الطلبات الموضـوعية أو طلبـات\nاستصدار الأوامر.", "text_ru": "От судебных пошлин и издержек на всех стадиях разбирательства освобождаются иски, вытекающие из споров, связанных с положениями настоящего Трудового кодекса, предъявляемые работниками, стажёрами и учениками производственного обучения либо лицами, имеющими право на получение соответствующих сумм после них; суд во всех случаях вправе обратить решение к немедленному исполнению без предоставления обеспечения, а в случае отказа в иске — вправе возложить на истца судебные расходы полностью или частично.\n\nКатегории лиц, указанные в первом абзаце настоящей статьи, освобождаются от гербового сбора по всем выдаваемым им справкам и копиям, а также по подаваемым ими жалобам и заявлениям в порядке применения положений настоящего Трудового кодекса.\n\nС учётом положений статьи (185) настоящего Трудового кодекса для указанных категорий не требуется подписание искового заявления, заявления по существу требований либо заявления о вынесении судебного приказа адвокатом.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "8", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يكون للمبالغ المستحقة للعامل  ،أو المستحقين عنه  ،والناشئة عن علاقـة عمـل\nامتياز على جميع أموال المدين من منقول وعقـار  ،وتـستوفى هـذه المبـالغ قبـل\nالمصروفات القضائية  ،والمبالغ المستحقة للخزانـة العامـة  ،ومـصروفات الحفـظ\nوالترميم وأية مرتبة امتياز مقررة أو تقرر وفق ًا لأى قانون آخر .\nوتعتبر اشتراكات التأمين الاجتماعى جزءا من حقوق العمال التى تستوفى وتؤدى\nللهيئة المختصة .", "text_ru": "Суммы, причитающиеся работнику или лицам, имеющим право на их получение после него, и возникающие из трудового отношения, пользуются преимущественным правом удовлетворения перед всем движимым и недвижимым имуществом должника; эти суммы удовлетворяются раньше судебных издержек, сумм, причитающихся государственной казне, расходов на хранение и восстановление имущества, а также любой иной привилегии, установленной или устанавливаемой в соответствии с каким-либо иным законом.\n\nВзносы социального страхования считаются частью прав работников, подлежащих взысканию и перечислению в пользу компетентного органа.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "9", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "لا يمنع من الوفاء بجميع الالتزامات الناشئة طبق ًا لهذا القانون  ،حـل المنـشأة ،\nأو تصفيتها  ،أو إغلاقها  ،أو إفلاسها .\nويجب أن يحدد القرار أو الحكم الصادر بأى من ذلـك  ،أجـلا ً للوفـاء بحقـوق\nالعاملين  ،وتتولى الجهة الإدارية المختصة متابعة الوفاء بتلك الحقوق  ،ويكون لهـا أن\nتنوب عن ذوى الشأن فى اتخاذ الإجراءات اللازمة للوفاء بها فى الأجل المحدد .\nويصدر الوزير المختص قرارا بتحديد ضـوابط وإجـراءات ومواعيـد الوفـاء\nبحقوق العمال .", "text_ru": "Исполнение всех обязательств, возникающих в соответствии с настоящим Трудовым кодексом, не приостанавливается в связи с роспуском предприятия, его ликвидацией, закрытием или банкротством.\n\nРешение или судебный акт, вынесенные по любому из указанных оснований, должны определять срок для исполнения прав работников; компетентный административный орган осуществляет контроль за исполнением этих прав и вправе представлять заинтересованных лиц при принятии необходимых мер для их исполнения в установленный срок.\n\nКомпетентный министр издаёт решение, определяющее правила, процедуры и сроки исполнения прав работников.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "10", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "إذا تعدد أصحاب العمل كانوا مـسئولين بالتـضامن فيمـا بيـنهم عـن الوفـاء\nبجميع الالتزامات الناشئة عن هذا القانون  ،أو لوائح المنشأة المعتمـدة  ،أو اتفاقيـات\nالعمل الجماعية .\nويكون الوكيل المفوض أو من تنازل له صاحب العمل عن الأعمال المسندة إليـه\nكلها أو بعضها متضامنين معه فى الوفاء بجميع الالتزامـات التـى تفرضـها أحكـام\nهذا القانون .", "text_ru": "При множественности работодателей они несут солидарную ответственность друг перед другом за исполнение всех обязательств, вытекающих из настоящего Трудового кодекса, утверждённого внутреннего регламента предприятия либо коллективных трудовых договоров.\n\nУполномоченный представитель либо лицо, которому работодатель передал выполнение возложенных на него функций полностью или частично, несёт солидарную с ним ответственность за исполнение всех обязательств, установленных положениями настоящего Трудового кодекса.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "11", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "لا يترتب على إدماج المنشأة  ،أو تقـسيمها  ،أو انتقالهـا بـالإرث أو الوصـية\nأو الهبة أو البيع ولو كان بالمزاد العلني  ،أو النزول  ،أو الإيجار  ،أو غير ذلك مـن\nالتصرفات إنهاء عقود استخدام عمال المنشأة  ،ويكون الخلف مسئولا ً بالتـضامن مـع\nأصحاب الأعمال السابقين عن تنفيذ جميع الالتزامات الناشئة عن هذه العقود .", "text_ru": "Слияние предприятия, его разделение либо переход прав на него в порядке наследования, по завещанию, дарению, продаже (в том числе с публичных торгов), уступки, аренды или на основании иной сделки не влекут прекращения трудовых договоров работников предприятия; правопреемник несёт солидарную с прежними работодателями ответственность за исполнение всех обязательств, вытекающих из этих договоров.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "12", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يستحق العاملون الذين تسرى فى شأنهم أحكام هذا القانون علاوة سـنوية دوريـة\nفى تاريخ استحقاقها لا تقل عن (٣٪)من الأجر التـأميني  ،وتـستحق تلـك العـلاوة\nبانقضاء سنة من تاريخ التعيين  ،أو من تاريخ استحقاق العـلاوة الدوريـة الـسابقة .\nوفى حالة تعرض المنشأة لظروف اقتصادية يتعذر معهـا صـرف العـلاوة الدوريـة\nالمشار إليها  ،يعرض الأمر على المجلس القـومى للأجـور للبـت فـى تخفيـضها\nأو الإعفاء منها وذلك خلال ثلاثين يوما من تاريخ عرض الأمر عليه .", "text_ru": "Работники, на которых распространяются положения настоящего Трудового кодекса, имеют право на ежегодную периодическую надбавку в дату наступления права на неё в размере не менее 3% страхового заработка; право на эту надбавку возникает по истечении года со дня назначения либо со дня наступления права на предыдущую периодическую надбавку.\n\nВ случае если предприятие оказывается в экономических условиях, затрудняющих выплату указанной периодической надбавки, вопрос передаётся на рассмотрение Национального совета по заработной плате для принятия решения о её снижении или об освобождении от неё в течение тридцати дней со дня передачи ему этого вопроса.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "13", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يصدر الوزير المختص قرارا بتحديد اختصاص الجهة الإدارية المختـصة فـى\nتطبيق أحكام هذا القانون .", "text_ru": "Компетентный министр издаёт решение, определяющее компетенцию компетентного административного органа в применении положений настоящего Трудового кодекса.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "14", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "تئول ثلث المبالغ المحكوم بها عن مخالفة أحكام هذا القـانون لـصالح الـوزارة\nالمختصة للصرف منها على أغراض الخـدمات الاجتماعيـة والـصحية والثقافيـة ،\nوتطوير أساليب التدريب المهنى للفئات الأولى بالرعاية من بين العمال الخاضعين لأحكـام\nهذا القانون وعلى الأخص العمالة غير المنتظمة  ،ويتم توزيعها وتحديد أوجـه الـصرف\nبقرار من الوزير المختص  ،على أن تئول باقى الحصيلة للخزانة العامة للدولة .", "text_ru": "Треть сумм, взысканных по судебным решениям за нарушение положений настоящего Трудового кодекса, поступает в пользу компетентного министерства для расходования на цели социального, медицинского и культурного обслуживания, а также на развитие методов профессиональной подготовки категорий, пользующихся приоритетным вниманием среди работников, на которых распространяются положения настоящего Трудового кодекса, в первую очередь — неформально занятых работников; распределение этих средств и определение направлений их расходования осуществляется решением компетентного министра, при этом оставшаяся часть поступлений передаётся в государственную казну.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "15", "book": "الكتاب الأول", "book_title": "التعاريف والأحكام العامة", "part": "الباب الثاني", "part_title": "الأحكام العامة", "chapter": null, "chapter_title": null, "text": "يكون تحصيل الرسوم ومقابل الخدمات المنصوص عليها فى هذا القانون  ،وفق ًـا\nلأحكام قانون تنظيم استخدام وسائل الدفع غير النقدى الصادر بالقانون رقم  ١٨لسنة ۲۰۱۹", "text_ru": "Взимание сборов и платы за услуги, предусмотренных настоящим Трудовым кодексом, осуществляется в соответствии с положениями Закона о регулировании использования безналичных средств платежа № 18 от 2019 года.", "book_title_ru": "Определения и общие положения", "book_ru": "Книга первая", "part_ru": "Раздел второй", "part_title_ru": "Общие положения", "chapter_ru": null, "chapter_title_ru": null}, {"number": "16", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "تسرى أحكام هذا الباب على جميع مراكز التدريب الخاضعة لأحكام هذا القانون ،\nوعلى الفئات الآتية :\n-١الراغبين فى التدريب .\n-٢الأشخاص ذوو الإعاقة والأقزام  ،والفئات الأولى بالرعاية .\n-٣المتدرجين .\n-٤الراغبين فى التأهيل الأعلى أو المستمر .\n-٥عمال التلمذة الصناعية .", "text_ru": "Положения настоящего раздела применяются ко всем центрам подготовки, на которые распространяются положения настоящего Трудового кодекса, а также к следующим категориям:\n1. Лицам, желающим пройти профессиональную подготовку.\n2. Лицам с инвалидностью, лицам с карликовостью и категориям, пользующимся приоритетным вниманием.\n3. Ученикам (стажёрам).\n4. Лицам, желающим получить повышение квалификации или пройти непрерывное обучение.\n5. Работникам производственного ученичества.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "17", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "تتولى الجهة الإدارية المختصة القيام بالتوجيه المهنى لراغبى التدريب لمساعدتهم\nفى اختيار المهن التى يرغبون التدرب عليها وفق ًا لقدراتهم .\nكما تتولى بالتنسيق مع الوزارات والجهات المعنيـة  ،وبالتـشاور مـع ممثلـى\nمنظمات أصحاب الأعمال والعمال الأكثر تمثيلا ً  ،إعداد التـصنيف المهنـى الـوطنى\nللمهن والحرف والوظائف فى سوق العمل  ،وتحديد متطلباتها وتوصيفها  ،والمهارات\nوالجدارات اللازمة لها  ،والعمل على تحديثها وفق ًا لمعايير الجـودة العالميـة  ،وبمـا\nيتوافق مع التغيرات التكنولوجية الحديثة وتغير المناخ .\nويصدر الوزير المختص قرارا بالقواعد والإجراءات المنظمة لـذلك  ،والجهـات\nوالفئات المستفيدة .", "text_ru": "Компетентный административный орган осуществляет профессиональную ориентацию лиц, желающих пройти подготовку, содействуя им в выборе профессий, которым они хотели бы обучаться, в соответствии с их способностями.\n\nОн также осуществляет, во взаимодействии с соответствующими министерствами и органами и в консультации с наиболее представительными представителями организаций работодателей и работников, разработку национальной профессиональной классификации профессий, специальностей и должностей на рынке труда, определение предъявляемых к ним требований и их описания, необходимых для них навыков и компетенций, и работает над её обновлением в соответствии с мировыми стандартами качества и с учётом современных технологических изменений и изменения климата.\n\nКомпетентный министр издаёт решение о правилах и процедурах, регулирующих это, а также об органах и категориях, пользующихся соответствующими услугами.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "18", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "ينشأ مجلس يسمى \"المجلس الأعلى لتنمية مهارات الموارد البـشرية \"  ،ويكـون\nمقره الرئيسى مدينة القاهرة  ،برئاسة الوزير المختص  ،ويضم فى عضويته ما يلى :\nممثلين عن وزارات ) الصحة  ،التخطيط والتنمية الاقتصادية والتعاون الـدولى ،\nالتربية والتعليم والتعليم الفنى التعليم العالى والبحث العلمى  ،الـصناعة  ،الاسـتثمار\nوالتجارة الخارجية  ،الاتصالات وتكنولوجيا المعلومات  ،التضامن الاجتماعى  ،قطاع\nالأعمال العام  ،التنمية المحلية  ،الإسكان والمرافق والمجتمعات العمرانية  ،الـسياحة\nوالآثار (  ،يرشحهم الوزراء المعنيون .\nرئيس الجهاز المركزى للتنظيم والإدارة أو من ينيبه .\nرئيس المجلس القومى للأشخاص ذوى الإعاقة أو من ينيبه .\nسبعة أعضاء يمثلون منظمات أصحاب الأعمال الأكثر تمثيلا ً مـن حيـث العـضوية ،\nترشحهم منظماتهم .\nسبعة أعضاء يمثلون المنظمات النقابية العمالية  ،ترشحهم منظماتهم الأكثر تمثيلا ً\nللعمال  .على أن يراعى عند الترشيح تمثيل جميع مستويات المنظمات النقابية العمالية\nما لم يكن ذلك متعذرا .\nوللمجلس أن يستعين بمن يراه من ذوى الخبرة من الفئـات التـى يـرى لزومـا\nتمثيلها  ،دون أن يكون لهم صوت معدود فى المداولات .\nويتولى المجلس وضع السياسات العامة لتنميـة مهـارات المـوارد البـشرية ،\nوسياسات التدريب والتأهيل  ،وسياسات تـدريب وتأهيـل الأشـخاص ذوى الإعاقـة\nوالأقزام والفئات الأولى بالرعاية بما يتفق مع السياسة العامة للدولة .\nكما يتولى وضع الخطط اللازمة لربط التعليم والتدريب باحتياجات سوق العمـل\nالحالى ووظائف المستقبل  ،والمهارات اللازمة لها .\nويصدر بتشكيل المجلس واختصاصاته الأخرى ونظام العمل به وأمانته التنفيذيـة\nقرار من رئيس مجلس الوزراء  ،فى موعد لا يتجاوز ستة أشهر من تاريخ العمل بهذا\nالقانون  ،على أن يجتمع المجلس مرة على الأقل كل ثلاثة أشهر .", "text_ru": "Учреждается совет под названием «Высший совет по развитию навыков человеческих ресурсов», местонахождением которого является город Каир, под председательством компетентного министра; в его состав входят:\n\n— представители министерств (здравоохранения; планирования, экономического развития и международного сотрудничества; образования и технического образования; высшего образования и научных исследований; промышленности; инвестиций и внешней торговли; связи и информационных технологий; социальной солидарности; государственного делового сектора; местного развития; жилищного строительства, коммунальных услуг и городских сообществ; туризма и древностей), выдвигаемые соответствующими министрами;\n— председатель Центрального агентства по организации и управлению или его представитель;\n— председатель Национального совета по делам инвалидов или его представитель;\n— семь членов, представляющих наиболее представительные по численности членства организации работодателей, выдвигаемые их организациями;\n— семь членов, представляющих профсоюзные организации работников, выдвигаемые их наиболее представительными организациями, при этом при выдвижении учитывается представленность всех уровней профсоюзных организаций работников, если это возможно.\n\nСовет вправе привлекать по своему усмотрению экспертов из категорий, представительство которых он сочтёт необходимым, без права решающего голоса при обсуждениях.\n\nСовет разрабатывает общую политику развития навыков человеческих ресурсов, политику подготовки и переподготовки, политику подготовки и переподготовки лиц с инвалидностью, лиц с карликовостью и категорий, пользующихся приоритетным вниманием, в соответствии с общей государственной политикой.\n\nОн также разрабатывает необходимые планы для увязки образования и подготовки с текущими потребностями рынка труда и профессиями будущего, а также с необходимыми для них навыками.\n\nСостав совета, иные его полномочия, порядок его работы и его исполнительный секретариат устанавливаются решением Председателя Совета министров в срок, не превышающий шести месяцев со дня вступления настоящего Трудового кодекса в силу; совет собирается не реже одного раза в три месяца.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "19", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يجوز للمجلس أن يشكل فى نطاق أى محافظة أو منطقة جغرافية مجلسا تنفيـذيا\nلتنمية مهارات الموارد البشرية  ،ويحدد بقرار من المجلس رئيس وأعـضاء المجلـس\nالتنفيذى  ،على أن يضم فى عضويته ممثلين عن منظمات أصحاب العمل والمنظمـات\nالنقابية العمالية المعنية بالتساوى فيما بينهما  ،كما يضم فى عضويته ممثلى الـوزارات\nوالجهات المعنية  ،ويتولى متابعة تنفيذ الخطط والقـرارات  ،والتوصـيات الـصادرة\nعن المجلس الأعلى لتنمية مهارات الموارد البشرية والتنسيق مـع الجهـات المحليـة\nالمختصة بتنمية مهارات الموارد البشرية وتحسين كفاءتها من خلال التدريب المهنـى\nوالتدريب المستمر .\nويحدد قرار التشكيل الاختصاصات الأخرى للمجلس  ،ونظام العمل به .", "text_ru": "Совет вправе образовывать в пределах любой мухафазы или географического района исполнительный совет по развитию навыков человеческих ресурсов; председатель и члены исполнительного совета определяются решением совета, при этом в его состав включаются на паритетных началах представители организаций работодателей и профсоюзных организаций работников, а также представители соответствующих министерств и органов; он осуществляет контроль за исполнением планов, решений и рекомендаций, принятых Высшим советом по развитию навыков человеческих ресурсов, и координацию с компетентными местными органами по развитию навыков человеческих ресурсов и повышению их эффективности посредством профессиональной подготовки и непрерывного обучения.\n\nРешение об образовании совета определяет иные его полномочия и порядок его работы.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "20", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يمارس صندوق تمويل التدريب والتأهيل نشاطه على المـستوى القـومى وفق ًـا\nلاحتياجات سوق العمل وبما يتماشى مع احتياجات منظمات أصحاب الأعمال القطاعية\nالمنشأة بقانون  ،ويختص بتقديم الخدمات الآتية :\n-١تمويل عمليات تنمية مهارات الموارد البشرية والتدريب المهنى والتقنى مـن\nخلال إنشاء وتطوير مراكز التدريب  ،وإعداد وتنفيذ برامج التدريب  ،وأدلة المهارات\nوالجدارات اللازمة .\n-٢تمويل المشروعات التنموية التى تستهدف تنمية مهارات الموارد البـشرية ،\nوربط مخرجات التعليم والتدريب باحتياجات سوق العمل الحالى والمستقبلى والتنـسيق\nمع مجالس المهارات القطاعية .\n-٣وضع الشروط والقواعد التنفيذية لضبط عمليات التمويل .\n- ٤متابعة وتقييم تنفيذ جميع الأعمال الممولة منه .\n\nويصدر رئيس مجلس الوزراء قرارا بتشكيل مجلـس إدارة الـصندوق برئاسـة\nالوزير المختص وعضوية ممثلى المنظمات النقابيـة العماليـة ومنظمـات أصـحاب\nالأعمال بالتساوى فيما بينهما  ،وممثلى الـوزارات والجهـات المختـصة  ،وتحديـد\nاختصاصاته الأخرى ونظام العمل به  ،والمعاملة المالية لـرئيس وأعـضاء مجلـس\nالإدارة  ،على أن تكون من موارده الذاتية  ،وفروعه فى المحافظات ولائحـة نظامـه\nالأساسى  ،ونظام تحصيل موارده  ،والنظام المحاسبى الواجب اتباعه .\nولمجلس إدارة الصندوق أن يستخدم وسائل القانون الخاص فـى تحقيـق أهدافـه\nومباشرة اختصاصاته .", "text_ru": "Фонд финансирования профессиональной подготовки и переподготовки осуществляет свою деятельность на общенациональном уровне в соответствии с потребностями рынка труда и с учётом потребностей отраслевых организаций работодателей, создаваемых на основании закона; он оказывает следующие услуги:\n1. Финансирование мероприятий по развитию навыков человеческих ресурсов, профессиональной и технической подготовки посредством создания и развития центров подготовки, разработки и реализации программ подготовки и справочников необходимых навыков и компетенций.\n2. Финансирование проектов развития, направленных на развитие навыков человеческих ресурсов, увязку результатов образования и подготовки с текущими и будущими потребностями рынка труда, а также координацию с отраслевыми советами по квалификациям.\n3. Установление условий и исполнительных правил регулирования финансирования.\n4. Контроль и оценка исполнения всех финансируемых им работ.\n\nПредседатель Совета министров издаёт решение об образовании совета директоров Фонда под председательством компетентного министра и с участием на паритетных началах представителей профсоюзных организаций работников и организаций работодателей, а также представителей соответствующих министерств и органов; этим же решением определяются иные полномочия совета директоров, порядок его работы, порядок финансового вознаграждения председателя и членов совета директоров — за счёт собственных средств Фонда, — его отделения в мухафазах, положение об его уставе, порядок сбора его средств и подлежащая применению система бухгалтерского учёта.\n\nСовет директоров Фонда вправе использовать средства частного права для достижения своих целей и осуществления своих полномочий.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "21", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "تتكون موارد الصندوق المشار إليه فى المادة  ۲۰من هذا القانون من :\n-١نسبة ) ٪٠,٢٥ربع فى المائة( من الحد الأدنـى للأجـر التـأمينى بمنـشآت\nالقطاع العام  ،وقطاع الأعمال العام  ،والقطاع الخاص  ،والتى يعمـل بهـا ثلاثـون\nعاملا ً فأكثر  ،بحد أدنى عشرة جنيهات  ،وبحد أقصى ثلاثون جنيها عن كل عامـل ،\nتتحملها وتلتزم المنشأة بسدادها سنويا مقابل الخدمات المنصوص عليها فى المادة (٢٠)\nمن هذا القانون .\nويحدد بقرار من الوزير المختص قواعد وشروط الإعفاء الكلى من النسبة المشار\nإليها  ،وذلك فى حالة قيام تلك المنشآت بتدريب العـاملين لـديها وفق ًـا لمقتـضياتها ،\nأو اللوائح المعتمدة بتلك المنشآت .\n-٢الإعانات والتبرعات والهبات التى يقبلها مجلس إدارة الصندوق طبق ًا للقواعـد\nالتى تحددها لائحة النظام الأساسى وفق ًا للقوانين المعمول بها فى هذا الشأن .\n-٣عائد استثمار أموال الصندوق .\nويكون للصندوق حساب خاص لدى أحد البنوك التجارية المعتمـدة لـدى البنـك\nالمركزى  ،ويعد الصندوق سنويا القوائم الدالة على المركز المالي  ،وتخـضع أموالـه\nلرقابة الجهاز المركزى للمحاسبات ويرحل فائض أمواله من سنة إلى أخرى .", "text_ru": "Средства Фонда, указанного в статье 20 настоящего Трудового кодекса, формируются из:\n1. доли в размере 0,25% (четверть процента) от минимального страхового заработка на предприятиях государственного сектора, государственного делового сектора и частного сектора, на которых занято тридцать и более работников, с минимальным размером десять фунтов и максимальным размером тридцать фунтов на каждого работника; предприятие несёт эти расходы и обязано ежегодно уплачивать их в счёт услуг, предусмотренных статьёй (20) настоящего Трудового кодекса.\nРешением компетентного министра устанавливаются правила и условия полного освобождения от указанной доли в случае, если такие предприятия осуществляют подготовку своих работников в соответствии со своими потребностями или утверждёнными на этих предприятиях регламентами.\n2. субсидий, пожертвований и даров, принимаемых советом директоров Фонда согласно правилам, устанавливаемым положением об уставе, в соответствии с действующим в этой сфере законодательством;\n3. дохода от инвестирования средств Фонда.\n\nФонд имеет специальный счёт в одном из коммерческих банков, аккредитованных Центральным банком; Фонд ежегодно составляет отчётность, отражающую его финансовое положение; его средства подлежат контролю со стороны Центрального агентства по учёту и контролю, а остаток его средств переносится из года в год.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "22", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "لا يجوز لأية جهة مزاولة عمليات التدريب  ،إلا إذا كانت متخذة شـكل شـركة\nمن شـركات المـساهمة  ،أو التوصـية بالأسـهم  ،أو ذات المـسئولية المحـدودة\nأو الشخص الواحد .\nويستثنى من أحكام الفقرة الأولى من هذه المادة :\n- ١منظمات أصحاب الأعمال والمنظمـات النقابيـة العماليـة  ،والجمعيـات\nوالمؤسسات الأهلية المنشأة وفق ًا للقانون المنظم لها  ،التى تزاول عمليات التدريب .\n-٢جهات التدريب التى تنشئها وحدات الجهاز الإدارى للدولة  ،والهيئات العامة ،\nووحدات الإدارة المحلية لتدريب موظفيها وموظفى الجهات ذات الصلة بها .\n-٣المنشآت التى تتولى تدريب عمالها .\n-٤الكيانات التى تزاول عمليـات تأهيـل وتـدريب الأشـخاص ذوى الإعاقـة\nوالأقزام  ،والفئات الأولى بالرعاية .", "text_ru": "Осуществление деятельности по профессиональной подготовке допускается только органами, учреждёнными в форме акционерного общества, товарищества на паях, общества с ограниченной ответственностью или компании одного лица.\n\nИз положений первого абзаца настоящей статьи исключаются:\n1. организации работодателей, профсоюзные организации работников, а также ассоциации и частные (общественные) учреждения, созданные в соответствии с регулирующим их законом, осуществляющие деятельность по подготовке;\n2. органы подготовки, создаваемые подразделениями государственного административного аппарата, государственными учреждениями и органами местного самоуправления для подготовки своих сотрудников и сотрудников связанных с ними органов;\n3. предприятия, осуществляющие подготовку собственных работников;\n4. организации, осуществляющие переподготовку и подготовку лиц с инвалидностью, лиц с карликовостью и категорий, пользующихся приоритетным вниманием.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "23", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يشترط لمزاولة عمليات التدريب الحصول على تـرخيص بـذلك مـن الـوزارة\nالمختصة باستثناء الجهات المنصوص عليها فى البنـدين (٣) ، ٢مـن المـادة (٢٢)\nمن هذا القانون .\nويصدر الوزير المختص قرارا بتحديد شـروط وإجـراءات مـنح التـرخيص ،\nومدته  ،وتجديده  ،وحالات إلغائه  ،ورسومه بما لا يزيد علـى مائـة ألـف جنيـه ،\nوحالات الإعفاء منها .\nكما يحدد القرار قواعد  ،وإجراءات إنشاء  ،واعتماد مراكز التـدريب الخاضـعة\nلأحكام هذا القانون .\nوتلتزم الوزارة المختصة بإمساك سجل ورقى أو إلكترونى لقيد الجهات التى يـتم\nالترخيص لها بمزاولة عمليات التدريب  ،وإخطار المجلس الأعلـى لتنميـة المـوارد\nوالمهارات البشرية بما يتم قيده فى هذا السجل .", "text_ru": "Условием осуществления деятельности по подготовке является получение соответствующего разрешения от компетентного министерства, за исключением органов, указанных в пунктах 2 и 3 статьи (22) настоящего Трудового кодекса.\n\nКомпетентный министр издаёт решение, определяющее условия и порядок выдачи разрешения, срок его действия, порядок продления, случаи его аннулирования и размер пошлины за него — не свыше ста тысяч фунтов, — а также случаи освобождения от неё.\n\nЭтим же решением определяются правила и порядок создания и аккредитации центров подготовки, на которые распространяются положения настоящего Трудового кодекса.\n\nКомпетентное министерство обязано вести бумажный или электронный реестр для регистрации органов, получивших разрешение на осуществление деятельности по подготовке, и уведомлять Высший совет по развитию навыков человеческих ресурсов о вносимых в этот реестр записях.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "24", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "تلتزم الجهات المشار إليها فى المادة (٢٢)من هذا القانون فيما عدا البنـدين (٣) ، ٢\nبإخطار الوزارة المختصة بالبرامج التدريبية التى تقدمها لاعتمادها  ،على أن تتـضمن\nما يأتي :\nالشروط التى يجب توافرها فى المتدربين للالتحاق بالبرامج .\nمدى كفاية العمليات التدريبية من حيث موضوعات  ،ومجالات التدريب  ،وعـدد\nالساعات المخصصة لها .\nمستويات وتخصصات المدربين .\nمستوى المهارة التى يكتسبها المتدرب بعد الانتهاء من البرنامج .\nويصدر الوزير المختص قرارا بتحديد إجراءات ومواعيد الإخطار والاعتماد بعد\nالتنسيق مع الهيئة المصرية لضمان الجودة والاعتمـاد فـى التعلـيم الفنـى والتقنـى\nوالتدريب المهنى )إتقان( المنشأة بالقانون رقم  ١٦٠لسنة . ٢٠٢٢", "text_ru": "Органы, указанные в статье (22) настоящего Трудового кодекса, за исключением указанных в пунктах 2 и 3, обязаны уведомлять компетентное министерство об учебных программах, которые они предлагают, для их утверждения; уведомление должно содержать:\n— требования, предъявляемые к обучающимся для зачисления на программы;\n— достаточность учебных мероприятий с точки зрения тем, направлений подготовки и количества отведённых для них часов;\n— уровень и специализацию преподавателей (инструкторов);\n— уровень навыков, приобретаемых обучающимся по завершении программы.\n\nКомпетентный министр издаёт решение, определяющее порядок и сроки уведомления и утверждения, после согласования с Египетским органом по обеспечению качества и аккредитации в сфере технического и профессионально-технического образования и профессиональной подготовки («Иткан»), учреждённым Законом № 160 от 2022 года.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "25", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يشترط فى المدربين الذين يزاولون أعمـال التـدريب أن يـرخص لهـم بـذلك\nمن الوزارة المختصة بناء على طلـبهم أو طلـب إحـدى الجهـات المـشار إليهـا\nفى المادة  ٢٢من هذا القانون .\nويصدر الوزير المختص قرارا بتحديـد شـروط وقواعـد  ،وإجـراءات مـنح\nالترخيص  ،والرسوم المستحقة عنه بما لا يجاوز خمسة آلاف جنيه  ،وحالات إيقافـه\nأو إلغائه .\nعلى أن يستثنى من ذلـك المـدربون التـابعون للجهـات المنـصوص عليهـا\nفى البندين (٣) ، ٢من المادة (٢٢)من هذا القانون  ،إذا اقتـصر عملهـم بالتـدريب\nداخل هذه الجهات دون غيرها .\nوتلتزم الوزارة المختصة بإعداد سجل ورقى أو إلكترونى لقيد المدربين المرخص\nلهم  ،ويتم التأشير فيه حال إيقاف أو إلغاء الترخيص .", "text_ru": "Условием для лиц, осуществляющих деятельность инструкторов (преподавателей подготовки), является получение ими разрешения от компетентного министерства на основании их собственного заявления либо заявления одного из органов, указанных в статье 22 настоящего Трудового кодекса.\n\nКомпетентный министр издаёт решение, определяющее условия, правила и порядок выдачи разрешения, а также причитающуюся за него пошлину — не свыше пяти тысяч фунтов, — и случаи приостановления или аннулирования разрешения.\n\nИз этого правила исключаются инструкторы, работающие в органах, указанных в пунктах 2 и 3 статьи (22) настоящего Трудового кодекса, если их деятельность по подготовке ограничивается работой внутри этих органов и не выходит за их пределы.\n\nКомпетентное министерство обязано вести бумажный или электронный реестр для регистрации получивших разрешение инструкторов, в котором отмечаются случаи приостановления или аннулирования разрешения.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "26", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "تلتزم الجهة التى تزاول عمليات التدريب أن تمنح المتدرب لـديها شـهادة تفيـد\nاجتيازه البرنامج التدريبى الذى عقدته له  ،والمستوى الـذى بلغـه  ،ويحـدد بقـرار\nمن الوزير المختص البيانات الأخرى التى تدون فى هذه الـشهادة وقواعـد اعتمادهـا\nمن الجهة الإدارية المختصة  ،والرسم المقابل لذلك بما لا يجاوز خمسمائة جنيه .", "text_ru": "Орган, осуществляющий деятельность по подготовке, обязан выдать обучающемуся у него лицу свидетельство, подтверждающее прохождение им учебной программы, организованной для него, и достигнутый им уровень; иные сведения, вносимые в это свидетельство, правила его утверждения компетентным административным органом, а также соответствующая пошлина — не свыше пятисот фунтов — определяются решением компетентного министра.", "book_title_ru": "Профессиональная подготовка, трудоустройство и занятость неформальных работников", "book_ru": "Книга вторая", "part_ru": "Раздел первый", "part_title_ru": "Профессиональная подготовка", "chapter_ru": null, "chapter_title_ru": null}, {"number": "27", "book": "الكتاب الثانى", "book_title": "التدريب والتشغيل وتشغيل العمالة غير المنتظمة", "part": "الباب الأول", "part_title": "التدريب", "chapter": null, "chapter_title": null, "text": "يلتزم كل من يرغب فى مزاولة مهنة أو حرفة من التى يصدر بتحديـدها قـرار\nمن الوزير المختص  ،أن يتقدم بطلب إلى الجهة الإدارية المختصة للحـصول علـى\nترخيص بمزاولتها .\nويحدد القرار شروط وقواعد  ،وإجراءات منح الترخيص  ،والرسوم المقررة عنه\nبما لا يجاوز خمسمائة جنيه  ،وحالات الإعفاء منها .\nولا يجوز تشغيل العامل إلا إذا كان حاصلا ً على هذا الترخيص .\nوعلى طالب الترخيص أن يرفق بطلبه شهادة تفيد مـستوى مهارتـه  ،ويـصدر\nالوزير المختص بالتشاور مع المنظمة النقابية العماليـة المعنيـة ومنظمـة أصـحاب\nالأعمال المعنية قرارا بتحديد جميع البيانات التى يجب إثباتهـا فـى تلـك الـشهادة ،\nوالأحكام الخاصة بقياس مستوى المهارة والجهات التى تتولى تحديد هـذا المـستوى ،\nوكيفية إجرائه  ،وشروط التقدم له  ،والمكان الذى يجرى فيه لكـل حرفـة أو مهنـة\nودرجات المهارة التى تقدرها طبق ًا لنتائج الاختبارات  ،والرسم المقرر عنهـا بمـا لا\nيجاوز خمسمائة جنيه وحالات الإعفاء من هذا الرسم .\nويستثنى من الحصول على هذه الشهادة خريجو المـدارس الفنيـة المتوسـطة ،\nوفوق المتوسطة والمعاهد العليا  ،والجامعات  ،الذين يعملون فى مجال تخصصهم .", "text_ru": "Любое лицо, желающее заниматься профессией или ремеслом из числа тех, перечень которых устанавливается решением компетентного министра, обязано подать заявление в компетентный административный орган для получения разрешения на занятие этой профессией или ремеслом.\n\nРешением определяются условия, правила и порядок выдачи разрешения, а также установленна
